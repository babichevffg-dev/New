/* ============ АУДИО ЭФФЕКТЫ (Web Audio API) ============ */
const SoundEffects = {
  ctx: null,
  init() {
    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  playClick() {
    if (!state.sound) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.05);
    } catch(e){}
  },
  playSuccess() {
    if (!state.sound) return;
    this.init();
    if (!this.ctx) return;
    try {
      const now = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.2, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.25);
      });
    } catch(e){}
  }
};

/* ============ УТИЛИТЫ И ФОРМУЛЫ ============ */
const ACTIVITY_COEF = { sedentary: 1.2, moderate: 1.375, active: 1.55 };

// Формула Миффлина-Сан Жеора
const calcBMR = p => {
  const w = parseFloat(p.weight) || 70;
  const h = parseFloat(p.height) || 170;
  const a = parseFloat(p.age) || 25;
  const base = 10 * w + 6.25 * h - 5 * a;
  return p.gender === 'm' ? base + 5 : base - 161;
};

const calcDailyNorm = p => Math.round(calcBMR(p) * (ACTIVITY_COEF[p.baseActivity] || 1.2));
const calcTarget = p => Math.round(calcDailyNorm(p) * (1 - (p.deficitPercent || 20) / 100));

const calcFoodKcal = (food, grams) => ({
  kcal: Math.round(food.kcal * grams / 100),
  p: +(food.p * grams / 100).toFixed(1),
  f: +(food.f * grams / 100).toFixed(1),
  c: +(food.c * grams / 100).toFixed(1)
});

/* ============ УТИЛИТЫ И ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДНЯ ============ */
function getTodayRecord() {
  const key = todayKey();
  if (!state.data.days[key]) {
    state.data.days[key] = {
      meals: [],
      activities: [],
      weight: null,
      oils: { sunflower_fry: 0, sunflower_salad: 0, olive_fry: 0, olive_salad: 0 },
      water: 0,
      dental: { morning: false, evening: false, rinse1: false, rinse2: false },
      fasting: { active: false, startTime: null, targetHours: 16 }
    };
  }
  const d = state.data.days[key];
  if (!d.oils) d.oils = { sunflower_fry: 0, sunflower_salad: 0, olive_fry: 0, olive_salad: 0 };
  if (typeof d.water !== 'number') d.water = 0;
  if (!d.dental) d.dental = { morning: false, evening: false, rinse1: false, rinse2: false };
  if (!d.fasting) d.fasting = { active: false, startTime: null, targetHours: 16 };
  return d;
}

function quickLogOil(type, usage, grams) {
  const d = getTodayRecord();
  const oilKey = `${type}_${usage}`;
  d.oils[oilKey] = (d.oils[oilKey] || 0) + grams;

  // Calculate macros: 1g oil ~ 8.9 kcal, 1g fat
  const isOlive = type === 'olive';
  const oilName = isOlive ? 'Масло оливковое' : 'Масло подсолнечное';
  const usageName = usage === 'fry' ? 'жарка' : 'салат';
  const kcalPerG = isOlive ? 8.84 : 8.99;

  const kcal = Math.round(grams * kcalPerG);
  const f = +grams.toFixed(1);

  d.meals.push({
    name: `${oilName} (${usageName})`,
    kcal: kcal,
    p: 0,
    f: f,
    c: 0,
    grams: grams,
    icon: usage === 'fry' ? '🍳' : '🥗',
    mealType: usage === 'fry' ? 'lunch' : 'dinner',
    desc: `Добавлено при ${usageName==='жарка'?'жарке':'заправке салата'} (${grams}г)`
  });

  state.data.xp = (state.data.xp || 0) + 10;
  save();
  SoundEffects.playSuccess();
  render();
}

function quickLogWater(ml) {
  const d = getTodayRecord();
  d.water = Math.max(0, (d.water || 0) + ml);
  state.data.xp = (state.data.xp || 0) + 5;
  save();
  SoundEffects.playSuccess();
  render();
}

function toggleDentalCare(key) {
  const d = getTodayRecord();
  d.dental[key] = !d.dental[key];
  if (d.dental[key]) state.data.xp = (state.data.xp || 0) + 5;
  save();
  SoundEffects.playClick();
  render();
}


const todayKey = () => new Date().toISOString().slice(0, 10);

// Расчёт уровня пользователя по XP
const getLevelInfo = (xp = 0) => {
  const levels = [
    { lvl: 1, title: 'Новичк Атлет', minXp: 0, maxXp: 100, icon: '🌱' },
    { lvl: 2, title: 'Фитнес-Адепт', minXp: 100, maxXp: 250, icon: '🏃' },
    { lvl: 3, title: 'Кинетик-Ранер', minXp: 250, maxXp: 500, icon: '⚡' },
    { lvl: 4, title: 'Дисциплинированный', minXp: 500, maxXp: 900, icon: '🔥' },
    { lvl: 5, title: 'Спортивный Воин', minXp: 900, maxXp: 1400, icon: '🛡️' },
    { lvl: 6, title: 'Мастер Зала', minXp: 1400, maxXp: 2000, icon: '🏋️' },
    { lvl: 7, title: 'Титан Энергии', minXp: 2000, maxXp: 2800, icon: '⚡' },
    { lvl: 8, title: 'Железный Лев', minXp: 2800, maxXp: 3800, icon: '🦁' },
    { lvl: 9, title: 'Легенда Спорта', minXp: 3800, maxXp: 5000, icon: '👑' },
    { lvl: 10, title: 'Iron Champion 🏆', minXp: 5000, maxXp: 10000, icon: '🏆' }
  ];
  let cur = levels[0];
  for (let l of levels) {
    if (xp >= l.minXp) cur = l;
  }
  const pct = Math.min(100, Math.max(0, ((xp - cur.minXp) / (cur.maxXp - cur.minXp)) * 100));
  return { ...cur, xp, pct: Math.round(pct) };
};

function bindSetupEvents() {
  const f = state._setupForm;

  const updateCalc = () => {
    const norm = calcDailyNorm(f);
    const target = calcTarget(f);
    const dn = document.getElementById('disp_norm');
    const dt = document.getElementById('disp_target');
    if (dn) dn.textContent = `${norm} ккал`;
    if (dt) dt.textContent = `${target} ккал 🎯`;
  };

  // Поле имени обновляет форму ЛОКАЛЬНО БЕЗ re-render, сохраняя фокус!
  const nameEl = document.getElementById('setup_name');
  if (nameEl) {
    nameEl.oninput = (e) => {
      f.name = e.target.value;
    };
  }

  ['age', 'height', 'weight', 'targetWeight'].forEach(key => {
    const el = document.getElementById(`setup_${key}`);
    if (el) {
      el.oninput = (e) => {
        f[key] = parseFloat(e.target.value) || 0;
        updateCalc();
      };
    }
  });

  const rangeEl = document.getElementById('setup_deficitPercent');
  if (rangeEl) {
    rangeEl.oninput = (e) => {
      f.deficitPercent = parseInt(e.target.value);
      const span = rangeEl.parentElement.querySelector('span.text-brand-400');
      if (span) span.textContent = `${f.deficitPercent}%`;
      updateCalc();
    };
  }

  // Кнопки пола и активности
  const btnM = document.getElementById('btn_gender_m');
  const btnF = document.getElementById('btn_gender_f');
  if (btnM && btnF) {
    btnM.onclick = () => { f.gender = 'm'; render(); };
    btnF.onclick = () => { f.gender = 'f'; render(); };
  }

  ['sedentary', 'moderate', 'active'].forEach(act => {
    const btn = document.getElementById(`btn_act_${act}`);
    if (btn) {
      btn.onclick = () => { f.baseActivity = act; render(); };
    }
  });

  const saveBtn = document.getElementById('saveSetup');
  if (saveBtn) {
    saveBtn.onclick = () => {
      if (!f.name.trim()) {
        alert('Пожалуйста, введи своё имя!');
        return;
      }
      SoundEffects.playSuccess();
      state.profile = { ...f };
      save();
      render();
    };
  }
}

// 4. ⚡ ЭКСПРЕСС-ВВОД БЛЮД С УМНЫМ ТЕКСТОМ
function parseAndAddExpressMeal(text) {
  if (!text || !text.trim()) return;
  const allFoods = [...DEFAULT_FOODS, ...(state.data.customFoods || [])];

  // Пример текста: "гречка 200г, оливковое масло 10г, кура 150г"
  const parts = text.split(/[,;
]+/);
  let addedCount = 0;
  const d = getTodayRecord();

  parts.forEach(part => {
    const p = part.trim();
    if (!p) return;
    const match = p.match(/(.*?)\s*(\d+)\s*(г|гр|g|мл)?$/i);
    let nameSearch = p;
    let grams = 100;

    if (match) {
      nameSearch = match[1].trim();
      grams = parseInt(match[2]) || 100;
    }

    // Fuzzy matching product
    const found = allFoods.find(f => f.name.toLowerCase().includes(nameSearch.toLowerCase())) ||
                  allFoods.find(f => nameSearch.toLowerCase().includes(f.name.toLowerCase().split(' ')[0]));

    if (found) {
      const kbju = calcFoodKcal(found, grams);
      d.meals.push({
        ...kbju,
        grams,
        name: found.name,
        icon: '⚡',
        mealType: 'snack',
        desc: `Экспресс-ввод (${grams}г)`
      });
      addedCount++;
    }
  });

  if (addedCount > 0) {
    state.data.xp = (state.data.xp || 0) + (addedCount * 10);
    save();
    SoundEffects.playSuccess();
    render();
    alert(`Экспресс-ввод: успешно распознано и добавлено ${addedCount} элементов!`);
  } else {
    alert('Не удалось распознать продукты. Попробуйте указать: "гречка 200г, яблоко 150г"');
  }
}

  const p = state.profile;

  return `

        </div>

          <div class="h-full bg-gradient-to-r from-purple-500 to-indigo-500 transition-all duration-500" style="width: ${pct}%"></div>
        </div>

          Завершить окно голодания 🛑
        </button>
      </div>
    ` : `
      <button onclick="toggleFasting(true)" class="sport-btn btn-primary w-full py-2.5 text-xs bg-gradient-to-r from-purple-600 to-indigo-600">
        Старт 16-часового окна голодания 🚀
      </button>
    `}
  </div>`;
}

function toggleFasting(active) {
  const d = getTodayRecord();
  if (active) {
    d.fasting = { active: true, startTime: Date.now(), targetHours: 16 };
    state.data.xp = (state.data.xp || 0) + 15;
  } else {
    d.fasting.active = false;
  }
  save();
  SoundEffects.playClick();
  render();
}

/* ============ УМНЫЕ РЕКОМЕНДАЦИИ ============ */
function renderSmartRecommendations(remaining, totals, targetP, targetF, targetC) {
  if (remaining <= 0) {
    return `
    <div class="sport-card bg-red-950/40 border-red-500/30 p-3.5">
      <div class="flex items-center gap-2 font-bold text-red-400 text-xs">
        🛑 Лимит дневных калорий исчерпан!
      </div>
      <p class="text-[11px] text-slate-300 mt-1">
        Ты выжал максимум калорий на сегодня. Если испытываешь голод — отдай предпочтение травяному чаю, воде или легким огурцам/зелени.
      </p>
    </div>`;
  }

  const lacks = [];
  if (totals.p < targetP * 0.8) lacks.push('белка 🥩');
  if (totals.f < targetF * 0.8) lacks.push('полезных жиров 🥑');
  if (totals.c < targetC * 0.8) lacks.push('сложных углеводов 🍞');

  const suitableIdeas = IDEAS.filter(i => i.kcal <= remaining).slice(0, 3);

  return `
  <div class="sport-card bg-gradient-to-br from-emerald-950/40 to-cyan-950/40 border-emerald-500/30 p-4 space-y-2.5">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">💡</span>
        <h3 class="font-bold text-xs text-slate-200 uppercase tracking-wider">Умные Рекомендации</h3>
      </div>
      <span class="text-xs font-black text-brand-400">+${remaining} ккал в запасе</span>
    </div>

    ${lacks.length > 0 ? `
      <div class="text-xs text-slate-300 bg-slate-900/60 rounded-xl p-2 border border-slate-800">
        📌 <b>Внимание к БЖУ:</b> Сейчас не хватает ${lacks.join(', ')}.
      </div>
    ` : ''}

    ${suitableIdeas.length > 0 ? `
      <div class="space-y-1.5">
        <div class="text-[11px] font-semibold text-slate-400">Идеи быстрых спортивных перекусов:</div>
        <div class="grid grid-cols-1 gap-1.5">
          ${suitableIdeas.map(i => `
            <div class="bg-slate-900/80 rounded-xl p-2 flex items-center justify-between text-xs border border-slate-800">
              <span class="font-medium text-slate-200">${i.name}</span>
              <span class="font-bold text-brand-400">${i.kcal} ккал</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}
  </div>`;
}

/* ============ ВКЛАДКА "СТАТИСТИКА" ============ */
function renderStatsTab() {
  const target = calcTarget(state.profile);
  const last7 = [];

  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    const day = state.data.days[key] || { meals: [], activities: [] };
    const kcal = day.meals.reduce((s, m) => s + m.kcal, 0);
    const burned = day.activities.reduce((s, a) => s + a.kcal, 0);
    last7.push({
      day: d.toLocaleDateString('ru-RU', { weekday: 'short' }),
      kcal,
      burned,
      target
    });
  }

  const maxVal = Math.max(target, ...last7.map(d => d.kcal)) * 1.15 || 2000;
  const weights = state.data.weights || [];
  const lastWeights = weights.slice(-7);

  return `
  <div class="space-y-4">
    <!-- График калорий за 7 дней -->
    <div class="sport-card space-y-3">
      <h3 class="font-bold text-sm text-slate-200">📊 Мониторинг за 7 дней</h3>
      <div class="h-44 flex items-end gap-2 pt-4">
        ${last7.map(d => {
          const h = Math.round((d.kcal / maxVal) * 100);
          const targetH = Math.round((d.target / maxVal) * 100);
          const ok = d.kcal > 0 && d.kcal <= d.target + d.burned;
          return `
            <div class="flex-1 flex flex-col items-center h-full justify-end gap-1">
              <span class="text-[9px] text-slate-400 font-bold">${d.kcal || 0}</span>
              <div class="w-full relative flex-1 flex items-end">
                <div class="absolute bottom-0 w-full bg-slate-800 rounded-t border-t border-slate-700" style="height:${targetH}%"></div>
                <div class="w-full rounded-t relative z-10 transition-all duration-500 ${ok ? 'bg-gradient-to-t from-brand-600 to-brand-400' : d.kcal > d.target ? 'bg-gradient-to-t from-red-600 to-red-400' : 'bg-slate-600'}" style="height:${h}%"></div>
              </div>
              <span class="text-[10px] text-slate-400 uppercase font-semibold">${d.day}</span>
            </div>
          `;
        }).join('')}
      </div>

      <div class="flex justify-around text-[10px] font-semibold text-slate-400 border-t border-slate-800 pt-2">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-brand-500 rounded-sm"></span> Дефицит</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-red-500 rounded-sm"></span> Профицит</span>

}

/* ============ СОБЫТИЯ DASHBOARD ============ */
function bindDashboardEvents() {
  const td = document.getElementById('toggleDark');
  if (td) td.onclick = () => setDark(!state.dark);

  const ts = document.getElementById('toggleSound');
  if (ts) ts.onclick = () => {
    state.sound = !state.sound;
    save();
    render();
  };

  const nq = document.getElementById('nextQuote');
  if (nq) nq.onclick = () => {
    SoundEffects.playClick();
    state.quoteIdx++;
    render();
  };

  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => {
      SoundEffects.playClick();
      state.tab = btn.dataset.tab;
      render();
    };
  });

  const expressBtn = document.getElementById('expressAddBtn');
  if (expressBtn) {
    expressBtn.onclick = () => {
      const input = document.getElementById('expressMealInput');
      if (input && input.value) parseAndAddExpressMeal(input.value);
    };
  }

  const of = document.getElementById('openFood');
  if (of) of.onclick = () => { SoundEffects.playClick(); openFoodModal(); };

  const oa = document.getElementById('openActivity');
  if (oa) oa.onclick = () => { SoundEffects.playClick(); openActivityModal(); };

  // Удаление приёмов пищи
  document.querySelectorAll('[data-del-meal]').forEach(btn => {
    btn.onclick = () => {
      SoundEffects.playClick();
      const idx = parseInt(btn.dataset.delMeal);
      const dayKey = todayKey();
      if (state.data.days[dayKey]) {
        state.data.days[dayKey].meals.splice(idx, 1);
        save();
        render();
      }
    };
  });

  // Удаление активностей
  document.querySelectorAll('[data-del-act]').forEach(btn => {
    btn.onclick = () => {
      SoundEffects.playClick();
      const idx = parseInt(btn.dataset.delAct);
      const dayKey = todayKey();
      if (state.data.days[dayKey]) {
        state.data.days[dayKey].activities.splice(idx, 1);
        save();
        render();
      }
    };
  });

  // Сохранение веса
  const sw = document.getElementById('saveWeight');
  if (sw) {
    sw.onclick = () => {
      const input = document.getElementById('weightInput');
      const w = parseFloat(input.value);
      if (!w || w < 30 || w > 300) {
        alert('Введите корректный вес (30-300 кг)');
        return;
      }
      SoundEffects.playSuccess();
      if (!state.data.weights) state.data.weights = [];
      state.data.weights.push({ date: todayKey(), weight: w });
      save();
      render();
    };
  }

  // Сохранение файла и загрузка файла
  const ex = document.getElementById('exportData');
  if (ex) {
    ex.onclick = () => saveToFile();
  }

  const imp = document.getElementById('importFileInput');
  if (imp) {
    imp.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        loadFromFile(e.target.files[0]);
      }
    };
  }

  // Сброс данных
  const rs = document.getElementById('resetData');
  if (rs) {
    rs.onclick = () => {
      if (confirm('Сбросить все данные трекера? Это действие нельзя отменить!')) {
        localStorage.clear();
        location.reload();
      }
    };
  }
}

/* ============ МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ЕДЫ ============ */
function openFoodModal() {
  const modal = document.getElementById('modalRoot');
  const allFoods = [...DEFAULT_FOODS, ...(state.data.customFoods || [])];

  const form = {
    mealType: 'lunch',
    foodId: allFoods[0].id,
    portions: [{ id: 'plate_m', qty: 1 }],
    search: ''
  };

  const renderModal = () => {
    const food = allFoods.find(f => f.id === form.foodId) || allFoods[0];
    const filtered = allFoods.filter(f => f.name.toLowerCase().includes(form.search.toLowerCase()));

    const totalGrams = form.portions.reduce((s, p) => {
      const pr = PORTIONS.find(x => x.id === p.id);
      return s + (pr ? pr.grams * p.qty : 0);
    }, 0);

    const kbju = calcFoodKcal(food, totalGrams);

    modal.innerHTML = `
    <div class="fixed inset-0 modal-bg z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="sport-card bg-slate-900 w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-4 space-y-3 pop border-slate-700">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-base text-slate-100">🍽️ Добавить приём пищи</h3>
          <button id="closeModal" class="text-slate-400 hover:text-white font-bold p-1">✕</button>
        </div>

        <!-- Выбор приёма пищи -->
        <div>
          <div class="text-[11px] text-slate-400 mb-1 font-semibold">Приём пищи</div>
          <div class="grid grid-cols-4 gap-1">
            ${MEAL_TYPES.map(m => `
              <button data-mf="${m.v}" class="sport-btn py-1.5 px-1 text-[11px] ${form.mealType===m.v?'btn-primary':'btn-ghost'}">
                ${m.i} ${m.l}
              </button>
            `).join('')}
          </div>
        </div>

        <!-- Поиск и выбор продукта -->
        <div>
          <div class="text-[11px] text-slate-400 mb-1 font-semibold">Продукт из базы</div>
          <input id="foodSearch" value="${form.search}" placeholder="🔍 Поиск продукта..."
            class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-100 text-xs mb-2" />

          <select id="foodSelect" class="w-full px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-100 text-xs font-semibold">
            ${filtered.map(f => `<option value="${f.id}" ${f.id===form.foodId?'selected':''}>${f.name} (${f.kcal} ккал/100г)</option>`).join('')}
          </select>
        </div>

        <!-- Конструктор Порций -->
        <div>
          <div class="text-[11px] text-slate-400 mb-1 font-semibold flex justify-between items-center">
            <span>Настройка порций</span>
            <button id="addPortion" class="text-brand-400 text-xs hover:underline">+ добавка</button>
          </div>
          <div class="space-y-2">
            ${form.portions.map((p, idx) => `
              <div class="flex gap-2 items-center">
                <select data-pi="${idx}" class="port-select flex-1 px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-100 text-xs">
                  ${PORTIONS.map(pr => `<option value="${pr.id}" ${pr.id===p.id?'selected':''}>${pr.icon} ${pr.name} (${pr.grams}г)</option>`).join('')}
                </select>
                <input type="number" min="0.1" step="0.5" value="${p.qty}" data-qi="${idx}" class="port-qty w-16 px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-100 text-xs font-bold text-center" />
                ${form.portions.length > 1 ? `<button data-rmi="${idx}" class="text-slate-500 hover:text-red-400 text-xs">✕</button>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Итоговый калькулятор KBJU -->
        <div class="sport-card bg-slate-800/80 p-3 border-emerald-500/20">
          <div class="flex justify-between items-center">
            <span class="text-xs text-slate-300">Вес порции: <b>${totalGrams}г</b></span>
            <span class="text-base font-black text-brand-400">${kbju.kcal} ккал</span>
          </div>
          <div class="text-[11px] text-slate-400 mt-1 flex justify-between">
            <span>Белки: ${kbju.p}г</span>
            <span>Жиры: ${kbju.f}г</span>
            <span>Углеводы: ${kbju.c}г</span>
          </div>
        </div>

        <div class="flex gap-2 pt-1">
          <button id="saveFood" class="sport-btn btn-primary flex-1 text-xs py-3">
            Добавить в дневник 🎯
          </button>
        </div>
      </div>
    </div>`;

    // Привязка событий модалки
    modal.querySelectorAll('[data-mf]').forEach(b => {
      b.onclick = () => { form.mealType = b.dataset.mf; renderModal(); };
    });

    const fs = document.getElementById('foodSearch');
    if (fs) {
      fs.oninput = e => {
        form.search = e.target.value;
        renderModal();
        const newFs = document.getElementById('foodSearch');
        if (newFs) {
          newFs.focus();
          newFs.setSelectionRange(newFs.value.length, newFs.value.length);
        }
      };
    }

    const fsel = document.getElementById('foodSelect');
    if (fsel) {
      fsel.onchange = e => { form.foodId = e.target.value; renderModal(); };
    }

    const ap = document.getElementById('addPortion');
    if (ap) {
      ap.onclick = () => { form.portions.push({ id: 'plate_m', qty: 1 }); renderModal(); };
    }

    modal.querySelectorAll('.port-select').forEach(s => {
      s.onchange = e => { form.portions[parseInt(s.dataset.pi)].id = e.target.value; renderModal(); };
    });

    modal.querySelectorAll('.port-qty').forEach(q => {
      q.onchange = e => { form.portions[parseInt(q.dataset.qi)].qty = parseFloat(e.target.value) || 1; renderModal(); };
    });

    modal.querySelectorAll('[data-rmi]').forEach(b => {
      b.onclick = () => { form.portions.splice(parseInt(b.dataset.rmi), 1); renderModal(); };
    });

    const cm = document.getElementById('closeModal');
    if (cm) cm.onclick = () => { modal.innerHTML = ''; };

    const sf = document.getElementById('saveFood');
    if (sf) {
      sf.onclick = () => {
        if (!food || totalGrams <= 0) return;
        SoundEffects.playSuccess();
        const mt = MEAL_TYPES.find(m => m.v === form.mealType);
        const descStr = form.portions.map(p => {
          const pr = PORTIONS.find(x => x.id === p.id);
          return `${p.qty}×${pr?.name || ''}`;
        }).join(' + ');

        const entry = {
          ...kbju,
          grams: totalGrams,
          name: food.name,
          icon: mt.i,
          mealType: form.mealType,
          desc: descStr
        };

        const dayKey = todayKey();
        const day = state.data.days[dayKey] || { meals: [], activities: [] };
        state.data.days[dayKey] = { ...day, meals: [...day.meals, entry] };

        // Начисление XP
        state.data.xp = (state.data.xp || 0) + 15;

        save();
        modal.innerHTML = '';
        render();
      };
    }
  };

  renderModal();
}

        <div class="sport-card bg-slate-800 p-3 flex justify-between items-center border-cyan-500/20">
          <span class="text-xs text-slate-300">Сожжёшь энергии:</span>
          <span class="text-xl font-black text-sports-flame">+${kcal} ккал 🔥</span>
        </div>

        <button id="saveAct" class="sport-btn btn-cyan w-full text-xs py-3 shadow-lg shadow-cyan-500/20">
          Записать активность 🏆
        </button>
      </div>
    </div>`;

    modal.querySelectorAll('[data-act]').forEach(b => {
      b.onclick = () => { form.actId = b.dataset.act; renderModal(); };
    });

    const ad = document.getElementById('actDur');
    if (ad) {
      ad.oninput = e => { form.duration = parseFloat(e.target.value) || 1; renderModal(); };
    }

    const cm = document.getElementById('closeModal');
    if (cm) cm.onclick = () => { modal.innerHTML = ''; };

    const sa = document.getElementById('saveAct');
    if (sa) {
      sa.onclick = () => {
        SoundEffects.playSuccess();
        const act = ACTIVITIES.find(a => a.id === form.actId);
        const kcal = Math.round((act.kph || 0) * form.duration);

        const dayKey = todayKey();
        const day = state.data.days[dayKey] || { meals: [], activities: [] };
        state.data.days[dayKey] = {
          ...day,
          activities: [...day.activities, { activityId: form.actId, name: act.name, icon: act.icon, duration: form.duration, kcal }]
        };

        // Начисление XP
        state.data.xp = (state.data.xp || 0) + 20;

        save();
        modal.innerHTML = '';
        render();
      };
    }
  };

  renderModal();
}


/* ============ СОХРАНЕНИЕ И АВТО-ЗАГРУЗКА ИЗ ФАЙЛА ============ */
function saveToFile() {
  const payload = {
    profile: state.profile,
    data: state.data,
    dark: state.dark,
    sound: state.sound,
    savedAt: new Date().toISOString()
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'food_data.json';
  a.click();
}

function loadFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed.profile) state.profile = parsed.profile;
      if (parsed.data) state.data = parsed.data;
      if (typeof parsed.dark === 'boolean') state.dark = parsed.dark;
      if (typeof parsed.sound === 'boolean') state.sound = parsed.sound;
      save();
      SoundEffects.playSuccess();
      alert('Данные успешно загружены из файла!');
      render();
    } catch(err) {
      alert('Ошибка при чтении файла JSON!');
    }
  };
  reader.readAsText(file);
}

// Автоматическая подгрузка при открытии сайта если доступен food_data.json в домене
async function autoLoadFromFile() {
  try {
    const res = await fetch('food_data.json', { cache: 'no-cache' });
    if (res.ok) {
      const parsed = await res.json();
      if (parsed && parsed.profile) {
        state.profile = parsed.profile;
        if (parsed.data) state.data = parsed.data;
        if (typeof parsed.dark === 'boolean') state.dark = parsed.dark;
        if (typeof parsed.sound === 'boolean') state.sound = parsed.sound;
        save();
        render();
      }
    }
  } catch(e) {
    // Тихо игнорируем если файл не серверится на сервере
  }
}

autoLoadFromFile();

/* ============ ЗАПУСК ПРИЛОЖЕНИЯ ============ */
render();
</script>

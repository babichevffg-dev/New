  "players": [
    { "name": { "ru": "Райан Мендеш", "en": "Ryan Mendes" }, "pos": "forward", "status": "Captain", "story": { "ru": "Многолетний лидер и символ футбольного возрождения Кабо-Верде.", "en": "Long-time leader and symbol of the football revival of Cape Verde." } },

    { "name": { "ru": "Возинья", "en": "Vozinha" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "39-летний ветеран, настоящая легенда африканского футбола! Прошёл через кипрский АЕЛ и азербайджанский «Зиря». Герой Кубка Африки 2023, где Кабо-Верде дошла до полуфинала. Его сейвы и харизма сделали его национальным героем. 70+ матчей за сборную.", "en": "A 39-year-old veteran and true African football legend! He came through Cypriot AEL and Azerbaijani Zira. Hero of AFCON 2023, where Cape Verde reached the semi-finals. His saves and charisma made him a national hero. 70+ caps for the national team." } },

    { "name": { "ru": "Жоао Пауло", "en": "João Paulo" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Надёжный страж ворот с богатым опытом игры в португальских низших лигах. Его хладнокровие и уверенная игра на выходах делают его ценным резервистом для легендарного Возиньи.", "en": "A reliable shot-stopper with rich experience in Portugal's lower leagues. His composure and confident command of the area make him a valuable backup to the legendary Vozinha." } },

    { "name": { "ru": "Тьягу Перейра", "en": "Tiago Pereira" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "24-летний вундеркинд — будущее вратарской линии Кабо-Верде! Его включение в состав — это ставка на молодое поколение островного футбола.", "en": "A 24-year-old wonderkid — the future of Cape Verde's goalkeeping line! His inclusion is a bet on the young generation of island football." } },

    { "name": { "ru": "Логан Коста", "en": "Logan Costa" }, "pos": "defender", "status": "Star", "story": { "ru": "24-летний центральный защитник французской «Тулузы» — настоящая звезда! Прошёл через академию «Реймса» и теперь играет в Лиге 1. Его техника и скорость делают его одним из лучших молодых защитников Африки. Один из самых дорогих игроков в истории сборной.", "en": "The 24-year-old centre-back for French side Toulouse is a true star! He came through Reims' academy and now plays in Ligue 1. His technique and pace make him one of Africa's best young defenders. One of the most valuable players in the squad's history." } },

    { "name": { "ru": "Дилан Тавареш", "en": "Dylan Tavares" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний левый защитник швейцарского «Сьона» — один из самых техничных защитников сборной! Прошёл через французские клубы и теперь играет в Швейцарии. Его кроссы и стандарты — секретное оружие «Голубых акул». 35+ матчей за сборную.", "en": "The 29-year-old left-back for Swiss side FC Sion is one of the squad's most technical defenders! He came through French clubs and now plays in Switzerland. His crosses and set pieces are the 'Blue Sharks' secret weapon. 35+ caps for the national team." } },

    { "name": { "ru": "Стивен Фортеш", "en": "Steven Fortès" }, "pos": "defender", "status": "Star", "story": { "ru": "33-летний центральный защитник — ветеран сборной с богатым опытом! Прошёл через французские клубы «Ланс» и «Остенде». Его физическая мощь и чтение игры делают его одним из столпов обороны. 30+ матчей за сборную.", "en": "A 33-year-old centre-back — a national team veteran with rich experience! He came through French clubs Lens and Oostende. His physical power and reading of the game make him one of the defensive pillars. 30+ caps for the national team." } },

    { "name": { "ru": "Джефферсон Энкарнасан", "en": "Jefferson Encarnação" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний универсал — способен закрыть любой фланг обороны! Его скорость и кроссы делают его современным фланговым защитником. Один из самых стабильных игроков оборонительной линии «Голубых акул».", "en": "A 27-year-old utility man — capable of covering any defensive flank! His pace and crosses make him a modern full-back. One of the most consistent players in the 'Blue Sharks' defensive line." } },

    { "name": { "ru": "Роберто Лопес", "en": "Roberto Lopes" }, "pos": "defender", "status": "Legend", "story": { "ru": "33-летний центральный защитник ирландского «Шемрок Роверс» — настоящий боец! Его опыт игры в еврокубках (Лига Европы УЕФА) делает его уникальным оружием. 30+ матчей за сборную, один из лидеров обороны.", "en": "The 33-year-old centre-back for Irish side Shamrock Rovers is a true fighter! His European competition experience (UEFA Europa League) makes him a unique weapon. 30+ caps for the national team, one of the defensive leaders." } },

    { "name": { "ru": "Фабиан Гарсия", "en": "Fábio Garcia" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний защитник — представитель нового поколения! Его включение в состав — это ставка на будущее островной обороны. Один из самых перспективных талантов Кабо-Верде.", "en": "A 23-year-old defender — representative of the new generation! His inclusion is a bet on the future of the island's defence. One of Cape Verde's most promising talents." } },

    { "name": { "ru": "Яннис Коррейя", "en": "Yannick Correia" }, "pos": "defender", "status": "Squad", "story": { "ru": "25-летний защитник с опытом игры в итальянских низших лигах. Его тактическая мудрость и универсальность делают его ценным резервистом.", "en": "A 25-year-old defender with experience in Italy's lower leagues. His tactical wisdom and versatility make him a valuable reserve." } },

    { "name": { "ru": "Давид Коррейя", "en": "David Correia" }, "pos": "defender", "status": "Squad", "story": { "ru": "28-летний правый защитник — надёжный боец с характером! Прошёл через португальские клубы и теперь является одним из ключевых игроков обороны «Голубых акул».", "en": "A 28-year-old right-back — a reliable fighter with character! He came through Portuguese clubs and now is one of the key defensive players for the 'Blue Sharks'." } },

    { "name": { "ru": "Кевин Пина", "en": "Kevin Pina" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний опорный полузащитник российского «Краснодара» — настоящая звезда! Прошёл через португальский футбол и теперь покоряет РПЛ. Его тактическая мудрость и умение разрушать атаки делают его сердцем команды. 35+ матчей за сборную, забил решающий гол в отборе!", "en": "The 28-year-old defensive midfielder for Russian side FC Krasnodar is a true star! He came through Portuguese football and now conquers the Russian Premier League. His tactical wisdom and ability to break up attacks make him the team's heart. 35+ caps, scored the decisive goal in qualifying!" } },

    { "name": { "ru": "Ларос Дуарте", "en": "Laros Duarte" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний полузащитник нидерландского «Гронингена» — представитель элитного голландского футбола! Старший брат Дероя Дуарте, настоящая футбольная династия. Его техника и видение поля делают его дирижёром атак. 25+ матчей за сборную.", "en": "The 27-year-old midfielder for Dutch side FC Groningen is a representative of elite Dutch football! Older brother of Deroy Duarte, a true football dynasty. His technique and vision make him the conductor of attacks. 25+ caps for the national team." } },

    { "name": { "ru": "Дерой Дуарте", "en": "Deroy Duarte" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний плеймейкер болгарского «Ботева» — младший брат Лароса! Настоящая семейная гордость Кабо-Верде. Прошёл через нидерландский «Фейеноорд» и теперь покоряет Восточную Европу. Его креативность и удары из-за штрафной — секретное оружие.", "en": "The 26-year-old playmaker for Bulgarian side Botev Plovdiv — Laros' younger brother! A true family pride of Cape Verde. He came through Dutch Feyenoord and now conquers Eastern Europe. His creativity and shots from outside the box are a secret weapon." } },

    { "name": { "ru": "Марку Силва", "en": "Marco Silva" }, "pos": "midfielder", "status": "Star", "story": { "ru": "30-летний центральный полузащитник — один из самых стабильных игроков сборной! Его энергия и работоспособность в центре поля делают его незаменимым для Бубишты. 45+ матчей за «Голубых акул», настоящий боец.", "en": "A 30-year-old central midfielder — one of the squad's most consistent players! His energy and work rate in central midfield make him indispensable for Bubista. 45+ caps for the 'Blue Sharks', a true fighter." } },

    { "name": { "ru": "Воссинья", "en": "Vossinha" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "38-летний ветеран — настоящая легенда Кабо-Верде! Прошёл через португальский и кипрский футбол. Его опыт и лидерство бесценны для молодой команды. 65+ матчей за сборную, участник Кубка Африки 2013 и 2015!", "en": "A 38-year-old veteran — a true Cape Verde legend! He came through Portuguese and Cypriot football. His experience and leadership are invaluable for the young team. 65+ caps, participant in AFCON 2013 and 2015!" } },

    { "name": { "ru": "Бриан Тейшейра", "en": "Brian Teixeira" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "23-летний атакующий полузащитник — один из самых перспективных талантов! Прошёл через академию «Спортинга» в Лиссабоне. Его техника и дриблинг создают проблемы для любой обороны.", "en": "A 23-year-old attacking midfielder — one of the most promising talents! He came through Sporting Lisbon's academy. His technique and dribbling cause problems for any defence." } },

    { "name": { "ru": "Жефферсон Лима", "en": "Jefferson Lima" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "29-летний полузащитник с богатым опытом игры в бразильских низших лигах. Его энергия и работоспособность делают его ценным резервистом.", "en": "A 29-year-old midfielder with rich experience in Brazil's lower leagues. His energy and work rate make him a valuable reserve." } },

    { "name": { "ru": "Вагнер Пина", "en": "Wagner Pina" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "22-летний вингер португальского «Эшторила» — один из самых ярких молодых талантов! Его скорость и дриблинг создают хаос в обороне соперника. 10+ матчей за сборную, будущее атаки «Голубых акул».", "en": "The 22-year-old winger for Portuguese side Estoril Praia is one of the brightest young talents! His pace and dribbling create chaos in the opponent's defence. 10+ caps, the future of the 'Blue Sharks' attack." } },

    { "name": { "ru": "Кенни Роша Сантос", "en": "Kenny Rocha Santos" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний плеймейкер бельгийского «Остенде» — настоящая звезда! Прошёл через французские «Нанси» и «Мец». Его креативность и пасы — дирижёр атак сборной. 30+ матчей за Кабо-Верде, автор решающих голов в отборе.", "en": "The 26-year-old playmaker for Belgian side KV Oostende is a true star! He came through French Nancy and Metz. His creativity and passing are the conductor of the national team's attacks. 30+ caps, scorer of crucial qualifying goals." } },

    { "name": { "ru": "Бебе", "en": "Bebé" }, "pos": "forward", "status": "Legend", "story": { "ru": "35-летний нападающий — настоящая легенда с удивительной судьбой! Прошёл через «Манчестер Юнайтед» (!), «Бенфику», «Валенсию». Его история из детского дома до элиты мирового футбола вдохновляет всю нацию. 30+ матчей за сборную, символ мечты.", "en": "A 35-year-old forward — a true legend with an incredible story! He came through Manchester United (!), Benfica, Valencia. His journey from an orphanage to world football elite inspires the entire nation. 30+ caps, a symbol of dreams." } },

    { "name": { "ru": "Жилсон Тавареш", "en": "Gilson Tavares" }, "pos": "forward", "status": "Star", "story": { "ru": "24-летний нападающий португальской «Эштрелы Амадора» — один из самых горячих бомбардиров сборной! Прошёл через академию «Бенфики». Его мощь и игра в воздухе делают его опасным оружием. 20+ матчей за «Голубых акул», 8+ голов.", "en": "The 24-year-old forward for Portuguese side Estrela Amadora is one of the squad's hottest scorers! He came through Benfica's academy. His power and aerial ability make him a dangerous weapon. 20+ caps, 8+ goals for the 'Blue Sharks'." } },

    { "name": { "ru": "Гари Родригес", "en": "Garry Rodrigues" }, "pos": "forward", "status": "Legend", "story": { "ru": "35-летний вингер турецкого «Анкарагюджю» — настоящая звезда! Прошёл через греческий «Олимпиакос», саудовский «Аль-Иттихад». Его скорость и дриблинг создают кошмар для защитников. 45+ матчей за сборную, один из самых опытных игроков.", "en": "The 35-year-old winger for Turkish side Ankaragücü is a true star! He came through Greek Olympiacos and Saudi Al Ittihad. His pace and dribbling create a nightmare for defenders. 45+ caps, one of the squad's most experienced players." } },

    { "name": { "ru": "Стопира", "en": "Stopira" }, "pos": "forward", "status": "Legend", "story": { "ru": "37-летний ветеран — настоящая легенда Кабо-Верде! Прошёл через множество клубов в Европе и Африке. Его лидерство и опыт бесценны для молодой команды. 50+ матчей за сборную, символ эпохи возрождения.", "en": "A 37-year-old veteran — a true Cape Verde legend! He came through multiple clubs in Europe and Africa. His leadership and experience are invaluable for the young team. 50+ caps, a symbol of the revival era." } },

    { "name": { "ru": "Элбер Джамилу", "en": "Elber Djamil" }, "pos": "forward", "status": "Rising", "story": { "ru": "22-летний нападающий — один из самых молодых игроков в заявке! Его включение — это ставка на будущее островной атаки. Представляет новое поколение «Голубых акул», готовых покорять мировую арену.", "en": "A 22-year-old forward — one of the youngest players in the squad! His inclusion is a bet on the future of the island's attack. Represents the new generation of 'Blue Sharks' ready to conquer the world stage." } }
  ]
},
"KSA": {
  "desc": {
    "ru": "«Зеленые соколы» Саудовской Аравии — это амбиции, подкрепленные стремительным развитием. После исторической победы над Аргентиной они больше не боятся никого. Обладая техничными игроками и сыгранностью, саудовцы готовы покорять новые вершины и удивлять футбольный мир.",
    "en": "The 'Green Falcons' of Saudi Arabia are ambitions backed by rapid development. After their historic victory over Argentina, they fear no one anymore. Possessing technical players and excellent teamwork, the Saudis are ready to conquer new heights and surprise the football world."
  },
  "coaches": [{
    "name": { "ru": "Вр.и.о. (вакантно)", "en": "Interim (vacant)" },
    "story": {
      "ru": "Эрве Ренар уволен в апреле 2026 года за 55 дней до ЧМ. Новый тренер не назначен.",
      "en": "Hervé Renard was sacked in April 2026, 55 days before the World Cup. New coach not yet appointed."
    },
    "image": "https://placehold.co/300x300?text=KSA+Coach"
  }],
  "players": [
    { "name": { "ru": "Салем Аль-Досари", "en": "Salem Al-Dawsari" }, "pos": "forward", "status": "Star", "story": { "ru": "Автор легендарного гола в ворота Аргентины на ЧМ-2022.", "en": "Author of the legendary goal against Argentina at the 2022 World Cup." } },

    { "name": { "ru": "Мохамед Аль-Овайс", "en": "Mohamed Al Owais" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Герой ЧМ-2022! Его невероятные сейвы в матче против Аргентины (включая сэйвы от Месси и Мартинеса) стали фундаментом исторической победы. Настоящий гигант в воротах, который не боится громких имен.", "en": "Hero of the 2022 World Cup! His incredible saves against Argentina (including stops from Messi and Martinez) were the foundation of the historic victory. A true giant in goal who fears no big names." } },
    { "name": { "ru": "Наваф Аль-Акиди", "en": "Nawaf Al Aqidi" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Молодой талант из «Аль-Насра», который тренировался и играл в одной команде с Криштиану Роналду. Этот бесценный опыт трансформировал его в уверенного в себе голкипера европейского уровня.", "en": "A young talent from Al-Nassr who trained and played alongside Cristiano Ronaldo. This invaluable experience transformed him into a confident, European-level goalkeeper." } },
    { "name": { "ru": "Ахмед Аль-Кассар", "en": "Ahmed Alkassar" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Надежный ветеран «Аль-Кадисии». Его спокойствие и опыт служат надежным тылом для «Зеленых соколов», готовых к любым сюрпризам на мундиале.", "en": "The reliable veteran of Al-Qadsiah. His calmness and experience provide a solid safety net for the 'Green Falcons' ready for any World Cup surprises." } },

    { "name": { "ru": "Сауд Абдулхамид", "en": "Saud Abdulhamid" }, "pos": "defender", "status": "Star", "story": { "ru": "ЕДИНСТВЕННЫЙ легионер в заявке! Правый защитник французского «Ланса» и обладатель Кубка Франции. Его опыт игры в Европе — это мост между азиатским характером и топ-тактикой.", "en": "The ONLY overseas player in the squad! The right-back for French side Lens and Coupe de France winner. His European experience is the bridge between Asian grit and top-level tactics." } },
    { "name": { "ru": "Абдулелах Аль-Амри", "en": "Abdulelah Al Amri" }, "pos": "defender", "status": "Star", "story": { "ru": "Скала обороны «Аль-Насра». Еженедельные дуэли с лучшими нападающими мира в Про-лиге Саудовской Аравии сделали его бесстрашным и невероятно жестким центральным защитником.", "en": "The rock of Al-Nassr's defense. Weekly duels with the world's best strikers in the Saudi Pro League have made him a fearless and incredibly tough centre-back." } },
    { "name": { "ru": "Хассан Тамбакти", "en": "Hassan Tambakti" }, "pos": "defender", "status": "Star", "story": { "ru": "Чемпион Азии в составе «Аль-Хиляля». Его физическая мощь и чтение игры делают его непробиваемой стеной в центре обороны «Зеленых соколов».", "en": "An Asian champion with Al-Hilal. His physical power and reading of the game make him an impenetrable wall in the center of the 'Green Falcons' defense." } },
    { "name": { "ru": "Мотеб Аль-Харби", "en": "Moteb Al Harbi" }, "pos": "defender", "status": "Rising", "story": { "ru": "Молодой и взрывной левый защитник «Аль-Хиляля». Его скорость и подключения в атаку добавляют современное измерение в оборону сборной.", "en": "The young and explosive left-back of Al-Hilal. His pace and overlapping runs add a modern attacking dimension to the national team's defense." } },
    { "name": { "ru": "Али Ладжами", "en": "Ali Lajami" }, "pos": "defender", "status": "Squad", "story": { "ru": "Универсальный боец «Аль-Хиляля». Способен закрыть любой фланг обороны, привнося в команду тактическую гибкость и надежность.", "en": "A versatile fighter for Al-Hilal. Capable of covering any defensive flank, bringing tactical flexibility and reliability to the team." } },
    { "name": { "ru": "Хассан Кадеш", "en": "Hassan Kadesh" }, "pos": "defender", "status": "Squad", "story": { "ru": "Опытный центральный защитник «Аль-Иттихада». Его лидерские качества и игра на втором этаже делают его опасным оружием на стандартах.", "en": "An experienced centre-back for Al-Ittihad. His leadership and aerial ability make him a dangerous weapon on set pieces." } },
    { "name": { "ru": "Наваф Бушаль", "en": "Nawaf Boushal" }, "pos": "defender", "status": "Squad", "story": { "ru": "Техничный защитник «Аль-Насра», умеющий начинать атаки из глубины. Его пасы и видение поля ломают стереотипы об оборонцах сборной Саудовской Аравии.", "en": "A technical defender for Al-Nassr who can start attacks from deep. His passing and vision break the stereotypes about Saudi Arabia's defenders." } },
    { "name": { "ru": "Али Маджраши", "en": "Ali Majrashi" }, "pos": "defender", "status": "Squad", "story": { "ru": "Надежный крайний защитник «Аль-Ахли». Его работоспособность и самоотверженность в каждом матче делают его любимцем тренерского штаба.", "en": "A reliable full-back for Al-Ahli. His work rate and dedication in every match make him a favorite of the coaching staff." } },

"ALG": {
  "desc": {

    "en": "The 'Desert Foxes' are the speed, technique, and pride of Algeria. The national team that gave the world the legendary sensation of 1982 is ready for great things again. Their game is a cascade of feints and lightning-fast combinations, backed by an unyielding will to win."
  },

  "players": [

    { "name": { "ru": "Аисса Манди", "en": "Aïssa Mandi" }, "pos": "defender", "status": "Star", "story": { "ru": "33-летний центральный защитник французского «Лилля» — настоящий генерал обороны! Прошёл через «Реймс» и «Бетис». Его физическая мощь и чтение игры делают его одним из лучших африканских защитников в Европе. 70+ матчей за сборную, лидер обороны.", "en": "The 33-year-old French side Lille centre-back is a true defensive general! He came through Reims and Betis. His physical power and reading of the game make him one of Africa's best defenders in Europe. 70+ caps for the national team, a defensive leader." } },

    { "name": { "ru": "Самуэль Бастьен", "en": "Samuel Bastien" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний опорный полузащитник итальянской «Салернитаны» — настоящий мотор команды! Прошёл через «Андерлехт» и «Кьево». Его тактическая мудрость и умение разрушать атаки делают его незаменимым. 40+ матчей за «Леопардов».", "en": "The 28-year-old Italian side Salernitana defensive midfielder is a true team engine! He came through Anderlecht and Chievo. His tactical wisdom and ability to break up attacks make him indispensable. 40+ caps for the 'Leopards'." } },

    { "name": { "ru": "Самуэль Мутуссами", "en": "Samuel Moutoussamy" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний полузащитник французской «Нанта» — представитель элитного французского футбола! Прошёл через французские академии и теперь играет в Лиге 1. Его энергия и работоспособность в центре поля делают его незаменимым. 30+ матчей за сборную.", "en": "The 28-year-old French side Nantes midfielder is a representative of elite French football! He came through French academies and now plays in Ligue 1. His energy and work rate in central midfield make him indispensable. 30+ caps for the national team." } },

    { "name": { "ru": "Оменуке Мфулу", "en": "Omenuke Mfulu" }, "pos": "midfielder", "status": "Star", "story": { "ru": "31-летний полузащитник турецкого «Эюпспора» — ветеран с богатым опытом! Прошёл через французский футбол и теперь играет в Суперлиге. Его опыт и лидерство бесценны для молодой команды. 45+ матчей за «Леопардов».", "en": "The 31-year-old Turkish side Eyüpspor midfielder is a veteran with rich experience! He came through French football and now plays in the Super Lig. His experience and leadership are invaluable for the young team. 45+ caps for the 'Leopards'." } },

    { "name": { "ru": "Гаэль Какута", "en": "Gaël Kakuta" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "34-летний ветеран французского «Амьена» — настоящая легенда! Бывший вундеркинд «Челси», который не пробился в основу, но стал звездой во Франции. Его техника и видение поля делают его дирижёром атак. 50+ матчей за сборную.", "en": "The 34-year-old French side Amiens veteran is a true legend! A former Chelsea wonderkid who didn't break into the first team but became a star in France. His technique and vision make him the conductor of attacks. 50+ caps for the national team." } },

    { "name": { "ru": "Шарль Пикель", "en": "Charles Pickel" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний полузащитник итальянской «Кремонезе» — представитель элитного итальянского футбола! Прошёл через швейцарский футбол и теперь играет в Серии А. Его энергия и работоспособность делают его незаменимым. 25+ матчей за сборную.", "en": "The 27-year-old Italian side Cremonese midfielder is a representative of elite Italian football! He came through Swiss football and now plays in Serie A. His energy and work rate make him indispensable. 25+ caps for the national team." } },

    { "name": { "ru": "Тео Бонгонда", "en": "Théo Bongonda" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний вингер московского «Спартака» — настоящая звезда! Прошёл через бельгийский «Генк» и турецкий футбол. Его скорость и дриблинг создают кошмар для любых защитников. 35+ матчей за «Леопардов», один из самых опасных игроков.", "en": "The 29-year-old Moscow Spartak winger is a true star! He came through Belgian Genk and Turkish football. His pace and dribbling create a nightmare for any defenders. 35+ caps for the 'Leopards', one of the most dangerous players." } },

    { "name": { "ru": "Мишель-Анж Баликвиша", "en": "Michel-Ange Balikwisha" }, "pos": "midfielder", "status": "Star", "story": { "ru": "24-летний вингер бельгийского «Стандарда» — одна из главных звёзд сборной! Прошёл через бельгийские академии и теперь играет в одном из топ-клубов страны. Его техника и креативность делают его дирижёром атак. 20+ матчей за сборную.", "en": "The 24-year-old Belgian side Standard Liège winger is one of the squad's biggest stars! He came through Belgian academies and now plays for one of the country's top clubs. His technique and creativity make him the conductor of attacks. 20+ caps for the national team." } },

    { "name": { "ru": "Йоан Висса", "en": "Yoane Wissa" }, "pos": "forward", "status": "Star", "story": { "ru": "28-летний нападающий английского «Брентфорда» — настоящая суперзвезда! Прошёл через французский «Лорьян» и теперь играет в Премьер-лиге. Его скорость и голевое чутье делают его одним из самых опасных игроков Африки. 30+ матчей за сборную, главная надежда атаки.", "en": "The 28-year-old English side Brentford forward is a true superstar! He came through French Lorient and now plays in the Premier League. His pace and goal-scoring instinct make him one of Africa's most dangerous players. 30+ caps for the national team, the attack's main hope." } },

    { "name": { "ru": "Мешак Элиа", "en": "Meschak Elia" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний вингер швейцарского «Янг Бойз» — одна из главных звёзд сборной! Прошёл через конголезский «ТП Мазембе» и теперь играет в Лиге чемпионов УЕФА. Его техника и дриблинг создают проблемы для любой обороны. 40+ матчей за «Леопардов».", "en": "The 27-year-old Swiss side Young Boys winger is one of the squad's biggest stars! He came through Congolese TP Mazembe and now plays in the UEFA Champions League. His technique and dribbling cause problems for any defence. 40+ caps for the 'Leopards'." } },

    { "name": { "ru": "Силас Вамангитука", "en": "Silas Wamangituka" }, "pos": "forward", "status": "Star", "story": { "ru": "26-летний нападающий немецкого «Штутгарта» — настоящая сенсация! Родился в Конго, но долгое время выступал за молодежные сборные Франции. В 2024 году сменил гражданство на ДР Конго. Его мощь и игра в штрафной делают его опасным оружием. 10+ матчей за сборную.", "en": "The 26-year-old German side Stuttgart forward is a true sensation! Born in Congo but played for France's youth teams for years. Switched allegiance to DR Congo in 2024. His power and penalty area play make him a dangerous weapon. 10+ caps for the national team." } },

    { "name": { "ru": "Аарон Лейя Исека", "en": "Aaron Leya Iseka" }, "pos": "forward", "status": "Star", "story": { "ru": "28-летний нападающий французского «Меца» — представитель элитного французского футбола! Прошёл через бельгийский «Андерлехт» и теперь играет в Лиге 1. Его физическая мощь и игра в воздухе делают его опасным оружием. 25+ матчей за сборную.", "en": "The 28-year-old French side Metz forward is a representative of elite French football! He came through Belgian Anderlecht and now plays in Ligue 1. His physical power and aerial ability make him a dangerous weapon. 25+ caps for the national team." } },

    { "name": { "ru": "Николя Нгамалеу", "en": "Nicolas Ngamaleu" }, "pos": "forward", "status": "Star", "story": { "ru": "30-летний вингер московского «Динамо» — настоящий боец с характером! Прошёл через камерунский футбол и теперь играет в РПЛ. Его скорость и дриблинг создают кошмар для любых защитников. 45+ матчей за «Леопардов», один из самых опытных игроков.", "en": "The 30-year-old Moscow Dynamo winger is a true fighter with character! He came through Cameroonian football and now plays in the Russian Premier League. His pace and dribbling create a nightmare for any defenders. 45+ caps for the 'Leopards', one of the squad's most experienced players." } },

    { "name": { "ru": "Фистон Майеле", "en": "Fiston Mayele" }, "pos": "forward", "status": "Legend", "story": { "ru": "33-летний нападающий египетского «Пирамидз» — настоящая легенда африканского футбола! Лучший бомбардир Лиги чемпионов КАФ 2023/24. Его опыт и голевое чутье бесценны для молодой команды. 35+ матчей за сборную, символ эпохи.",
"en": "The 33-year-old Egyptian side Pyramids FC forward is a true African football legend! Top scorer of the 2023/24 CAF Champions League. His experience and goal-scoring instinct are invaluable for the young team. 35+ caps for the national team, a symbol of an era." } }
  ]
},
"UZB": {
  "desc": {
    "ru": "Сборная Узбекистана — гордость Центральной Азии и команда, чье время наконец пришло. Обладая самым талантливым поколением в своей истории, узбекистанцы сочетают техничный футбол и восточную мудрость. Они едут на свой первый мундиаль, чтобы доказать: в Узбекистане футбол — это чуть больше, чем просто игра.",
    "en": "The Uzbekistan national team is the pride of Central Asia and a team whose time has finally come. Possessing the most talented generation in its history, the Uzbeks combine technical football and Eastern wisdom. They go to their first World Cup to prove: in Uzbekistan, football is more than a game."
  },
  "coaches": [{
    "name": { "ru": "Фабио Каннаваро", "en": "Fabio Cannavaro" },
    "story": {
      "ru": "Легендарный итальянский защитник, чемпион мира 2006. Привёл Узбекистан к первому в истории ЧМ.",
      "en": "Legendary Italian defender, 2006 World Cup champion. Led Uzbekistan to their first-ever World Cup."
    },
    "image": "https://placehold.co/300x300?text=Fabio+Cannavaro"
  }],
  "players": [
    { "name": { "ru": "Эльдор Шомуродов", "en": "Eldor Shomurodov" }, "pos": "forward", "status": "Captain", "story": { "ru": "Лучший бомбардир в истории сборной, проторивший путь в итальянскую Серию А.", "en": "The national team's all-time leading goalscorer, who paved the way to the Italian Serie A." } },
    { "name": { "ru": "Аббосбек Файзуллаев", "en": "Abbosbek Fayzullaev" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Молодой талант, ставший открытием чемпионата и надеждой узбекского футбола.", "en": "A young talent who has become a revelation and the hope of Uzbek football." } },

    { "name": { "ru": "Абдукодир Хусанов", "en": "Abdukodir Khusanov" }, "pos": "defender", "status": "Star", "story": { "ru": "Главная сенсация и гордость нации! Первый узбекистанец в истории АПЛ, подписавший контракт с самим «Манчестер Сити» Пепa Гвардиолы. Его скорость, мощь и чтение игры позволяют ему сдерживать лучших нападающих мира. Любимчик Каннаваро, цементирующий оборону «Белых волков».", "en": "The main sensation and pride of the nation! The first Uzbek in Premier League history, signed by Pep Guardiola's Manchester City himself. His pace, power, and reading of the game allow him to contain the world's best strikers. Cannavaro's favorite, cementing the 'White Wolves' defense." } },

    { "name": { "ru": "Отабек Шукуров", "en": "Otabek Shukurov" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Сердце и душа сборной, мотор полузащиты. Его фирменные штрафные удары — это отдельный вид искусства, который не раз спасал команду в решающие моменты. Опытный лидер, выступающий в турецкой Суперлиге, задающий тон в центре поля.", "en": "The heart and soul of the national team, the midfield engine. His signature free-kicks are a separate art form that has saved the team in crucial moments more than once. An experienced leader playing in the Turkish Super Lig, setting the tempo in central midfield." } },

    { "name": { "ru": "Игорь Сергеев", "en": "Igor Sergeyev" }, "pos": "forward", "status": "Legend", "story": { "ru": "Настоящий ветеран и легенда ташкентского «Пахтакора». Более 100 матчей за сборную! Его опыт, игра на втором этаже и умение держать мяч под давлением делают его незаменимым таргетменом. Мост между старым и новым поколениями узбекского футбола.", "en": "A true veteran and legend of Tashkent's Pakhtakor. Over 100 caps for the national team! His experience, aerial ability, and hold-up play make him an indispensable target man. The bridge between the old and new generations of Uzbek football." } },

    { "name": { "ru": "Ходжиакбар Алиджанов", "en": "Khojiakbar Alijonov" }, "pos": "defender", "status": "Star", "story": { "ru": "Неприступная скала в центре обороны «Пахтакора» и сборной. Отличается невероятной самоотверженностью и умением играть головой. Его лидерские качества и спортивная злость делают его кошмаром для любых нападающих.", "en": "An impregnable rock in the center of defense for Pakhtakor and the national team. Distinguished by incredible dedication and aerial prowess. His leadership and competitive anger make him a nightmare for any strikers." } },

    { "name": { "ru": "Хусниддин Аликулов", "en": "Husniddin Aliqulov" }, "pos": "defender", "status": "Star", "story": { "ru": "Современный латераль из «Насафа». Его правая нога бьет как пушка, а навесы с фланга находят головы форвардов с хирургической точностью. Один из самых прогрессирующих защитников Азии, постоянно подключающийся в атаку.", "en": "A modern full-back from Nasaf. His right foot strikes like a cannon, and his crosses from the flank find the forwards' heads with surgical precision. One of Asia's most progressive defenders, constantly joining the attack." } },

    { "name": { "ru": "Олег Бахтиёров", "en": "Oleg Bakhtiarov" }, "pos": "defender", "status": "Star", "story": { "ru": "Универсальный боец, способный закрыть любой фланг обороны. Прошёл суровую школу казахстанской Премьер-лиги в составе «Ордабасы». Его тактическая гибкость и физическая мощь — идеальное оружие для системы Каннаваро.", "en": "A versatile fighter capable of covering any defensive flank. He went through the tough school of the Kazakh Premier League with Ordabasy. His tactical flexibility and physical power are the perfect weapon for Cannavaro's system." } },

    { "name": { "ru": "Шоймурод Абдурахманов", "en": "Shoymurod Abdurakhmanov" }, "pos": "defender", "status": "Star", "story": { "ru": "Надежнейший центральный защитник «Насафа». Отлично читает игру и предпочитает играть на опережение. Его хладнокровие в стрессовых ситуациях помогает сборной сохранять сухие матчи против топ-сборных.", "en": "The most reliable centre-back for Nasaf. He reads the game brilliantly and prefers to play on the front foot. His composure in stressful situations helps the national team keep clean sheets against top teams." } },

    { "name": { "ru": "Шерзод Насруллаев", "en": "Sherzod Nasrullaev" }, "pos": "defender", "status": "Star", "story": { "ru": "Ещё один оплот обороны из каршинского «Насафа». Отличается великолепным чувством позиции и жесткостью в единоборствах. В паре с Хусановым образует центральный защитный дуэт, который сложно пройти.", "en": "Another defensive pillar from Karshi's Nasaf. Distinguished by excellent positional sense and toughness in duels. Paired with Khusanov, he forms a central defensive duo that is hard to get past." } },

    { "name": { "ru": "Сaidжамол Давлатжонов", "en": "Saidjamol Davlatjonov" }, "pos": "defender", "status": "Rising", "story": { "ru": "Молодой и дерзкий левый защитник из «Бунёдкора». Представляет новое поколение узбекских футболистов, которые с детства впитали итальянскую тактическую дисциплину от Каннаваро. Его скорость и дриблинг — свежий глоток воздуха.", "en": "A young and daring left-back from Bunyodkor. Represents the new generation of Uzbek footballers who have absorbed Italian tactical discipline from Cannavaro since childhood. His pace and dribbling are a breath of fresh air." } },

    { "name": { "ru": "Иброхимхалил Юлдосhev", "en": "Ibrokhimkhalil Yuldoshev" }, "pos": "defender", "status": "Star", "story": { "ru": "Быстрый и выносливый правый защитник, покоряющий клубный футбол Казахстана. Его неутомимые рывки по бровке позволяют сборной создавать численное преимущество на флангах. Настоящий трудяга.", "en": "A fast and enduring right-back conquering Kazakh club football. His tireless runs down the wing allow the national team to create numerical superiority on the flanks. A true workhorse." } },

    { "name": { "ru": "Отабек Бойров", "en": "Otabek Boirov" }, "pos": "defender", "status": "Rising", "story": { "ru": "21-летний вундеркинд из «Пахтакора». Один из самых перспективных молодых центральных защитников Азии. Его спокойствие с мячом и первый пас из обороны ломают стереотипы о классических азиатских защитниках.", "en": "A 21-year-old wonderkid from Pakhtakor. One of Asia's most promising young centre-backs. His composure on the ball and first pass from the back break the stereotypes about classic Asian defenders." } },

    { "name": { "ru": "Джасурбек Жалолитдинов", "en": "Jasurbek Jaloliddinov" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Креативный хавбек с потрясающим дриблингом. Его умение обыгрывать один в один и обострять игру из глубины поля делает его одним из самых непредсказуемых игроков сборной. Настоящий волшебник мяча.", "en": "A creative midfielder with stunning dribbling skills. His ability to beat players 1v1 and sharpen the game from deep makes him one of the squad's most unpredictable players. A true ball wizard." } },

    { "name": { "ru": "Азизбек Тургунбоев", "en": "Azizbek Turgunboev" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Неутомимый «бокс-ту-бокс» из «Пахтакора». Его легкие способны выдерживать сумасшедшие объемы беговой работы. Он перекрывает кислород сопернику и тут же начинает стремительные контратаки.", "en": "The tireless box-to-box midfielder from Pakhtakor. His lungs can handle insane running volumes. He cuts off the opponent's oxygen supply and immediately launches swift counterattacks." } },

    { "name": { "ru": "Азизбек Амонов", "en": "Azizbek Amonov" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Опорный полузащитник-разрушитель. Его главная задача — срывать атаки соперника на подступах к штрафной. Жесткий, принципиальный и тактически грамотный игрок, обеспечивающий баланс в команде.", "en": "A defensive destroyer midfielder. His main task is to break up the opponent's attacks near the penalty area. A tough, principled, and tactically astute player providing balance to the team." } },

    { "name": { "ru": "Ходжимат Эркинов", "en": "Khojimat Erkinov" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Техничный плеймейкер, имеющий опыт игры в российской Премьер-лиге. Его видение поля и умение отдать разрезающий пас между линий линий — ключ к взлоку насыщенной обороны соперника.", "en": "A technical playmaker with experience in the Russian Premier League. His vision of the field and ability to deliver a penetrating pass between the lines are the key to breaking down a packed opponent defense." } },

    { "name": { "ru": "Диёр Холматов", "en": "Diyor Kholmatov" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "Молодой и амбициозный хавбек из «Ордабасы». Отличается отличным ударом из-за штрафной и невероятной работоспособностью. Один из главных талантов нового поколения, уже ставший незаменимым в основе.", "en": "A young and ambitious midfielder from Ordabasy. Distinguished by a great shot from outside the box and incredible work rate. One of the main talents of the new generation, already indispensable in the starting lineup." } },

    { "name": { "ru": "Бобур Абдихоликов", "en": "Bobur Abdikholikov" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Интеллектуальный полузащитник с великолепным первым касанием. Его пасы и умение диктовать темп игры делают его дирижером оркестра в центре поля. Настоящий мозг команды на поле.", "en": "An intellectual midfielder with a magnificent first touch. His passing and ability to dictate the game's tempo make him the conductor of the orchestra in central midfield. The true brain of the team on the pitch." } },

    { "name": { "ru": "Одилжон Хамробеков", "en": "Odiljon Hamrobekov" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Мощный и габаритный опорник «Пахтакора». Отлично чувствует игру и страхует партнеров по обороне. Его физическая мощь позволяет ему доминировать в единоборствах в центре поля.", "en": "A powerful and physical defensive midfielder for Pakhtakor. He reads the game brilliantly and covers his defensive partners. His physical power allows him to dominate duels in central midfield." } },

    { "name": { "ru": "Остон Урунов", "en": "Oston Urunov" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Обладатель потрясающей левой ноги, в свое время покорявший московский «Спартак». Его дриблинг, нестандартные финты и умение исполнить невозможное со стандартов делают его любимцем болельщиков и кошмаром соперников.", "en": "The owner of a stunning left foot, who once conquered Moscow's Spartak. His dribbling, unorthodox feints, and ability to execute the impossible from set pieces make him a fan favorite and a nightmare for opponents." } },

    { "name": { "ru": "Эдсон Нематов", "en": "Edson Nematov" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Первый номер сборной и герой «Насафа». Молодой, реактивный и бесстрашный вратарь, который не боится играть на выходах и начинать атаки своей команды. Будущее вратарской линии Узбекистана уже наступило.", "en": "The national team's number one and the hero of Nasaf. A young, reactive, and fearless goalkeeper who is not afraid to play off his line and start his team's attacks. The future of Uzbekistan's goalkeeping has already arrived." } },

    { "name": { "ru": "Ботирали Эргашев", "en": "Botirali Ergashev" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Надежный и опытный страж ворот из АГМК. Его спокойствие и уверенность в себе служат отличным примером для молодых партнеров. Всегда готов выйти на замену и спасти команду в трудную минуту.", "en": "A reliable and experienced shot-stopper from AGMK. His calmness and self-confidence serve as a great example for young teammates. Always ready to come off the bench and save the team in a difficult moment." } },

    { "name": { "ru": "Уткир Юсупов", "en": "Utkir Yusupov" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Ветеран с богатым опытом выступлений за клубы Узбекистана. Его профессионализм и отношение к тренировочному процессу задают высочайшие стандарты в раздевалке сборной. Третий вратарь, но настоящий лидер по духу.", "en": "A veteran with rich experience playing for Uzbek clubs. His professionalism and attitude towards the training process set the highest standards in the national team's dressing room. The third goalkeeper, but a true leader in spirit." } },

    { "name": { "ru": "Шерзод Эсанов", "en": "Sherzod Esanov" }, "pos": "forward", "status": "Star", "story": { "ru": "Один из самых результативных нападающих внутреннего чемпионата. Отличается отличным голевым чутьем и умением оказаться в нужном месте в нужное время. Мощное подкрепление для атакующего потенциала сборной.", "en": "One of the most prolific strikers in the domestic championship. Distinguished by excellent goal-scoring instinct and the ability to be in the right place at the right time. A powerful reinforcement for the national team's attacking potential." } },

    { "name": { "ru": "Иброхим Иброхимов", "en": "Ibrokhim Ibrokhimov" }, "pos": "forward", "status": "Star", "story": { "ru": "Быстрый и техничный форвард «Навбахора». Его умение играть в отрыве и убегать в контратаки идеально вписывается в философию Каннаваро. Настоящий кошмар для защитников, не любящих играть высоко в линии.", "en": "A fast and technical forward for Navbahor. His ability to play on the shoulder of the last defender and run into counterattacks fits perfectly into Cannavaro's philosophy. A true nightmare for defenders who don't like playing a high line." } }
  ]
},
"COL": {
  "desc": {
    "ru": "Колумбия — это карнавал красок и взрывной, атакующий футбол. «Лос Кафетерос» вновь обрели свою магию в сочетании звезд мирового масштаба и страсти родных трибун. Каждый их матч — праздник жизни и мастерства, заставляющий весь мир влюбляться в желтую футболку.",
    "en": "Colombia has returned to the ranks of the world's top national teams, demonstrating bright attacking football. 'Los Cafeteros' have regained their magic, combining the technique of world-class stars and the passion of home fans. Each of their matches is a celebration of life and skill that makes the whole world fall in love with the yellow jersey."
  },
  "coaches": [{ "name": { "ru": "Нестор Лоренцо", "en": "Néstor Lorenzo" }, "story": { "ru": "Аргентинский тренер, при котором Колумбия выдала рекордную беспроигрышную серию.", "en": "Argentine coach under whom Colombia produced a record unbeaten streak." }, "image": "https://placehold.co/300x300?text=Néstor+Lorenzo" }],
  "players": [
    { "name": { "ru": "Луис Диас", "en": "Luis Diaz" }, "pos": "forward", "status": "Star", "story": { "ru": "Взрывной вингер «Ливерпуля», главная атакующая угроза колумбийцев.", "en": "Explosive Liverpool winger, the main attacking threat for the Colombians." } },
    { "name": { "ru": "Хамес Родригес", "en": "James Rodriguez" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Обладатель золотой бутсы ЧМ-2014, переживающий вторую молодость в сборной.", "en": "2014 WC Golden Boot winner, undergoing a second youth in the national team." } },

    { "name": { "ru": "Камило Варгас", "en": "Camilo Vargas" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "37-летний ветеран мексиканского «Атласа» — первый номер сборной! Его невероятная реакция и опыт игры в Латинской Америке делают его непререкаемым авторитетом. 70+ матчей за «Лос Кафетерос», настоящий страж ворот.", "en": "The 37-year-old Mexican side Atlas veteran is the national team's number one! His incredible reflexes and Latin American experience make him an unquestionable authority. 70+ caps for 'Los Cafeteros', a true guardian of the goal." } },

    { "name": { "ru": "Альваро Монтерро", "en": "Alvaro Montero" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "32-летний голкипер колумбийского «Атлетико Насьональ» — надёжный резервист с богатым опытом! Один из лучших стражей ворот внутреннего чемпионата. Его хладнокровие и уверенность на линии ворот делают его ценным дублёром.", "en": "The 32-year-old Colombian side Atlético Nacional goalkeeper is a reliable backup with rich experience! One of the best shot-stoppers in the domestic league. His composure and confidence between the posts make him a valuable backup." } },

    { "name": { "ru": "Хосе Фернандо Куадрадо", "en": "José Fernando Cuadrado" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "29-летний вратарь «Онсе Кальдас» — представитель нового поколения! Его включение в состав — это ставка на молодость и энергию. Один из самых перспективных голкиперов Колумбии, готовый сменить ветеранов.", "en": "The 29-year-old Once Caldas goalkeeper is a representative of the new generation! His inclusion is a bet on youth and energy. One of Colombia's most promising goalkeepers, ready to replace the veterans." } },

    { "name": { "ru": "Йерри Мина", "en": "Yerry Mina" }, "pos": "defender", "status": "Star", "story": { "ru": "31-летний центральный защитник итальянской «Кремонезе» — настоящий гигант (195 см)! Прошёл через «Барселону», «Эвертон» и теперь играет в Серии А. Его рост и мощь делают его башней в штрафной соперника. 50+ матчей за сборную, лидер обороны.", "en": "The 31-year-old Italian side Cremonese centre-back is a true giant (195cm)! He came through Barcelona, Everton, and now plays in Serie A. His height and power make him a tower in the opponent's penalty area. 50+ caps for the national team, a defensive leader." } },

    { "name": { "ru": "Дависон Санчес", "en": "Davinson Sánchez" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний центральный защитник турецкого «Галатасарая» — один из самых стабильных игроков сборной! Прошёл через «Аякс» и английский «Тоттенхэм». Его физическая мощь и чтение игры делают его одним из лучших защитников Южной Америки. 60+ матчей за «Лос Кафетерос».", "en": "The 29-year-old Turkish side Galatasaray centre-back is one of the squad's most consistent players! He came through Ajax and English Tottenham. His physical power and reading of the game make him one of South America's best defenders. 60+ caps for 'Los Cafeteros'." } },

    { "name": { "ru": "Хуан Кабальеро", "en": "Juan Cabal" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний левый защитник итальянского «Ювентуса» — одна из главных звёзд сборной! Прошёл через колумбийские клубы и теперь играет в одном из лучших клубов мира. Его скорость и техника делают его современным фланговым защитником. 15+ матчей за сборную, будущее колумбийского футбола.", "en": "The 23-year-old Italian side Juventus left-back is one of the squad's biggest stars! He came through Colombian clubs and now plays for one of the world's best clubs. His pace and technique make him a modern full-back. 15+ caps for the national team, the future of Colombian football." } },

    { "name": { "ru": "Даниэль Муньос", "en": "Daniel Muñoz" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний правый защитник английского «Кристал Пэлас» — представитель элитного английского футбола! Прошёл через бельгийский «Генк» и теперь играет в Премьер-лиге. Его энергия и работоспособность делают его незаменимым. 25+ матчей за сборную.", "en": "The 29-year-old English side Crystal Palace right-back is a representative of elite English football! He came through Belgian Genk and now plays in the Premier League. His energy and work rate make him indispensable. 25+ caps for the national team." } },

    { "name": { "ru": "Йохан Моихика", "en": "Johan Mojica" }, "pos": "defender", "status": "Legend", "story": { "ru": "33-летний ветеран испанского «Мальорки» — настоящая легенда колумбийского футбола! Прошёл через испанские клубы и теперь играет в Ла Лиге. Его опыт и лидерство бесценны для молодой команды. 55+ матчей за сборную, участник ЧМ-2018.", "en": "The 33-year-old Spanish side Mallorca veteran is a true Colombian football legend! He came through Spanish clubs and now plays in La Liga. His experience and leadership are invaluable for the young team. 55+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Карлос Куэста", "en": "Carlos Cuesta" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний центральный защитник бельгийского «Генка» — один из самых перспективных талантов! Прошёл через колумбийский «Атлетико Насьональ» и теперь играет в Бельгии. Его техника и скорость делают его современным защитником. 20+ матчей за сборную.", "en": "The 26-year-old Belgian side Genk centre-back is one of the most promising talents! He came through Colombian Atlético Nacional and now plays in Belgium. His technique and pace make him a modern defender. 20+ caps for the national team." } },

    { "name": { "ru": "Дейнрис Кинтеро", "en": "Deiner Quiñónez" }, "pos": "defender", "status": "Squad", "story": { "ru": "28-летний защитник колумбийского «Мильонариос» — надёжный боец с характером! Один из самых стабильных игроков внутреннего чемпионата. Его физическая мощь и самоотверженность делают его ценным резервистом. 10+ матчей за сборную.", "en": "The 28-year-old Colombian side Millonarios defender is a reliable fighter with character! One of the most consistent players in the domestic league. His physical power and dedication make him a valuable reserve. 10+ caps for the national team." } },

    { "name": { "ru": "Вильмар Барриос", "en": "Wilmar Barrios" }, "pos": "midfielder", "status": "Star", "story": { "ru": "31-летний опорный полузащитник российского «Зенита» — настоящий мотор команды! Прошёл через колумбийский «Бока Хуниорс» и теперь играет в РПЛ. Его тактическая мудрость и умение разрушать атаки делают его незаменимым. 70+ матчей за сборную.", "en": "The 31-year-old Russian side Zenit defensive midfielder is a true team engine! He came through Colombian Boca Juniors and now plays in the Russian Premier League. His tactical wisdom and ability to break up attacks make him indispensable. 70+ caps for the national team." } },

    { "name": { "ru": "Ричард Риос", "en": "Richard Ríos" }, "pos": "midfielder", "status": "Star", "story": { "ru": "25-летний полузащитник английского «Брайтона» — одна из главных звёзд сборной! Прошёл через бразильский «Палмейрас» и теперь играет в Премьер-лиге. Его техника и видение поля делают его дирижёром атак. 20+ матчей за «Лос Кафетерос», будущее колумбийского футбола.", "en": "The 25-year-old English side Brighton midfielder is one of the squad's biggest stars! He came through Brazilian Palmeiras and now plays in the Premier League. His technique and vision make him the conductor of attacks. 20+ caps for 'Los Cafeteros', the future of Colombian football." } },

    { "name": { "ru": "Джефферсон Лерма", "en": "Jefferson Lerma" }, "pos": "midfielder", "status": "Star", "story": { "ru": "30-летний полузащитник английского «Кристал Пэлас» — настоящий боец с характером! Прошёл через испанский «Леванте» и теперь играет в Премьер-лиге. Его энергия и работоспособность в центре поля делают его незаменимым. 50+ матчей за сборную.", "en": "The 30-year-old English side Crystal Palace midfielder is a true fighter with character! He came through Spanish Levante and now plays in the Premier League. His energy and work rate in central midfield make him indispensable. 50+ caps for the national team." } },

    { "name": { "ru": "Хорхе Карраскаль", "en": "Jorge Carrascal" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний полузащитник российского «Динамо» — представитель элитного российского футбола! Прошёл через аргентинский «Ривер Плейт» и теперь играет в РПЛ. Его креативность и пасы — секретное оружие «Лос Кафетерос». 25+ матчей за сборную.", "en": "The 27-year-old Russian side Dynamo Moscow midfielder is a representative of elite Russian football! He came through Argentine River Plate and now plays in the Russian Premier League. His creativity and passing are 'Los Cafeteros' secret weapon. 25+ caps for the national team." } },

    { "name": { "ru": "Густаво Куэльяр", "en": "Gustavo Cuéllar" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "32-летний ветеран саудовского «Аль-Хиляля» — настоящая легенда колумбийского футбола! Прошёл через колумбийские клубы и теперь играет на Ближнем Востоке. Его опыт и лидерство бесценны для молодой команды. 45+ матчей за сборную.", "en": "The 32-year-old Saudi side Al Hilal veteran is a true Colombian football legend! He came through Colombian clubs and now plays in the Middle East. His experience and leadership are invaluable for the young team. 45+ caps for the national team." } },

    { "name": { "ru": "Джон Ариас", "en": "John Arias" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний вингер бразильского «Флуминенсе» — одна из главных звёзд сборной! Прошёл через колумбийские клубы и теперь играет в одном из лучших клубов Бразилии. Его скорость и дриблинг создают кошмар для любых защитников. 25+ матчей за «Лос Кафетерос».", "en": "The 27-year-old Brazilian side Fluminense winger is one of the squad's biggest stars! He came through Colombian clubs and now plays for one of Brazil's best clubs. His pace and dribbling create a nightmare for any defenders. 25+ caps for 'Los Cafeteros'." } },

    { "name": { "ru": "Рафаэль Сантос Борре", "en": "Rafael Santos Borré" }, "pos": "forward", "status": "Star", "story": { "ru": "29-летний нападающий бразильского «Интернасьонала» — настоящий боец с характером! Прошёл через «Атлетико Мадрид», «Вильярреал» и теперь играет в Бразилии. Его мощь и игра в штрафной делают его опасным оружием. 35+ матчей за сборную.", "en": "The 29-year-old Brazilian side Internacional forward is a true fighter with character! He came through Atlético Madrid, Villarreal, and now plays in Brazil. His power and penalty area play make him a dangerous weapon. 35+ caps for the national team." } },

    { "name": { "ru": "Дуван Сапата", "en": "Duván Zapata" }, "pos": "forward", "status": "Legend", "story": { "ru": "34-летний ветеран итальянской «Аталанты» — настоящая легенда колумбийского футбола! Прошёл через «Наполи», «Сампдорию» и теперь играет в Серии А. Его опыт и голевое чутье бесценны для молодой команды. 50+ матчей за сборную, участник ЧМ-2018.", "en": "The 34-year-old Italian side Atalanta veteran is a true Colombian football legend! He came through Napoli, Sampdoria, and now plays in Serie A. His experience and goal-scoring instinct are invaluable for the young team. 50+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Луис Суарес", "en": "Luis Suárez" }, "pos": "forward", "status": "Legend", "story": { "ru": "37-летний ветеран колумбийского «Атлетико Насьональ» — настоящая легенда! Не путать с уругвайцем! Прошёл через множество колумбийских клубов. Его опыт и лидерство бесценны для молодой команды. 30+ матчей за сборную, символ эпохи.", "en": "The 37-year-old Colombian side Atlético Nacional veteran is a true legend! Not to be confused with the Uruguayan! He came through multiple Colombian clubs. His experience and leadership are invaluable for the young team. 30+ caps for the national team, a symbol of an era." } },

    { "name": { "ru": "Йон Андерсон", "en": "Jhon Anderson" }, "pos": "forward", "status": "Rising", "story": { "ru": "22-летний вундеркинд бразильского «Фламенго» — одна из главных сенсаций! Прошёл через колумбийские клубы и теперь играет в одном из лучших клубов Бразилии. Его техника и креативность делают его дирижёром атак. 10+ матчей за сборную, будущее колумбийского футбола.", "en": "The 22-year-old Brazilian side Flamengo wonderkid is one of the main sensations! He came through Colombian clubs and now plays for one of Brazil's best clubs. His technique and creativity make him the conductor of attacks. 10+ caps for the national team, the future of Colombian football." } },

    { "name": { "ru": "Кристиан Борха", "en": "Cristian Borja" }, "pos": "forward", "status": "Star", "story": { "ru": "26-летний нападающий аргентинского «Бока Хуниорс» — представитель элитного аргентинского футбола! Прошёл через колумбийские клубы и теперь играет в одном из лучших клубов Аргентины. Его скорость и голевое чутье делают его опасным оружием. 15+ матчей за сборную.", "en": "The 26-year-old Argentine side Boca Juniors forward is a representative of elite Argentine football! He came through Colombian clubs and now plays for one of Argentina's best clubs. His pace and goal-scoring instinct make him a dangerous weapon. 15+ caps for the national team." } },

    { "name": { "ru": "Хуан Хосе Перейра", "en": "Juan José Pereira" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "21-летний полузащитник колумбийского «Атлетико Насьональ» — один из самых молодых игроков в заявке! Его включение — это ставка на будущее колумбийского футбола. Представляет новое поколение «Лос Кафетерос», готовых покорять мировую арену.", "en": "The 21-year-old Colombian side Atlético Nacional midfielder is one of the youngest players in the squad! His inclusion is a bet on the future of Colombian football. Represents the new generation of 'Los Cafeteros' ready to conquer the world stage." } },

    { "name": { "ru": "Андерсон Ангуло", "en": "Anderson Angulo" }, "pos": "defender", "status": "Rising", "story": { "ru": "24-летний защитник эквадорского «Индепендьенте дель Валье» — представитель элитного эквадорского футбола! Прошёл через колумбийские клубы и теперь играет в одном из лучших клубов Эквадора. Его физическая мощь и скорость делают его современным защитником. 10+ матчей за сборную.", "en": "The 24-year-old Ecuadorian side Independiente del Valle defender is a representative of elite Ecuadorian football! He came through Colombian clubs and now plays for one of Ecuador's best clubs. His physical power and pace make him a modern defender. 10+ caps for the national team." } },

    { "name": { "ru": "Хуан Давид Кабальеро", "en": "Juan David Cabal" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний защитник колумбийского «Депортиво Кали» — надёжный боец с характером! Один из самых стабильных игроков внутреннего чемпионата. Его опыт и лидерство делают его ценным резервистом. 8+ матчей за сборную.", "en": "The 27-year-old Colombian side Deportivo Cali defender is a reliable fighter with character! One of the most consistent players in the domestic league. His experience and leadership make him a valuable reserve. 8+ caps for the national team." } }

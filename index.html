"CRO": {
  "desc": {
    "ru": "Сборная Хорватии — маленькое чудо большого футбола. Страна, которая вопреки всему, раз за разом, восходит на пьедестал. Ведомые гениальным Модричем, хорваты — эталон выносливости, тактической выучки и несгибаемого духа, который позволяет им побеждать в самых безнадежных ситуациях.",
    "en": "The Croatia national team is a small miracle of big football. A country that, against all odds, repeatedly rises to the pedestal. Led by the brilliant Modrić, the Croats are the standard of endurance, tactical training, and unyielding spirit that allows them to win in the most hopeless situations."

  },
  "coaches": [{ "name": { "ru": "Златко Далич", "en": "Zlatko Dalić" }, "story": { "ru": "Самый успешный тренер в истории Хорватии, символ стабильности и национального духа.", "en": "The most successful coach in Croatia's history, a symbol of stability and national spirit." }, "image": "https://placehold.co/300x300?text=Zlatko+Dalić" }],
  "players": [
    { "name": { "ru": "Лука Модрич", "en": "Luka Modric" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Вечный двигатель и легенда мирового футбола. Обладатель Золотого мяча.", "en": "Perpetual motion machine and world football legend. Ballon d'Or winner." } },
    { "name": { "ru": "Йошко Гвардиол", "en": "Josko Gvardiol" }, "pos": "defender", "status": "Star", "story": { "ru": "Один из самых дорогих и талантливых защитников мира.", "en": "One of the most expensive and talented defenders in the world." } },

    { "name": { "ru": "Доминик Ливакович", "en": "Dominik Livaković" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "31-летний вратарь загребского «Динамо» — герой ЧМ-2022! Его сейвы в серии пенальти против Японии и Бразилии вошли в историю. Настоящий мастер отражения 11-метровых. 70+ матчей за сборную, первый номер «Ватрени».", "en": "The 31-year-old Dinamo Zagreb goalkeeper is the hero of WC 2022! His saves in the penalty shootouts against Japan and Brazil went down in history. A true master of saving penalties. 70+ caps for the national team, the 'Vatreni' number one." } },

    { "name": { "ru": "Доминик Котарски", "en": "Dominik Kotarski" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "26-летний вратарь датского «Копенгагена» — представитель элитного скандинавского футбола! Прошёл через амстердамский «Аякс» и теперь играет в Лиге чемпионов УЕФА. Его реакция и игра на выходах делают его надёжным резервистом. 10+ матчей за сборную.", "en": "The 26-year-old Danish side FC Copenhagen goalkeeper is a representative of elite Scandinavian football! He came through Amsterdam Ajax and now plays in the UEFA Champions League. His reflexes and command of the area make him a reliable backup. 10+ caps for the national team." } },

    { "name": { "ru": "Ивор Пандур", "en": "Ivor Pandur" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "26-летний голкипер английского «Халл Сити» — представитель Чемпионшипа! Прошёл через хорватские клубы и теперь покоряет английский футбол. Его хладнокровие и уверенность на линии ворот делают его ценным третьим номером. 5+ матчей за сборную.", "en": "The 26-year-old English side Hull City goalkeeper is a representative of the Championship! He came through Croatian clubs and now conquers English football. His composure and confidence between the posts make him a valuable third choice. 5+ caps for the national team." } },

    { "name": { "ru": "Дуе Чалета-Цар", "en": "Duje Ćaleta-Car" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний центральный защитник испанского «Реал Сосьедада» — представитель элитного испанского футбола! Прошёл через французский «Марсель» и австрийский «Ред Булл Зальцбург». Его техника и скорость делают его современным защитником. 40+ матчей за «Ватрени».", "en": "The 28-year-old Spanish side Real Sociedad centre-back is a representative of elite Spanish football! He came through French Marseille and Austrian Red Bull Salzburg. His technique and pace make him a modern defender. 40+ caps for the 'Vatreni'." } },

    { "name": { "ru": "Йосип Шутало", "en": "Josip Šutalo" }, "pos": "defender", "status": "Star", "story": { "ru": "25-летний центральный защитник нидерландского «Аякса» — одна из главных звёзд сборной! Прошёл через загребское «Динамо» и теперь играет в одном из лучших клубов Нидерландов. Его физическая мощь и чтение игры делают его одним из лучших молодых защитников Европы. 25+ матчей за сборную.", "en": "The 25-year-old Dutch side Ajax centre-back is one of the squad's biggest stars! He came through Dinamo Zagreb and now plays for one of the Netherlands' best clubs. His physical power and reading of the game make him one of Europe's best young defenders. 25+ caps for the national team." } },

    { "name": { "ru": "Йосип Станишич", "en": "Josip Stanišić" }, "pos": "defender", "status": "Star", "story": { "ru": "25-летний правый защитник мюнхенской «Баварии» — настоящая звезда! Родился в Германии в хорватской семье, но выбрал сборную исторической родины. Прошёл через академию «Баварии» и теперь играет за топ-клуб мира. Его универсальность позволяет закрыть любой фланг. 20+ матчей за сборную.", "en": "The 25-year-old Bayern Munich right-back is a true star! Born in Germany to a Croatian family but chose the national team of his ancestral homeland. He came through Bayern's academy and now plays for a world top club. His versatility allows him to cover any flank. 20+ caps for the national team." } },

    { "name": { "ru": "Марин Понграчич", "en": "Marin Pongračić" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний центральный защитник итальянской «Фиорентины» — представитель элитного итальянского футбола! Прошёл через австрийский «Ред Булл Зальцбург» и немецкий «Вольфсбург». Его физическая мощь и игра на втором этаже делают его опасным оружием на стандартах. 30+ матчей за сборную.", "en": "The 27-year-old Italian side Fiorentina centre-back is a representative of elite Italian football! He came through Austrian Red Bull Salzburg and German Wolfsburg. His physical power and aerial ability make him a dangerous weapon on set pieces. 30+ caps for the national team." } },

    { "name": { "ru": "Мартин Эрлич", "en": "Martin Erlić" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний защитник итальянской «Болоньи» — представитель элитного итальянского футбола! Прошёл через хорватские клубы и теперь играет в Серии А. Его тактическая мудрость и универсальность делают его ценным резервистом. 15+ матчей за сборную.", "en": "The 27-year-old Italian side Bologna defender is a representative of elite Italian football! He came through Croatian clubs and now plays in Serie A. His tactical wisdom and versatility make him a valuable reserve. 15+ caps for the national team." } },

    { "name": { "ru": "Матео Ковачич", "en": "Mateo Kovačić" }, "pos": "midfielder", "status": "Star", "story": { "ru": "31-летний полузащитник английского «Манчестер Сити» — настоящая легенда! Прошёл через загребское «Динамо», лондонский «Челси» и мадридский «Реал». Его техника и видение поля делают его дирижёром атак «Ватрени». 100+ матчей за сборную, один из лучших полузащитников поколения.", "en": "The 31-year-old English side Manchester City midfielder is a true legend! He came through Dinamo Zagreb, London Chelsea, and Madrid Real. His technique and vision make him the conductor of the 'Vatreni' attacks. 100+ caps for the national team, one of the best midfielders of his generation." } },

    { "name": { "ru": "Марцело Брозович", "en": "Marcelo Brozović" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "33-летний ветеран саудовского «Аль-Насра» — настоящая легенда хорватского футбола! Прошёл через загребское «Динамо», итальянский «Интер» и теперь играет на Ближнем Востоке. Его тактическая мудрость и умение разрушать атаки делают его незаменимым. 90+ матчей за сборную, участник ЧМ-2018 (финал!) и ЧМ-2022 (бронза!).", "en": "The 33-year-old Saudi side Al Nassr veteran is a true Croatian football legend! He came through Dinamo Zagreb, Italian Inter, and now plays in the Middle East. His tactical wisdom and ability to break up attacks make him indispensable. 90+ caps for the national team, participant in WC 2018 (final!) and WC 2022 (bronze!)." } },

    { "name": { "ru": "Марио Пашалич", "en": "Mario Pašalić" }, "pos": "midfielder", "status": "Star", "story": { "ru": "30-летний полузащитник итальянской «Аталанты» — один из самых стабильных игроков сборной! Прошёл через английский «Челси», итальянские «Милан» и «Рома». Его энергия и работоспособность в центре поля делают его незаменимым. 60+ матчей за «Ватрени», один из ключевых игроков.", "en": "The 30-year-old Italian side Atalanta midfielder is one of the squad's most consistent players! He came through English Chelsea, Italian Milan, and Roma. His energy and work rate in central midfield make him indispensable. 60+ caps for the 'Vatreni', one of the key players." } },

    { "name": { "ru": "Никола Влашич", "en": "Nikola Vlašić" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний атакующий полузащитник итальянского «Торино» — настоящий волшебник мяча! Прошёл через английский «Эвертон» и итальянские клубы. Его техника и креативность делают его дирижёром атак. 50+ матчей за сборную, один из самых опасных игроков.", "en": "The 28-year-old Italian side Torino attacking midfielder is a true ball wizard! He came through English Everton and Italian clubs. His technique and creativity make him the conductor of attacks. 50+ caps for the national team, one of the most dangerous players." } },

    { "name": { "ru": "Лука Сучич", "en": "Luka Sučić" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "23-летний полузащитник австрийского «Ред Булл Зальцбурга» — одна из главных звёзд сборной! Прошёл через загребское «Динамо» и теперь играет в Лиге чемпионов УЕФА. Его техника и видение поля делают его одним из лучших молодых полузащитников Европы. 20+ матчей за сборную, будущее хорватского футбола.", "en": "The 23-year-old Austrian side Red Bull Salzburg midfielder is one of the squad's biggest stars! He came through Dinamo Zagreb and now plays in the UEFA Champions League. His technique and vision make him one of Europe's best young midfielders. 20+ caps for the national team, the future of Croatian football." } },

    { "name": { "ru": "Мартин Батурина", "en": "Martin Baturina" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "22-летний вундеркинд загребского «Динамо» — одна из главных сенсаций! Прошёл через академию клуба и теперь стал основным игроком. Его техника и креативность делают его дирижёром атак. 15+ матчей за сборную, будущее хорватского футбола.", "en": "The 22-year-old Dinamo Zagreb wonderkid is one of the main sensations! He came through the club's academy and now became a mainstay player. His technique and creativity make him the conductor of attacks. 15+ caps for the national team, the future of Croatian football." } },

    { "name": { "ru": "Кристиан Якич", "en": "Kristijan Jakić" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний опорный полузащитник немецкого «Айнтрахта» — настоящий мотор команды! Прошёл через хорватские клубы и теперь играет в Бундеслиге. Его тактическая мудрость и умение разрушать атаки делают его незаменимым. 25+ матчей за сборную.", "en": "The 28-year-old German side Eintracht Frankfurt defensive midfielder is a true team engine! He came through Croatian clubs and now plays in the Bundesliga. His tactical wisdom and ability to break up attacks make him indispensable. 25+ caps for the national team." } },

    { "name": { "ru": "Петар Сучич", "en": "Petar Sučić" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "23-летний полузащитник австрийского «Ред Булл Зальцбурга» — партнёр Луки Сучича по клубу! Не путать с ним — это другой игрок. Прошёл через хорватские клубы и теперь играет в Лиге чемпионов УЕФА. Его энергия и работоспособность делают его незаменимым. 10+ матчей за сборную.", "en": "The 23-year-old Austrian side Red Bull Salzburg midfielder is Luka Sučić's club teammate! Not to be confused with him — this is a different player. He came through Croatian clubs and now plays in the UEFA Champions League. His energy and work rate make him indispensable. 10+ caps for the national team." } },

    { "name": { "ru": "Никола Моро", "en": "Nikola Moro" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "27-летний полузащитник итальянской «Болоньи» — представитель элитного итальянского футбола! Прошёл через загребское «Динамо» и теперь играет в Серии А. Его тактическая дисциплина и умение начинать атаки делают его ценным резервистом. 15+ матчей за сборную.", "en": "The 27-year-old Italian side Bologna midfielder is a representative of elite Italian football! He came through Dinamo Zagreb and now plays in Serie A. His tactical discipline and ability to start attacks make him a valuable reserve. 15+ caps for the national team." } },

    { "name": { "ru": "Тони Фрук", "en": "Toni Fruk" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "24-летний полузащитник хорватского «Риеки» — представитель внутреннего чемпионата! Его включение в состав — это ставка на молодость и энергию. Один из самых перспективных талантов хорватского футбола. 5+ матчей за сборную.", "en": "The 24-year-old Croatian side Rijeka midfielder is a representative of the domestic league! His inclusion is a bet on youth and energy. One of Croatia's most promising talents. 5+ caps for the national team." } },

    { "name": { "ru": "Иван Перишич", "en": "Ivan Perišić" }, "pos": "forward", "status": "Legend", "story": { "ru": "37-летний ветеран нидерландского ПСВ — настоящая легенда хорватского футбола! Прошёл через немецкую Бундеслигу («Боруссия Дортмунд», «Бавария»), английскую Премьер-лигу («Тоттенхэм») и итальянскую Серию А («Интер»). 130+ матчей за сборную, участник ЧМ-2018 (финал!) и ЧМ-2022 (бронза!). Символ эпохи.", "en": "The 37-year-old Dutch PSV veteran is a true Croatian football legend! He came through the German Bundesliga (Borussia Dortmund, Bayern), English Premier League (Tottenham), and Italian Serie A (Inter). 130+ caps for the national team, participant in WC 2018 (final!) and WC 2022 (bronze!). A symbol of an era." } },

    { "name": { "ru": "Андрей Крамарич", "en": "Andrej Kramarić" }, "pos": "forward", "status": "Star", "story": { "ru": "33-летний нападающий немецкого «Хоффенхайма» — настоящая звезда! Лучший бомбардир в истории сборной с 30+ голами. Прошёл через загребское «Динамо» и английский «Лестер Сити». Его техника и голевое чутье делают его одним из самых опасных игроков Европы. 90+ матчей за «Ватрени».", "en": "The 33-year-old German side Hoffenheim forward is a true star! The national team's all-time top scorer with 30+ goals. He came through Dinamo Zagreb and English Leicester City. His technique and goal-scoring instinct make him one of Europe's most dangerous players. 90+ caps for the 'Vatreni'." } },

    { "name": { "ru": "Анте Будимир", "en": "Ante Budimir" }, "pos": "forward", "status": "Star", "story": { "ru": "33-летний нападающий испанской «Осасуны» — настоящий гигант (194 см)! Прошёл через итальянские клубы и теперь играет в Ла Лиге. Его рост и мощь делают его башней в штрафной соперника. 35+ матчей за сборную, одно из самых опасных оружий на стандартах.", "en": "The 33-year-old Spanish side Osasuna forward is a true giant (194cm)! He came through Italian clubs and now plays in La Liga. His height and power make him a tower in the opponent's penalty area. 35+ caps for the national team, one of the most dangerous weapons on set pieces." } },

    { "name": { "ru": "Марко Пашалич", "en": "Marko Pašalić" }, "pos": "forward", "status": "Squad", "story": { "ru": "27-летний нападающий американского «Орландо Сити» — представитель элитного американского футбола! Прошёл через хорватские клубы и теперь играет в MLS. Его скорость и дриблинг создают проблемы для любой обороны. 10+ матчей за сборную.", "en": "The 27-year-old American side Orlando City forward is a representative of elite American football! He came through Croatian clubs and now plays in MLS. His pace and dribbling cause problems for any defence. 10+ caps for the national team." } },

    { "name": { "ru": "Петар Муса", "en": "Petar Musa" }, "pos": "forward", "status": "Squad", "story": { "ru": "27-летний нападающий американского «Далласа» — ещё один представитель MLS! Прошёл через хорватские и немецкие клубы и теперь играет в США. Его мощь и игра в штрафной делают его опасным оружием. 10+ матчей за сборную.", "en": "The 27-year-old American side FC Dallas forward is another MLS representative! He came through Croatian and German clubs and now plays in the USA. His power and penalty area play make him a dangerous weapon. 10+ caps for the national team." } },

    { "name": { "ru": "Игор Матанович", "en": "Igor Matanović" }, "pos": "forward", "status": "Rising", "story": { "ru": "22-летний вундеркинд немецкого «Айнтрахта» — одна из главных сенсаций! Родился в Германии в хорватской семье, но выбрал сборную исторической родины. Прошёл через академию «Айнтрахта» и теперь играет в Бундеслиге. Его техника и креативность делают его дирижёром атак. 5+ матчей за сборную, будущее хорватского футбола.", "en": "The 22-year-old German side Eintracht Frankfurt wonderkid is one of the main sensations! Born in Germany to a Croatian family but chose the national team of his ancestral homeland. He came through Eintracht's academy and now plays in the Bundesliga. His technique and creativity make him the conductor of attacks. 5+ caps for the national team, the future of Croatian football." } }
  ]
},
"GHA": {
  "desc": {
    "ru": "«Черные звезды» — пламя западноафриканского футбола. Сборная Ганы это скорость, физическая сила и умение играть на грани возможного, команда с огромным мундиальным опытом, готовая вновь зажечь сердца своих фанатов и доказать свое превосходство на поле.",
    "en": "The 'Black Stars' are the flame of West African football. The Ghana national team is famous for its speed, physical strength, and ability to play on the edge of the possible. This is a team with vast World Cup experience, ready to ignite the hearts of its fans once again and prove its superiority on the field."
  },
  "coaches": [{
    "name": { "ru": "Карлос Кейрош", "en": "Carlos Queiroz" },
    "story": {
      "ru": "Португальский ветеран тренерского цеха. Ранее тренировал сборные Ирана, Египта и ЮАР. Назначен в апреле 2026.",
      "en": "Portuguese veteran coach. Previously managed Iran, Egypt and South Africa. Appointed in April 2026."
    },
    "image": "https://placehold.co/300x300?text=Carlos+Queiroz"
  }],
  "players": [
    { "name": { "ru": "Мохаммед Кудус", "en": "Mohammed Kudus" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Универсальный и техничный игрок «Вест Хэма», надежда Ганы.", "en": "Versatile and technical West Ham player, the hope of Ghana." } },

    { "name": { "ru": "Лоуренс Ати-Зиги", "en": "Lawrence Ati-Zigi" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Основной вратарь швейцарского «Санкт-Галлена». Обладает невероятной реакцией и отлично играет ногами, что идеально вписывается в современную тактику Кейроша.", "en": "The starting goalkeeper for Swiss side St. Gallen. Possesses incredible reflexes and excellent distribution with his feet, fitting perfectly into Queiroz's modern tactics." } },
    { "name": { "ru": "Абдул Манаф Нурудин", "en": "Abdul Manaf Nurudeen" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Страж ворот бельгийского «Эйпена». Настоящий гигант, чей рост и прыгучесть делают его неприступным на последних этажах.", "en": "The shot-stopper for Belgian side Eupen. A true giant whose height and leaping ability make him unbreachable in the top corners." } },
    { "name": { "ru": "Джо Воллакотт", "en": "Joe Wollacott" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "Родился в Англии, но выбрал историческую родину. Прошел через академию «Челси» и теперь защищает цвета «Чарльтон Атлетик». Отличный пример диаспоры.", "en": "Born in England but chose his ancestral homeland. Came through Chelsea's academy and now protects the colors of Charlton Athletic. A great example of the diaspora." } },

    { "name": { "ru": "Мохаммед Салису", "en": "Mohammed Salisu" }, "pos": "defender", "status": "Star", "story": { "ru": "Мощнейший центральный защитник «Монако». Его игра в воздухе — одно из главных оружий Ганы на стандартах. Настоящая скала в обороне.", "en": "The powerhouse centre-back for Monaco. His aerial ability is one of Ghana's main weapons on set pieces. A true rock in defense." } },
    { "name": { "ru": "Александр Джеку", "en": "Alexander Djiku" }, "pos": "defender", "status": "Star", "story": { "ru": "Лидер обороны и капитан «Страсбура». Отлично читает игру и всегда готов подставить под удар голову или ногу, спасая команду.", "en": "The defensive leader and captain of Strasbourg. Reads the game brilliantly and is always ready to put his head or foot on the line to save the team." } },
    { "name": { "ru": "Алиду Сеиду", "en": "Alidu Seidu" }, "pos": "defender", "status": "Rising", "story": { "ru": "Молодой и взрывной защитник «Спортинга». Его скорость позволяет ему успешно опекать самых быстрых вингеров мира.", "en": "The young and explosive defender for Sporting CP. His pace allows him to successfully contain the world's fastest wingers." } },
    { "name": { "ru": "Денис Одои", "en": "Denis Odoi" }, "pos": "defender", "status": "Legend", "story": { "ru": "Ветеран «Брюгге», способный закрыть любой фланг защиты. Его опыт игр в Европе и Англии бесценен для молодой команды.", "en": "The Club Brugge veteran capable of covering any defensive flank. His experience playing in Europe and England is invaluable for the young team." } },
    { "name": { "ru": "Тари Лэмпти", "en": "Tariq Lamptey" }, "pos": "defender", "status": "Star", "story": { "ru": "Молниеносный правый латераль «Брайтона». Один из самых быстрых игроков АПЛ, чей дриблинг и навесы создают постоянную угрозу.", "en": "The lightning-fast right wing-back for Brighton. One of the fastest players in the Premier League, whose dribbling and crosses create a constant threat." } },
    { "name": { "ru": "Баба Рахман", "en": "Baba Rahman" }, "pos": "defender", "status": "Legend", "story": { "ru": "Опытнейший левый защитник, прошедший через АПЛ с «Челси» и «Лидсом». Его навесы и стандарты — фирменное оружие «Черных звезд».", "en": "A highly experienced left-back who navigated the Premier League with Chelsea and Leeds. His crosses and set pieces are a trademark weapon of the 'Black Stars'." } },
    { "name": { "ru": "Гидеон Менса", "en": "Gideon Mensah" }, "pos": "defender", "status": "Star", "story": { "ru": "Современный левый защитник «Осера». Отлично подключается в атаку и обладает убойным ударом с левой ноги.", "en": "A modern left-back for Auxerre. Joins the attack brilliantly and possesses a lethal left-footed shot." } },
    { "name": { "ru": "Даниэль Амарти", "en": "Daniel Amartey" }, "pos": "defender", "status": "Star", "story": { "ru": "Универсал «Бешикташа», который с одинаковым успехом может сыграть в центре обороны и в опорной зоне. Настоящий тактический хамелеон.", "en": "The Besiktas utility man who can equally play in the center of defense and in defensive midfield. A true tactical chameleon." } },

    { "name": { "ru": "Томас Партей", "en": "Thomas Partey" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Главный мотор команды и звезда «Арсенала». Его дальние передачи и умение диктовать темп — фундамент игры Ганы.", "en": "The main engine of the team and star of Arsenal. His long passing and ability to dictate the tempo are the foundation of Ghana's game." } },
    { "name": { "ru": "Салис Абдул Самед", "en": "Salis Abdul Samed" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Неутомимый «бок-ту-бокс» из французского «Ланса». Его легкие способны перекрывать кислород сопернику на протяжении всех 90 минут.", "en": "The tireless box-to-box midfielder from French side Lens. His lungs can cut off the opponent's oxygen supply for the full 90 minutes." } },
    { "name": { "ru": "Элиша Овусу", "en": "Elisha Owusu" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Техничный полузащитник бельгийского «Гента». Отлично чувствует игру и умеет найти свободное пространство между линиями.", "en": "The technical midfielder for Belgian side Gent. Reads the game brilliantly and knows how to find free space between the lines." } },
    { "name": { "ru": "Маджид Ашимеру", "en": "Majeed Ashimeru" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Опорник «Андерлехта» с отличным первым пасом. Его умение начинать атаки из глубины поля делает его скрытой угрозой.", "en": "The Anderlecht defensive midfielder with a great first pass. His ability to start attacks from deep makes him a hidden threat." } },
    { "name": { "ru": "Даниэль-Кофи Кьере", "en": "Daniel-Kofi Kyereh" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Креативный хавбек «Санкт-Паули». Его видение поля и нестандартные обводки — то, что нужно для взлома плотной обороны.", "en": "The creative midfielder for St. Pauli. His vision and unorthodox dribbling are exactly what's needed to break down packed defenses." } },

    { "name": { "ru": "Иньяки Уильямс", "en": "Iñaki Williams" }, "pos": "forward", "status": "Star", "story": { "ru": "Невероятно быстрый нападающий «Атлетик Бильбао». Обладает рекордом по количеству подряд сыгранных матчей в Ла Лиге (более 250!), что говорит о его стальной выносливости.", "en": "The incredibly fast forward for Athletic Bilbao. Holds the record for most consecutive La Liga matches played (over 250!), speaking to his steel-like endurance." } },
    { "name": { "ru": "Антуан Семенйо", "en": "Antoine Semenyo" }, "pos": "forward", "status": "Star", "story": { "ru": "Мощный и техничный вингер «Борнмута». Его способность продавливать защитников и бить с обеих ног делает его кошмаром для любой обороны.", "en": "The powerful and technical winger for Bournemouth. His ability to bully defenders and shoot with both feet makes him a nightmare for any defense." } },
    { "name": { "ru": "Эрнест Нуама", "en": "Ernest Nuamah" }, "pos": "forward", "status": "Rising", "story": { "ru": "Суперзвезда лионского «Олимпика». Один из самых дорогих молодых талантов Африки, чей дриблинг завораживает болельщиков по всей Европе.", "en": "The superstar of Lyon. One of Africa's most expensive young talents, whose dribbling mesmerizes fans across Europe." } },
    { "name": { "ru": "Камалдин Сулемана", "en": "Kamaldeen Sulemana" }, "pos": "forward", "status": "Star", "story": { "ru": "Молниеносный вингер «Саутгемптона». Его взрывная скорость на первых метрах не имеет аналогов в мировом футболе.", "en": "The lightning-fast winger for Southampton. His explosive speed over the first few meters has no equal in world football." } },
    { "name": { "ru": "Осман Букари", "en": "Osman Bukari" }, "pos": "forward", "status": "Star", "story": { "ru": "Хладнокровный финишер пражской «Спарты». Умеет забивать в самых неудобных ситуациях, обладая отличным чувством позиции.", "en": "The clinical finisher for Sparta Prague. Knows how to score in the most awkward situations, possessing an excellent sense of position." } },
    { "name": { "ru": "Джордан Аью", "en": "Jordan Ayew" }, "pos": "forward", "status": "Legend", "story": { "ru": "Опытнейший форвард «Лестера». Сын великого Абеди Пеле, он унаследовал от отца невероятное футбольное чутье и лидерские качества.", "en": "The highly experienced Leicester forward. Son of the great Abedi Pele, he inherited his father's incredible football instinct and leadership qualities." } },
    { "name": { "ru": "Андре Аью", "en": "André Ayew" }, "pos": "forward", "status": "Legend", "story": { "ru": "Ветеран и настоящий патриот. Более 120 матчей за сборную. Его самоотверженность на поле вдохновляет молодое поколение «Черных звезд».", "en": "The veteran and true patriot. Over 120 caps for the national team. His dedication on the pitch inspires the young generation of the 'Black Stars'." } },
    { "name": { "ru": "Фатаву Иссахаку", "en": "Fatawu Issahaku" }, "pos": "forward", "status": "Rising", "story": { "ru": "Молодой кудесник мяча из лиссабонского «Спортинга». Его финты и нестандартные решения — это чистое западноафриканское волшебство.", "en": "The young ball wizard from Sporting Lisbon. His feints and unorthodox decisions are pure West African magic." } },
    { "name": { "ru": "Ибрагим Осман", "en": "Ibrahim Osman" }, "pos": "forward", "status": "Rising", "story": { "ru": "Дриблер-виртуоз из «Брайтона». Родился в Англии, но с гордостью защищает цвета Ганы, привнося в команду английский стиль и африканскую страсть.", "en": "The virtuoso dribbler for Brighton. Born in England but proudly represents Ghana, bringing English style and African passion to the team." } }
  ]
},
"PAN": {
  "desc": {
    "ru": "Сборная Панамы — символ прогресса и неустанного труда. «Лос Каналистос» пробились в элиту, благодаря своей физической мощи и железной дисциплине. Они готовы сражаться за каждый метр поля, доказывая, что панамский футбол — это сила!",
    "en": "The Panama national team is a symbol of progress and relentless work. 'Los Canaleros' broke into the elite thanks to their physical power and iron discipline. They are ready to fight for every meter of the pitch, proving that Panamanian football is a force that cannot be ignored."
  },
  "coaches": [{ "name": { "ru": "Томас Кристиансен", "en": "Thomas Christiansen" }, "story": { "ru": "Специалист, прививший панамской сборной комбинационный и техничный стиль игры.", "en": "Specialist who brought a combinational and technical style of play to the Panamanian team." }, "image": "https://placehold.co/300x300?text=Thomas+Christiansen" }],
  "players": [
    { "name": { "ru": "Адальберто Карраскилья", "en": "Adalberto Carrasquilla" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Мозг команды, признанный лучшим игроком Золотого кубка КОНКАКАФ.", "en": "The team's brain, recognized as the best player of the CONCACAF Gold Cup." } },

    { "name": { "ru": "Хосе Кальдерон", "en": "José Calderón" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "39-летний ветеран и первый номер сборной! Прошёл через множество мексиканских клубов и теперь является настоящим стражем ворот «Лос Каналистос». Его опыт и лидерство бесценны для молодой команды. 80+ матчей за сборную, участник ЧМ-2018.", "en": "The 39-year-old veteran and national team's number one! He navigated through multiple Mexican clubs and now is a true guardian of 'Los Canaleros'. His experience and leadership are invaluable for the young team. 80+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Сезар Блэкман", "en": "César Blackman" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "26-летний вратарь испанского «Мирандес» — представитель европейского футбола! Прошёл через панамские клубы и теперь играет в Сегунде. Его реакция и игра на выходах делают его надёжным резервистом. 20+ матчей за сборную.", "en": "The 26-year-old Spanish side Mirandés goalkeeper is a representative of European football! He came through Panamanian clubs and now plays in the Segunda División. His reflexes and command of the area make him a reliable backup. 20+ caps for the national team." } },

    { "name": { "ru": "Луис Мехия", "en": "Luis Mejía" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "34-летний голкипер уругвайского «Феникса» — надёжный резервист с богатым опытом! Прошёл через южноамериканский футбол и теперь играет в Уругвае. Его хладнокровие и уверенность на линии ворот делают его ценным третьим номером. 30+ матчей за сборную.", "en": "The 34-year-old Uruguayan side Fenix goalkeeper is a reliable backup with rich experience! He navigated through South American football and now plays in Uruguay. His composure and confidence between the posts make him a valuable third choice. 30+ caps for the national team." } },

    { "name": { "ru": "Эрик Дэвис", "en": "Eric Davis" }, "pos": "defender", "status": "Star", "story": { "ru": "33-летний левый защитник словацкого «Дунайска Стрела» — настоящий боец с характером! Прошёл через португальский футбол и теперь играет в Восточной Европе. Его скорость и кроссы делают его опасным оружием на фланге. 90+ матчей за сборную, участник ЧМ-2018.", "en": "The 33-year-old Slovakian side Dunajská Streda left-back is a true fighter with character! He came through Portuguese football and now plays in Eastern Europe. His pace and crosses make him a dangerous weapon on the flank. 90+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Фидель Эскобар", "en": "Fidel Escobar" }, "pos": "defender", "status": "Star", "story": { "ru": "30-летний центральный защитник американского «Нью-Йорк Ред Буллз» — представитель элитного американского футбола! Прошёл через панамские клубы и теперь играет в MLS. Его физическая мощь и чтение игры делают его одним из лучших защитников КОНКАКАФ. 60+ матчей за сборную.", "en": "The 30-year-old American side New York Red Bulls centre-back is a representative of elite American football! He came through Panamanian clubs and now plays in MLS. His physical power and reading of the game make him one of CONCACAF's best defenders. 60+ caps for the national team." } },

    { "name": { "ru": "Адриан Мачадо", "en": "Adrián Machado" }, "pos": "defender", "status": "Rising", "story": { "ru": "24-летний защитник колумбийского «Депортиво Кали» — представитель нового поколения! Его техника и скорость делают его современным центральным защитником. Один из самых перспективных талантов панамского футбола. 15+ матчей за сборную.", "en": "The 24-year-old Colombian side Deportivo Cali defender is a representative of the new generation! His technique and pace make him a modern centre-back. One of Panama's most promising talents. 15+ caps for the national team." } },

    { "name": { "ru": "Родерик Миллер", "en": "Roderick Miller" }, "pos": "defender", "status": "Star", "story": { "ru": "32-летний правый защитник азербайджанского «Нефтчи» — настоящий универсал! Прошёл через мексиканский футбол и теперь играет на Кавказе. Его энергия и работоспособность делают его незаменимым. 50+ матчей за сборную, участник ЧМ-2018.", "en": "The 32-year-old Azerbaijani side Neftçi right-back is a true utility man! He came through Mexican football and now plays in the Caucasus. His energy and work rate make him indispensable. 50+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Хуан Карлос Варгас", "en": "Juan Carlos Vargas" }, "pos": "defender", "status": "Squad", "story": { "ru": "28-летний защитник панамского «Тауро» — представитель внутреннего чемпионата! Один из самых стабильных игроков панамской лиги. Его опыт и лидерство делают его ценным резервистом. 20+ матчей за сборную.", "en": "The 28-year-old Panamanian side Tauro defender is a representative of the domestic league! One of the most consistent players in the Panamanian league. His experience and leadership make him a valuable reserve. 20+ caps for the national team." } },

    { "name": { "ru": "Кристиан Мартинес", "en": "Cristian Martínez" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний защитник американского «Коламбус Крю» — ещё один представитель MLS! Прошёл через панамские клубы и теперь играет в одном из лучших клубов США. Его физическая мощь и игра на втором этаже делают его опасным оружием на стандартах. 15+ матчей за сборную.", "en": "The 27-year-old American side Columbus Crew defender is another MLS representative! He came through Panamanian clubs and now plays for one of the USA's best clubs. His physical power and aerial ability make him a dangerous weapon on set pieces. 15+ caps for the national team." } },

    { "name": { "ru": "Анибаль Годой", "en": "Aníbal Godoy" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "35-летний ветеран американского «Нэшвилла» — настоящая легенда панамского футбола! Рекордсмен сборной по количеству матчей — 150+ игр! Прошёл через мексиканский футбол и теперь играет в MLS. Его опыт и лидерство бесценны для молодой команды. Участник ЧМ-2018.", "en": "The 35-year-old American side Nashville SC veteran is a true Panamanian football legend! The national team's all-time appearance record holder — 150+ caps! He came through Mexican football and now plays in MLS. His experience and leadership are invaluable for the young team. Participant in WC 2018." } },

    { "name": { "ru": "Йоэль Барсена", "en": "Yoel Bárcenas" }, "pos": "midfielder", "status": "Star", "story": { "ru": "30-летний вингер мексиканского «Мазатлана» — одна из главных звёзд сборной! Прошёл через панамские клубы и теперь играет в мексиканской лиге. Его скорость и дриблинг создают кошмар для любых защитников. 70+ матчей за сборную, участник ЧМ-2018.", "en": "The 30-year-old Mexican side Mazatlán winger is one of the squad's biggest stars! He came through Panamanian clubs and now plays in the Mexican league. His pace and dribbling create a nightmare for any defenders. 70+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Эдгардо Фарина", "en": "Edgardo Fariña" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний полузащитник коста-риканского «Алахуэленсе» — представитель центральноамериканского футбола! Прошёл через панамские клубы и теперь играет в Коста-Рике. Его техника и видение поля делают его дирижёром атак. 40+ матчей за сборную.", "en": "The 29-year-old Costa Rican side Alajuelense midfielder is a representative of Central American football! He came through Panamanian clubs and now plays in Costa Rica. His technique and vision make him the conductor of attacks. 40+ caps for the national team." } },

    { "name": { "ru": "Хосе Луис Родригес", "en": "José Luis Rodríguez" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний нападающий бельгийского «Гента» — одна из главных звёзд сборной! Прошёл через панамские клубы и теперь играет в одном из лучших клубов Бельгии. Его мощь и игра в штрафной делают его опасным оружием. 35+ матчей за «Лос Каналистос», 10+ голов.", "en": "The 27-year-old Belgian side Gent forward is one of the squad's biggest stars! He came through Panamanian clubs and now plays for one of Belgium's best clubs. His power and penalty area play make him a dangerous weapon. 35+ caps for 'Los Canaleros', 10+ goals." } },

    { "name": { "ru": "Исмаэль Диас", "en": "Ismael Díaz" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний вингер мексиканского «Тихуаны» — настоящий волшебник мяча! Прошёл через испанскую академию «Валенсии» и теперь играет в мексиканской лиге. Его техника и креативность делают его одним из самых опасных игроков КОНКАКАФ. 45+ матчей за сборную.", "en": "The 27-year-old Mexican side Tijuana winger is a true ball wizard! He came through Spanish Valencia's academy and now plays in the Mexican league. His technique and creativity make him one of CONCACAF's most dangerous players. 45+ caps for the national team." } },

    { "name": { "ru": "Эрнесто Уокер", "en": "Ernesto Walker" }, "pos": "forward", "status": "Rising", "story": { "ru": "26-летний нападающий панамского «Сан-Франциско» — представитель внутреннего чемпионата! Один из самых результативных форвардов панамской лиги. Его скорость и голевое чутье делают его опасным оружием. 20+ матчей за сборную, 8+ голов.", "en": "The 26-year-old Panamanian side San Francisco forward is a representative of the domestic league! One of the Panamanian league's most prolific strikers. His pace and goal-scoring instinct make him a dangerous weapon. 20+ caps for the national team, 8+ goals." } },

    { "name": { "ru": "Катарсо Муньос", "en": "Catharso Muñoz" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "23-летний полузащитник панамского «Спортинг Сан-Мигелито» — один из самых молодых игроков в заявке! Его включение — это ставка на будущее панамского футбола. Представляет новое поколение «Лос Каналистос», готовых покорять мировую арену.", "en": "The 23-year-old Panamanian side Sporting San Miguelito midfielder is one of the youngest players in the squad! His inclusion is a bet on the future of Panamanian football. Represents the new generation of 'Los Canaleros' ready to conquer the world stage." } },

"URU": {
  "desc": {
    "ru": "Уругвай — это дух «Гарра Чарруа» -  наследие первых чемпионов мира. Команда, где каждый игрок готов отдать жизнь на поле, ради победы. Под руководством Марсело Бьелсы «Селесте» заиграли в самый интенсивный футбол в мире, сочетая свои славные традиции с неукротимой энергией.",
    "en": "Uruguay is the 'Garra Charrúa' spirit, the legacy of the first world champions. A team where every player is ready to die on the field for victory. Under Marcelo Bielsa, the 'Celeste' have begun playing the most intensive football in the world, combining their glorious traditions with the indomitable energy of modernity."
  },
  "coaches": [{ "name": { "ru": "Марсело Бьелса", "en": "Marcelo Bielsa" }, "story": { "ru": "«Эль Локо» — легендарный тактик, прививший Уругваю невероятно интенсивный и зрелищный футбол.", "en": "'El Loco' — a legendary tactician who brought incredibly intense and spectacular football to Uruguay." }, "image": "https://placehold.co/300x300?text=Marcelo+Bielsa" }],
  "players": [
    { "name": { "ru": "Федерико Вальверде", "en": "Federico Valverde" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Неутомимый мотор команды, способный выполнять огромный объем работы.", "en": "The team's tireless motor, capable of performing a huge volume of work." } },
    { "name": { "ru": "Дарвин Нуньес", "en": "Darwin Nunez" }, "pos": "forward", "status": "Star", "story": { "ru": "Мощный и быстрый нападающий «Ливерпуля», главная ударная сила сборной.", "en": "A powerful and fast Liverpool striker, the main striking force of the national team." } },

    { "name": { "ru": "Франко Израэль", "en": "Franco Israel" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "26-летний вратарь лиссабонского «Спортинга» — первый номер сборной! Его невероятная реакция и игра на выходах делают его надежным стражем ворот. 15+ матчей за «Селесте».", "en": "The 26-year-old Sporting CP goalkeeper is the national team's number one! His incredible reflexes and command of the area make him a reliable guardian. 15+ caps for the 'Celeste'." } },
    { "name": { "ru": "Серхио Рочет", "en": "Sergio Rochet" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "33-летний ветеран бразильского «Интернасьонала» — опытный резервист. Прошел через множество клубов и теперь делится своим опытом с молодежью. 10+ матчей за сборную.", "en": "The 33-year-old Internacional veteran is an experienced backup. He navigated through multiple clubs and now shares his experience with the youth. 10+ caps for the national team." } },
    { "name": { "ru": "Сантьяго Меле", "en": "Santiago Mele" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "27-летний голкипер «Пеньяроля» — представитель внутреннего чемпионата! Его включение — это ставка на молодость и энергию. Один из самых перспективных вратарей Уругвая.", "en": "The 27-year-old Peñarol goalkeeper is a representative of the domestic league! His inclusion is a bet on youth and energy. One of Uruguay's most promising goalkeepers." } },

    { "name": { "ru": "Рональд Араухо", "en": "Ronald Araújo" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний центральный защитник «Барселоны» — настоящая стена! Преодолел тяжелейшую травму всего за несколько месяцев до турнира, чтобы вернуться и возглавить оборону. Его физическая мощь и скорость делают его кошмаром для нападающих. 30+ матчей за сборную.", "en": "The 27-year-old Barcelona centre-back is a true wall! He overcame a devastating injury just months before the tournament to return and lead the defense. His physical power and pace make him a nightmare for strikers. 30+ caps for the national team." } },
    { "name": { "ru": "Хосе Мария Хименес", "en": "José María Giménez" }, "pos": "defender", "status": "Legend", "story": { "ru": "31-летний капитан мадридского «Атлетико» — ветеран и лидер! 100+ матчей за сборную, участник трех чемпионатов мира. Его опыт и самоотверженность — символ «Гарра Чарруа».", "en": "The 31-year-old Atlético Madrid captain is a veteran and leader! 100+ caps for the national team, participant in three World Cups. His experience and dedication are the symbol of 'Garra Charrúa'." } },
    { "name": { "ru": "Матиас Оливера", "en": "Mathías Olivera" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний левый защитник «Наполи» — агрессивный и бескомпромиссный боец! Его стиль игры идеально вписывается в интенсивную тактику Бьелсы. 40+ матчей за сборную.", "en": "The 28-year-old Napoli left-back is an aggressive and uncompromising fighter! His playing style fits perfectly into Bielsa's intensive tactics. 40+ caps for the national team." } },
    { "name": { "ru": "Гильермо Варела", "en": "Guillermo Varela" }, "pos": "defender", "status": "Star", "story": { "ru": "31-летний правый защитник «Фламенго» — универсал с богатым опытом! Прошел через «Манчестер Юнайтед» и теперь доминирует в Южной Америке. 35+ матчей за сборную.", "en": "The 31-year-old Flamengo right-back is a versatile player with rich experience! He came through Manchester United and now dominates in South America. 35+ caps for the national team." } },
    { "name": { "ru": "Себастьян Касерес", "en": "Sebastián Cáceres" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний защитник мексиканской «Америки» — настоящий гигант! Его игра на втором этаже и мощь делают его опасным оружием на стандартах. 25+ матчей за сборную.", "en": "The 26-year-old Mexican side América defender is a true giant! His aerial ability and power make him a dangerous weapon on set pieces. 25+ caps for the national team." } },
    { "name": { "ru": "Максимильяно Араухо", "en": "Maximiliano Araújo" }, "pos": "defender", "status": "Rising", "story": { "ru": "26-летний универсал испанского «Алавеса» — один из самых техничных защитников! Отлично играет левой ногой и постоянно подключается в атаку. 15+ матчей за сборную.", "en": "The 26-year-old Spanish side Alavés utility man is one of the most technical defenders! Plays brilliantly with his left foot and constantly joins the attack. 15+ caps for the national team." } },
    { "name": { "ru": "Хоакин Соса", "en": "Joaquín Sosa" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний талант из «Насьоналя» — представитель нового поколения! Его включение — это ставка на будущее уругвайского футбола. 5+ матчей за сборную.", "en": "The 23-year-old Nacional talent is a representative of the new generation! His inclusion is a bet on the future of Uruguayan football. 5+ caps for the national team." } },

    { "name": { "ru": "Родриго Бентанкур", "en": "Rodrigo Bentancur" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний полузащитник «Тоттенхэма» — вернулся из ада! Восстановился после разрыва крестообразной связки, чтобы успеть на свой второй чемпионат мира. Его техника и видение поля — фундамент игры «Селесте». 50+ матчей за сборную.", "en": "The 28-year-old Tottenham midfielder — returned from hell! Recovered from an ACL tear to make it to his second World Cup. His technique and vision are the foundation of the 'Celeste' game. 50+ caps for the national team." } },
    { "name": { "ru": "Мануэль Угарте", "en": "Manuel Ugarte" }, "pos": "midfielder", "status": "Star", "story": { "ru": "25-летний опорный полузащитник «Манчестер Юнайтед» — новый король перехватов! Его невероятная работоспособность и умение читать игру делают его идеальным исполнителем для Бьелсы. 30+ матчей за сборную.", "en": "The 25-year-old Manchester United defensive midfielder is the new king of interceptions! His incredible work rate and reading of the game make him the perfect executor for Bielsa. 30+ caps for the national team." } },
    { "name": { "ru": "Нахитан Нандес", "en": "Nahitan Nández" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "30-летний хавбек «Кальяри» — «Эль Гальо» (Петух)! Проводит на поле по 12+ км за матч, покрывая огромные объемы работы. Его сердце и энергия — это воплощение «Гарра Чарруа». 60+ матчей за сборную.", "en": "The 30-year-old Cagliari midfielder is 'El Gallo' (The Rooster)! Runs 12+ km per match, covering huge volumes of work. His heart and energy are the embodiment of 'Garra Charrúa'. 60+ caps for the national team." } },
    { "name": { "ru": "Матиас Весино", "en": "Matías Vecino" }, "pos": "midfielder", "status": "Star", "story": { "ru": "34-летний ветеран «Лацио» — мастер скрытых угроз! Его фирменные поздние забегания в штрафную площадь не раз приносили сборной важнейшие голы. 60+ матчей за сборную.", "en": "The 34-year-old Lazio veteran is a master of hidden threats! His signature late runs into the penalty area have brought the national team crucial goals more than once. 60+ caps for the national team." } },
    { "name": { "ru": "Николас Де Ла Крус", "en": "Nicolás De La Cruz" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний плеймейкер «Фламенго» — «Эль Пити»! Невероятный дриблер и ассистент, способный взломать любую, даже самую насыщенную оборону. 35+ матчей за сборную.", "en": "The 29-yearold Flamengo playmaker is 'El Pity'! An incredible dribbler and assist provider capable of breaking down any, even the most packed, defense. 35+ caps for the national team." } },
    { "name": { "ru": "Брайан Родригес", "en": "Brian Rodríguez" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний вингер «Лос-Анджелес ФК» — «Пелука»! Его финты и скорость создают постоянную угрозу на фланге. Один из самых креативных игроков сборной. 30+ матчей за сборную.", "en": "The 26-year-old LAFC winger is 'Peluka'! His feints and pace create a constant threat on the flank. One of the squad's most creative players. 30+ caps for the national team." } },
    { "name": { "ru": "Кристиан Оливера", "en": "Cristian Olivera" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "24-летний нападающий «Лос-Анджелес ФК» — взрывной и дерзкий! Отлично чувствует пространство и всегда готов убежать в контратаку. 10+ матчей за сборную.", "en": "The 24-year-old LAFC forward is explosive and daring! Reads space brilliantly and is always ready to run into a counterattack. 10+ caps for the national team." } },

    { "name": { "ru": "Луис Суарес", "en": "Luis Suárez" }, "pos": "forward", "status": "Legend", "story": { "ru": "39-летний легендарный нападающий «Интер Майами» — живая легенда! Герой ЧМ-2010, где он забил рукой против Ганы. Его невероятное голевое чутье и характер не угасли даже в 39 лет. 140+ матчей за сборную, 60+ голов.", "en": "The 39-year-old Inter Miami legendary forward is a living legend! Hero of WC 2010, where he scored with his hand against Ghana. His incredible goal-scoring instinct and character haven't faded even at 39. 140+ caps for the national team, 60+ goals." } },
    { "name": { "ru": "Факундо Пельистри", "en": "Facundo Pellistri" }, "pos": "forward", "status": "Rising", "story": { "ru": "24-летний вингер «Манчестер Юнайтед» — «Какито»! Мастер игры один в один, способный обыграть любого защитника на пространстве. 15+ матчей за сборную.", "en": "The 24-year-old Manchester United winger is 'Caquito'! A master of 1v1 situations, capable of beating any defender in open space. 15+ caps for the national team." } },
    { "name": { "ru": "Диего Росси", "en": "Diego Rossi" }, "pos": "forward", "status": "Star", "story": { "ru": "28-летний нападающий «Фенербахче» — хладнокровный финишер! Обладает отличным ударом и умением оказаться в нужном месте в нужное время. 30+ матчей за сборную.", "en": "The 28-year-old Fenerbahçe forward is a clinical finisher! Possesses a great shot and the ability to be in the right place at the right time. 30+ caps for the national team." } },
    { "name": { "ru": "Агустин Каноббио", "en": "Agustín Canobbio" }, "pos": "forward", "status": "Star", "story": { "ru": "28-летний вингер «Атлетико Паранаэнсе» — «Кубо»! Невероятная работоспособность и убойный удар с левой ноги. Один из самых полезных игроков в тактике Бьелсы. 25+ матчей за сборную.", "en": "The 28-year-old Athletico Paranaense winger is 'Cubo'! Incredible work rate and a lethal left-footed shot. One of the most useful players in Bielsa's tactics. 25+ caps for the national team." } },
    { "name": { "ru": "Франко Гонсалес", "en": "Franco González" }, "pos": "forward", "status": "Rising", "story": { "ru": "21-летний вундеркинд «Ривер Плейта» — будущее уругвайской атаки! Его техника и дриблинг восхищают скаутов по всей Южной Америке. 5+ матчей за сборную.", "en": "The 21-year-old River Plate wonderkid is the future of the Uruguayan attack! His technique and dribbling amaze scouts across South America. 5+ caps for the national team." } },
    { "name": { "ru": "Лусиано Родригес", "en": "Luciano Rodríguez" }, "pos": "forward", "status": "Rising", "story": { "ru": "22-летний талант «Алавеса» — «Чики»! Креативный полузащитник/нападающий с отличным видением поля. 8+ матчей за сборную.", "en": "The 22-year-old Alavés talent is 'Chiqui'! A creative midfielder/forward with excellent vision of the field. 8+ caps for the national team." } },
    { "name": { "ru": "Кевин Васкес", "en": "Kevin Vázquez" }, "pos": "forward", "status": "Star", "story": { "ru": "31-летний вингер «Сельты» — «Пато»! Опытный игрок с прекрасным навесом и стандартами. Его опыт в Ла Лиге бесценен для сборной. 20+ матчей за сборную.", "en": "The 31-year-old Celta Vigo winger is 'Pato'! An experienced player with excellent crossing and set pieces. His La Liga experience is invaluable for the national team. 20+ caps for the national team." } }

"NZL": {
  "desc": {
    "ru": "«All Whites» — сила Океании, готовая бросить вызов всему миру -  Сборная Новой Зеландии - славится своим командным единством и физической подготовкой. Они едут на мундиаль, чтобы показать, что даже на далеких островах живет настоящий футбольный дух, способный на свершения.",
    "en": "The All Whites are the dominant force in Oceania, ready to challenge the whole world. The New Zealand national team is famous for its team unity and physical fitness. They go to the World Cup to prove: even on distant islands lives a true football spirit capable of great achievements."
  },
  "coaches": [{ "name": { "ru": "Даррен Бэзли", "en": "Darren Bazeley" }, "story": { "ru": "Тренер, работающий над интеграцией молодых талантов в главную команду Океании.", "en": "Coach working on integrating young talents into Oceania's top team." }, "image": "https://placehold.co/300x300?text=Darren+Bazeley" }],
  "players": [
    { "name": { "ru": "Крис Вуд", "en": "Chris Wood" }, "pos": "forward", "status": "Captain", "story": { "ru": "Опытный нападающий, лучший бомбардир в истории сборной и звезда АПЛ.", "en": "Experienced striker, the national team's all-time top scorer and a Premier League star." } },

    { "name": { "ru": "Алекс Полсен", "en": "Alex Paulsen" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "23-летний феномен, ставший первым новозеландцем в истории «Борнмута»! Летом 2024 года английский клуб заплатил за него рекордный для Океании трансфер. Его рефлексам и игре на выходах позавидуют даже в топ-лигах.", "en": "A 23-year-old phenomenon who became the first New Zealander in Bournemouth's history! In the summer of 2024, the English club paid a record transfer for Oceania for him. His reflexes and command of the area are envied even in top leagues." } },

    { "name": { "ru": "Макс Крокомб", "en": "Max Crocombe" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "31-летний ветеран, прошедший суровую школу английского нижнего футбола. Его путь от академии «Манчестер Юнайтед» до капитанской повязки в «Ноттс Каунти» — это воплощение несгибаемой воли. Надежный страж ворот «All Whites».", "en": "A 31-year-old veteran who went through the tough school of English lower-league football. His journey from the Manchester United academy to the captain's armband at Notts County is the embodiment of an unyielding will. A reliable guardian of the All Whites' goal." } },

    { "name": { "ru": "Майкл Вуд", "en": "Michael Woud" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "27-летний голкипер «Окленд FC». Прошел через нидерландские клубы и теперь является одним из лидеров нового внутреннего чемпионата. Его спокойствие и игра ногами отлично вписываются в современный футбол.", "en": "A 27-year-old goalkeeper for Auckland FC. He came through Dutch clubs and now is one of the leaders of the new domestic league. His composure and distribution with his feet fit perfectly into modern football." } },

    { "name": { "ru": "Майкл Боксолл", "en": "Michael Boxall" }, "pos": "defender", "status": "Legend", "story": { "ru": "36-летний генерал обороны и легенда «Миннесоты Юнайтед». Настоящий воздушный гигант, чьи голы на последних минутах не раз спасали сборную. Его опыт и лидерство — это фундамент духа Океании!", "en": "A 36-year-old defensive general and Minnesota United legend. A true aerial giant whose last-minute goals have saved the national team more than once. His experience and leadership are the foundation of the Oceanian spirit!" } },

    { "name": { "ru": "Билл Туилома", "en": "Bill Tuiloma" }, "pos": "defender", "status": "Star", "story": { "ru": "30-летний центральный защитник «Портленд Тимберс». В свое время его забрали в академию самого «ПСЖ»! Теперь он — главный разрушитель атак соперника в MLS. Его физическая мощь и чтение игры делают его непробиваемым.", "en": "A 30-year-old centre-back for Portland Timbers. In his youth, he was taken into the academy of PSG itself! Now he is the main destroyer of opponent attacks in MLS. His physical power and reading of the game make him impenetrable." } },

    { "name": { "ru": "Нандо Пейнакер", "en": "Nando Pijnaker" }, "pos": "defender", "status": "Star", "story": { "ru": "25-летний защитник, закаливший свой характер в жестких баталиях ирландской лиги. Выступая за «Слайго Роверс» и «Дандолк», он научился не уступать ни в одном единоборстве. Настоящий воин на поле.", "en": "A 25-year-old defender who hardened his character in the tough battles of the Irish league. Playing for Sligo Rovers and Dundalk, he learned not to yield in a single duel. A true warrior on the pitch." } },

    { "name": { "ru": "Джеймс МакГарри", "en": "James McGarry" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний опорник/защитник шотландского «Данди Юнайтед». Шотландский футбол научил его жесткости и самоотверженности. Его умение начинать атаки из глубины поля делает его современным центральным защитником.", "en": "A 28-year-old midfielder/defender for Scottish side Dundee United. Scottish football taught him toughness and dedication. His ability to start attacks from deep makes him a modern centre-back." } },

    { "name": { "ru": "Джордж Стэнджер", "en": "George Stanger" }, "pos": "defender", "status": "Rising", "story": { "ru": "28-летний защитник, прошедший школу шотландского футбола. Его надежность и позиционная игра позволяют тренеру Бэзли чувствовать себя спокойно за состояние ворот.", "en": "A 28-year-old defender who came through the Scottish football school. His reliability and positional play allow coach Bazeley to feel calm about the state of the goal." } },

    { "name": { "ru": "Том Дойл", "en": "Tom Doyle" }, "pos": "defender", "status": "Legend", "story": { "ru": "33-летний ветеран «Веллингтон Феникс». Настоящий патриот, который мог бы играть в Европе, но предпочел развивать футбол на родине. Его левая нога отлично доставляет мяч на фланги.", "en": "A 33-year-old Wellington Phoenix veteran. A true patriot who could have played in Europe but chose to develop football at home. His left foot delivers the ball to the flanks perfectly." } },

    { "name": { "ru": "Финн Сёрман", "en": "Finn Surman" }, "pos": "defender", "status": "Squad", "story": { "ru": "26-летний защитник, покоряющий американский футбол. Его опыт игры в USL и NCAA добавил ему тактической гибкости и атлетизма.", "en": "A 26-year-old defender conquering American football. His experience in the USL and NCAA added tactical flexibility and athleticism to his game." } },

    { "name": { "ru": "Сэм Саттон", "en": "Sam Sutton" }, "pos": "defender", "status": "Rising", "story": { "ru": "26-летний капитан «Веллингтон Феникс». Лидер новой волны новозеландского футбола, сочетающий английскую школу и океанийский характер.", "en": "A 26-year-old captain of Wellington Phoenix. The leader of the new wave of New Zealand football, combining English schooling and Oceanian character." } },

    { "name": { "ru": "Марко Стаменич", "en": "Marko Stamenic" }, "pos": "midfielder", "status": "Star", "story": { "ru": "23-летний мотор «Ноттингем Форест»! Летом 2024 года стал автором громкого трансфера в АПЛ. Его разрушительный стиль и невероятная работоспособность — идеальное оружие для прессинга Бэзли.", "en": "A 23-year-old engine for Nottingham Forest! In the summer of 2024, he became the author of a loud transfer to the Premier League. His destructive style and incredible work rate are the perfect weapon for Bazeley's pressing." } },

    { "name": { "ru": "Джо Белл", "en": "Joe Bell" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний полузащитник норвежского «Викинга». Прошел через академию «Брэнна» и выиграл Кубок Норвегии. Его видение поля и умение диктовать темп — это мозг сборной Новой Зеландии.", "en": "A 26-year-old midfielder for Norwegian side Viking. He came through Brann's academy and won the Norwegian Cup. His vision and ability to dictate the tempo are the brain of the New Zealand national team." } },

    { "name": { "ru": "Райан Томас", "en": "Ryan Thomas" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "31-летний ветеран нидерландского ПЕК Зволле. Более 200 матчей в Эредивизи! Его опыт игр в Европе делает его незаменимым в центре поля. Мастер стандартов и дальних ударов.", "en": "A 31-year-old veteran of Dutch PEC Zwolle. Over 200 matches in the Eredivisie! His European experience makes him indispensable in central midfield. A master of set pieces and long shots." } },

    { "name": { "ru": "Кэмерон Девлин", "en": "Cameron Devlin" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний опорник шотландского «Хартс». Его мощные удары из-за штрафной и жесткость в отборе мяча заставляют соперников дрожать. Настоящий танк в центре поля.", "en": "A 27-year-old defensive midfielder for Scottish Hearts. His powerful shots from outside the box and toughness in winning the ball make opponents tremble. A true tank in central midfield." } },

    { "name": { "ru": "Мэттью Гарбетт", "en": "Matthew Garbett" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "24-летний универсал нидерландского НАК Бреда. Помог клубу выйти в Эредивизи! Его тактическая гибкость позволяет закрывать сразу несколько позиций в полузащите и обороне.", "en": "A 24-year-old utility man for Dutch NAC Breda. Helped the club get promoted to the Eredivisie! His tactical flexibility allows him to cover several positions in midfield and defense." } },

    { "name": { "ru": "Алекс Руфер", "en": "Alex Rufer" }, "pos": "midfielder", "status": "Star", "story": { "ru": "28-летний плеймейкер «Веллингтон Феникс». Брат известного футболиста, он сам является дирижером атак «Олл Уайтс». Его пасы разрезают любую оборону.", "en": "A 28-year-old playmaker for Wellington Phoenix. The brother of a famous footballer, he himself is the conductor of the All Whites' attacks. His passes cut through any defense." } },

    { "name": { "ru": "Сарприт Сингх", "en": "Sarpreet Singh" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "26-летний креативный хавбек «Окленд FC». В свое время он уехал в академию «Баварии», но теперь вернулся на родину, чтобы стать звездой нового чемпионата. Его левая нога — это магия.", "en": "A 26-year-old creative midfielder for Auckland FC. In his youth, he went to Bayern Munich's academy, but now returned home to become a star of the new league. His left foot is pure magic." } },

    { "name": { "ru": "Бен Олд", "en": "Ben Old" }, "pos": "forward", "status": "Star", "story": { "ru": "23-летний вингер французского «Сент-Этьена»! Летом 2024 года совершил сенсационный переход в Лигу 1. Его скорость и дриблинг — главное оружие новозеландцев в контратаках.", "en": "A 23-year-old winger for French Saint-Étienne! In the summer of 2024, he made a sensational move to Ligue 1. His pace and dribbling are the All Whites' main weapon in counterattacks." } },

    { "name": { "ru": "Бен Уэйн", "en": "Ben Waine" }, "pos": "forward", "status": "Star", "story": { "ru": "24-летний нападающий «Шеффилд Уэнсдей». Прошел через школу «Плимут Аргайл», где стал любимцем фанатов. Его неустанная работа на прессинге и голевое чутье делают его идеальным партнером для Вуда.", "en": "A 24-year-old forward for Sheffield Wednesday. He came through Plymouth Argyle, where he became a fan favorite. His relentless pressing work and goal-scoring instinct make him the perfect partner for Wood." } },

    { "name": { "ru": "Коста Барбарусес", "en": "Kosta Barbarouses" }, "pos": "forward", "status": "Legend", "story": { "ru": "35-летний ветеран «Веллингтон Феникс». Настоящий долгожитель океанийского футбола! Его опыт, игра в подыгрыше и умение забить в самой неудобной ситуации бесценны для молодой команды.", "en": "A 35-year-old Wellington Phoenix veteran. A true long-liver of Oceanian football! His experience, hold-up play, and ability to score in the most awkward situations are invaluable for the young team." } },

    { "name": { "ru": "Логан Рогерсон", "en": "Logan Rogerson" }, "pos": "forward", "status": "Rising", "story": { "ru": "26-летний нападающий «Окленд FC». Один из самых ярких талантов нового поколения. Его техника и умение обыграть один в один открывают новые горизонты для атаки сборной.", "en": "A 26-year-old forward for Auckland FC. One of the brightest talents of the new generation. His technique and 1v1 skills open new horizons for the national team's attack." } },

    { "name": { "ru": "Оскар ван Хаттум", "en": "Oskar van Hattum" }, "pos": "forward", "status": "Rising", "story": { "ru": "23-летний форвард «Веллингтон Феникс». Сын известного новозеландского футболиста, он продолжает семейные традиции. Его скорость и движение без мяча создают постоянные проблемы для защитников.", "en": "A 23-year-old forward for Wellington Phoenix. The son of a famous New Zealand footballer, he continues the family traditions. His pace and off-the-ball movement constantly cause problems for defenders." } },

    { "name": { "ru": "Макс Мата", "en": "Max Mata" }, "pos": "forward", "status": "Star", "story": { "ru": "24-летний нападающий шотландского «Хиберниана». Прошел через английский «Шрусбери Таун». Его мощь, игра головой и умение держать мяч делают его настоящим таргетменом.", "en": "A 24-year-old forward for Scottish Hibernian. He came through English Shrewsbury Town. His power, aerial ability, and hold-up play make him a true target man." } },

    { "name": { "ru": "Райли Бидойс", "en": "Riley Bidois" }, "pos": "forward", "status": "Squad", "story": { "ru": "23-летний вингер, покоряющий скандинавский футбол. Его опыт игры в Дании добавил ему скорости и тактической дисциплины. Опасен своими рывками за спину защитникам.", "en": "A 23-year-old winger conquering Scandinavian football. His experience playing in Denmark added pace and tactical discipline. Dangerous with his runs in behind the defense." } }
  ]
},
"NOR": {
  "desc": {
    "ru": "Норвегия — это мощь северных ветров и атакующая сила мирового класса. Ведомые лучшим бомбардиром планеты, норвежцы полны решимости вернуть свою страну в футбольную элиту. Их игра — это сочетание физической силы и высокого интеллекта, которое делает их опасными для любого соперника.",
    "en": "Norway is the power of the northern winds and a world-class attacking force. Led by the planet's best goalscorer, the Norwegians are determined to return their country to the football elite. Their game is a combination of physical strength and high intelligence that makes them dangerous for any opponent."
  },
  "coaches": [{
    "name": { "ru": "Стале Сольбаккен", "en": "Ståle Solbakken" },
    "story": {
      "ru": "Опытный норвежский специалист, который построил команду вокруг суперзвезд и вернул сборную на мировую арену после долгих лет забвения.",
      "en": "An experienced Norwegian specialist who built the team around superstars and returned the national team to the world stage after years of oblivion."
    },
    "image": "https://placehold.co/300x300?text=Ståle+Solbakken"
  }],
  "players": [
    { "name": { "ru": "Эрлинг Холанд", "en": "Erling Haaland" }, "pos": "forward", "status": "Star", "story": { "ru": "Абсолютная голевая машина. В своем дебютном сезоне в АПЛ побил рекорд по голам (36). Его физическая мощь и убийственная точность делают его самым страшным нападающим планеты.", "en": "The ultimate goal machine. Broke the Premier League scoring record (36 goals) in his debut season. His physical power and clinical finishing make him the most feared striker on the planet." } },
    { "name": { "ru": "Мартин Эдегор", "en": "Martin Ødegaard" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Самый молодой капитан в истории «Арсенала» и креативный мозг сборной. Начал карьеру в 15 лет в «Стрёмсгодсете», став самым молодым игроком в истории норвежской элитной лиги.", "en": "The youngest captain in Arsenal's history and the creative brain of Norway. Started his career at 15 for Strømsgodset, becoming the youngest player in the history of the Norwegian top flight." } },

    { "name": { "ru": "Пер Кристиан Бротвейт", "en": "Per Kristian Bråtveit" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Надежный первый номер. Известен своими невероятными рефлексами и командованием в штрафной площади. Прошел через футбол Норвегии и Швеции.", "en": "The reliable number one. Known for his incredible reflexes and commanding presence in the box. He has navigated through Norwegian and Swedish football." } },
    { "name": { "ru": "Якоб Карлстрём", "en": "Jacob Karlstrøm" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Талантливый резервист, который был одним из лучших вратарей норвежской Элитесериен. Готов в любой момент выйти на замену и спасти команду.", "en": "A talented backup who has been one of the best goalkeepers in the Norwegian Eliteserien. Ready to step in at any moment and save the team." } },
    { "name": { "ru": "Юлиан Файе Лунн", "en": "Julian Faye Lund" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "Молодой перспективный голкипер, представляющий будущее норвежской вратарской школы. Отлично играет ногами и уверенно чувствует себя на выходах.", "en": "A young promising goalkeeper representing the future of the Norwegian goalkeeping school. Plays well with his feet and feels confident coming off his line." } },

    { "name": { "ru": "Юлиан Рюэрсон", "en": "Julian Ryerson" }, "pos": "defender", "status": "Star", "story": { "ru": "Первый норвежец, сыгравший за дортмундскую «Боруссию» за последние десятилетия. Его забегания и точные навесы — главное оружие на правом фланге.", "en": "The first Norwegian to play for Borussia Dortmund in decades. His overlapping runs and pinpoint crosses are the main weapon on the right flank." } },
    { "name": { "ru": "Биргер Мелинг", "en": "Birger Meling" }, "pos": "defender", "status": "Legend", "story": { "ru": "Опытный левый защитник с более чем 50 матчами за сборную. Ветеран датского и французского футбола, обеспечивающий надежность и лидерство в обороне.", "en": "An experienced left-back with over 50 caps for the national team. A veteran of Danish and French football, providing reliability and leadership in defense." } },
    { "name": { "ru": "Лео Эстигор", "en": "Leo Østigård" }, "pos": "defender", "status": "Star", "story": { "ru": "Мощный центральный защитник, закалившийся в Серия А и Лиге 1. Бескомпромиссен в воздухе и в единоборствах на земле. Настоящий воин.", "en": "A powerful centre-back who hardened himself in Serie A and Ligue 1. Uncompromising in the air and in ground duels. A true warrior." } },
    { "name": { "ru": "Андреас Ханче-Ольсен", "en": "Andreas Hanche-Olsen" }, "pos": "defender", "status": "Star", "story": { "ru": "Колосс из «Майнца». Его физическое доминирование и чтение игры делают его кошмаром для любых нападающих в Бундеслиге.", "en": "The colossus from Mainz. His physical dominance and reading of the game make him a nightmare for any strikers in the Bundesliga." } },
    { "name": { "ru": "Маркус Хольмгрен Петтерсен", "en": "Marcus Holmgren Pedersen" }, "pos": "defender", "status": "Star", "story": { "ru": "Универсальный фулбек, способный закрыть оба фланга. Его скорость и выносливость позволяют ему «пылесосить» всю бровку от штрафной до штрафной.", "en": "A versatile full-back capable of covering both flanks. His pace and stamina allow him to 'vacuum' the entire wing from box to box." } },
    { "name": { "ru": "Фредрик Андре Бьёркан", "en": "Fredrik André Bjørkan" }, "pos": "defender", "status": "Star", "story": { "ru": "Атакующий левый защитник «Майнца». Забивает голы и отдает голевые передачи с завидной регулярностью, идеально вписываясь в современную тактику.", "en": "An attacking left-back for Mainz 05. Scores goals and provides assists with enviable regularity, fitting perfectly into modern tactics." } },
    { "name": { "ru": "Сигурд Ростед", "en": "Sigurd Rosted" }, "pos": "defender", "status": "Squad", "story": { "ru": "Ветеран бельгийского «Гента». Бескомпромиссный защитник, который преуспевает в ситуациях один в один и отлично играет головой.", "en": "A veteran of Belgian side Gent. An uncompromising defender who excels in 1v1 situations and is excellent in the air." } },
    { "name": { "ru": "Стиан Роде Грегерсен", "en": "Stian Rode Gregersen" }, "pos": "defender", "status": "Star", "story": { "ru": "Скала обороны. Доказал свой класс во Франции и Швеции, отличаясь невероятной концентрацией на протяжении всех 90 минут.", "en": "A rock in defense. He has proven his class in France and Sweden, distinguished by incredible concentration for the full 90 minutes." } },

:root{--bg:#050b18;--card:rgba(16,33,61,.94);--border:rgba(255,255,255,.12);--accent:#3498db;--gold:#f1c40f;--text:#f8f9fa;--muted:#8ea6c7;--pitch:#0a1931}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
.lang-switcher{position:fixed;top:10px;left:10px;display:flex;gap:8px;z-index:1000}
.lang-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-weight:400;font-size:0.75rem;padding:2px 4px;transition:0.2s}
.lang-btn.active{color:var(--gold)}
.bg-trophy{position:fixed;inset:0;z-index:0;pointer-events:none;
  background: url("https://api.tvrgomel.by/upload/iblock/776/aaoipplamffc4dt1o9rq49ve47z9jl02.jpg") no-repeat center;
  background-size: cover;
  opacity: 0.5;
  filter: brightness(1.5) contrast(1.1);
}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 16px 12px}
header h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:700}
header p{color:var(--muted);margin-top:6px;font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:24px 0 16px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.tab,.btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:.9rem;transition:.15s}
.tab:hover,.btn:hover{background:rgba(255,255,255,.12)}
.tab.active{background:var(--accent);color:#042;border-color:var(--accent);font-weight:600}
.btn-save{background:var(--gold);color:#221;border-color:var(--gold);font-weight:600}
.btn-save:hover{background:#ffd966}
.btn-danger{border-color:#a33;color:#faa}
.panel{display:none}
.panel.active{display:block}
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 360px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;backdrop-filter:blur(10px)}
.card h3{font-size:1.05rem;margin-bottom:10px;color:var(--gold)}
.standings{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:12px}
.standings th,.standings td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--border)}
.standings th:not(:nth-child(2)), .standings td:not(:nth-child(2)) { width: 1%; white-space: nowrap; }
@media (max-width: 480px) {
  .standings th, .standings td { padding: 4px 2px; font-size: 0.7rem; }
  .card { padding: 8px; overflow-x: auto; }
}
.standings th{color:var(--muted);font-weight:500}
.standings td:nth-child(2){text-align:left}
.standings tr.pos1{background:rgba(52,152,219,.35)}
.standings tr.pos2{background:rgba(52,152,219,.2)}
.standings tr.pos3{background:rgba(241,196,15,.25)}
.standings tr.pos3.out3{opacity:.45}
.match-block{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
.match-meta{font-size:.78rem;color:var(--muted);margin-bottom:6px;line-height:1.4}
.match-meta b{color:var(--gold);font-weight:600}
.match-row{display:grid;grid-template-columns:1fr 45px 15px 45px 1fr auto;gap:4px;align-items:center;font-size:.85rem}
.team-cell{display:flex;align-items:center;gap:6px;min-width:0}
.team-cell.away{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.flag{width:24px;height:16px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.3);flex-shrink:0}
.team-tip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.25);transition:.15s}
.team-tip:hover{color:var(--accent);border-bottom-color:var(--accent)}
.team-tip span{text-shadow: -1px -1px 0 var(--pitch), 1px -1px 0 var(--pitch), -1px 1px 0 var(--pitch), 1px 1px 0 var(--pitch);}
.team-popover{position:fixed;z-index:9999;width:min(300px,calc(100vw - 24px));background:rgba(8,22,42,.97);border:1px solid var(--gold);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden;pointer-events:auto;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .15s,transform .15s,visibility .15s}
.team-popover.show{opacity:1;visibility:visible;transform:translateY(0)}
.team-pop-photo{width:100%;height:140px;object-fit:cover;display:block;background:rgba(0,0,0,.3)}
.team-pop-body{padding:12px 14px}
.team-pop-body h4{font-size:1rem;color:var(--gold);margin-bottom:4px;text-shadow: -1px -1px 0 var(--pitch), 1px -1px 0 var(--pitch), -1px 1px 0 var(--pitch), 1px 1px 0 var(--pitch);}
.team-pop-rank{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.team-pop-body p{font-size:.85rem;line-height:1.5;color:var(--text)}
.score-inp{width:40px;padding:5px;text-align:center;border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,.35);color:var(--text);font-size:1rem;font-weight:600}
.score-inp:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.score-inp.filled{background:rgba(0,212,170,.15)}
.ko-section{margin-bottom:24px}
.ko-section h3{color:var(--accent);margin-bottom:12px}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ko-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.ko-card .winner{font-weight:700;color:var(--gold);text-align:center;margin-top:8px}
.bracket-wrap{overflow-x:auto;padding:20px 0; -webkit-overflow-scrolling: touch;}
.bracket{display:flex;gap:40px;min-width:max-content; padding-bottom: 20px;}
.bracket-col{flex:1;min-width:150px}
.bracket-col h4{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.br-slot{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;font-size:.78rem;min-height:56px}
.third-table{width:100%;border-collapse:collapse;font-size:.85rem}
.third-table th,.third-table td{padding:8px;border:1px solid var(--border);text-align:center}
.third-table tr.qual{background:rgba(52,152,219,.3)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.stadium-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 320px),1fr));gap:16px}
.stadium-card{display:flex;flex-direction:column;gap:12px}
.stadium-img{width:100%;height:200px;object-fit:cover;border-radius:8px;background:rgba(0,0,0,.3)}
.stadium-info h3{font-size:1.1rem;color:var(--gold);margin-bottom:4px}
.stadium-info .city{font-size:.9rem;color:var(--muted);margin-bottom:8px;font-weight:600}
.stadium-info .desc{font-size:.85rem;line-height:1.5;margin-bottom:12px}
.stadium-fact{font-size:.82rem;padding:10px;background:rgba(255,255,255,.05);border-left:3px solid var(--gold);border-radius:0 4px 4px 0;font-style:italic}
.champion-banner{text-align:center;padding:32px;background:linear-gradient(135deg,rgba(241,196,15,.25),rgba(52,152,219,.15));border:2px solid var(--gold);border-radius:16px;margin-top:20px;display:none}
.champion-banner.show{display:block}
.champion-banner .trophy{font-size:3rem}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.team-card-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:0.2s}
.team-card-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.team-card-btn .flag{width:48px;height:32px}

.squad-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.player-row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:grid;grid-template-columns:1fr 120px 100px;align-items:center;cursor:pointer;transition:0.15s}
.player-row:hover{background:rgba(255,255,255,0.08);border-color:var(--accent)}
.player-name{font-weight:600;display:flex;align-items:center;gap:8px}
.player-pos{font-size:0.85rem;color:var(--muted)}
.player-status{font-size:0.8rem;text-align:center;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.1)}
.player-status.captain{background:var(--gold);color:#221;font-weight:700}
.back-btn{margin-bottom:20px;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:0.9rem}
.back-btn:hover{background:rgba(255,255,255,0.12)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-content{background:var(--bg);border:1px solid var(--gold);border-radius:16px;width:min(500px, 100%);max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.6)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.modal-header h3{color:var(--gold);font-size:1.4rem}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1;padding:4px}
.modal-body{padding:24px}
.modal-body p{line-height:1.6;font-size:1.05rem}
#saveStatus{font-size:.85rem;color:var(--muted)}
#saveStatus.ok{color:var(--accent)}
@media (max-width: 600px) {
  .match-row { grid-template-columns: 1fr 38px 10px 38px 1fr auto; font-size: 0.75rem; }
  .flag { width: 20px; height: 13px; }

.team-card-btn span { font-weight: 700; font-size: 1.1rem; color: #fff; text-shadow: -1px -1px 0 var(--pitch), 1px -1px 0 var(--pitch), -1px 1px 0 var(--pitch), 1px 1px 0 var(--pitch), 0 2px 4px rgba(0,0,0,0.4); }
.squad-container { display: grid; grid-template-columns: 1fr 300px; gap: 24px; margin-top: 20px; }
@media (max-width: 900px) { .squad-container { grid-template-columns: 1fr; } }
.team-header { text-align: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }

.team-desc { font-size: 1.05rem; line-height: 1.6; color: var(--text); max-width: 800px; margin: 0 auto; }
.section-title { font-size: 1.2rem; color: var(--gold); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.coach-list { display: flex; flex-direction: column; gap: 12px; }
.coach-card { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.2s; }
.coach-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.1); }
.coach-info h4 { color: var(--text); margin-bottom: 4px; }
.coach-info span { font-size: 0.85rem; color: var(--muted); }
.modal-photo-link { display: block; width: 150px; height: 150px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); cursor: pointer; transition: 0.3s; }
.modal-photo-link:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold); }
.modal-photo { width: 100%; height: 100%; object-fit: cover; }
.social-hint { display: block; text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: -15px; margin-bottom: 20px; }
</style>

function getScore(id){return scores[id]||{h:null,a:null,pen:null}}
function isPlayed(sc){return sc.h!==null&&sc.h!==''&&sc.a!==null&&sc.a!==''}
function isGroupFinished(g){
  const ms = GROUP_MATCHES.filter(m => m.g === g);
  return ms.every(m => isPlayed(getScore(m.id)));
}
function areAllGroupsFinished(){
  return 'ABCDEFGHIJKL'.split('').every(g => isGroupFinished(g));
}

function getMskDateStr(d, t) {
  if (!t) return d;
  const [h] = t.split(':').map(Number);
  if (h + 7 < 24) return d;
  const dt = new Date(d + 'T12:00:00');
  dt.setDate(dt.getDate() + 1);
  return dt.toISOString().split('T')[0];
}

function etToMsk(t){
  if(!t)return '';
  const [h,m]=t.split(':').map(Number);
  let mh=h+7,mm=m||0;
  if(mh>=24)mh-=24;
  return String(mh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function formatKickoff(t){
  const T = TRANSLATIONS[currentLang];
  if(!t)return '';
  if(currentLang === 'ru') return '🕐 ' + etToMsk(t) + ' МСК (' + t + ' ET)';
  return '🕐 '+t+' ET · '+etToMsk(t)+' '+T.msk_time;
}
function formatDate(d, t){
  const locale = currentLang;
  const targetD = currentLang === 'ru' ? getMskDateStr(d, t) : d;
  return new Date(targetD+'T12:00:00').toLocaleDateString(locale,{weekday:'short',day:'numeric',month:'short'});
}

}
function slotLabel(s){
  const T = TRANSLATIONS[currentLang];
  if(!s)return '—';
  if(s.startsWith('W'))return T.winner+' '+s.slice(1);
  if(s.startsWith('L'))return T.loser+' '+s.slice(1);
  if(/^[12][A-L]$/.test(s)) {
    const pos = s[0]==='1'? T.pos_1st + ' ' : T.pos_2nd + ' ';
    const gr = T.gr_short + ' ';
    return pos+gr+s[1];
  }
  if(s.startsWith('3@'))return T.pos_3rd + ' ' + T.to_short + s[2] + ')';
  return s;
}

function calcGroupStandings(g){
  const ids=GROUPS[g];
  const st=ids.map(id=>({id,w:0,d:0,l:0,gf:0,ga:0,pts:0,played:0}));
  const idx=id=>st.findIndex(x=>x.id===id);
  GROUP_MATCHES.filter(m=>m.g===g).forEach(m=>{
    const sc=getScore(m.id);
    if(!isPlayed(sc))return;
    const h=+sc.h,a=+sc.a;
    const hi=idx(m.h),ai=idx(m.a);
    st[hi].gf+=h;st[hi].ga+=a;st[hi].played++;
    st[ai].gf+=a;st[ai].ga+=h;st[ai].played++;
    if(h>a){st[hi].w++;st[hi].pts+=3;st[ai].l++}
    else if(h<a){st[ai].w++;st[ai].pts+=3;st[hi].l++}
    else{st[hi].d++;st[ai].d++;st[hi].pts++;st[ai].pts++}
  });
  st.forEach(s=>{s.gd=s.gf-s.ga});
  function h2h(ta,tb){
    let ap=0,bp=0,agd=0,bgd=0,agf=0,bgf=0;
    GROUP_MATCHES.filter(m=>m.g===g&&((m.h===ta&&m.a===tb)||(m.h===tb&&m.a===ta))).forEach(m=>{
      const sc=getScore(m.id);if(!isPlayed(sc))return;
      const h=+sc.h,a2=+sc.a,home=m.h===ta;
      const gf=home?h:a2,ga=home?a2:h;
      agf+=gf;bgf+=ga;agd+=gf-ga;bgd+=ga-gf;
      if(gf>ga)ap+=3;else if(gf<ga)bp+=3;else{ap++;bp++}
    });
    return{ap,bp,agd,bgd,agf,bgf};
  }
  function rankPair(a,b){
    if(a.pts!==b.pts)return b.pts-a.pts;
    const h=h2h(a.id,b.id);
    if(h.ap!==h.bp)return h.bp-h.ap;
    if(h.agd!==h.bgd)return h.bgd-h.agd;
    if(h.agf!==h.bgf)return h.bgf-h.agf;
    if(a.gd!==b.gd)return b.gd-a.gd;
    if(a.gf!==b.gf)return b.gf-a.gf;
    return (TEAMS[a.id].r||99)-(TEAMS[b.id].r||99);
  }
  st.sort((a,b)=>rankPair(a,b));
  return st.map((s,i)=>({...s,pos:i+1}));
}

function getThirdPlaces(){
  const all=[];
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const st=calcGroupStandings(g);
    if(st[2])all.push({...st[2],group:g});
  });
  all.sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.gd!==a.gd)return b.gd-a.gd;
    if(b.gf!==a.gf)return b.gf-a.gf;
    return (TEAMS[a.id].r||99)-(TEAMS[b.id].r||99);
  });
  return all;
}
function getQualifiedThirds(){return getThirdPlaces().slice(0,8);}
function getAnnexMapping(){
  const q=getQualifiedThirds();
  if(q.length<8)return null;
  return ANNEX_C[q.map(t=>t.group).sort().join('')]||null;
}
function resolveThirdForWinner(wg){
  if(!areAllGroupsFinished()) return null;
  const map=getAnnexMapping();if(!map)return null;
  const slot=map[wg];if(!slot)return null;
  const g=slot[1];
  const t=getThirdPlaces().find(x=>x.group===g);
  return t?t.id:null;
}
function resolveSlot(slot,memo={}){
  if(!slot)return null;
  if(memo[slot]!==undefined)return memo[slot];
  if(TEAMS[slot]){memo[slot]=slot;return slot}
  if(slot.startsWith('3@')){
    const id=resolveThirdForWinner(slot[2]);memo[slot]=id;return id;
  }
  if(/^3[A-L]$/.test(slot)){
    if(!isGroupFinished(slot[1])) return null;
    const st=calcGroupStandings(slot[1]);
    const id=st[2]?st[2].id:null;memo[slot]=id;return id;
  }
  if(/^[12][A-L]$/.test(slot)){
    if(!isGroupFinished(slot[1])) return null;
    const st=calcGroupStandings(slot[1]);
    const id=st[+slot[0]-1]?st[+slot[0]-1].id:null;memo[slot]=id;return id;
  }
  if(slot.startsWith('W')||slot.startsWith('L')){
    const mid=slot.slice(1);
    const m=KO.find(x=>x.id===mid);
    if(!m){memo[slot]=null;return null}
    const sc=getScore(mid);
    const hId=resolveSlot(m.h,memo),aId=resolveSlot(m.a,memo);
    if(!isPlayed(sc)){memo[slot]=null;return null}
    let h=+sc.h,a=+sc.a;
    if(h===a&&sc.pen){if(sc.pen==='h')h++;else a++}
    if(h===a){memo[slot]=null;return null}
    memo[slot]=slot[0]==='W'?(h>a?hId:aId):(h>a?aId:hId);
    return memo[slot];
  }
  memo[slot]=null;return null;
}
function getWinner(mid){return resolveSlot('W'+mid);}

function renderStandingsTable(g){
  const T = TRANSLATIONS[currentLang];
  const st=calcGroupStandings(g);
  const q8=getQualifiedThirds().map(t=>t.group);
  let h='<table class="standings"><tr><th>'+T.st_pos+'</th><th>'+T.st_team+'</th><th>'+T.st_p+'</th><th>'+T.st_w+'</th><th>'+T.st_d+'</th><th>'+T.st_l+'</th><th>'+T.st_gf+'</th><th>'+T.st_ga+'</th><th>'+T.st_gd+'</th><th>'+T.st_pts+'</th></tr>';
  st.forEach((s,i)=>{
    let cls='pos'+(i+1);
    if(i===2){cls+=' pos3';if(!q8.includes(g))cls+=' out3'}
    h+='<tr class="'+cls+'"><td>'+(i+1)+'</td><td>'+teamLabel(s.id)+'</td><td>'+s.played+'</td><td>'+s.w+'</td><td>'+s.d+'</td><td>'+s.l+'</td><td>'+s.gf+'</td><td>'+s.ga+'</td><td>'+(s.gd>0?'+':'')+s.gd+'</td><td><b>'+s.pts+'</b></td></tr>';
  });
  return h+'</table>';
}

      const m=KO.find(x=>x.id===id);

      const hId=resolveSlot(m.h),aId=resolveSlot(m.a);
      const w=getWinner(id);

      if(w)h+='<br>→ <span style="color:var(--gold)">'+teamLabel(w)+'</span>';
      h+='</div>';
    });
    h+='</div>';
  });
  document.getElementById('panel5').innerHTML=h+'</div></div>';
  const champ=getWinner('M104');
  const banner=document.getElementById('championBanner');

}

function renderTeams(){
  if(selectedTeamId) {
    showSquad(selectedTeamId);
  } else {
    renderTeamsGrid();
  }
}

function renderTeamsGrid(){
  selectedTeamId = null;
  const T = TRANSLATIONS[currentLang];
  let h = '<div class="teams-grid">';
  Object.keys(TEAMS).sort((a,b) => {
    const nameA = TEAMS[a].n[currentLang] || TEAMS[a].n.en;
    const nameB = TEAMS[b].n[currentLang] || TEAMS[b].n.en;
    return nameA.localeCompare(nameB);
  }).forEach(id => {
    const t = TEAMS[id];
    const name = t.n[currentLang] || t.n.en;
    h += `<button class="team-card-btn" onclick="goToTeam('${id}')">
      ${flagImg(id)}
      <span>${name}</span>
    </button>`;
  });
  h += '</div>';
  document.getElementById('panel6').innerHTML = h;
}


function goToTeam(id){
  activeTab = 6;
  showSquad(id);
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t, i) => t.classList.toggle('active', i === 6));
  const panels = document.querySelectorAll('.panel');
  panels.forEach((p, i) => p.classList.toggle('active', i === 6));
  window.scrollTo({top: 0, behavior: 'smooth'});
  hideTeamPopover(0);
}

function goToStadium(nameEn){
  activeTab = 7;
  renderStadiums();
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t, i) => t.classList.toggle('active', i === 7));
  const panels = document.querySelectorAll('.panel');
  panels.forEach((p, i) => p.classList.toggle('active', i === 7));

  setTimeout(() => {
    const el = document.getElementById('stadium-' + nameEn.replace(/[^a-zA-Z0-9]/g, '-'));
    if(el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
  }, 100);
}

function goToStadiumByVenue(v){
  const stadium = STADIUMS_DATA.find(s => v.includes(s.name.en));
  if(stadium) goToStadium(stadium.name.en);
}

function showSquad(teamId){
  selectedTeamId = teamId;
  const T = TRANSLATIONS[currentLang];
  const t = TEAMS[teamId];
  const name = t.n[currentLang] || t.n.en;
  const data = SQUADS[teamId] || { players: [], coaches: [], desc: { ru: "", en: "" } };
  const players = data.players || [];
  const coaches = data.coaches || [];
  const desc = data.desc[currentLang] || data.desc.en || "";

  let h = `<button class="back-btn" onclick="renderTeamsGrid()"><span>${T.back_to_teams}</span></button>`;

  h += `<div class="card">
    <div class="team-header">
      <img src="${t.f}" class="big-flag" alt="">
      <h2>${name}</h2>
      <p class="team-desc">${desc}</p>
    </div>

    <div class="squad-container">
      <div class="players-section">
        <h3 class="section-title">🏃 ${T.squad}</h3>
        <div class="squad-list">`;

  players.forEach((p, idx) => {
    const pName = p.name[currentLang] || p.name.en;
    const pPos = T[p.pos] || p.pos;
    const isCaptain = p.status === 'Captain';
    h += `<div class="player-row" onclick="showPersonDetail('${teamId}', 'players', ${idx})">
      <div class="player-name">👤 ${pName}</div>
      <div class="player-pos">${pPos}</div>
      <div class="player-status ${isCaptain ? 'captain' : ''}">${isCaptain ? T.captain : ''}</div>
    </div>`;
  });

  h += `</div></div>
      <div class="coaches-section">
        <h3 class="section-title">📋 ${T.coaches}</h3>
        <div class="coach-list">`;


  coaches.forEach((c, idx) => {
    const cName = c.name[currentLang] || c.name.en;
    const coachRole = {
      ru: 'Главный тренер',
      en: 'Head Coach',
      zh: '主教练',
      es: 'Entrenador principal',
      fr: 'Entraîneur principal'
    }[currentLang] || 'Head Coach';
    h += `<div class="coach-card" onclick="showPersonDetail('${teamId}', 'coaches', ${idx})">
      <div class="coach-info">
        <h4>${cName}</h4>
        <span>${coachRole}</span>
      </div>
    </div>`;
  });


  h += `</div></div></div></div>`;
  document.getElementById('panel6').innerHTML = h;
}

function showPersonDetail(teamId, type, idx){
  const person = SQUADS[teamId][type][idx];
  const pName = person.name[currentLang] || person.name.en;
  const pStory = person.story[currentLang] || person.story.en;
  const pPhoto = person.image || "";
  const pSocial = person.social || "#";

  document.getElementById('modalPlayerName').textContent = pName;
  document.getElementById('modalPlayerStory').textContent = pStory;
  document.getElementById('modalPlayerPhoto').src = pPhoto;
  document.getElementById('modalPlayerSocial').href = pSocial;
  document.getElementById('playerModal').classList.add('show');
}


function closePlayerModal(){
  document.getElementById('playerModal').classList.remove('show');
}

function renderStadiums(){
  let h='<div class="stadium-grid">';
  STADIUMS_DATA.forEach(s=>{
    const name = s.name[currentLang] || s.name.en;
    const city = s.city[currentLang] || s.city.en;
    const desc = s.desc[currentLang] || s.desc.en;
    const fact = s.fact[currentLang] || s.fact.en;
    const sId = 'stadium-' + s.name.en.replace(/[^a-zA-Z0-9]/g, '-');
    
    // Добавляем тег <a> вокруг изображения с ссылкой на сайт стадиона
 h += `<div class="card stadium-card" id="${sId}">
  <a href="${s.url}" target="_blank" rel="noopener noreferrer">
    <img src="${s.img}" class="stadium-img" alt="${name}">
  </a>
  <div class="stadium-info">
    <h3><a href="${s.url}" target="_blank" rel="noopener noreferrer" class="stadium-name-link">${name}</a></h3>
    <div class="city">${city}</div>
    <p class="desc">${desc}</p>
    <div class="stadium-fact">${fact}</div>
  </div>
</div>`;
  });
  const panel = document.getElementById('panel7');
  if(panel) panel.innerHTML = h + '</div>';
}

function renderAll(){
  const ae=document.activeElement;
  const fid=ae&&ae.dataset?ae.dataset.id:null;
  const fside=ae&&ae.dataset?ae.dataset.side:null;
  const selStart=ae&&ae.selectionStart!=null?ae.selectionStart:null;
  renderGroups();renderTables();renderThird();renderCalendar();renderKnockout();renderBracket();renderTeams();renderStadiums();
  bindInputs();
  if(fid){
    const inp=document.querySelector('input.score-inp[data-id="'+fid+'"][data-side="'+fside+'"]');
    if(inp){inp.focus();if(selStart!=null)try{inp.setSelectionRange(selStart,selStart)}catch(e){}}
  }
}

let teamPopTimer=null,teamPopPinned=null;
function positionTeamPopover(anchor){
  const pop=document.getElementById('teamPopover');
  if(!pop.classList.contains('show'))return;
  const r=anchor.getBoundingClientRect();
  const pw=pop.offsetWidth,ph=pop.offsetHeight;
  let left=r.left+r.width/2-pw/2;
  let top=r.bottom+10;
  if(left<8)left=8;
  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  if(top+ph>window.innerHeight-8)top=r.top-ph-10;
  if(top<8)top=8;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
}
function showTeamPopover(id,anchor){
  const t=TEAMS[id];if(!t)return;
  const pop=document.getElementById('teamPopover');
  clearTimeout(teamPopTimer);
  const name = typeof t.n === 'object' ? t.n[currentLang] : t.n;
  const desc = typeof t.d === 'object' ? t.d[currentLang] : t.d;
  const rank_text = {
    ru: 'Сборная · рейтинг FIFA: №',
    zh: '国家队 · 国际足联排名：第',
    es: 'Equipo nacional · Ranking FIFA: №',
    fr: 'Équipe nationale · Classement FIFA: №',
    en: 'National team · FIFA Rank: #'
  }[currentLang] || 'National team · FIFA Rank: #';
  pop.innerHTML='<img class="team-pop-photo" src="'+(t.p||t.f)+'" alt="" onclick="goToTeam(\''+id+'\')" style="cursor:pointer"><div class="team-pop-body"><h4 onclick="goToTeam(\''+id+'\')" style="cursor:pointer;text-decoration:underline">'+name+'</h4><div class="team-pop-rank">'+rank_text+t.r+'</div><p>'+(desc||'')+'</p></div>';
  pop.classList.add('show');
  pop.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>positionTeamPopover(anchor));
}
function hideTeamPopover(delay){
  clearTimeout(teamPopTimer);
  teamPopTimer=setTimeout(()=>{
    if(teamPopPinned)return;
    const pop=document.getElementById('teamPopover');
    pop.classList.remove('show');
    pop.setAttribute('aria-hidden','true');
  },delay==null?140:delay);
}
function initTeamPopover(){
  const pop=document.getElementById('teamPopover');
  if(pop.dataset.bound)return;
  pop.dataset.bound='1';
  document.addEventListener('mouseover',e=>{
    const tip=e.target.closest('.team-tip');
    if(tip){teamPopPinned=null;showTeamPopover(tip.dataset.team,tip)}
  });
  document.addEventListener('mouseout',e=>{
    const tip=e.target.closest('.team-tip');
    const toTip=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.team-tip');
    const toPop=e.relatedTarget&&(e.relatedTarget===pop||pop.contains(e.relatedTarget));
    if(tip&&!toTip&&!toPop)hideTeamPopover();
  });
  pop.addEventListener('mouseenter',()=>clearTimeout(teamPopTimer));
  pop.addEventListener('mouseleave',()=>hideTeamPopover());
  document.addEventListener('click',e=>{
    if(!e.target.closest('#teamPopover') && !e.target.closest('.team-tip')){teamPopPinned=null;hideTeamPopover(0)}
  });
  window.addEventListener('scroll',()=>{
    const tip=document.querySelector('.team-tip[data-team="'+teamPopPinned+'"]')||document.querySelector('.team-tip:hover');
    if(tip&&pop.classList.contains('show'))positionTeamPopover(tip);
  },true);
  window.addEventListener('resize',()=>{
    const tip=document.querySelector('.team-tip[data-team="'+teamPopPinned+'"]');
    if(tip&&pop.classList.contains('show'))positionTeamPopover(tip);
  });
}

function bindInputs(){
  document.querySelectorAll('.score-inp').forEach(inp=>{
    const handler=()=>{
      const id=inp.dataset.id,side=inp.dataset.side;
      const sc=getScore(id);
      const h=side==='h'?(inp.value===''?null:+inp.value):sc.h;
      const a=side==='a'?(inp.value===''?null:+inp.value):sc.a;
      updateScore(id,h,a);
    };
    inp.oninput=handler;
    inp.onchange=handler;
  });
  document.querySelectorAll('.pen-sel').forEach(sel=>{sel.onchange=()=>setPen(sel.dataset.id,sel.value||null)});
}

document.getElementById('btnSave').onclick=()=>persist();
document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify({version:2,scores,updatedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wc2026-results.json';a.click();
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);scores=d.scores||d;persist();renderAll()}catch(err){alert(TRANSLATIONS[currentLang].json_error)}};
  r.readAsText(f);e.target.value='';
};
document.getElementById('btnReset').onclick=()=>{
  if(confirm(TRANSLATIONS[currentLang].reset_confirm)){scores={};localStorage.removeItem(STORAGE_KEY);showStatus(TRANSLATIONS[currentLang].reset_done,false);renderAll()}
};

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.onclick = () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
    buildUI();
    renderAll();
  };
});


initTeamPopover();load();buildUI();renderAll();

</script>

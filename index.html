  "coaches": [{ "name": { "ru": "Себастьен Минье", "en": "Sébastien Migné" }, "story": { "ru": "Французский тренер с богатым опытом работы в развивающихся футбольных странах.", "en": "French coach with extensive experience working in developing football nations." }, "image": "https://placehold.co/300x300?text=Sébastien+Migné" }],
  "players": [
    { "name": { "ru": "Дюкен Назон", "en": "Duckens Nazon" }, "pos": "forward", "status": "Star", "story": { "ru": "Мощный нападающий, главная атакующая сила карибской сборной.", "en": "A powerful striker and the main attacking force of the Caribbean side." } },

    { "name": { "ru": "Джони Пласид", "en": "Johny Placide" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Капитан и легенда гаитянского футбола. В свои 38 лет он стал символом терпения — 11 лет waited мечту о чемпионате мира, проходя через неудачные отборы 2014, 2018 и 2022. Вратарь «Бастии» — последний страж ворот, который ведёт за собой «Гренадеров» на их втором в истории мундиале.", "en": "Captain and legend of Haitian football. At 38, he has become a symbol of patience — waiting 11 years for the World Cup dream, surviving failed qualifiers in 2014, 2018, and 2022. The Bastia goalkeeper is the last line of defence leading the 'Grenadiers' to their second-ever World Cup." } },

    { "name": { "ru": "Александр Пьер", "en": "Alexandre Pierre" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "Молодой и амбициозный вратарь французского «Сошо». Представляет новое поколение гаитянских голкиперов, готовых сменить ветерана Пласида в любой момент.", "en": "A young and ambitious goalkeeper for French side Sochaux. Represents the new generation of Haitian shot-stoppers, ready to step in for veteran Placide at any moment." } },

    { "name": { "ru": "Жозуэ Дюверже", "en": "Josué Duverger" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Третий вратарь сборной, выступающий за «Космос Кобленц» в Германии. Его путь из Гаити в немецкий футбол — пример несгибаемой воли к прогрессу.", "en": "The third goalkeeper of the national team, playing for Cosmos Koblenz in Germany. His journey from Haiti to German football is an example of an unbreakable will to progress." } },

    { "name": { "ru": "Карленс Аркус", "en": "Carlens Arcus" }, "pos": "defender", "status": "Star", "story": { "ru": "Надёжный правый защитник «Анже» из Лиги 1. Уроженец Порт-о-Пренса, прошедший путь от улиц столицы Гаити до элитного французского футбола. Один из столпов обороны «Гренадеров».", "en": "A reliable right-back for Ligue 1's Angers SCO. Born in Port-au-Prince, he rose from the streets of Haiti's capital to elite French football. One of the defensive pillars of the 'Grenadiers'." } },

    { "name": { "ru": "Вильгенс Поген", "en": "Wilguens Paugain" }, "pos": "defender", "status": "Squad", "story": { "ru": "Опорный защитник бельгийского «Зюлте-Варегем». Отличается жёсткостью в единоборствах и самоотверженностью в каждом матче за национальную команду.", "en": "A solid defender for Belgian side Zulte Waregem. Known for his toughness in duels and dedication in every match for the national team." } },

    { "name": { "ru": "Дюк Лакруа", "en": "Duke Lacroix" }, "pos": "defender", "status": "Squad", "story": { "ru": "Удивительная история: уроженец Нью-Джерси, сын гаитянских эмигрантов, играет во втором дивизионе США за «Колорадо-Спрингс». Помог команде выиграть чемпионат USL в 2024 году, а теперь едет на чемпионат мира! Настоящая американская мечта по-гаитянски.", "en": "A remarkable story: born in New Jersey to Haitian immigrant parents, he plays in the US second tier for Colorado Springs Switchbacks. Helped the team win the 2024 USL Championship, and now he's heading to the World Cup! A true Haitian-American dream." } },

    { "name": { "ru": "Мартен Эксперьенс", "en": "Martin Experience" }, "pos": "defender", "status": "Squad", "story": { "ru": "Его фамилия буквально переводится как «Опыт» — и он полностью ей соответствует. Защитник французской «Нанси-Лотарингии», чьё имя стало синонимом надёжности в обороне сборной.", "en": "His surname literally translates as 'Experience' — and he lives up to it completely. A defender for French side AS Nancy-Lorraine, whose name has become synonymous with reliability in the national team's defence." } },

    { "name": { "ru": "Жан-Кевен Дюверн", "en": "Jean-Kévin Duverne" }, "pos": "defender", "status": "Rising", "story": { "ru": "Универсальный защитник бельгийского «Гента». Способен сыграть на любом фланге обороны, что делает его незаменимым инструментом в руках тренера Минье.", "en": "A versatile defender for Belgian side KAA Gent. Capable of playing on any flank of the defence, making him an indispensable tool in coach Migné's hands." } },

    { "name": { "ru": "Рикардо Аде", "en": "Ricardo Adé" }, "pos": "defender", "status": "Star", "story": { "ru": "Сопереживающий капитан и один из лидеров обороны. 35-летний защитник эквадорского ЛДУ Кито, который стал символом возвращения Гаити на мировую арену. Именно его вопрос «Почему бы нашему поколению не выйти на ЧМ?» вдохновил команду на квалификацию.", "en": "Co-captain and one of the defensive leaders. The 35-year-old defender of Ecuador's LDU Quito has become a symbol of Haiti's return to the world stage. It was his question 'Why can't our generation make it to the World Cup?' that inspired the team through qualification." } },

    { "name": { "ru": "Ханнес Делькруа", "en": "Hannes Delcroix" }, "pos": "defender", "status": "Rising", "story": { "ru": "Уникальный случай: родился на Гаити, вырос в Бельгии, выступал за юношеские сборные Бельгии (был капитаном!), но выбрал историческую родину. Центральный защитник «Лугано» (экс-«Бернли»), который привносит европейскую школу в оборону «Гренадеров».", "en": "A unique case: born in Haiti, raised in Belgium, captained Belgium's youth teams, but chose his ancestral homeland. A centre-back for Lugano (ex-Burnley) who brings European schooling to the 'Grenadiers' defence." } },

    { "name": { "ru": "Кето Термонси", "en": "Keeto Thermoncy" }, "pos": "defender", "status": "Squad", "story": { "ru": "Молодой защитник из академии «Янг Бойз». Один из самых перспективных талантов гаитянского футбола, представляющий будущее национальной команды.", "en": "A young defender from the Young Boys academy. One of the most promising talents in Haitian football, representing the future of the national team." } },

    { "name": { "ru": "Левертон Пьер", "en": "Leverton Pierre" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Полузащитник португальской «Визелы», чья энергия и работоспособность в центральной зоне делают его одним из ключевых игроков гаитянского midfield.", "en": "A midfielder for Portuguese side Vizela, whose energy and work rate in the central zone make him one of the key players in Haiti's midfield." } },

    { "name": { "ru": "Карл-Фред Сент", "en": "Carl-Fred Sainthe" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Представитель гаитянской диаспоры, выступающий за «Эль-Пасо Локомотив» в США. Его включение в состав — дань уважения множеству талантливых гаитянских футболистов, разбросанных по всему миру.", "en": "A representative of the Haitian diaspora, playing for El Paso Locomotive FC in the USA. His inclusion honours the many talented Haitian footballers scattered across the globe." } },

    { "name": { "ru": "Данли Жан Жак", "en": "Danley Jean Jacques" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Опорный полузащитник «Филадельфия Юнион» из MLS. Уроженец Пти-Гоав, прошедший путь из маленького гаитянского города через французский «Мец» в американскую лигу. Его мощь и энергия в центре поля — основа игры сборной.", "en": "A defensive midfielder for MLS's Philadelphia Union. Born in Petit-Goâve, he rose from a small Haitian town through French club Metz to the American league. His power and energy in central midfield form the backbone of the national team." } },

    { "name": { "ru": "Жан-Рикне Белльгард", "en": "Jean-Ricner Bellegarde" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Звезда английского «Вулверхэмптона»! Один из немногих гаитянских футболистов в АПЛ. Родился в Коломбе (Франция), но выбрал сборную Гаити, став одним из главных открытий отборочного цикла. Его удары — настоящая артиллерия «Гренадеров».", "en": "A star of England's Wolverhampton Wanderers! One of the few Haitian footballers in the Premier League. Born in Colombes, France, but chose Haiti, becoming one of the revelations of the qualifying campaign. His shots are real artillery for the 'Grenadiers'." } },

    { "name": { "ru": "Вуденски Пьер", "en": "Woodensky Pierre" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Представитель гаитянского клуба «Виолетт» — один из немногих игроков внутреннего чемпионата в составе сборной. Символ того, что талант живёт и на самом острове.", "en": "A representative of Haitian club Violette AC — one of the few players from the domestic league in the national squad. A symbol that talent lives on the island itself." } },

    { "name": { "ru": "Доминик Симон", "en": "Dominique Simon" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Полузащитник словацкого «Татрана» из Прешова. Прошёл путь через европейские низшие лиги, чтобы оказаться на чемпионате мира — история настоящего бойца.", "en": "A midfielder for Slovak side Tatran Prešov. He navigated through European lower leagues to reach the World Cup — the story of a true fighter." } },

    { "name": { "ru": "Луисиус Дидсон", "en": "Louicius Deedson" }, "pos": "forward", "status": "Rising", "story": { "ru": "Молодой нападающий «Далласа» в MLS. Один из самых быстрых игроков сборной, чья скорость и дриблинг создают проблемы для любой обороны.", "en": "A young forward for Dallas in MLS. One of the fastest players in the squad, whose speed and dribbling cause problems for any defence." } },

    { "name": { "ru": "Рубен Провиденс", "en": "Ruben Providence" }, "pos": "forward", "status": "Squad", "story": { "ru": "Крайний нападающий нидерландского «Алмере Сити». Его имя переводится как «Провидение» — и он стал настоящим даром для атаки гаитянской сборной.", "en": "A winger for Dutch side Almere City FC. His surname translates as 'Providence' — and he has truly become a gift for Haiti's attack." } },

    { "name": { "ru": "Жозуэ Казимир", "en": "Josué Casimir" }, "pos": "forward", "status": "Rising", "story": { "ru": "24-летний вингер французского «Осера» из Лиги 1. Родился на Гваделупе, но выбрал Гаити. Один из самых перспективных молодых талантов в составе «Гренадеров».", "en": "A 24-year-old winger for French Ligue 1 side Auxerre. Born in Guadeloupe but chose Haiti. One of the most promising young talents in the 'Grenadiers' squad." } },

    { "name": { "ru": "Деррик Этьен-мл.", "en": "Derrick Etienne Jr." }, "pos": "forward", "status": "Star", "story": { "ru": "Опытный вингер «Торонто» в MLS. Сын бывшего футболиста сборной Гаити, он вырос в футбольной семье. 41 матч за сборную, 8 голов — настоящий ветеран американской школы гаитянского футбола.", "en": "An experienced winger for Toronto FC in MLS. Son of a former Haiti international, he grew up in a football family. 41 caps and 8 goals for the national team — a true veteran of the American-school Haitian football." } },

    { "name": { "ru": "Уилсон Исидор", "en": "Wilson Isidor" }, "pos": "forward", "status": "Star", "story": { "ru": "Сенсация отборочного цикла! Нападающий «Сандерленда» из Чемпионшипа, который недавно сменил футбольное гражданство с Франции на Гаити. Рыночная стоимость €18 млн — самый дорогой игрок в истории гаитянского футбола. Забил решающие голы, которые вернули страну на мундиаль спустя 52 года.", "en": "The sensation of the qualifying campaign! A Sunderland striker who recently switched international allegiance from France to Haiti. Market value €18 million — the most expensive player in Haitian football history. He scored crucial goals that brought the country back to the World Cup after 52 years." } },

    { "name": { "ru": "Францди Пьерро", "en": "Frantzdy Pierrot" }, "pos": "forward", "status": "Star", "story": { "ru": "Мощный 194-сантиметровый форвард турецкого «Ризеспор». Один из самых опытных нападающих сборной, чей рост и сила делают его грозным оружием в штрафной соперника. Настоящий таран «Гренадеров».", "en": "A powerful 194cm forward for Turkish side Çaykur Rizespor. One of the most experienced strikers in the squad, whose height and strength make him a fearsome weapon in the opponent's penalty area. A true battering ram for the 'Grenadiers'." } },

    { "name": { "ru": "Яссин Фортюн", "en": "Yassin Fortune" }, "pos": "forward", "status": "Squad", "story": { "ru": "Атакующий полузащитник/нападающий португальской «Визелы». Техничный и креативный игрок, способный обострить игру в заключительной трети поля.", "en": "An attacking midfielder/forward for Portuguese side Vizela. A technical and creative player capable of sharpening the game in the final third." } },

    { "name": { "ru": "Ленни Жозеф", "en": "Lenny Joseph" }, "pos": "forward", "status": "Rising", "story": { "ru": "Молодой нападающий венгерского «Ференцвароша» — одного из грандов восточноевропейского футбола. Его переход в такой клуб — показатель растущего уровня гаитянских талантов на европейской арене.", "en": "A young forward for Hungary's Ferencváros — one of the giants of Eastern European football. His move to such a club reflects the growing level of Haitian talents on the European stage." } }
  ]
},
"SCO": {
  "desc": {
    "ru": "«Тартановая армия» возвращается на мировую сцену, неся с собой рев волынок и дух Хайленда. Сборная Шотландии — это не только фанаты, это команда, нашедшая свою игру и баланс. Они выходят на поле готовые сражаться до последней капли пота.",
    "en": "The 'Tartan Army' returns to the world stage, carrying with it the roar of bagpipes and the spirit of the Highlands. The Scotland national team is not just about fans; it's a team that has found its game and balance. They take the field with an open visor, ready to fight for the blue cross on their chest until the last drop of sweat."
  },
  "coaches": [{ "name": { "ru": "Стив Кларк", "en": "Steve Clarke" }, "story": { "ru": "Тренер, вернувший Шотландии стабильность и регулярное участие в крупных турнирах.", "en": "Coach who restored stability and regular participation in major tournaments for Scotland." }, "image": "https://placehold.co/300x300?text=Steve+Clarke" }],
  "players": [
    { "name": { "ru": "Эндрю Робертсон", "en": "Andrew Robertson" }, "pos": "defender", "status": "Captain", "story": { "ru": "Из любительского футбола до победы в Лиге чемпионов с «Ливерпулем».", "en": "From amateur football to winning the Champions League with Liverpool." } },
    { "name": { "ru": "Скотт Мактоминей", "en": "Scott McTominay" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Символ шотландского духа, неожиданно ставший лучшим бомбардиром отбора.", "en": "Symbol of the Scottish spirit, unexpectedly becoming the top scorer in qualifying." } },

    { "name": { "ru": "Крейг Гордон", "en": "Craig Gordon" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "43-летний ветеран «Хартс» стал вторым самым возрастным полевым игроком в истории чемпионатов мира! Пропустил Евро-2024, но вернулся, чтобы помочь «Хартс» пропустить меньше всех голов в шотландской Премьер-лиге (34 мяча — на 7 меньше, чем у чемпиона «Селтика»). Его история — это возрождение после тяжелейших травм коленей, которые едва не завершили карьеру.", "en": "The 43-year-old Hearts veteran became the second oldest player in World Cup history! Missed Euro 2024 but returned to help Hearts concede the fewest goals in the Scottish Premiership (34 goals — 7 fewer than champions Celtic). His story is a comeback from devastating knee injuries that nearly ended his career." } },

    { "name": { "ru": "Ангус Ганн", "en": "Angus Gunn" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Вратарь «Ноттингем Форест», который провёл всего один матч в АПЛ в этом сезоне, выйдя на замену в перерыве игры с «Кристал Пэлас». Но за плечами 21 матч за сборную — опыт, который может понадобиться Кларку в любой момент.", "en": "A Nottingham Forest goalkeeper who made just one Premier League appearance this season, coming on at half-time against Crystal Palace. But with 21 caps for Scotland, he has the experience Clarke may need at any moment." } },

    { "name": { "ru": "Лиам Келли", "en": "Liam Kelly" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Третий вратарь «Рейнджерс» с всего двумя матчами за сборную. Один из трёх игроков глазгианского гранда в составе — символ доверия Кларка к клубу из Глазго.", "en": "The third goalkeeper from Rangers with just two caps. One of three Rangers players in the squad — a symbol of Clarke's trust in the Glasgow giants." } },

    { "name": { "ru": "Грант Хэнли", "en": "Grant Hanley" }, "pos": "defender", "status": "Star", "story": { "ru": "34-летний защитник «Хиберниан» вернулся в Шотландию после долгих лет в английском Чемпионшипе. 66 матчей за сборную, но сезон получился нервным: пропуск 6 матчей из-за травм, красная карточка в апреле и повреждение колена в последнем туре. Но он доказал готовность и едет на свой первый мундиаль.", "en": "The 34-year-old Hibernian defender returned to Scotland after years in the English Championship. 66 caps for Scotland, but a nerve-wracking season: 6 matches missed through injury, a red card in April, and a knee injury on the final day. But he proved his fitness and is heading to his first World Cup." } },

    { "name": { "ru": "Джек Хендри", "en": "Jack Hendry" }, "pos": "defender", "status": "Star", "story": { "ru": "31-летний защитник саудовского «Аль-Эттифак», провёл 29 матчей в Про-лиге. Один из самых стабильных центральных защитников сборной, чей опыт в экзотическом чемпионате делает его уникальным бойцом «Тартановой армии».", "en": "The 31-year-old defender for Saudi Pro League's Al Ettifaq, playing 29 matches this season. One of the most reliable centre-backs in the squad, whose experience in an exotic league makes him a unique fighter for the 'Tartan Army'." } },

    { "name": { "ru": "Аарон Хики", "en": "Aaron Hickey" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний правый защитник «Брентфорда», который в основном выходит на замену (в среднем 33 минуты за матч в АПЛ). Но 19 матчей за сборную в таком возрасте — это заявка на будущее шотландского футбола.", "en": "A 23-year-old right-back for Brentford, largely used off the bench (averaging 33 minutes per Premier League match). But 19 caps at such an age is a statement for the future of Scottish football." } },

    { "name": { "ru": "Дом Хайам", "en": "Dom Hyam" }, "pos": "defender", "status": "Squad", "story": { "ru": "Надёжный защитник «Рексема» — того самого клуба, который принадлежит голливудским звёздам! Прошёл через множество аренд в нижних дивизионах Англии, прежде чем стать опорой «Ковентри» (2017-2022), затем три года в «Блэкберне», и теперь — звезда валлийского феномена.", "en": "A reliable defender for Wrexham — the club owned by Hollywood stars! He navigated through multiple loans in England's lower leagues before becoming a mainstay at Coventry (2017-2022), then three years at Blackburn, and now a star of the Welsh phenomenon." } },

    { "name": { "ru": "Скотт Маккенна", "en": "Scott McKenna" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний центральный защитник загребского «Динамо», которое выиграло чемпионат Хорватии с отрывом в 20 очков! Опыт игры в Восточной Европе добавил ему жёсткости и тактической мудрости. 49 матчей за сборную — один из столпов обороны.", "en": "The 29-year-old centre-back for Dinamo Zagreb, who won the Croatian championship with a 20-point lead! Experience in Eastern European football added toughness and tactical wisdom. 49 caps for Scotland — one of the defensive pillars." } },

    { "name": { "ru": "Натан Паттерсон", "en": "Nathan Patterson" }, "pos": "defender", "status": "Rising", "story": { "ru": "24-летний защитник «Эвертона», который провёл всего 9 матчей в АПЛ (446 минут). Но для сборной он — важный игрок, выходивший на поле в обоих мартовских товарищеских матчах. Борется с Хики за место в основе.", "en": "A 24-year-old Everton defender who played just 9 Premier League matches (446 minutes). But for Scotland he is an important player, featuring in both March friendlies. He battles with Hickey for a starting spot." } },

    { "name": { "ru": "Энтони Ралстон", "en": "Anthony Ralston" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний универсал «Селтика», выигравший свой восьмой титул чемпиона Шотландии! Сыграл 35 матчей в сезоне, хотя в решающей игре с «Хартс» (3:1) остался на скамейке. Надёжный резервист, готовый закрыть любую позицию в обороне.", "en": "The 27-year-old Celtic utility player who won his eighth Scottish Premiership title! He played 35 games this season, though he remained on the bench in the decisive match against Hearts (3-1). A reliable squad player ready to cover any defensive position." } },

    { "name": { "ru": "Джон Суттар", "en": "John Souttar" }, "pos": "defender", "status": "Rising", "story": { "ru": "Самый молодой дебютант в истории «Данди» — вышел на поле в 16 лет в 2013 году! Теперь защитник «Рейнджерс» получил свой шанс после того, как был исключён из финальной заявки на Евро-2024. 6 матчей за сборную — но впереди целая карьера.", "en": "The youngest player ever to appear for Dundee — debuting at 16 in 2013! Now a Rangers defender who got his chance after being omitted from the Euro 2024 final squad. 6 caps for Scotland — but a whole career ahead." } },

    { "name": { "ru": "Киран Тирни", "en": "Kieran Tierney" }, "pos": "defender", "status": "Star", "story": { "ru": "Одна из самых ярких молодых звёзд шотландского футбола, чья карьера в «Арсенале» не задалась. Возвращение в «Селтик» летом 2024 года стало вторым дыханием — теперь он ключевой игрок команды Мартина О'Нила. 55 матчей за сборную, левый защитник с характером.", "en": "Once one of the brightest young stars of Scottish football, whose career at Arsenal didn't work out. His return to Celtic in summer 2024 gave him a second wind — now he's a key member of Martin O'Neill's team. 55 caps for Scotland, a left-back with character." } },

    { "name": { "ru": "Райан Кристи", "en": "Ryan Christie" }, "status": "midfielder", "story": { "ru": "Уроженец Инвернесса, полузащитник «Борнмута» с 66 матчами за сборную. Этот чемпионат мира станет для него третьим крупным турниром (Евро-2020 и Евро-2024). Один из самых опытных игроков в полузащите «Тартановой армии».", "en": "Born in Inverness, the Bournemouth midfielder has 66 caps for Scotland. This World Cup will be his third major tournament (Euro 2020 and Euro 2024). One of the most experienced players in the 'Tartan Army' midfield." } },

    { "name": { "ru": "Финдли Кёртис", "en": "Findlay Curtis" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "19-летний вундеркинд «Рейнджерс», ставший сенсацией заявки! Провёл вторую половину сезона в аренде в «Килмарноке», где забил 5 голов в 8 матчах. Дебютировал за сборную в марте против Японии. Будущее шотландского футбола уже здесь.", "en": "A 19-year-old Rangers wonderkid who became the surprise of the squad! He spent the second half of the season on loan at Kilmarnock, scoring 5 goals in 8 matches. Debuted for Scotland in March against Japan. The future of Scottish football is already here." } },

    { "name": { "ru": "Льюис Фергюсон", "en": "Lewis Ferguson" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Капитан итальянской «Болоньи», который провёл 44 матча в этом сезоне, включая четвертьфинал Лиги Европы (проиграли «Астон Вилле»). 23 матча за сборную, но именно его лидерство в Серии А делает его одним из ключевых игроков Кларка.", "en": "The captain of Italian side Bologna, who played 44 matches this season including the Europa League quarterfinal (lost to Aston Villa). 23 caps for Scotland, but his leadership in Serie A makes him one of Clarke's key players." } },

    { "name": { "ru": "Бен Гэннон-Доук", "en": "Ben Gannon-Doak" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "Стал самым молодым шотландцем, игравшим за «Ливерпуль» в АПЛ (дебют 26 декабря 2022 года). Но регулярной практики ни на «Энфилде», ни в «Борнмуте» не получал. 3 матча за сборную — талант, которому нужен шанс.", "en": "Became the youngest Scot to play for Liverpool in the Premier League (debut on December 26, 2022). But he struggled for regular minutes at Anfield and has also found gametime hard to come by at Bournemouth. 3 caps for Scotland — a talent needing a chance." } },

    { "name": { "ru": "Тайлер Флетчер", "en": "Tyler Fletcher" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "Подросток из «Манчестер Юнайтед», который заменил в заявке травмированного Билли Гилмура! Дебютировал за сборную именно в том матче против Кюрасао (30 мая), выйдя на замену в перерыве. Сын бывшего капитана Шотландии и полузащитника «МЮ» Даррена Флетчера. Футбольная династия в действии.", "en": "A teenager from Manchester United who replaced the injured Billy Gilmour in the squad! He made his international debut in that very match against Curacao (May 30), coming on at half-time. Son of former Scotland captain and Manchester United midfielder Darren Fletcher. A football dynasty in action." } },

    { "name": { "ru": "Джон Макгинн", "en": "John McGinn" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Капитан «Астон Виллы» с 85 матчами и 20 голами за сборную — второй по опыту игрок после Робертсона. Надёжнейший двигатель полузащити «Тартановой армии», чья энергия и работоспособность делают его незаменимым. 32 года, но ноги как у 20-летнего.", "en": "Aston Villa captain with 85 caps and 20 goals for Scotland — the second most experienced player after Robertson. The most reliable engine of the 'Tartan Army' midfield, whose energy and work rate make him indispensable. 32 years old, but legs like a 20-year-old." } },

    { "name": { "ru": "Кенни Маклин", "en": "Kenny McLean" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Капитан «Норвича», сыгравший 45 матчей во всех турнирах (3745 минут!). Но главное — его гол с центра поля, который принёс Шотландии первую за 28 лет путёвку на чемпионат мира! 56 матчей за сборную, человек, забивший исторический мяч.", "en": "Norwich captain who played 45 matches across all competitions (3,745 minutes)! But most importantly — his goal from the halfway line that secured Scotland's first World Cup spot in 28 years! 56 caps for Scotland, the man who scored the historic goal." } },

    { "name": { "ru": "Че Адамс", "en": "Che Adams" }, "pos": "forward", "status": "Star", "story": { "ru": "Нападающий итальянского «Торино», который провёл довольно скромный сезон (5 голов и 3 передачи в Серии А, но только 4 полных матча). Зато за сборную он всегда надёжен: 11 голов в 46 матчах. Один из главных бомбардиров «Тартановой армии».", "en": "A Torino striker who had a fairly modest season (5 goals and 3 assists in Serie A, but only 4 full matches). But for Scotland he has always been reliable: 11 goals in 46 appearances. One of the main scorers for the 'Tartan Army'." } },

    { "name": { "ru": "Линдон Дайкс", "en": "Lyndon Dykes" }, "pos": "forward", "status": "Star", "story": { "ru": "После борьбы за минуты в «Бирмингеме» перешёл в «Чарльтон» в январе и сразу ожил: 3 гола и 3 передачи в Чемпионшипе. 50 матчей и 10 голов за сборную — всегда неудобный для защитников, способный продавить оборону любого соперника.", "en": "After struggling for minutes at Birmingham, he moved to Charlton in January and immediately came alive: 3 goals and 3 assists in the Championship. 50 caps and 10 goals for Scotland — always a handful for defenders, capable of bullying any backline." } },

    { "name": { "ru": "Джордж Хёрст", "en": "George Hirst" }, "pos": "forward", "status": "Rising", "story": { "ru": "Относительный новичок на международной арене: представлял юношеские сборные Англии, но в марте 2025 года сменил футбольное гражданство на Шотландию. Сын бывшего нападающего «Шеффилд Уэнсдей» Дэвида Хёрста. 8 матчей за сборную — наследник знаменитой фамилии.", "en": "A relative newcomer on the international stage: he represented England's youth teams but switched allegiance to Scotland in March 2025. Son of former Sheffield Wednesday striker David Hirst. 8 caps for Scotland — heir to a famous footballing name." } },

    { "name": { "ru": "Лоуренс Шэнкленд", "en": "Lawrence Shankland" }, "pos": "forward", "status": "Star", "story": { "ru": "Капитан «Хартс», который едва не привёл клуб к чемпионскому титулу, проиграв борьбу в последнем туре! 20 голов и 6 передач во всех турнирах — самый горячий нападающий Шотландии. 18 матчей за сборную, но именно его форма сделала его незаменимым для Кларка.", "en": "The Hearts captain who came within a whisker of leading his side to the league title, only losing it on the final day! 20 goals and 6 assists in all competitions — the hottest striker in Scotland. 18 caps, but his form made him indispensable for Clarke." } },

    { "name": { "ru": "Росс Стюарт", "en": "Ross Stewart" }, "pos": "forward", "status": "Rising", "story": { "ru": "Не играл за сборную с 2022 года (всего 2 матча), но вернулся благодаря потрясающему сезону за «Саутгемптон»: 11 голов, включая важнейший мяч в плей-офф Чемпионшипа против «Мидлсбро». 29 лет, и кто знает, где бы он был без постоянных травм? Но сейчас он — джокер Кларка.", "en": "Hadn't played for Scotland since 2022 (just 2 caps), but returned thanks to a stunning season at Southampton: 11 goals, including a crucial one in the Championship playoff semifinal against Middlesbrough. 29 years old, and who knows where he'd be without constant injuries? But now he's Clarke's wildcard weapon." } }
  ]
},
"PAR": {
  "desc": {
    "ru": "Парагвай — прежде всего железная оборона и дух «Гуарани», который невозможно сломить. Неуступчивость в каждом эпизоде, мастерство контратак - делают их опаснейшим соперником для любого гранда. Это команда бойцов, для которых самопожертвование на поле — высшая честь.",
    "en": "Paraguay is, above all, about rock-solid defense and the 'Guaraní' spirit that cannot be broken. Resilience in every episode and mastery of counterattacks make them a dangerous opponent for any giant. This is a team of fighters for whom self-sacrifice on the field is the highest honor."
  },
  "coaches": [{ "name": { "ru": "Густаво Альфаро", "en": "Gustavo Alfaro" }, "story": { "ru": "Мастер организации обороны, известный своим умением выводить команды на чемпионаты мира.", "en": "Master of defensive organization, known for his ability to lead teams to World Cups." }, "image": "https://placehold.co/300x300?text=Gustavo+Alfaro" }],
  "players": [
    { "name": { "ru": "Мигель Альмирон", "en": "Miguel Almirón" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Техничный вингер, ставший кумиром болельщиков «Ньюкасла».", "en": "A technical winger who became a fan favorite at Newcastle." } },

    { "name": { "ru": "Гатито Фернандес", "en": "Gatito Fernández" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "38-летний ветеран «Серро Портеньо» — настоящий символ парагвайского футбола. Его прозвище «Гатито» (котёнок) обманчиво: за ним скрывается опытный страж ворот с 31 матчем за сборную. Один из немногих игроков внутреннего чемпионата, получивших шанс на мундиале.", "en": "The 38-year-old Cerro Porteño veteran is a true symbol of Paraguayan football. His nickname 'Gatito' (kitten) is deceptive: behind it hides an experienced goalkeeper with 31 caps for the national team. One of the few domestic league players to get a World Cup chance." } },

    { "name": { "ru": "Орландо Гилл", "en": "Orlando Gill" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "25-летний вратарь аргентинского «Сан-Лоренсо» — представитель нового поколения парагвайских голкиперов. 6 матчей за сборную, но именно его уверенность на линии ворот сделала его вторым номером в заявке.", "en": "A 25-year-old goalkeeper for Argentine side San Lorenzo — representative of the new generation of Paraguayan shot-stoppers. 6 caps for the national team, but his confidence between the posts earned him the number two spot in the squad." } },

    { "name": { "ru": "Гастон Ольвейра", "en": "Gastón Olveira" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "33-летний вратарь «Олимпии» с единственным матчем за сборную. Его включение — дань уважения опыту и стабильности, которые он привносит в клубный футбол Парагвая.", "en": "A 33-year-old Olimpia goalkeeper with just one cap for the national team. His inclusion honors the experience and stability he brings to Paraguayan club football." } },

    { "name": { "ru": "Густаво Гомес", "en": "Gustavo Gómez" }, "pos": "defender", "status": "Captain", "story": { "ru": "Капитан сборной и лидер бразильского «Палмейраса»! 32-летний центральный защитник — настоящий генерал обороны «Альбиррохи». Его лидерство и опыт игры в топ-чемпионатах Южной Америки делают его незаменимым столпом «Гуарани».", "en": "Team captain and leader of Brazilian giants Palmeiras! The 32-year-old centre-back is a true defensive general for the Albirroja. His leadership and experience in South America's top leagues make him an indispensable pillar of the 'Guaraní'." } },

    { "name": { "ru": "Омар Альдерете", "en": "Omar Alderete" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний защитник английского «Сандерленда» — один из самых стабильных центральных защитников сборной. 36 матчей и 3 гола за национальную команду. Его физическая мощь и чтение игры делают его кошмаром для любого нападающего.", "en": "The 29-year-old defender for English side Sunderland is one of the most reliable centre-backs in the squad. 36 caps and 3 goals for the national team. His physical power and reading of the game make him a nightmare for any striker." } },

    { "name": { "ru": "Хуан Хосе Касерес", "en": "Juan José Cáceres" }, "pos": "defender", "status": "Rising", "story": { "ru": "26-летний защитник московского «Динамо» — единственный представитель российского футбола в заявке! 17 матчей за сборную. Его переход в РПЛ стал сенсацией, а теперь он едет на чемпионат мира — настоящий посол парагвайского футбола в Восточной Европе.", "en": "The 26-year-old defender for Moscow's Dynamo — the only representative of Russian football in the squad! 17 caps for the national team. His move to the Russian Premier League was a sensation, and now he's heading to the World Cup — a true ambassador of Paraguayan football in Eastern Europe." } },

    { "name": { "ru": "Фабиан Бальбуэна", "en": "Fabián Balbuena" }, "pos": "defender", "status": "Star", "story": { "ru": "34-летний ветеран бразильского «Гремио» с 48 матчами за сборную. Прошёл через английскую Премьер-лигу («Вест Хэм»), испанскую Ла Лигу и теперь закаляет себя в Серии А. Его опыт и хладнокровие — бесценны для молодой обороны «Альбиррохи».", "en": "The 34-year-old veteran of Brazilian side Grêmio with 48 caps for the national team. He's navigated through the English Premier League (West Ham), Spanish La Liga, and now toughens himself in Serie A. His experience and composure are invaluable for the young Albirroja defence." } },

    { "name": { "ru": "Хуниор Алонсо", "en": "Júnior Alonso" }, "pos": "defender", "status": "Star", "story": { "ru": "33-летний защитник бразильского «Атлетико Минейро» — один из самых опытных игроков сборной с 71 матчем! Его универсальность позволяет играть как в центре обороны, так и на фланге. Настоящий боец с характером «Гуарани».", "en": "The 33-year-old defender for Brazilian side Atlético Mineiro is one of the most experienced players in the squad with 71 caps! His versatility allows him to play both as a centre-back and on the flanks. A true fighter with the 'Guaraní' character." } },

    { "name": { "ru": "Густаво Веласкес", "en": "Gustavo Velázquez" }, "pos": "defender", "status": "Squad", "story": { "ru": "35-летний ветеран «Серро Портеньо» с 13 матчами за сборную. Его включение — это история о том, что возраст не помеха, если есть страсть к футболу. Один из немногих игроков внутреннего чемпионата в заявке.", "en": "The 35-year-old Cerro Porteño veteran with 13 caps for the national team. His inclusion is a story about how age is no barrier when there's passion for football. One of the few domestic league players in the squad." } },

    { "name": { "ru": "Хосе Канале", "en": "José Canale" }, "pos": "defender", "status": "Squad", "story": { "ru": "29-летний защитник аргентинского «Лануса» с всего 2 матчами за сборную. Его вызов — это шанс доказать, что он готов к большим вызовам. Представляет растущее поколение парагвайских защитников в аргентинском футболе.", "en": "The 29-year-old defender for Argentine side Lanús with just 2 caps for the national team. His call-up is a chance to prove he's ready for bigger challenges. Represents the growing generation of Paraguayan defenders in Argentine football." } },

    { "name": { "ru": "Александро Майдама", "en": "Alexandro Maidana" }, "pos": "defender", "status": "Rising", "story": { "ru": "20-летний вундеркинд аргентинского «Тальереса» — самый молодой защитник в заявке! Его включение в состав — ставка на будущее. Уже забил гол за сборную в товарищеском матче против Никарагуа (4:0) перед самым мундиалем.", "en": "A 20-year-old wonderkid for Argentine side Talleres — the youngest defender in the squad! His inclusion is a bet on the future. He already scored for the national team in a friendly against Nicaragua (4-0) right before the World Cup." } },

    { "name": { "ru": "Диего Гомес", "en": "Diego Gómez" }, "pos": "midfielder", "status": "Star", "story": { "ru": "23-летний полузащитник английского «Брайтона» — одна из главных звёзд сборной! Забил важнейший гол в товарищеском матче против Греции (1:0) в марте 2026 года. Его техника и видение поля делают его дирижёром атак «Альбиррохи».", "en": "The 23-year-old midfielder for English side Brighton is one of the squad's biggest stars! He scored a crucial goal in a friendly against Greece (1-0) in March 2026. His technique and vision make him the conductor of the Albirroja's attacks." } },

    { "name": { "ru": "Каку", "en": "Kaku" }, "pos": "midfielder", "status": "Star", "story": { "ru": "31-летний плеймейкер эмиратского «Аль-Айна» — настоящий кудесник мяча! Забил пенальти в товарищеском матче против Никарагуа (4:0). Его креативность и умение обострять игру — секретное оружие парагвайской атаки.", "en": "The 31-year-old playmaker for Emirati side Al Ain is a true wizard with the ball! He scored a penalty in the friendly against Nicaragua (4-0). His creativity and ability to sharpen the game are the Paraguayan attack's secret weapon." } },

    { "name": { "ru": "Андрес Кубас", "en": "Andrés Cubas" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "29-летний опорный полузащитник канадского «Ванкувер Уайткэпс» из MLS. Его задача — разрушать атаки соперника и начинать свои. Представляет растущее присутствие парагвайцев в североамериканском футболе.", "en": "The 29-year-old defensive midfielder for Canadian MLS side Vancouver Whitecaps. His job is to break up opponent attacks and start his own. Represents the growing Paraguayan presence in North American football." } },

    { "name": { "ru": "Рамон Соса", "en": "Ramón Sosa" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "25-летний полузащитник бразильского «Палмейраса» — один из самых перспективных талантов сборной. Игра в топ-клубе Бразилии закалила его характер и добавила мастерства. Один из ключевых игроков полузащиты «Гуарани».", "en": "The 25-year-old midfielder for Brazilian giants Palmeiras is one of the squad's most promising talents. Playing for a top Brazilian club has hardened his character and added skill. One of the key players in the 'Guaraní' midfield." } },

    { "name": { "ru": "Дамьян Бобадилья", "en": "Damián Bobadilla" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "24-летний полузащитник бразильского «Сан-Паулу» — ещё один представитель топ-клубов Южной Америки. Его энергия и работоспособность в центре поля делают его незаменимым для Альфаро.", "en": "The 24-year-old midfielder for Brazilian giants São Paulo is another representative of South America's top clubs. His energy and work rate in central midfield make him indispensable for Alfaro." } },

    { "name": { "ru": "Брайан Охеда", "en": "Braian Ojeda" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "25-летний полузащитник американского «Орландо Сити» из MLS. После неудачного сезона в английском «Ноттингем Форест» нашёл себя в США. Его опыт в двух разных футбольных культурах делает его универсальным бойцом.", "en": "The 25-year-old midfielder for American MLS side Orlando City. After an unsuccessful season at English Nottingham Forest, he found himself in the USA. His experience in two different football cultures makes him a versatile fighter." } },

    { "name": { "ru": "Матиас Галарса", "en": "Matías Galarza" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "24-летний полузащитник «Атланты Юнайтед» из MLS — партнёр Альмирона по клубу! Забил гол в отборочном матче против Перу (1:0) в сентябре 2025 года. Его гол стал одним из важнейших в квалификации на ЧМ-2026.", "en": "The 24-year-old midfielder for Atlanta United in MLS — Almirón's club teammate! He scored in the qualifying match against Peru (1-0) in September 2025. His goal was one of the most crucial in the 2026 World Cup qualification." } },

    { "name": { "ru": "Маурисио", "en": "Maurício" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний полузащитник бразильского «Палмейраса» — третий представитель этого топ-клуба в заявке! Его включение — это ставка на опыт игры в элитном южноамериканском футболе. Настоящий боец центра поля.", "en": "The 26-year-old midfielder for Brazilian giants Palmeiras is the third representative of this top club in the squad! His inclusion is a bet on experience in elite South American football. A true central midfield fighter." } },

    { "name": { "ru": "Антонио Санабрия", "en": "Antonio Sanabria" }, "pos": "forward", "status": "Star", "story": { "ru": "29-летний нападающий итальянской «Кремонезе» — один из самых опытных форвардов сборной. Забил важнейший гол в товарищеском матче против Мексики (2:1) в ноябре 2025 года. Его хладнокровие в штрафной и умение играть спиной к воротам делают его незаменимым.", "en": "The 29-year-old forward for Italian side Cremonese is one of the squad's most experienced strikers. He scored a crucial goal in the friendly against Mexico (2-1) in November 2025. His composure in the penalty area and ability to play with his back to goal make him indispensable." } },

    { "name": { "ru": "Хулио Энсисо", "en": "Julio Enciso" }, "pos": "forward", "status": "Rising", "story": { "ru": "22-летний вундеркинд французского «Страсбурга» — одна из главных надежд парагвайского футбола! Его техника, скорость и дриблинг создают проблемы для любой обороны. Именно его ФИФА назвала в числе главных звёзд заявки «Альбиррохи».", "en": "The 22-year-old wonderkid for French side Strasbourg is one of Paraguayan football's biggest hopes! His technique, speed, and dribbling cause problems for any defence. FIFA himself named him among the Albirroja's headline stars." } },

    { "name": { "ru": "Габриэль Авалос", "en": "Gabriel Ávalos" }, "pos": "forward", "status": "Squad", "story": { "ru": "25-летний нападающий аргентинского «Индепендьенте» — один из самых горячих форвардов Южной Америки. Его включение в состав — это ставка на молодость и голод до голов. Представляет новое поколение парагвайских нападающих.", "en": "The 25-year-old forward for Argentine side Independiente is one of South America's hottest strikers. His inclusion is a bet on youth and hunger for goals. Represents the new generation of Paraguayan forwards." } },

    { "name": { "ru": "Алекс Арсе", "en": "Álex Arce" }, "pos": "forward", "status": "Squad", "story": { "ru": "28-летний нападающий аргентинского «Индепендьенте Ривадавия» — ещё один представитель аргентинского футбола в заявке. Забил гол в товарищеском матче против США (1:2) в ноябре 2025 года. Его мощь и игра в воздухе делают его опасным оружием.", "en": "The 28-year-old forward for Argentine side Independiente Rivadavia is another representative of Argentine football in the squad. He scored in the friendly against the USA (1-2) in November 2025. His power and aerial ability make him a dangerous weapon." } },

    { "name": { "ru": "Исидро Питта", "en": "Isidro Pitta" }, "pos": "forward", "status": "Squad", "story": { "ru": "27-летний нападающий бразильского «Ред Булл Брагантино» — представитель элитного бразильского футбола. Его скорость и умение играть в контратаках идеально вписываются в тактику Альфаро. Один из самых опасных форвардов сборной.", "en": "The 27-year-old forward for Brazilian elite side Red Bull Bragantino is a representative of elite Brazilian football. His speed and ability to play counterattacks fit perfectly into Alfaro's tactics. One of the squad's most dangerous forwards." } },

    { "name": { "ru": "Густаво Кабальеро", "en": "Gustavo Caballero" }, "pos": "forward", "status": "Rising", "story": { "ru": "23-летний нападающий английского «Портсмута» — единственный представитель английского Чемпионшипа в заявке! Забил гол в товарищеском матче против Марокко (1:2) в марте 2026 года. Его молодость и амбиции — это будущее парагвайской атаки.", "en": "The 23-year-old forward for English Championship side Portsmouth is the only representative of the English second tier in the squad! He scored in the friendly against Morocco (1-2) in March 2026. His youth and ambition are the future of the Paraguayan attack." } }
  ]
},
"AUS": {
  "desc": {
   "ru": "«Socceroos» — это воля к победе. Представители Пятого континента славятся своим несгибаемым характером и физической мощью. Они не сдаются, превращая каждый матч в битву, и готовы доказать, что австралийский футбол способен покорять мировые вершины.",
   "en": "The Socceroos are the personification of the will to win. Representatives of the Fifth Continent are famous for their unyielding character and physical power. They never give up, turning every match into a battle, and are ready to prove that Australian football is capable of conquering world peaks."
  },
  "coaches": [{ "name": { "ru": "Тони Попович", "en": "Tony Popovic" }, "story": { "ru": "Легенда австралийского футбола, возглавивший «Socceroos» в ходе отбора к ЧМ-2026.", "en": "Australian football legend who took charge of the Socceroos during the WC 2026 qualifying campaign." }, "image": "https://placehold.co/300x300?text=Tony+Popovic" }],
  "players": [
    { "name": { "ru": "Мэтью Райан", "en": "Mathew Ryan" }, "pos": "goalkeeper", "status": "Captain", "story": { "ru": "Опытный вратарь, ставший стеной для своей сборной на многих турнирах.", "en": "Experienced goalkeeper who has been a wall for his national team in many tournaments." } },

    { "name": { "ru": "Пол Иццо", "en": "Paul Izzo" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "31-летний вратарь датского «Раннерса» — надёжный дублёр Райана. Прошёл через австралийскую А-лигу, прежде чем покорить скандинавский футбол. Его реакция и игра на выходах делают его ценным резервистом.", "en": "The 31-year-old goalkeeper for Danish side Randers is a reliable backup to Ryan. He navigated through Australia's A-League before conquering Scandinavian football. His reflexes and command of the area make him a valuable reserve." } },

    { "name": { "ru": "Патрик Бич", "en": "Patrick Beach" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "22-летний вундеркинд «Мельбурн Сити» — один из пяти игроков внутреннего чемпионата в заявке! Представляет новое поколение австралийских голкиперов, которые не боятся конкурировать с ветеранами.", "en": "A 22-year-old wonderkid for Melbourne City — one of five domestic league players in the squad! Represents the new generation of Australian goalkeepers who aren't afraid to compete with veterans." } },

    { "name": { "ru": "Азиз Бехич", "en": "Aziz Behich" }, "pos": "defender", "status": "Star", "story": { "ru": "35-летний ветеран «Мельбурн Сити» — один из самых опытных игроков сборной с 90+ матчами! Универсал, способный закрыть любой фланг защиты. Его лидерство и опыт незаменимы для молодой обороны «Socceroos».", "en": "The 35-year-old Melbourne City veteran is one of the squad's most experienced players with 90+ caps! A versatile defender capable of covering any flank. His leadership and experience are invaluable for the young Socceroos defence." } },

    { "name": { "ru": "Джордан Бос", "en": "Jordan Bos" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний защитник нидерландского «Фейеноорда» — один из самых перспективных талантов австралийского футбола! Его переход в топ-клуб Эредивизи стал прорывом. Теперь он едет на чемпионат мира — мечта любого футболиста.", "en": "A 23-year-old defender for Dutch giants Feyenoord — one of Australian football's most promising talents! His move to a top Eredivisie club was a breakthrough. Now he's heading to the World Cup — every footballer's dream." } },

    { "name": { "ru": "Кэмерон Берджесс", "en": "Cameron Burgess" }, "pos": "defender", "status": "Squad", "story": { "ru": "28-летний защитник английского «Суонси Сити» из Чемпионшипа. Прошёл через академию «Фулхэма», но пробился в большой футбол через аренду и упорный труд. 30+ матчей за сборную — надёжный центральный защитник.", "en": "A 28-year-old defender for English Championship side Swansea City. He came through Fulham's academy but broke into top football through loans and hard work. 30+ caps for the national team — a reliable centre-back." } },

    { "name": { "ru": "Алессандро Чиркати", "en": "Alessandro Circati" }, "pos": "defender", "status": "Rising", "story": { "ru": "22-летний центральный защитник итальянской «Пармы» из Серии А! Один из самых молодых игроков в заявке, но уже выступает в одном из топ-чемпионатов Европы. Его техника и чтение игры — будущее австралийской обороны.", "en": "A 22-year-old centre-back for Italian Serie A side Parma! One of the youngest players in the squad but already playing in one of Europe's top leagues. His technique and reading of the game are the future of Australian defence." } },

    { "name": { "ru": "Милош Дегенек", "en": "Miloš Degenek" }, "pos": "defender", "status": "Star", "story": { "ru": "31-летний защитник кипрского АПОЭЛа — ветеран сборной с 60+ матчами. Родился в Хорватии, но вырос в Австралии и выбрал «Socceroos». Прошёл через сербский футбол, японскую Джей-лигу и теперь закаляет себя на Кипре. Настоящий боец с международным опытом.", "en": "The 31-year-old defender for Cypriot APOEL is a national team veteran with 60+ caps. Born in Croatia but raised in Australia, he chose the Socceroos. He's navigated through Serbian football, Japan's J-League, and now toughens himself in Cyprus. A true fighter with international experience." } },

    { "name": { "ru": "Джон Гериа", "en": "John Geria" }, "pos": "defender", "status": "Squad", "story": { "ru": "30-летний защитник японского «Альбирекс Ниигата» — единственный представитель Джей-лиги в заявке! Его решение играть в Японии добавило ему тактической мудрости и дисциплины. Один из самых стабильных правых защитников сборной.", "en": "The 30-year-old defender for Japanese side Albirex Niigata is the only J-League representative in the squad! His decision to play in Japan added tactical wisdom and discipline. One of the most reliable right-backs in the national team." } },

    { "name": { "ru": "Лукас Херрингтон", "en": "Lucas Herrington" }, "pos": "defender", "status": "Rising", "story": { "ru": "21-летний вундеркинд американского «Колорадо Рэпидз» из MLS — один из самых молодых защитников в заявке! Его переход в североамериканский футбол стал смелым шагом. Теперь он едет на чемпионат мира — настоящая австралийская история успеха.", "en": "A 21-year-old wonderkid for American MLS side Colorado Rapids — one of the youngest defenders in the squad! His move to North American football was a bold step. Now he's heading to the World Cup — a true Australian success story." } },

    { "name": { "ru": "Луиджи Итальяно", "en": "Luigi Italiano" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний защитник австрийского «Грацера» — представитель австрийского футбола в заявке. Его включение — это ставка на опыт игры в европейском футболе. Универсал, способный закрыть несколько позиций в обороне.", "en": "The 27-year-old defender for Austrian side Grazer AK is a representative of Austrian football in the squad. His inclusion is a bet on experience in European football. A versatile defender capable of covering multiple positions." } },

    { "name": { "ru": "Гарри Сауттар", "en": "Harry Souttar" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний гигант (198 см) английского «Лестер Сити» — настоящая башня в обороне «Socceroos»! Его рост и мощь делают его кошмаром для нападающих на стандартах. 40+ матчей за сборную, один из ключевых защитников команды.", "en": "The 27-year-old giant (198 cm) of English side Leicester City is a true tower in the Socceroos defence! His height and power make him a nightmare for strikers on set pieces. 40+ caps for the national team, one of the key defenders." } },

    { "name": { "ru": "Бен Трюин", "en": "Ben Trewin" }, "pos": "defender", "status": "Squad", "story": { "ru": "26-летний защитник американского «Нью-Йорк Сити» из MLS. Прошёл через австралийскую А-лигу, прежде чем покорить североамериканский футбол. Его скорость и техника делают его современным фланговым защитником.", "en": "A 26-year-old defender for American MLS side New York City FC. He navigated through Australia's A-League before conquering North American football. His pace and technique make him a modern full-back." } },

    { "name": { "ru": "Кенни Девлин", "en": "Kenny Devlin" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "28-летний полузащитник шотландского «Харт оф Мидлотиан» — представитель шотландского футбола в заявке. Его энергия и работоспособность в центре поля делают его незаменимым для Поповича. 25+ матчей за сборную.", "en": "The 28-year-old midfielder for Scottish side Heart of Midlothian is a representative of Scottish football in the squad. His energy and work rate in central midfield make him indispensable for Popovic. 25+ caps for the national team." } },

    { "name": { "ru": "Айдин Хрустич", "en": "Ajdin Hrustic" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний плеймейкер нидерландского «Гераклеса Алмело» — один из самых техничных игроков сборной! Прошёл через немецкую Бундеслигу («Айнтрахт Франкфурт»), итальянскую Серию А («Верона») и теперь играет в Эредивизи. Его видение поля и пасы — секретное оружие «Socceroos».", "en": "The 29-year-old playmaker for Dutch side Heracles Almelo is one of the squad's most technical players! He's navigated through the German Bundesliga (Eintracht Frankfurt), Italian Serie A (Hellas Verona), and now plays in the Eredivisie. His vision and passing are the Socceroos' secret weapon." } },

    { "name": { "ru": "Джексон Ирвайн", "en": "Jackson Irvine" }, "pos": "midfielder", "status": "Star", "story": { "ru": "32-летний полузащитник немецкой «Санкт-Паули» из Бундеслиги — один из ключевых игроков сборной! Его опыт игры в топ-чемпионатах Европы (Англия, Шотландия, Германия) делает его лидером полузащиты. 70+ матчей за «Socceroos», настоящий ветеран.", "en": "The 32-year-old midfielder for German Bundesliga side FC St. Pauli is one of the national team's key players! His experience in Europe's top leagues (England, Scotland, Germany) makes him a midfield leader. 70+ caps for the Socceroos, a true veteran." } },

    { "name": { "ru": "Киран Меткалф", "en": "Kieran Metcalfe" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "25-летний полузащитник немецкой «Санкт-Паули» — партнёр Ирвайна по клубу! Его включение в состав — это ставка на молодость и энергию. Представляет новое поколение австралийских полузащитников, готовых покорять Европу.", "en": "The 25-year-old midfielder for German Bundesliga side FC St. Pauli — Irvine's club teammate! His inclusion is a bet on youth and energy. Represents the new generation of Australian midfielders ready to conquer Europe." } },

    { "name": { "ru": "Пол Окон-Энглстер", "en": "Paul Okon-Englster" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "21-летний вундеркинд австралийского «Сиднея» — один из пяти игроков внутреннего чемпионата в заявке! Сын легенды австралийского футбола Пола Окона. Его техника и креативность — будущее «Socceroos».", "en": "A 21-year-old wonderkid for Australian side Sydney FC — one of five domestic league players in the squad! Son of Australian football legend Paul Okon. His technique and creativity are the future of the Socceroos." } },

    { "name": { "ru": "Райли О'Нилл", "en": "Riley O'Neill" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "26-летний полузащитник американского «Нью-Йорк Сити» из MLS. Прошёл через австралийскую академию, прежде чем покорить североамериканский футбол. Его универсальность позволяет играть на разных позициях в полузащите.", "en": "A 26-year-old midfielder for American MLS side New York City FC. He came through an Australian academy before conquering North American football. His versatility allows him to play multiple midfield positions." } },

    { "name": { "ru": "Нестори Иранкунда", "en": "Nestory Irankunda" }, "pos": "forward", "status": "Star", "story": { "ru": "20-летняя суперзвезда английского «Уотфорда»! Прошёл через «Баварию», но не пробился в основу и перешёл в Чемпионшип. Забил в своём втором матче за сборную, став вторым самым молодым бомбардиром в истории Австралии (18 лет). 5 голов в 13 матчах — будущее австралийского футбола уже здесь!", "en": "A 20-year-old superstar for English side Watford! He came through Bayern Munich but struggled for first-team minutes and moved to the Championship. He scored in his second match for the national team, becoming Australia's second-youngest goalscorer ever (18 years old). 5 goals in 13 caps — the future of Australian football is already here!" } },

    { "name": { "ru": "Мэтью Леки", "en": "Mathew Leckie" }, "pos": "forward", "status": "Star", "story": { "ru": "34-летний ветеран «Мельбурн Сити» — один из самых опытных игроков сборной с 75+ матчами! Прошёл через немецкую Бундеслигу («Боруссия Мёнхенгладбах») и вернулся домой. Его скорость и опыт незаменимы для молодой атаки «Socceroos».", "en": "The 34-year-old Melbourne City veteran is one of the squad's most experienced players with 75+ caps! He navigated through the German Bundesliga (Borussia Mönchengladbach) before returning home. His pace and experience are invaluable for the young Socceroos attack." } },

    { "name": { "ru": "Авер Мабиль", "en": "Awer Mabil" }, "pos": "forward", "status": "Squad", "story": { "ru": "30-летний вингер испанского «Кастельона» из Сегунды. Родился в лагере беженцев в Кении, вырос в Австралии — его история вдохновляет! 40+ матчей за сборную, его скорость и дриблинг создают проблемы для любой обороны.", "en": "The 30-year-old winger for Spanish Segunda side Castellón. Born in a refugee camp in Kenya, raised in Australia — his story is inspiring! 40+ caps for the national team, his pace and dribbling cause problems for any defence." } },

    { "name": { "ru": "Мохамед Туре", "en": "Mohamed Toure" }, "pos": "forward", "status": "Rising", "story": { "ru": "21-летний нападающий английского «Норвич Сити» из Чемпионшипа — один из самых перспективных молодых форвардов Австралии! Его включение в состав — это ставка на будущее. Представляет новое поколение австралийских нападающих.", "en": "A 21-year-old forward for English Championship side Norwich City — one of Australia's most promising young strikers! His inclusion is a bet on the future. Represents the new generation of Australian forwards." } },

    { "name": { "ru": "Нишан Велупиллей", "en": "Nishan Velupillay" }, "pos": "forward", "status": "Rising", "story": { "ru": "23-летний вингер «Мельбурн Сити» — один из пяти игроков внутреннего чемпионата в заявке! Его скорость и техника делают его опасным оружием в контратаках. Представляет растущее качество австралийской А-лиги.", "en": "A 23-year-old winger for Melbourne City — one of five domestic league players in the squad! His pace and technique make him a dangerous weapon in counterattacks. Represents the growing quality of Australia's A-League." } },

    { "name": { "ru": "Кристиан Вольпато", "en": "Cristian Volpato" }, "pos": "forward", "status": "Star", "story": { "ru": "22-летний плеймейкер итальянского «Сассуоло» из Серии В! Прошёл через академию «Ромы», но не пробился в основу. Его техника и видение поля делают его дирижёром атак «Socceroos». Один из самых талантливых игроков сборной.", "en": "A 22-year-old playmaker for Italian Serie B side Sassuolo! He came through Roma's academy but struggled for first-team minutes. His technique and vision make him the conductor of the Socceroos' attacks. One of the squad's most talented players." } },

    { "name": { "ru": "Джейсон Енги", "en": "Jason Yengi" }, "pos": "forward", "status": "Squad", "story": { "ru": "26-летний нападающий с уникальной историей: играет одновременно за шотландский «Ливингстон» и японскую «Мачида Зельвия»! Его включение в состав — это ставка на универсальность и опыт игры в двух разных футбольных культурах.", "en": "A 26-year-old forward with a unique story: he plays simultaneously for Scottish side Livingston and Japanese Machida Zelvia! His inclusion is a bet on versatility and experience in two different football cultures." } }
  ]
},
"TUR": {
  "desc": {
    "ru": "Сборная Турции — океан эмоций и вулкан таланта. Команда, способная на  невероятные камбэки и яркие прорывы. Поддержка их болельщиков ощущается в любой точке мира, вдохновляя игроков на подвиги, которые заставляют всю Европу и Азию говорить о турецком футболе.",
    "en": "The Turkish national team is an ocean of emotions and a volcano of talent. A team capable of the most incredible comebacks and brilliant breakthroughs. The support of their passionate fans is felt anywhere in the world, inspiring players to feats that make all of Europe and Asia talk about Turkish football."
  },
  "coaches": [{ "name": { "ru": "Винченцо Монтелла", "en": "Vincenzo Montella" }, "story": { "ru": "Итальянский «Аэроплан», прививший турецкой сборной дисциплину и современный тактический рисунок.", "en": "The Italian 'Aeroplanino' who brought discipline and a modern tactical pattern to the Turkish team." }, "image": "https://placehold.co/300x300?text=Vincenzo+Montella" }],
  "players": [
    { "name": { "ru": "Хакан Чалханоглу", "en": "Hakan Çalhanoğlu" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Мастер стандартных положений и один из лучших плеймейкеров Европы.", "en": "Set-piece master and one of the best playmakers in Europe." } },
    { "name": { "ru": "Арда Гюлер", "en": "Arda Güler" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Юный гений из мадридского «Реала», будущее турецкого футбола.", "en": "Young genius from Real Madrid, the future of Turkish football." } },

    { "name": { "ru": "Алтай Байындыр", "en": "Altay Bayındır" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "28-летний вратарь английского «Манчестер Юнайтед» — первый турецкий голкипер в истории Премьер-лиги! Прошёл через академию «Фенербахче», прежде чем покорить английский футбол. Его реакция и игра на линии ворот делают его одним из самых перспективных стражей ворот Европы.", "en": "The 28-year-old goalkeeper for English side Manchester United — the first Turkish goalkeeper in Premier League history! He came through Fenerbahçe's academy before conquering English football. His reflexes and shot-stopping make him one of Europe's most promising goalkeepers." } },

    { "name": { "ru": "Мерт Гюнок", "en": "Mert Günok" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "37-летний ветеран «Фенербахче» — настоящая легенда турецкого футбола! 90+ матчей за сборную, участник Евро-2008 (где Турция дошла до полуфинала) и Евро-2016. Его опыт и лидерство незаменимы для молодой смены. Один из самых титулованных вратарей в истории страны.", "en": "The 37-year-old Fenerbahçe veteran is a true Turkish football legend! 90+ caps for the national team, participant in Euro 2008 (where Turkey reached the semifinals) and Euro 2016. His experience and leadership are invaluable for the young generation. One of the most decorated goalkeepers in the country's history." } },

    { "name": { "ru": "Угурджан Чакыр", "en": "Uğurcan Çakır" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "29-летний вратарь «Галатасарая» — один из самых стабильных голкиперов Турции! Прошёл через академию «Трабзонспора», где стал основным вратарём в 21 год. 40+ матчей за сборную, его уверенность на линии ворот и игра ногами делают его современным стражем.", "en": "The 29-year-old Galatasaray goalkeeper is one of Turkey's most reliable shot-stoppers! He came through Trabzonspor's academy, becoming the first-choice keeper at 21. 40+ caps for the national team, his confidence between the posts and distribution with his feet make him a modern goalkeeper." } },

    { "name": { "ru": "Абдюлькерим Бардакджи", "en": "Abdülkerim Bardakcı" }, "pos": "defender", "status": "Rising", "story": { "ru": "28-летний центральный защитник «Галатасарая» — один из самых перспективных талантов турецкого футбола! Его мощь и чтение игры делают его кошмаром для нападающих. 20+ матчей за сборную, будущий лидер обороны «лунных звёзд».", "en": "The 28-year-old Galatasaray centre-back is one of Turkish football's most promising talents! His power and reading of the game make him a nightmare for strikers. 20+ caps for the national team, a future leader of the 'Crescent Stars' defence." } },

    { "name": { "ru": "Чаглар Сеюнджю", "en": "Çağlar Söyüncü" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний защитник «Фенербахче» — настоящий боец с характером! Прошёл через английскую Премьер-лигу («Лестер Сити», 150+ матчей), испанский «Атлетико Мадрид» и теперь вернулся домой. 60+ матчей за сборную, его физическая мощь и лидерство незаменимы.", "en": "The 29-year-old Fenerbahçe defender is a true fighter with character! He navigated through the English Premier League (Leicester City, 150+ matches), Spanish Atlético Madrid, and now returned home. 60+ caps for the national team, his physical power and leadership are invaluable." } },

    { "name": { "ru": "Эврен Эльмали", "en": "Evren Elmalı" }, "pos": "defender", "status": "Squad", "story": { "ru": "26-летний защитник «Галатасарая» — универсал, способный закрыть любой фланг обороны! Его скорость и техника делают его современным фланговым защитником. Один из самых стабильных игроков турецкого чемпионата, теперь едет на свой первый мундиаль.", "en": "The 26-year-old Galatasaray defender is a versatile player capable of covering any defensive flank! His pace and technique make him a modern full-back. One of the most consistent players in the Turkish league, now heading to his first World Cup." } },

    { "name": { "ru": "Ферди Кадиоглу", "en": "Ferdi Kadıoğlu" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний левый защитник английского «Брайтона» — один из самых быстрых игроков сборной! Родился в Нидерландах, но выбрал Турцию. Прошёл через академию «Фейеноорда» и теперь покоряет Премьер-лигу. Его скорость и дриблинг создают проблемы для любой обороны.", "en": "The 26-year-old left-back for English side Brighton is one of the squad's fastest players! Born in the Netherlands but chose Turkey. He came through Feyenoord's academy and now conquers the Premier League. His pace and dribbling cause problems for any defence." } },

    { "name": { "ru": "Мерих Демирал", "en": "Merih Demiral" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний центральный защитник саудовского «Аль-Ахли» — настоящий генерал обороны! Прошёл через итальянскую Серию А («Ювентус», «Аталанта»), немецкую Бундеслигу и теперь закаляет себя на Ближнем Востоке. 50+ матчей за сборную, его рост и мощь делают его башней в штрафной.", "en": "The 28-year-old centre-back for Saudi side Al Ahli is a true defensive general! He navigated through Italian Serie A (Juventus, Atalanta), the German Bundesliga, and now toughens himself in the Middle East. 50+ caps for the national team, his height and power make him a tower in the penalty area." } },

    { "name": { "ru": "Мерт Мюльдюр", "en": "Mert Müldür" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний правый защитник «Фенербахче» — представитель одного из грандов турецкого футбола! Прошёл через итальянскую Серию А («Сассуоло») и теперь вернулся домой. Его опыт игры в Европе добавил ему тактической мудрости. 30+ матчей за сборную.", "en": "The 27-year-old right-back for Fenerbahçe is a representative of one of Turkish football's giants! He navigated through Italian Serie A (Sassuolo) and now returned home. His European experience added tactical wisdom. 30+ caps for the national team." } },

    { "name": { "ru": "Озан Кабак", "en": "Ozan Kabak" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний центральный защитник немецкого «Хоффенхайма» — один из самых перспективных талантов! Прошёл через «Штутгарт», английские «Норвич» и «Шальке», и теперь играет в Бундеслиге. Его техника и чтение игры делают его одним из лучших молодых защитников Европы.", "en": "The 26-year-old centre-back for German side Hoffenheim is one of the most promising talents! He came through Stuttgart, English Norwich and Schalke, and now plays in the Bundesliga. His technique and reading of the game make him one of Europe's best young defenders." } },

    { "name": { "ru": "Самет Акайдин", "en": "Samet Akaydın" }, "pos": "defender", "status": "Squad", "story": { "ru": "31-летний защитник «Ризеспора» — ветеран турецкого футбола с богатым опытом! Прошёл через множество клубов, прежде чем стать основным защитником. Его лидерство и опыт незаменимы для молодой обороны. 15+ матчей за сборную.", "en": "The 31-year-old Rizespor defender is a Turkish football veteran with rich experience! He navigated through multiple clubs before becoming a mainstay defender. His leadership and experience are invaluable for the young defence. 15+ caps for the national team." } },

    { "name": { "ru": "Зеки Челик", "en": "Zeki Çelik" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний правый защитник итальянской «Ромы» — один из самых стабильных игроков сборной! Прошёл через французскую Лигу 1 («Лилль»), где выиграл чемпионство в 2021 году, и теперь играет в Серии А. 50+ матчей за сборную, его скорость и кроссы — оружие «лунных звёзд».", "en": "The 29-year-old right-back for Italian side Roma is one of the squad's most reliable players! He came through French Ligue 1 (Lille), where he won the championship in 2021, and now plays in Serie A. 50+ caps for the national team, his pace and crosses are the Crescent Stars' weapon." } },

    { "name": { "ru": "Исмаил Юксек", "en": "İsmail Yüksek" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "26-летний полузащитник «Фенербахче» — один из самых энергичных игроков сборной! Его работоспособность и умение разрушать атаки соперника делают его незаменимым для Монтеллы. 20+ матчей за сборную, будущий лидер полузащиты.", "en": "The 26-year-old Fenerbahçe midfielder is one of the squad's most energetic players! His work rate and ability to break up opponent attacks make him indispensable for Montella. 20+ caps for the national team, a future midfield leader." } },

    { "name": { "ru": "Каан Айхан", "en": "Kaan Ayhan" }, "pos": "midfielder", "status": "Star", "story": { "ru": "30-летний универсал «Галатасарая» — настоящий боец с характером! Способен играть как в полузащите, так и в обороне. Прошёл через немецкую Бундеслигу («Фортуна Дюссельдорф», «Шальке») и теперь вернулся домой. 60+ матчей за сборную, его опыт бесценен.", "en": "The 30-year-old Galatasaray utility player is a true fighter with character! Capable of playing both in midfield and defence. He navigated through the German Bundesliga (Fortuna Düsseldorf, Schalke) and now returned home. 60+ caps for the national team, his experience is invaluable." } },

    { "name": { "ru": "Оркун Кекчю", "en": "Orkun Kökçü" }, "pos": "midfielder", "status": "Star", "story": { "ru": "25-летний плеймейкер «Бешикташа» — один из самых техничных игроков сборной! Прошёл через нидерландский «Фейеноорд» и португальскую «Бенфику», прежде чем вернуться в Турцию. Его видение поля и пасы — секретное оружие «лунных звёзд». 40+ матчей за сборную.", "en": "The 25-year-old Beşiktaş playmaker is one of the squad's most technical players! He came through Dutch Feyenoord and Portuguese Benfica before returning to Turkey. His vision and passing are the Crescent Stars' secret weapon. 40+ caps for the national team." } },

    { "name": { "ru": "Салих Озджан", "en": "Salih Özcan" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "27-летний опорный полузащитник немецкой «Боруссии Дортмунд» — представитель элитного европейского футбола! Прошёл через «Кёльн» и теперь играет в Бундеслиге. Его тактическая мудрость и умение начинать атаки делают его незаменимым. 15+ матчей за сборную.", "en": "The 27-year-old defensive midfielder for German giants Borussia Dortmund is a representative of elite European football! He came through Köln and now plays in the Bundesliga. His tactical wisdom and ability to start attacks make him indispensable. 15+ caps for the national team." } },

    { "name": { "ru": "Барыш Йылмаз", "en": "Barış Alper Yılmaz" }, "pos": "forward", "status": "Star", "story": { "ru": "26-летний вингер «Галатасарая» — один из самых ярких талантов турецкого футбола! Его скорость и дриблинг создают проблемы для любой обороны. Прошёл через «Анкарагюджю» и теперь стал звездой «Галатасарая». 30+ матчей за сборную, будущее атаки «лунных звёзд».", "en": "The 26-year-old Galatasaray winger is one of Turkish football's brightest talents! His pace and dribbling cause problems for any defence. He came through Ankaragücü and now became a Galatasaray star. 30+ caps for the national team, the future of the Crescent Stars' attack." } },

    { "name": { "ru": "Джан Узун", "en": "Can Uzun" }, "pos": "forward", "status": "Rising", "story": { "ru": "20-летний вундеркинд немецкого «Айнтрахта» — одна из главных надежд турецкого футбола! Его техника и видение поля делают его дирижёром атак. Самый молодой игрок в заявке, но уже 10+ матчей за сборную. Будущее турецкого футбола уже здесь!", "en": "The 20-year-old wonderkid for German side Eintracht Frankfurt is one of Turkish football's biggest hopes! His technique and vision make him the conductor of attacks. The youngest player in the squad but already 10+ caps. The future of Turkish football is already here!" } },

    { "name": { "ru": "Дениз Гюль", "en": "Deniz Gül" }, "pos": "forward", "status": "Rising", "story": { "ru": "22-летний нападающий португальского «Порту» — представитель элитного европейского футбола! Прошёл через турецкие клубы, прежде чем покорить Португалию. Его мощь и игра в штрафной делают его опасным оружием. 15+ матчей за сборную.", "en": "The 22-year-old forward for Portuguese giants Porto is a representative of elite European football! He came through Turkish clubs before conquering Portugal. His power and penalty area play make him a dangerous weapon. 15+ caps for the national team." } },

    { "name": { "ru": "Ирфан Кахведжи", "en": "İrfan Can Kahveci" }, "pos": "forward", "status": "Star", "story": { "ru": "30-летний вингер «Касымпаши» — ветеран сборной с богатым опытом! Прошёл через «Фенербахче» и «Истанбул Башакшехир», где стал одним из лучших бомбардиров. 50+ матчей за сборную, его опыт и хладнокровие незаменимы для молодой атаки.", "en": "The 30-year-old Kasımpaşa winger is a national team veteran with rich experience! He came through Fenerbahçe and İstanbul Başakşehir, where he became one of the top scorers. 50+ caps for the national team, his experience and composure are invaluable for the young attack." } },

    { "name": { "ru": "Кенан Йылдыз", "en": "Kenan Yıldız" }, "pos": "forward", "status": "Star", "story": { "ru": "21-летняя суперзвезда итальянского «Ювентуса» — один из самых талантливых молодых игроков Европы! Прошёл через академию «Баварии», но выбрал «Ювентус». Его техника и дриблинг сравнивают с Месси. 15+ матчей за сборную, будущее турецкого футбола.", "en": "The 21-year-old Juventus superstar is one of Europe's most talented young players! He came through Bayern Munich's academy but chose Juventus. His technique and dribbling are compared to Messi. 15+ caps for the national team, the future of Turkish football." } },

    { "name": { "ru": "Керем Актюркоглу", "en": "Kerem Aktürkoğlu" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний вингер «Фенербахче» — один из самых ярких игроков сборной! Прошёл через «Галатасарай» и португальскую «Бенфику», прежде чем вернуться домой. Его скорость и дриблинг создают проблемы для любой обороны. 40+ матчей за сборную, настоящая звезда.", "en": "The 27-year-old Fenerbahçe winger is one of the squad's brightest players! He came through Galatasaray and Portuguese Benfica before returning home. His pace and dribbling cause problems for any defence. 40+ caps for the national team, a true star." } },

    { "name": { "ru": "Огуз Айдын", "en": "Oğuz Aydın" }, "pos": "forward", "status": "Squad", "story": { "ru": "25-летний нападающий «Фенербахче» — представитель одного из грандов турецкого футбола! Его мощь и игра в воздухе делают его опасным оружием на стандартах. 10+ матчей за сборную, его голод до голов делает его незаменимым.", "en": "The 25-year-old Fenerbahçe forward is a representative of one of Turkish football's giants! His power and aerial ability make him a dangerous weapon on set pieces. 10+ caps for the national team, his hunger for goals makes him indispensable." } },

    { "name": { "ru": "Юнус Акгюн", "en": "Yunus Akgün" }, "pos": "forward", "status": "Rising", "story": { "ru": "24-летний вингер «Галатасарая» — один из самых перспективных талантов! Прошёл через академию клуба и теперь стал основным игроком. Его техника и креативность делают его дирижёром атак. 15+ матчей за сборную, будущее турецкого футбола.", "en": "The 24-year-old Galatasaray winger is one of the most promising talents! He came through the club's academy and now became a mainstay player. His technique and creativity make him the conductor of attacks. 15+ caps for the national team, the future of Turkish football." } }

"CUW": {
  "desc": {
    "ru": "Кюрасао — жемчужина Карибского моря, стремительно ворвавшаяся в мировую элиту. Используя опыт игроков из ведущих европейских лиг и голландскую футбольную школу, они создали команду с ярким стилем и огромным потенциалом. Это новая сила, с которой придется считаться!",

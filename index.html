    { "name": { "ru": "Пэ Джун Хо", "en": "Bae Jun-ho" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Дерзкий молодой талант, покоривший английский Чемпионшип. Его скорость, нахальство и умение играть один в один — это то самое новое поколение корейского футбола, которое не боится авторитетов.", "en": "A bold young talent who has conquered the English Championship. His speed, audacity, and ability to play one-on-one are that very new generation of Korean football that is not afraid of authorities." }, "image": "https://placehold.co/300x300?text=Bae+Jun-ho" },
    { "name": { "ru": "Ли Джэ Сон", "en": "Lee Jae-sung" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Неутомимый двигатель на правом фланге полузащиты. Его работоспособность и прессинг — фундамент корейской игры. Игрок, который выкладывается на поле на 100%.", "en": "A tireless engine on the right flank of the midfield. His work rate and pressing are the foundation of the Korean game. A player who gives 100% on the pitch." }, "image": "https://placehold.co/300x300?text=Lee+Jae-sung" },
    { "name": { "ru": "Ян Хён Джун", "en": "Yang Hyun-jun" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Молния на левом крыле. Его взрывная скорость и дриблинг на огромных скоростях сводят с ума защитников. Когда он разгоняется, у соперников остается только один шанс — сфолить.", "en": "The lightning bolt on the left wing. His explosive speed and dribbling at huge speeds drive defenders crazy. When he accelerates, the opponents have only one chance — to foul." }, "image": "https://placehold.co/300x300?text=Yang+Hyun-jun" },
    { "name": { "ru": "Хван Хи Чхан", "en": "Hwang Hee-chan" }, "pos": "forward", "status": "Star", "story": { "ru": "Хищник штрафной площади. Звезда «Вулверхэмптона» обладает невероятным чутьем на голы и умением открыться в свободные зоны. Его рывки за спину защитникам — постоянная угроза для любых ворот.", "en": "A predator of the penalty area. The Wolverhampton star possesses an incredible instinct for goals and the ability to find free zones. His runs behind the defenders are a constant threat to any goal." }, "image": "https://placehold.co/300x300?text=Hwang+Hee-chan" },
    { "name": { "ru": "О Хён Гю", "en": "Oh Hyeon-gyu" }, "pos": "forward", "status": "Starter", "story": { "ru": "Мощный таран из «Селтика». Его физическая мощь и игра на втором этаже — план «Б» для взлома глухой обороны. Неуступчивый в борьбе и всегда готовый подставить ногу под передачу.", "en": "A powerful battering ram from Celtic. His physical strength and aerial game are plan 'B' for breaking down a stubborn defense. Unyielding in combat and always ready to meet a cross." }, "image": "https://placehold.co/300x300?text=Oh+Hyeon-gyu" },
    { "name": { "ru": "Чо Гю Сон", "en": "Cho Gue-sung" }, "pos": "forward", "status": "Starter", "story": { "ru": "Классический форвард-целеустремитель. Его рост и прыгучесть делают его главным оружием на стандартах. Настоящий воздушный десант, способный снять мяч с любой высоты.", "en": "A classic target man. His height and jumping ability make him the main weapon on set pieces. A real airborne assault capable of taking the ball from any height." }, "image": "https://placehold.co/300x300?text=Cho+Gue-sung" },
    { "name": { "ru": "Чу Мин Гю", "en": "Joo Min-kyu" }, "pos": "forward", "status": "Starter", "story": { "ru": "Хладнокровный снайпер корейской лиги. Его инстинкт убийцы в штрафной и поставленный удар делают его опаснейшим оружием при выходах на замену. Мастер завершать то, что создали полузащитники.", "en": "A clinical sniper of the Korean league. His killer instinct in the box and set shot make him the most dangerous weapon when coming off the bench. A master of finishing what the midfielders created." }, "image": "https://placehold.co/300x300?text=Joo+Min-kyu" },
    { "name": { "ru": "Ли Дон Джун", "en": "Lee Dong-jun" }, "pos": "forward", "status": "Starter", "story": { "ru": "Юркий и непредсказуемый вингер. Его низкий центр тяжести и сумасшедшая работа с мячом позволяют ему обыгрывать один в один кого угодно. Настоящий кошмар для неповоротливых защитников.", "en": "A nimble and unpredictable winger. His low center of gravity and crazy ball control allow him to beat anyone one-on-one. A real nightmare for sluggish defenders." }, "image": "https://placehold.co/300x300?text=Lee+Dong-jun" },
    { "name": { "ru": "О Се Хун", "en": "Oh Se-hun" }, "pos": "forward", "status": "Reserve", "story": { "ru": "Высокий и техничный нападающий. Его умение зацепиться за мяч и сохранить его до подхода партнеров делает его идеальным таргетменом. Отличное дополнение к атакующему арсеналу сборной.", "en": "A tall and technical striker. His ability to hold up the ball and keep it until his teammates arrive makes him the ideal target man. An excellent addition to the team's attacking arsenal." }, "image": "https://placehold.co/300x300?text=Oh+Se-hun" }
  ]
},
"CZE": {
  "desc": {
    "ru": "Наследники славных традиций Недведа и Росицки, чехи всегда славились своей футбольной школой. Сборная Чехии — это дисциплина, тактическая выучка и умение находить бреши в самой крепкой обороне. Они готовы вновь доказывать, что чешский характер — это залог больших побед.",
    "en": "Heirs to the glorious traditions of Nedvěd and Rosický, the Czechs have always been famous for their football school. The Czech national team is about discipline, tactical training, and the ability to find gaps in the strongest defense. They are ready to prove once again that the Czech character is the key to great victories on the world stage."
  },
  "coaches": [{
  "name": { "ru": "Мирослав Коубек", "en": "Miroslav Koubek" },
  "story": {
    "ru": "Опытный 74-летний чешский тренер, назначенный в декабре 2025 года после отставки Ивана Гашека.",
    "en": "Experienced 74-year-old Czech coach, appointed in December 2025 after Ivan Hasek's dismissal."
  },
  "image": "https://placehold.co/300x300?text=Miroslav+Koubek"
}],
  "players": [
    { "name": { "ru": "Томаш Соучек", "en": "Tomas Soucek" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Неутомимый полузащитник, пробегающий за матч больше всех в АПЛ.", "en": "A tireless midfielder who covers more distance than anyone else in the Premier League." }, "image": "https://placehold.co/300x300?text=Tomas+Soucek" },
    { "name": { "ru": "Патрик Шик", "en": "Patrik Schick" }, "pos": "forward", "status": "Star", "story": { "ru": "Автор невероятного гола с центра поля на Евро-2020.", "en": "Scorer of an incredible goal from the halfway line at Euro 2020." }, "image": "https://placehold.co/300x300?text=Patrik+Schick" },
    { "name": { "ru": "Матей Коварж", "en": "Matej Kovar" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Страж ворот леверкузенского «Байера», прошедший школу «Манчестер Юнайтед». Его уверенная игра ногами и надежные сейвы делают его первым номером сборной. В молодости он также играл в теннис, что объясняет его феноменальную реакцию и работу рук.", "en": "The goalkeeper of Bayer Leverkusen, who went through the Manchester United school. His confident footwork and reliable saves make him the number one for the national team. In his youth, he also played tennis, which explains his phenomenal reaction and handwork." }, "image": "https://placehold.co/300x300?text=Matej+Kovar" },
    { "name": { "ru": "Иржи Павленка", "en": "Jiri Pavlenka" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Опытный ветеран бременского «Вердера». Его спокойствие и чтение игры — это страховка для всей обороны. Настоящий дядька-наставник для молодежного десанта в рамке, чей рост позволяет ему перекрывать любые углы.", "en": "An experienced veteran of Werder Bremen. His composure and reading of the game are insurance for the entire defense. A true mentor for the youthful squad in goal, whose height allows him to cover any angle." }, "image": "https://placehold.co/300x300?text=Jiri+Pavlenka" },
    { "name": { "ru": "Индржих Станек", "en": "Jindrich Stanek" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Надежный страж ворот, чья карьера связана с чешским футболом. Его рефлексы и лидерские качества незаменимы в матчах внутреннего первенства и еврокубков. Он всегда готов выйти на замену и спасти команду.", "en": "A reliable shot-stopper whose career is tied to Czech football. His reflexes and leadership qualities are indispensable in domestic and European matches. He is always ready to come off the bench and save the team." }, "image": "https://placehold.co/300x300?text=Jindrich+Stanek" },
    { "name": { "ru": "Владимир Цоуфал", "en": "Vladimir Coufal" }, "pos": "defender", "status": "Star", "story": { "ru": "Неистовый правый латераль «Вест Хэма». Его выносливость позволяет ему курсировать по всему флангу 90 минут без остановки. Его характер и самоотдача делают его любимцем болельщиков и незаменимым игроком сборной.", "en": "The tireless right wing-back of West Ham. His stamina allows him to shuttle up and down the flank for 90 minutes without stopping. His character and dedication make him a fans' favorite and an indispensable player for the national team." }, "image": "https://placehold.co/300x300?text=Vladimir+Coufal" },
    { "name": { "ru": "Давид Юрасек", "en": "David Jurasek" }, "pos": "defender", "status": "Star", "story": { "ru": "Взрывной левый защитник, покоривший Бундеслигу и португальский чемпионат. Его скорость и дриблинг на узких пространствах сводят с ума соперников. Настоящий представитель нового, дерзкого поколения чешских фулбэков.", "en": "An explosive left-back who has conquered the Bundesliga and the Portuguese league. His speed and dribbling in tight spaces drive opponents crazy. A true representative of the new, bold generation of Czech full-backs." }, "image": "https://placehold.co/300x300?text=David+Jurasek" },
    { "name": { "ru": "Томаш Голеш", "en": "Tomas Holes" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный солдат пражской «Славии». Может сыграть в центре обороны, на фланге и даже в опорной зоне. Его тактическая гибкость и неуступчивость делают его незаменимым для любой схемы тренера.", "en": "A universal soldier of Prague Slavia. Can play in the center of defense, on the flank, and even in the defensive midfield. His tactical flexibility and tenacity make him indispensable for any coach's scheme." }, "image": "https://placehold.co/300x300?text=Tomas+Holes" },
    { "name": { "ru": "Мартин Витик", "en": "Martin Vitik" }, "pos": "defender", "status": "Starter", "story": { "ru": "Монумент в центре обороны, чей путь лежал через болонский клуб. Его игра на втором этаже и чтение игры — щит команды. Он начал карьеру в низших лигах и пробился в элиту благодаря своему трудолюбию.", "en": "A monument in the center of defense, whose path went through a Bologna club. His aerial game and reading of the game are the team's shield. He started his career in the lower leagues and broke into the elite thanks to his hard work." }, "image": "https://placehold.co/300x300?text=Martin+Vitik" },
    { "name": { "ru": "Робин Гранач", "en": "Robin Hranac" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Молодой и амбициозный защитник пльзеньской «Виктории». Его скорость и чтение игры компенсируют нехватку опыта, а характер не позволяет сдаваться ни в одном единоборстве. Будущий лидер чешской обороны.", "en": "A young and ambitious defender of Viktoria Plzeň. His speed and reading of the game compensate for his lack of experience, and his character does not allow him to give up in a single duel. The future leader of the Czech defense." }, "image": "https://placehold.co/300x300?text=Robin+Hranac" },
    { "name": { "ru": "Ладислав Крейчи", "en": "Ladislav Krejci" }, "pos": "defender", "status": "Starter", "story": { "ru": "Мощный центральный защитник пражской «Спарты». Его физическая мощь и игра головой делают его непробиваемой стеной на стандартах. Идеальный партнер для создания надежного тыла сборной.", "en": "A powerful center-back for Prague Sparta. His physical strength and aerial game make him an impenetrable wall on set pieces. The perfect partner for creating a reliable rear for the national team." }, "image": "https://placehold.co/300x300?text=Ladislav+Krejci" },
    { "name": { "ru": "Давид Зима", "en": "David Zima" }, "pos": "defender", "status": "Starter", "story": { "ru": "Элегантный защитник с опытом игры в Италии. Его умение начинать атаки из глубины и поставленный пас — важное оружие команды. Мастер длинных переводов мяча, способный изменить ход игры одним движением.", "en": "An elegant defender with experience playing in Italy. His ability to start attacks from deep and his set pass are an important weapon for the team. A master of long passes, capable of changing the course of the game with one movement." }, "image": "https://placehold.co/300x300?text=David+Zima" },
    { "name": { "ru": "Лукаш Провод", "en": "Lukas Provod" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Креативный хавбек, чья левая нога — высокоточный инструмент. Его видение поля и нестандартные решения — свежий ветер в чешской полузащите. Игрок, способный одним пасом разрезать любую оборону.", "en": "A creative midfielder whose left foot is a precision instrument. His vision of the field and unorthodox solutions are a fresh wind in the Czech midfield. A player capable of cutting through any defense with a single pass." }, "image": "https://placehold.co/300x300?text=Lukas+Provod" },
    { "name": { "ru": "Ондржей Лингр", "en": "Ondrej Lingr" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Мотор и разрушитель центра поля. Его энергия и умение выигрывать подборы дают команде необходимую агрессию. Неустанный бегунок, который готов пахать от своих до чужих ворот все 90 минут.", "en": "The engine and destroyer of the central midfield. His energy and ability to win loose balls give the team the necessary aggression. A tireless runner ready to work from his own goal to the opponent's for all 90 minutes." }, "image": "https://placehold.co/300x300?text=Ondrej+Lingr" },
    { "name": { "ru": "Павел Шульц", "en": "Pavel Sulc" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Хладнокровный плеймейкер пльзеньской «Виктории». Его умение контролировать темп и начинать атаки из глубины — важное оружие команды. Мастер штрафных ударов, чьи выстрелы регулярно украшают матчи.", "en": "A cool-headed playmaker for Viktoria Plzeň. His ability to control the tempo and start attacks from deep is an important weapon for the team. A master of free-kicks, whose shots regularly decorate matches." }, "image": "https://placehold.co/300x300?text=Pavel+Sulc" },
    { "name": { "ru": "Михал Садилек", "en": "Michal Sadilek" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Элегантный дирижер из нидерландского «Твенте». Его видение поля и точность передач делают его мозгом атакующих построений. Настоящий метроном чешской сборной, задающий ритм всей команде.", "en": "An elegant conductor from the Dutch Twente. His vision of the field and passing accuracy make him the brain of the attacking formations. A real metronome of the Czech national team, setting the rhythm for the whole team." }, "image": "https://placehold.co/300x300?text=Michal+Sadilek" },
    { "name": { "ru": "Антонин Барак", "en": "Antonin Barak" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Мощный бокс-ту-бокс полузащитник с опытом Серии А. Его рывки и удары из-за штрафной — угроза для ворот соперника. Он начал карьеру в низших лигах и пробился в сборную исключительно благодаря своему трудолюбию.", "en": "A powerful box-to-box midfielder with Serie A experience. His runs and shots from outside the box are a threat to the opponent's goal. He started his career in the lower leagues and made it to the national team solely thanks to his hard work." }, "image": "https://placehold.co/300x300?text=Antonin+Barak" },
    { "name": { "ru": "Матей Юрасек", "en": "Matej Jurasek" }, "pos": "midfielder", "status": "Rookie", "story": { "ru": "Дерзкий молодой талант, покоривший пражскую «Славию». Его скорость, нахальство и умение играть один в один — это то самое новое поколение чешского футбола, которое не боится авторитетов.", "en": "A bold young talent who has conquered Prague Slavia. His speed, audacity, and ability to play one-on-one are that very new generation of Czech football that is not afraid of authorities." }, "image": "https://placehold.co/300x300?text=Matej+Jurasek" },
    { "name": { "ru": "Томаш Хоры", "en": "Tomas Chory" }, "pos": "forward", "status": "Starter", "story": { "ru": "Мощный таран и классический форвард-целеустремитель. Его рост и прыгучесть делают его главным оружием на стандартах. Настоящий воздушный десант, способный снять мяч с любой высоты и сохранить его для партнеров.", "en": "A powerful battering ram and a classic target man. His height and jumping ability make him the main weapon on set pieces. A real airborne assault capable of taking the ball from any height and holding it up for his teammates." }, "image": "https://placehold.co/300x300?text=Tomas+Chory" },
    { "name": { "ru": "Ян Кухта", "en": "Jan Kuchta" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неутомимый прессинг-машина и универсальный нападающий. Его работоспособность и умение начать атаку высоким отбором мяча делают его любимцем тренеров. Игрок, который выжигает себя на поле на 100%.", "en": "A tireless pressing machine and a versatile forward. His work rate and ability to start an attack with a high turnover make him a favorite of the coaches. A player who burns himself out on the pitch 100%." }, "image": "https://placehold.co/300x300?text=Jan+Kuchta" },
    { "name": { "ru": "Вацлав Черны", "en": "Vaclav Cerny" }, "pos": "forward", "status": "Star", "story": { "ru": "Юркий и непредсказуемый вингер, чей путь лежал через голландский и немецкий футбол. Его низкий центр тяжести и сумасшедшая работа с мячом позволяют ему обыгрывать один в один кого угодно.", "en": "A nimble and unpredictable winger, whose path went through Dutch and German football. His low center of gravity and crazy ball control allow him to beat anyone one-on-one." }, "image": "https://placehold.co/300x300?text=Vaclav+Cerny" },
    { "name": { "ru": "Адам Гложик", "en": "Adam Hlozek" }, "pos": "forward", "status": "Star", "story": { "ru": "Талантливый форвард с богатым международным опытом. Его техника и финты сводят с ума защитников. Он играл в топ-лигах Европы и привносит в сборную бесценный опыт выступлений на высшем уровне.", "en": "A talented forward with rich international experience. His technique and feints drive defenders crazy. He played in the top leagues of Europe and brings invaluable experience of playing at the highest level to the national team." }, "image": "https://placehold.co/300x300?text=Adam+Hlozek" },
    { "name": { "ru": "Моймир Хитил", "en": "Mojmir Chytil" }, "pos": "forward", "status": "Starter", "story": { "ru": "Быстрый и дерзкий нападающий пражской «Славии». Его взрывная скорость и дриблинг на огромных скоростях сводят с ума защитников. Когда он разгоняется, у соперников остается только один шанс — сфолить.", "en": "A fast and bold forward for Prague Slavia. His explosive speed and dribbling at huge speeds drive defenders crazy. When he accelerates, the opponents have only one chance — to foul." }, "image": "https://placehold.co/300x300?text=Mojmir+Chytil" }
  ]
},
"BIH": {
  "desc": {
    "ru": "Сборная Боснии и Герцеговины — команда с огромным сердцем и балканским темпераментом. Они играют за свой народ, вкладывая в каждый пас и каждый удар всю душу. Обладая техничными игроками мирового уровня, боснийцы способны сотворить сенсацию и переиграть любого фаворита.",
    "en": "The Bosnia and Herzegovina national team is a team with a huge heart and Balkan temperament. They play for their people, putting their whole soul into every pass and every shot. Possessing world-class technical players, the Bosnians are capable of creating a sensation and outplaying any favorite."
  },
  "coaches": [{ "name": { "ru": "Сергей Барбарез", "en": "Sergej Barbarez" }, "story": { "ru": "Кумир боснийских болельщиков, возглавивший сборную в сложный период трансформации.", "en": "Idol of Bosnian fans, taking charge of the national team during a difficult transformation period." }, "image": "https://placehold.co/300x300?text=Sergej+Barbarez" }],
  "players": [
    { "name": { "ru": "Эдин Джеко", "en": "Edin Džeko" }, "pos": "forward", "status": "Captain", "story": { "ru": "«Боснийский бриллиант», лучший бомбардир в истории своей страны.", "en": "The 'Bosnian Diamond', the all-time leading goalscorer for his country." }, "image": "https://placehold.co/300x300?text=Edin+Dzeko" },
    { "name": { "ru": "Недиeljко Лабрович", "en": "Nediljko Labrović" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Надежный страж ворот из Риеки. Его реакция и командование штрафной делают его первым номером сборной. Он прошел путь от хорватских низших лиг до лидера национальной команды, доказав, что характер важнее паспорта.", "en": "A reliable shot-stopper from Rijeka. His reflexes and command of the box make him the number one for the national team. He went from the Croatian lower leagues to the leader of the national team, proving that character is more important than a passport." }, "image": "https://placehold.co/300x300?text=Nediljko+Labrovic" },
    { "name": { "ru": "Кенан Пирич", "en": "Kenan Pirić" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Опытный ветеран, чья карьера напоминает увлекательное путешествие по Европе и Южной Америке. Его спокойствие и игра на выходах — это страховка для всей обороны. Настоящий дядька-наставник для молодежного десанта в рамке.", "en": "An experienced veteran whose career is like a fascinating journey across Europe and South America. His composure and sweeping game are insurance for the entire defense. A true mentor for the youthful squad in goal." }, "image": "https://placehold.co/300x300?text=Kenan+Piric" },
    { "name": { "ru": "Бельмин Диздаревич", "en": "Belmin Dizdarević" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Молодой и амбициозный талант, прошедший школу сараевского «Железничара». Его прыгучесть и игра ногами идеально вписываются в современный футбол. Он готов в любой момент выйти на замену и доказать, что будущее боснийского футбола в надежных руках.", "en": "A young and ambitious talent who went through the Sarajevo Željezničar school. His jumping ability and footwork fit perfectly into modern football. He is ready to come off the bench at any moment and prove that the future of Bosnian football is in safe hands." }, "image": "https://placehold.co/300x300?text=Belmin+Dizdarevic" },
    { "name": { "ru": "Сеад Колашинац", "en": "Sead Kolašinac" }, "pos": "defender", "status": "Star", "story": { "ru": "Мощный левый защитник с опытом АПЛ и Серии А. Его физическая мощь и умение подключаться к атаке делают его незаменимым на фланге. Он прошел путь от Штутгарта до «Аталанты», привнося в сборную бесценный международный опыт.", "en": "A powerful left-back with Premier League and Serie A experience. His physical strength and ability to join the attack make him indispensable on the flank. He went from Stuttgart to Atalanta, bringing invaluable international experience to the national team." }, "image": "https://placehold.co/300x300?text=Sead+Kolasinac" },
    { "name": { "ru": "Амар Дедич", "en": "Amar Dedić" }, "pos": "defender", "status": "Star", "story": { "ru": "Взрывной правый латераль, покоривший австрийскую Бундеслигу и итальянскую Серию А. Его скорость и дриблинг на узких пространствах сводят с ума соперников. Настоящий представитель нового, дерзкого поколения боснийских фулбэков.", "en": "An explosive right wing-back who has conquered the Austrian Bundesliga and Italian Serie A. His speed and dribbling in tight spaces drive opponents crazy. A true representative of the new, bold generation of Bosnian full-backs." }, "image": "https://placehold.co/300x300?text=Amar+Dedic" },
    { "name": { "ru": "Анель Ахмедходжич", "en": "Anel Ahmedhodžić" }, "pos": "defender", "status": "Starter", "story": { "ru": "Монумент в центре обороны, чей путь лежал через английскую Премьер-лигу. Его игра на втором этаже и чтение игры — щит команды. Он начал карьеру в академии «Мальме» и пробился в элиту благодаря своему трудолюбию.", "en": "A monument in the center of defense, whose path went through the English Premier League. His aerial game and reading of the game are the team's shield. He started his career in the Malmö academy and broke into the elite thanks to his hard work." }, "image": "https://placehold.co/300x300?text=Anel+Ahmedhodzic" },
    { "name": { "ru": "Эльдар Чивич", "en": "Eldar Ćivić" }, "pos": "defender", "status": "Starter", "story": { "ru": "Неистовый левый защитник с опытом игры в Чехии и Венгрии. Его выносливость позволяет ему курсировать по всему флангу 90 минут без остановки. Его характер и самоотдача делают его любимцем болельщиков и незаменимым игроком сборной.", "en": "A tireless left-back with experience playing in the Czech Republic and Hungary. His stamina allows him to shuttle up and down the flank for 90 minutes without stopping. His character and dedication make him a fans' favorite and an indispensable player for the national team." }, "image": "https://placehold.co/300x300?text=Eldar+Civic" },
    { "name": { "ru": "Синиша Саничанин", "en": "Siniša Saničanin" }, "pos": "defender", "status": "Legend", "story": { "ru": "Цемент обороны, прошедший суровую школу сербского и европейского футбола. Его жесткость в единоборствах и лидерские качества наводят ужас на нападающих. Настоящий генерал в задней линии, всегда готовый подставить голову под мяч.", "en": "The cement of the defense, having gone through the tough school of Serbian and European football. His toughness in duels and leadership qualities terrify strikers. A true general in the backline, always ready to put his head under the ball." }, "image": "https://placehold.co/300x300?text=Sinisa+Sanicanin" },
    { "name": { "ru": "Деннис Хаджикадунич", "en": "Dennis Hadžikadunić" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный солдат, способный закрыть любую позицию в центре обороны. Его тактическая гибкость и неуступчивость делают его незаменимым для любой схемы тренера. Он прошел путь от шведских низших лиг до российского чемпионата.", "en": "A universal soldier capable of covering any position in the center of defense. His tactical flexibility and tenacity make him indispensable for any coach's scheme. He went from the Swedish lower leagues to the Russian championship." }, "image": "https://placehold.co/300x300?text=Dennis+Hadzikadunic" },
    { "name": { "ru": "Нихад Муджакич", "en": "Nihad Mujakić" }, "pos": "defender", "status": "Starter", "story": { "ru": "Надежный центральный защитник с богатым международным опытом. Его спокойствие с мячом и умение начинать атаки из глубины — важное оружие команды. Мастер длинных переводов мяча, способный изменить ход игры одним движением.", "en": "A reliable center-back with rich international experience. His composure on the ball and ability to start attacks from deep are an important weapon for the team. A master of long passes, capable of changing the course of the game with one movement." }, "image": "https://placehold.co/300x300?text=Nihad+Mujakic" },
    { "name": { "ru": "Стъепан Раделич", "en": "Stjepan Radeljić" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Молодой и амбициозный защитник, представляющий светлое будущее боснийской обороны. Его скорость и чтение игры компенсируют нехватку опыта, а характер не позволяет сдаваться ни в одном единоборстве.", "en": "A young and ambitious defender representing the bright future of the Bosnian defense. His speed and reading of the game compensate for his lack of experience, and his character does not allow him to give up in a single duel." }, "image": "https://placehold.co/300x300?text=Stjepan+Radeljic" },
    { "name": { "ru": "Раде Крунич", "en": "Rade Krunić" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Дирижер из глубины поля, чей путь лежал через итальянскую Серию А. Его видение поля и точность передач делают его мозгом атакующих построений. Настоящий метроном боснийской сборной, задающий ритм всей команде.", "en": "A deep-lying conductor whose path went through the Italian Serie A. His vision of the field and passing accuracy make him the brain of the attacking formations. A real metronome of the Bosnian national team, setting the rhythm for the whole team." }, "image": "https://placehold.co/300x300?text=Rade+Krunic" },
    { "name": { "ru": "Гойко Цимирот", "en": "Gojko Cimirot" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Опытный опорник с богатым международным прошлым. Его тактический интеллект и спокойствие необходимы команде в матчах против топ-сборных. Настоящий генерал в центре поля, чей опыт бесценен в решающие моменты.", "en": "An experienced defensive midfielder with a rich international past. His tactical intelligence and composure are essential for the team in matches against top sides. A true general in the center of the pitch, whose experience is invaluable in crucial moments." }, "image": "https://placehold.co/300x300?text=Gojko+Cimirot" },
    { "name": { "ru": "Мухамед Бешич", "en": "Muhamed Bešić" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Мотор и разрушитель центра поля. Его энергия и умение выигрывать подборы дают команде необходимую агрессию. Неустанный бегунок, который готов пахать от своих до чужих ворот все 90 минут.", "en": "The engine and destroyer of the central midfield. His energy and ability to win loose balls give the team the necessary aggression. A tireless runner ready to work from his own goal to the opponent's for all 90 minutes." }, "image": "https://placehold.co/300x300?text=Muhamed+Besic" },
    { "name": { "ru": "Бенджамин Тахирович", "en": "Benjamin Tahirović" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Молодой феномен, покоривший бельгийский и турецкий футбол. Его элегантность с мячом и умение читать игру делают его ключевым игроком в центре поля. Будущий лидер боснийской сборной, уже сейчас дирижирующий игрой.", "en": "A young phenomenon who has conquered Belgian and Turkish football. His elegance on the ball and ability to read the game make him a key player in the center of the pitch. The future leader of the Bosnian national team, already conducting the game now." }, "image": "https://placehold.co/300x300?text=Benjamin+Tahirovic" },
    { "name": { "ru": "Харис Хайрадинович", "en": "Haris Hajradinović" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Креативный хавбек с поставленным ударом. Его умение контролировать темп и начинать атаки из глубины — важное оружие команды. Мастер штрафных ударов, чьи выстрелы регулярно украшают матчи.", "en": "A creative midfielder with a set shot. His ability to control the tempo and start attacks from deep is an important weapon for the team. A master of free-kicks, whose shots regularly decorate matches." }, "image": "https://placehold.co/300x300?text=Haris+Hajradinovic" },
    { "name": { "ru": "Мирослав Стеванович", "en": "Miroslav Stevanović" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Ветеранский опыт и тактическая мудрость. Его видение поля и нестандартные решения — свежий ветер в боснийской полузащите. Игрок, способный одним пасом разрезать любую оборону.", "en": "Veteran experience and tactical wisdom. His vision of the field and unorthodox solutions are a fresh wind in the Bosnian midfield. A player capable of cutting through any defense with a single pass." }, "image": "https://placehold.co/300x300?text=Miroslav+Stevanovic" },
    { "name": { "ru": "Лука Менало", "en": "Luka Menalo" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Динамичный вингер, чей путь лежал через хорватский футбол. Его скорость и дриблинг на огромных скоростях сводят с ума защитников. Когда он разгоняется, у соперников остается только один шанс — сфолить.", "en": "A dynamic winger whose path went through Croatian football. His speed and dribbling at huge speeds drive defenders crazy. When he accelerates, the opponents have only one chance — to foul." }, "image": "https://placehold.co/300x300?text=Luka+Menalo" },
    { "name": { "ru": "Мартин Зломислич", "en": "Martin Zlomislić" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Энергичный бокс-ту-бокс полузащитник, чье сердце бьется в ритме мостарского «Зриньски». Его рывки и удары из-за штрафной — угроза для ворот соперника. Он начал карьеру в низших лигах и пробился в сборную исключительно благодаря своему трудолюбию.", "en": "An energetic box-to-box midfielder whose heart beats to the rhythm of Mostar's Zrinjski. His runs and shots from outside the box are a threat to the opponent's goal. He started his career in the lower leagues and made it to the national team solely thanks to his hard work." }, "image": "https://placehold.co/300x300?text=Martin+Zlomislic" },
    { "name": { "ru": "Эрмедин Демирович", "en": "Ermedin Demirović" }, "pos": "forward", "status": "Star", "story": { "ru": "Хладнокровный снайпер, покоривший немецкую Бундеслигу. Его инстинкт убийцы в штрафной и поставленный удар делают его главной угрозой. Он готов выйти из тени и вести команду к голам.", "en": "A clinical sniper who has conquered the German Bundesliga. His killer instinct in the box and set shot make him the main threat. He is ready to step out of the shadows and lead the team to goals." }, "image": "https://placehold.co/300x300?text=Ermedin+Demirovic" },
    { "name": { "ru": "Милан Джурич", "en": "Milan Đurić" }, "pos": "forward", "status": "Legend", "story": { "ru": "Мощный таран и классический форвард-целеустремитель. Его рост и прыгучесть делают его главным оружием на стандартах. Настоящий воздушный десант, способный снять мяч с любой высоты и сохранить его для партнеров.", "en": "A powerful battering ram and a classic target man. His height and jumping ability make him the main weapon on set pieces. A real airborne assault capable of taking the ball from any height and holding it up for his teammates." }, "image": "https://placehold.co/300x300?text=Milan+Duric" },
    { "name": { "ru": "Смаил Превляк", "en": "Smail Prevljak" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неутомимый прессинг-машина и универсальный нападающий. Его работоспособность и умение начать атаку высоким отбором мяча делают его любимцем тренеров. Игрок, который выжигает себя на поле на 100%.", "en": "A tireless pressing machine and a versatile forward. His work rate and ability to start an attack with a high turnover make him a favorite of the coaches. A player who burns himself out on the pitch 100%." }, "image": "https://placehold.co/300x300?text=Smail+Prevljak" },
    { "name": { "ru": "Эдин Вишча", "en": "Edin Višća" }, "pos": "forward", "status": "Star", "story": { "ru": "Талантливый плеймейкер с богатым международным опытом. Его техника и финты сводят с ума защитников. Он играл в топ-лигах Европы и привносит в сборную бесценный опыт выступлений на высшем уровне.", "en": "A talented playmaker with rich international experience. His technique and feints drive defenders crazy. He played in the top leagues of Europe and brings invaluable experience of playing at the highest level to the national team." }, "image": "https://placehold.co/300x300?text=Edin+Visca" },
    { "name": { "ru": "Дени Милошевич", "en": "Deni Milošević" }, "pos": "forward", "status": "Starter", "story": { "ru": "Юркий и непредсказуемый вингер, чей путь лежал через турецкий футбол. Его низкий центр тяжести и сумасшедшая работа с мячом позволяют ему обыгрывать один в один кого угодно.", "en": "A nimble and unpredictable winger, whose path went through Turkish football. His low center of gravity and crazy ball control allow him to beat anyone one-on-one." }, "image": "https://placehold.co/300x300?text=Deni+Milosevic" },
    { "name": { "ru": "Леон Даваку", "en": "Leon Dajaku" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Быстрый и дерзкий нападающий, представляющий новое поколение боснийской атаки. Его взрывная скорость и дриблинг на огромных скоростях сводят с ума защитников. Когда он разгоняется, у соперников остается только один шанс — сфолить.", "en": "A fast and bold forward representing the new generation of the Bosnian attack. His explosive speed and dribbling at huge speeds drive defenders crazy. When he accelerates, the opponents have only one chance — to foul." }, "image": "https://placehold.co/300x300?text=Leon+Dajaku" }
  ]
},
"QAT": {
  "desc": {
   "ru": "Двукратный король Азии - Катар - перерос статус просто богатого организатора. Это команда, выкованная в лучших академиях, обладающая жаждой показать свою силу на мировом уровне. Их амбиции простираются далеко за пределы группового этапа.",
    "en": "Two-time kings of Asia, Qatar has outgrown the status of just a wealthy organizer. This is a team forged in the best academies, possessing sharp mutual understanding and a hunger to prove its strength on the world level. Their ambitions extend far beyond the group stage."
  },
  "coaches": [{
  "name": { "ru": "Хулен Лопетеги", "en": "Julen Lopetegui" },
  "story": {
    "ru": "Испанский топ-тренер с опытом работы в «Реале» и «Севилье». Привёл Катар к историческому выходу на ЧМ.",
    "en": "Top Spanish coach with experience at Real Madrid and Sevilla. Led Qatar to historic World Cup qualification."
  },
  "image": "https://placehold.co/300x300?text=Julen+Lopetegui"
}],
  "players": [
    { "name": { "ru": "Акрам Афиф", "en": "Akram Afif" }, "pos": "forward", "status": "Star", "story": { "ru": "Лучший игрок Азии, мастер филигранных передач и эффектных голов.", "en": "Asian Player of the Year, a master of clinical passes and spectacular goals." }, "image": "https://placehold.co/300x300?text=Akram+Afif" },
    { "name": { "ru": "Мешаль Баршам", "en": "Meshaal Barsham" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Основной вратарь «Аль-Садда». Родился в Судане, но с детства живет в Катаре. Его невероятная реакция и игра на выходах сделали его непробиваемым щитом сборной.", "en": "The main goalkeeper of Al Sadd. Born in Sudan, but has lived in Qatar since childhood. His incredible reflexes and sweeping game have made him the impenetrable shield of the national team." }, "image": "https://placehold.co/300x300?text=Meshaal+Barsham" },
    { "name": { "ru": "Юсеф Хассан", "en": "Yousef Hassan" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Опытный страж ворот, прошедший школу бельгийского «Эйпена». Его спокойствие и уверенный голос в штрафной — надежная страховка для обороны.", "en": "An experienced shot-stopper who went through the school of Belgian Eupen. His composure and confident voice in the box are reliable insurance for the defense." }, "image": "https://placehold.co/300x300?text=Yousef+Hassan" },
    { "name": { "ru": "Салах Закария", "en": "Salah Zakaria" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Молодой талант из «Аль-Духаиля». Его прыгучесть и современная игра ногами идеально вписываются в философию Лопетеги.", "en": "A young talent from Al Duhail. His jumping ability and modern footwork fit perfectly into Lopetegui's philosophy." }, "image": "https://placehold.co/300x300?text=Salah+Zakaria" },
    { "name": { "ru": "Лукас Мендес", "en": "Lucas Mendes" }, "pos": "defender", "status": "Star", "story": { "ru": "Бразильский легионер, ставший сердцем катарской обороны. Его чтение игры и жесткость в единоборствах наводят ужас на нападающих.", "en": "The Brazilian legionnaire who became the heart of the Qatari defense. His reading of the game and toughness in duels terrify strikers." }, "image": "https://placehold.co/300x300?text=Lucas+Mendes" },
    { "name": { "ru": "Педро Мигель", "en": "Pedro Miguel" }, "pos": "defender", "status": "Legend", "story": { "ru": "Ветеран и правый защитник с огромным опытом. Его выносливость позволяет ему курсировать по всему флангу, а характер делает его любимцем болельщиков.", "en": "A veteran right-back with huge experience. His stamina allows him to shuttle up and down the flank, and his character makes him a fans' favorite." }, "image": "https://placehold.co/300x300?text=Pedro+Miguel" },
    { "name": { "ru": "Бассам Аль-Рави", "en": "Bassam Al-Rawi" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный защитник, способный закрыть любой фланг или сыграть в центре. Его тактическая гибкость — настоящее спасение для тренера.", "en": "A versatile defender capable of covering any flank or playing in the center. His tactical flexibility is a real savior for the coach." }, "image": "https://placehold.co/300x300?text=Bassam+Al-Rawi" },
    { "name": { "ru": "Буалем Хухи", "en": "Boualem Khoukhi" }, "pos": "defender", "status": "Legend", "story": { "ru": "Легенда сборной, способный сыграть на любой позиции в защите и полузащите. Его удары из-за штрафной не раз приносили команде победы.", "en": "A legend of the national team, capable of playing in any position in defense and midfield. His shots from outside the box have brought the team victories more than once." }, "image": "https://placehold.co/300x300?text=Boualem+Khoukhi" },
    { "name": { "ru": "Хоммам Ахмед", "en": "Homam Ahmed" }, "pos": "defender", "status": "Star", "story": { "ru": "Динамичный левый латераль. Его скорость и навесы — главное оружие на фланге, а самоотдача не знает границ.", "en": "A dynamic left wing-back. His speed and crosses are the main weapon on the flank, and his dedication knows no bounds." }, "image": "https://placehold.co/300x300?text=Homam+Ahmed" },
    { "name": { "ru": "Яссем Габер", "en": "Jassem Gaber" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Молодой и амбициозный центральный защитник. Его скорость и чтение игры компенсируют нехватку опыта, а характер не позволяет сдаваться ни в одном единоборстве.", "en": "A young and ambitious center-back. His speed and reading of the game compensate for his lack of experience, and his character does not allow him to give up in a single duel." }, "image": "https://placehold.co/300x300?text=Jassem+Gaber" },
    { "name": { "ru": "Мохаммед Ваад", "en": "Mohammed Waad" }, "pos": "defender", "status": "Starter", "story": { "ru": "Надежный опорник и защитник. Его умение выигрывать подборы и начинать атаки из глубины делают его незаменимым.", "en": "A reliable defensive midfielder and defender. His ability to win loose balls and start attacks from deep make him indispensable." }, "image": "https://placehold.co/300x300?text=Mohammed+Waad" },
    { "name": { "ru": "Карим Будиаф", "en": "Karim Boudiaf" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Опытный француз, ставший символом катарского футбола. Его тактический интеллект и спокойствие необходимы команде в матчах против топ-сборных.", "en": "An experienced Frenchman who has become a symbol of Qatari football. His tactical intelligence and composure are essential for the team in matches against top sides." }, "image": "https://placehold.co/300x300?text=Karim+Boudiaf" },
    { "name": { "ru": "Ассим Мадибо", "en": "Assim Madibo" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Мотор и разрушитель центра поля. Его энергия и неустанный бег создают фундамент для атакующей игры.", "en": "The engine and destroyer of the central midfield. His energy and tireless running create the foundation for the attacking game." }, "image": "https://placehold.co/300x300?text=Assim+Madibo" },
    { "name": { "ru": "Абдулла Аль-Ахрак", "en": "Abdullah Al-Ahrak" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Креативный хавбек с отличным видением поля. Его нестандартные решения и точные передачи — свежий ветер в полузащите.", "en": "A creative midfielder with excellent vision of the field. His unorthodox solutions and accurate passes are a fresh wind in the midfield." }, "image": "https://placehold.co/300x300?text=Abdullah+Al-Ahrak" },
    { "name": { "ru": "Али Асад", "en": "Ali Asad" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Маэстро из «Аль-Садда». Его левая нога — высокоточный инструмент, способный отдать пас, который не видят другие.", "en": "The maestro from Al Sadd. His left foot is a precision instrument capable of delivering a pass that others don't see." }, "image": "https://placehold.co/300x300?text=Ali+Asad" },
    { "name": { "ru": "Ахмед Фатехи", "en": "Ahmed Fatehi" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Универсальный полузащитник, способный сыграть на любой позиции в центре поля. Его работоспособность и прессинг — фундамент катарской игры.", "en": "A versatile midfielder capable of playing in any position in the center of the pitch. His work rate and pressing are the foundation of the Qatari game." }, "image": "https://placehold.co/300x300?text=Ahmed+Fatehi" },
    { "name": { "ru": "Альмоез Али", "en": "Almoez Ali" }, "pos": "forward", "status": "Star", "story": { "ru": "Главный снайпер нации, установивший рекорд результативности на одном Кубке Азии. Его инстинкт убийцы в штрафной и акробатические удары делают его главной угрозой.", "en": "The nation's main sniper, who set the scoring record at a single Asian Cup. His killer instinct in the box and acrobatic shots make him the main threat." }, "image": "https://placehold.co/300x300?text=Almoez+Ali" },
    { "name": { "ru": "Юсуф Абдурисаг", "en": "Yusuf Abdurisag" }, "pos": "forward", "status": "Star", "story": { "ru": "Быстрый и дерзкий вингер. Его взрывная скорость и дриблинг на огромных скоростях сводят с ума защитников.", "en": "A fast and bold winger. His explosive speed and dribbling at huge speeds drive defenders crazy." }, "image": "https://placehold.co/300x300?text=Yusuf+Abdurisag" },
    { "name": { "ru": "Исмаил Мохаммад", "en": "Ismaeel Mohammad" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неистовый правый вингер. Его выносливость позволяет ему прессинговать соперников от своих до чужих ворот.", "en": "A tireless right winger. His stamina allows him to press opponents from his own goal to the opponent's." }, "image": "https://placehold.co/300x300?text=Ismaeel+Mohammad" },
    { "name": { "ru": "Мохаммед Мунтари", "en": "Mohammed Muntari" }, "pos": "forward", "status": "Legend", "story": { "ru": "Мощный форвард, ставший автором первого гола Катара на домашних чемпионатах мира. Его физическая мощь и игра на втором этаже — план «Б» для взлома обороны.", "en": "A powerful forward who became the author of Qatar's first goal at the home World Cup. His physical strength and aerial game are plan 'B' for breaking down the defense." }, "image": "https://placehold.co/300x300?text=Mohammed+Muntari" },
    { "name": { "ru": "Халед Мохаммед", "en": "Khaled Mohammed" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Юный талант, представляющий новое поколение катарской атаки. Его техника и финты сводят с ума защитников.", "en": "A young talent representing the new generation of the Qatari attack. His technique and feints drive defenders crazy." }, "image": "https://placehold.co/300x300?text=Khaled+Mohammed" }
  ]
},
"SUI": {
  "desc": {
    "ru": "Сборная Швейцарии — это эталон надежности и стабильности. Команда, которая превратила нейтралитет в футбольную крепость, не боится никого на планете. Они — мастера тактики и командной игры, способные выстоять под любым давлением и нанести, решающий удар в самый неожиданный момент.",
    "en": "The Swiss national team is the standard of reliability and stability. A team that turned neutrality into a football fortress, they fear no one on the planet. They are masters of tactics and team play, capable of withstanding any pressure and delivering a decisive strike at the most unexpected moment."
  },
  "coaches": [{ "name": { "ru": "Мурат Якин", "en": "Murat Yakin" }, "story": { "ru": "Тактически гибкий тренер, под руководством которого Швейцария стабильно обыгрывает грандов.", "en": "Tactically flexible coach under whom Switzerland consistently beats top-tier teams." }, "image": "https://placehold.co/300x300?text=Murat+Yakin" }],
  "players": [
    { "name": { "ru": "Гранит Джака", "en": "Granit Xhaka" }, "pos": "midfielder", "status": "Captain", "story": { "ru": "Лидер и мозг команды, проведший исторический сезон в «Байере».", "en": "Leader and brain of the team, having had a historic season with Bayer Leverkusen." }, "image": "https://placehold.co/300x300?text=Granit+Xhaka" },
    { "name": { "ru": "Янн Зоммер", "en": "Yann Sommer" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Ветеран и гарант надежности. Переживший множество трансферов, он остается главным стражем ворот. Его невероятная реакция и игра на линии ворот спасли сборную в решающих матчах. В молодости он серьезно занимался теннисом, что объясняет его феноменальную работу рук и ног.", "en": "A veteran and a guarantee of reliability. Having survived numerous transfers, he remains the main goalkeeper. His incredible reflexes and goal-line saves have rescued the national team in crucial matches. In his youth, he seriously played tennis, which explains his phenomenal hand and footwork." }, "image": "https://placehold.co/300x300?text=Yann+Sommer" },
    { "name": { "ru": "Грегор Кобель", "en": "Gregor Kobel" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Скала из дортмундской «Боруссии». Его невероятная реакция и игра на выходах сделали его одним из лучших вратарей Европы. Он известен своим гигантским размахом рук, позволяющим перекрывать любые углы, а уверенная игра ногами делает его идеальным для современного футбола.", "en": "The rock of Borussia Dortmund. His incredible reflexes and sweeping game made him one of the best goalkeepers in Europe. He is known for his giant arm span, allowing him to cover any angle, and his confident footwork makes him perfect for modern football." }, "image": "https://placehold.co/300x300?text=Gregor+Kobel" },
    { "name": { "ru": "Йонас Омлин", "en": "Jonas Omlin" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Опытный страж ворот, закаленный в суровых баталиях Лиги 1 и Бундеслиги. Его спокойствие и уверенная игра ногами — отличная страховка для команды, всегда готовая выйти на замену и спасти ворота в самый ответственный момент.", "en": "An experienced shot-stopper hardened in the tough battles of Ligue 1 and the Bundesliga. His composure and confident footwork are excellent insurance for the team, always ready to come off the bench and save the goal at the most crucial moment." }, "image": "https://placehold.co/300x300?text=Jonas+Omlin" },
    { "name": { "ru": "Мануэль Аканджи", "en": "Manuel Akanji" }, "pos": "defender", "status": "Star", "story": { "ru": "Универсальный солдат «Манчестер Сити». Может сыграть в центре обороны, на фланге и даже в полузащите. Его тактическая гибкость и неуступчивость делают его незаменимым, а умение начинать атаки пасом из глубины восхищает тренеров.", "en": "A universal soldier of Manchester City. Can play in the center of defense, on the flank, and even in midfield. His tactical flexibility and tenacity make him indispensable, and his ability to start attacks with a pass from deep delights the coaches." }, "image": "https://placehold.co/300x300?text=Manuel+Akanji" },
    { "name": { "ru": "Нико Эльведи", "en": "Nico Elvedi" }, "pos": "defender", "status": "Starter", "story": { "ru": "Монумент в центре обороны менхенгладбахской «Боруссии». Его игра на втором этаже и чтение игры — щит команды. Он невероятно редко нарушает правила, что говорит о его высочайшем интеллекте и умении играть чисто в любых ситуациях.", "en": "A monument in the center of Borussia Mönchengladbach's defense. His aerial game and reading of the game are the team's shield. He incredibly rarely commits fouls, which speaks to his highest intelligence and ability to play cleanly in any situation." }, "image": "https://placehold.co/300x300?text=Nico+Elvedi" },
    { "name": { "ru": "Фабиан Шер", "en": "Fabian Schär" }, "pos": "defender", "status": "Star", "story": { "ru": "Мощный центральный защитник «Ньюкасла». Его физическая мощь и поставленный удар делают его опасным оружием на стандартах. Он также известен своим отличным пасом из глубины, способным в одно мгновение перевернуть ход игры.", "en": "A powerful center-back for Newcastle. His physical strength and set shot make him a dangerous weapon on set pieces. He is also known for his excellent passing from deep, capable of turning the course of the game in an instant." }, "image": "https://placehold.co/300x300?text=Fabian+Schar" },
    { "name": { "ru": "Рикардо Родригес", "en": "Ricardo Rodríguez" }, "pos": "defender", "status": "Legend", "story": { "ru": "Ветеран и левый защитник с огромным опытом. Его выносливость позволяет ему курсировать по всему флангу, а его стандарты — одно из главных оружий сборной. Настоящий профессионал, чья преданность делу вдохновляет молодежь.", "en": "A veteran left-back with huge experience. His stamina allows him to shuttle up and down the flank, and his set pieces are one of the national team's main weapons. A true professional whose dedication inspires the youth." }, "image": "https://placehold.co/300x300?text=Ricardo+Rodriguez" },
    { "name": { "ru": "Сильван Видмер", "en": "Silvan Widmer" }, "pos": "defender", "status": "Starter", "story": { "ru": "Неистовый правый латераль. Его скорость и дриблинг позволяют ему легко обыгрывать один в один. Его работоспособность и отбор мяча — кошмар для любого оппонента, а его подключения в атаку приносят команде важные голы.", "en": "A tireless right wing-back. His speed and dribbling allow him to easily beat opponents one-on-one. His work rate and ball-winning are a nightmare for any opponent, and his attacking runs bring the team important goals." }, "image": "https://placehold.co/300x300?text=Silvan+Widmer" },
    { "name": { "ru": "Эрай Кёмерт", "en": "Eray Cömert" }, "pos": "defender", "status": "Starter", "story": { "ru": "Надежный центральный защитник, прошедший школу «Базеля» и испанской «Валенсии». Его жесткость в единоборствах и лидерские качества наводят ужас на нападающих. Он не боится подставлять голову под мяч и всегда готов к самопожертвованию.", "en": "A reliable center-back who went through the Basel school and Spanish Valencia. His toughness in duels and leadership qualities terrify strikers. He is not afraid to put his head under the ball and is always ready for self-sacrifice." }, "image": "https://placehold.co/300x300?text=Eray+Comert" },
    { "name": { "ru": "Сильван Хефти", "en": "Silvan Hefti" }, "pos": "defender", "status": "Starter", "story": { "ru": "Динамичный правый защитник, покоривший французскую Лигу 1. Его взрывная скорость и подключения в атаку делают его незаменимым на фланге. Настоящий двигатель, способный обеспечить ширину атаки на протяжении всех 90 минут.", "en": "A dynamic right-back who has conquered French Ligue 1. His explosive speed and attacking runs make him indispensable on the flank. A real engine capable of providing attacking width for all 90 minutes." }, "image": "https://placehold.co/300x300?text=Silvan+Hefti" },
    { "name": { "ru": "Ремо Фройлер", "en": "Remo Freuler" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Мотор и разрушитель центра поля. Его энергия и умение выигрывать подборы дают команде необходимую агрессию. Неустанный бегунок, который готов пахать все 90 минут, покрывая огромные пространства и возвращая мяч своей команде.", "en": "The engine and destroyer of the central midfield. His energy and ability to win loose balls give the team the necessary aggression. A tireless runner ready to work for all 90 minutes, covering huge spaces and returning the ball to his team." }, "image": "https://placehold.co/300x300?text=Remo+Freuler" },
    { "name": { "ru": "Денис Закария", "en": "Denis Zakaria" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Мощный опорный полузащитник с опытом АПЛ и Серии А. Его физическая мощь и умение начинать атаки из глубины делают его идеальным партнером для Джаки. Его длинные шаги позволяют ему легко накрывать соперников в центре поля.", "en": "A powerful defensive midfielder with Premier League and Serie A experience. His physical strength and ability to start attacks from deep make him the perfect partner for Xhaka. His long strides allow him to easily cover opponents in the center of the pitch." }, "image": "https://placehold.co/300x300?text=Denis+Zakaria" },
    { "name": { "ru": "Мишель Эбишер", "en": "Michel Aebischer" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Энергичный бокс-ту-бокс полузащитник, покоривший итальянскую Серию А. Его рывки и удары из-за штрафной — угроза для ворот соперника. Он обладает невероятным чутьем на гол и всегда готов подставить ногу под прострел.", "en": "An energetic box-to-box midfielder who has conquered Italian Serie A. His runs and shots from outside the box are a threat to the opponent's goal. He possesses an incredible instinct for goals and is always ready to meet a cross." }, "image": "https://placehold.co/300x300?text=Michel+Aebischer" },
    { "name": { "ru": "Фабиан Ридер", "en": "Fabian Rieder" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Молодой феномен, ставший ключевым плеймейкером. Его видение поля и точность передач делают его мозгом атакующих построений. Настоящий метроном швейцарской сборной, задающий ритм и темп всей команде.", "en": "A young phenomenon who became a key playmaker. His vision of the field and passing accuracy make him the brain of the attacking formations. A real metronome of the Swiss national team, setting the rhythm and tempo for the whole team." }, "image": "https://placehold.co/300x300?text=Fabian+Rieder" },
    { "name": { "ru": "Эдимилсон Фернандеш", "en": "Edimilson Fernandes" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Универсальный солдат, способный закрыть любую позицию в центре поля и на фланге. Его тактическая гибкость и неуступчивость делают его незаменимым для любой схемы тренера. Он всегда готов сыграть на новой позиции и показать свой максимум.", "en": "A universal soldier capable of covering any position in the center of the pitch and on the flank. His tactical flexibility and tenacity make him indispensable for any coach's scheme. He is always ready to play in a new position and show his maximum." }, "image": "https://placehold.co/300x300?text=Edimilson+Fernandes" },
    { "name": { "ru": "Ардон Яшари", "en": "Ardon Jashari" }, "pos": "midfielder", "status": "Rookie", "story": { "ru": "Дерзкий молодой талант, покоривший бельгийский чемпионат. Его скорость, нахальство и умение играть один в один — это то самое новое поколение швейцарского футбола, которое не боится авторитетов и готово рвать любого соперника.", "en": "A bold young talent who has conquered the Belgian championship. His speed, audacity, and ability to play one-on-one are that very new generation of Swiss football that is not afraid of authorities and is ready to tear apart any opponent." }, "image": "https://placehold.co/300x300?text=Ardon+Jashari" },
    { "name": { "ru": "Бреэль Эмболо", "en": "Breel Embolo" }, "pos": "forward", "status": "Star", "story": { "ru": "Мощный таран и классический форвард. Его физическая мощь и игра на втором этаже делают его главным оружием на стандартах. Настоящий воздушный десант, способный снять мяч с любой высоты и сохранить его для партнеров.", "en": "A powerful battering ram and a classic forward. His physical strength and aerial game make him the main weapon on set pieces. A real airborne assault capable of taking the ball from any height and holding it up for his teammates." }, "image": "https://placehold.co/300x300?text=Breel+Embolo" },
    { "name": { "ru": "Рубен Варгас", "en": "Ruben Vargas" }, "pos": "forward", "status": "Star", "story": { "ru": "Юркий и непредсказуемый вингер. Его низкий центр тяжести и сумасшедшая работа с мячом позволяют ему обыгрывать один в один кого угодно. Настоящий кошмар для неповоротливых защитников, способный изменить ход игры одним рывком.", "en": "A nimble and unpredictable winger. His low center of gravity and crazy ball control allow him to beat anyone one-on-one. A real nightmare for sluggish defenders, capable of changing the course of the game with a single run." }, "image": "https://placehold.co/300x300?text=Ruben+Vargas" },
    { "name": { "ru": "Дан Ндойе", "en": "Dan Ndoye" }, "pos": "forward", "status": "Star", "story": { "ru": "Молния на фланге. Его взрывная скорость и дриблинг на огромных скоростях сводят с ума защитников. Когда он разгоняется, у соперников остается только один шанс — сфолить, иначе он просто улетит за спину.", "en": "The lightning bolt on the flank. His explosive speed and dribbling at huge speeds drive defenders crazy. When he accelerates, the opponents have only one chance — to foul, otherwise he will simply fly behind their backs." }, "image": "https://placehold.co/300x300?text=Dan+Ndoye" },
    { "name": { "ru": "Ной Окафор", "en": "Noah Okafor" }, "pos": "forward", "status": "Star", "story": { "ru": "Талантливый форвард с богатым международным опытом. Его техника и финты сводят с ума защитников. Он играл в топ-лигах Европы и привносит в сборную бесценный опыт, способный решить исход самого напряженного матча.", "en": "A talented forward with rich international experience. His technique and feints drive defenders crazy. He played in the top leagues of Europe and brings invaluable experience to the national team, capable of deciding the outcome of the most tense match." }, "image": "https://placehold.co/300x300?text=Noah+Okafor" },
    { "name": { "ru": "Зеки Амдуни", "en": "Zeki Amdouni" }, "pos": "forward", "status": "Starter", "story": { "ru": "Хладнокровный снайпер, покоривший английскую Премьер-лигу. Его инстинкт убийцы в штрафной и поставленный удар делают его главной угрозой. Он всегда знает, где находится мяч, и готов в любую секунду нанести решающий удар.", "en": "A clinical sniper who has conquered the English Premier League. His killer instinct in the box and set shot make him the main threat. He always knows where the ball is and is ready to deliver the decisive strike at any second." }, "image": "https://placehold.co/300x300?text=Zeki+Amdouni" },
    { "name": { "ru": "Седрик Иттен", "en": "Cedric Itten" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неустанный прессинг-машина и универсальный нападающий. Его работоспособность и умение начать атаку высоким отбором мяча делают его любимцем тренеров. Игрок, который выжигает себя на поле на 100%, не оставляя соперникам ни секунды передышки.", "en": "A tireless pressing machine and a versatile forward. His work rate and ability to start an attack with a high turnover make him a favorite of the coaches. A player who burns himself out on the pitch 100%, leaving the opponents not a second of respite." }, "image": "https://placehold.co/300x300?text=Cedric+Itten" }
  ]
},
"MAR": {
  "desc": {
    "ru": "«Атласские львы» — гордость Африки и всего арабского мира. Став первой командой своего континента в полуфинале ЧМ, они доказали, что мечты сбываются. Марокко —  сочетание европейской дисциплины и африканской страсти, команда, которая заставляет сердца миллионов биться в унисон.",
    "en": "The 'Atlas Lions' are the pride of Africa and the entire Arab world. Becoming the first team from their continent to reach a World Cup semi-final, they proved that dreams come true. Morocco is a combination of European discipline and African passion, a team that makes the hearts of millions beat in unison."
  },
  "coaches": [{
  "name": { "ru": "Мохамед Уахби", "en": "Mohamed Ouahbi" },
  "story": {
    "ru": "Сменил Валида Реграги в марте 2026 года. Ранее тренировал молодёжную сборную Марокко.",
    "en": "Replaced Walid Regragui in March 2026. Previously coached Morocco's under-23 team."
  },
  "image": "https://placehold.co/300x300?text=Mohamed+Ouahbi"
}],
  "players": [
    { "name": { "ru": "Ашраф Хакими", "en": "Achraf Hakimi" }, "pos": "defender", "status": "Star", "story": { "ru": "Один из лучших правых защитников мира, обладающий невероятной скоростью.", "en": "One of the best right-backs in the world, possessing incredible speed." }, "image": "https://placehold.co/300x300?text=Achraf+Hakimi" },
    { "name": { "ru": "Хаким Зиеш", "en": "Hakim Ziyech" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Волшебник», способный создать гол из ничего своей левой ногой.", "en": "The 'Wizard', capable of creating a goal out of nothing with his left foot." }, "image": "https://placehold.co/300x300?text=Hakim+Ziyech" },
    { "name": { "ru": "Яссин Буну", "en": "Yassine Bounou" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Легендарный «Боно», герой мундиаля в Катаре. Его невероятные сейвы и спокойствие спасали команду в критические моменты. Помимо футбола, он увлечен игрой на пианино, что, возможно, развивает его феноменальную ритмичность и координацию в рамке.", "en": "The legendary 'Bono', hero of the Qatar World Cup. His incredible saves and composure rescued the team in critical moments. Besides football, he is passionate about playing the piano, which perhaps develops his phenomenal rhythm and coordination in goal." }, "image": "https://placehold.co/300x300?text=Yassine+Bounou" },
    { "name": { "ru": "Монир Эль Кажуи", "en": "Monir El Kajoui" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Восходящая звезда марокканского футбола из клуба AS FAR. Его реакция и лидерские качества делают его надежной страховкой для сборной. Он прошел путь от любительских полей до основы национальной команды, доказав, что упорство открывает любые двери.", "en": "A rising star of Moroccan football from AS FAR. His reflexes and leadership qualities make him a reliable backup for the national team. He went from amateur pitches to the national team's starting lineup, proving that perseverance opens any doors." }, "image": "https://placehold.co/300x300?text=Monir+El+Kajoui" },
    { "name": { "ru": "Алаа Белларуш", "en": "Alaa Bellaarouch" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Молодой и амбициозный страж ворот из «Видада». Его современная игра ногами и отличная реакция идеально вписываются в философию современного футбола. Он готов в любой момент выйти на замену и доказать, что будущее марокканского футбола в надежных руках.", "en": "A young and ambitious goalkeeper from Wydad. His modern footwork and excellent reflexes fit perfectly into the philosophy of modern football. He is ready to come off the bench at any moment and prove that the future of Moroccan football is in safe hands." }, "image": "https://placehold.co/300x300?text=Alaa+Bellaarouch" },
    { "name": { "ru": "Нуссаир Мазрауи", "en": "Noussair Mazraoui" }, "pos": "defender", "status": "Star", "story": { "ru": "Элегантный левоногий защитник мюнхенской «Баварии». Его тактический интеллект и умение читать игру позволяют ему успешно действовать на обоих флангах. В юности он играл в полузащите, что объясняет его великолепное видение поля и любовь к шахматам, которые тренируют его стратегическое мышление.", "en": "The elegant left-footed defender of Bayern Munich. His tactical intelligence and reading of the game allow him to successfully operate on both flanks. In his youth, he played in midfield, which explains his superb vision of the field and his love for chess, which trains his strategic thinking." }, "image": "https://placehold.co/300x300?text=Noussair+Mazraoui" },
    { "name": { "ru": "Найеф Агерд", "en": "Nayef Aguerd" }, "pos": "defender", "status": "Star", "story": { "ru": "Монолит в центре обороны «Вест Хэма». Его игра на втором этаже и мощь в единоборствах наводят ужас на нападающих. Он преодолел серьезную травму колена, чтобы вернуться на высший уровень, продемонстрировав невероятную силу духа и преданность делу.", "en": "A monolith in the center of West Ham's defense. His aerial game and power in duels terrify strikers. He overcame a serious knee injury to return to the highest level, demonstrating incredible strength of character and dedication." }, "image": "https://placehold.co/300x300?text=Nayef+Aguerd" },
    { "name": { "ru": "Ашраф Дари", "en": "Achraf Dari" }, "pos": "defender", "status": "Starter", "story": { "ru": "Надежный и спокойный центральный защитник французского «Бреста». Его умение начинать атаки из глубины и хладнокровие под давлением делают его незаменимым. Он является настоящим джентльменом на поле, крайне редко получая желтые карточки за грубую игру.", "en": "A reliable and calm center-back for French Brest. His ability to start attacks from deep and his composure under pressure make him indispensable. He is a true gentleman on the pitch, extremely rarely receiving yellow cards for rough play." }, "image": "https://placehold.co/300x300?text=Achraf+Dari" },
    { "name": { "ru": "Яхья Аттьят Аллах", "en": "Yahia Attiyat Allah" }, "pos": "defender", "status": "Starter", "story": { "ru": "Динамичный левый латераль, чья скорость и выносливость позволяют ему курсировать по всей бровке. Его навесы и подключения в штрафную — одно из главных оружий марокканской атаки. Он известен своим невероятным чувством юмора и позитивным настроем в раздевалке.", "en": "A dynamic left wing-back whose speed and stamina allow him to shuttle up and down the touchline. His crosses and runs into the box are one of the main weapons of the Moroccan attack. He is known for his incredible sense of humor and positive attitude in the dressing room." }, "image": "https://placehold.co/300x300?text=Yahia+Attiyat+Allah" },
    { "name": { "ru": "Джавад Эль Ямик", "en": "Jawad El Yamiq" }, "pos": "defender", "status": "Legend", "story": { "ru": "Опытный ветеран, прошедший суровую школу Ла Лиги и Серии А. Его лидерские качества и жесткость в единоборствах делают его настоящим генералом в задней линии. Он отлично играет головой, несмотря на то, что в детстве серьезно занимался легкой атлетикой и прыжками в высоту.", "en": "An experienced veteran who went through the tough school of La Liga and Serie A. His leadership qualities and toughness in duels make him a true general in the backline. He is excellent in the air, despite the fact that in his childhood he seriously practiced athletics and high jump." }, "image": "https://placehold.co/300x300?text=Jawad+El+Yamiq" },
    { "name": { "ru": "Суфьян Эль Каруани", "en": "Souffian El Karouani" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Перспективный молодой защитник из нидерландского НЕК. Его техника, скорость и умение играть один в один делают его опасным оружием на фланге. Он свободно говорит на нескольких языках, что помогает ему быстро адаптироваться в любой футбольной среде.", "en": "A promising young defender from the Dutch NEC. His technique, speed, and ability to play one-on-one make him a dangerous weapon on the flank. He speaks several languages fluently, which helps him quickly adapt to any football environment." }, "image": "https://placehold.co/300x300?text=Souffian+El+Karouani" },
    { "name": { "ru": "Софьян Амрабат", "en": "Sofyan Amrabat" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Неистовый мотор и разрушитель центра поля. Его выносливость и умение выигрывать подборы дают команде необходимую агрессию. В детстве он занимался боевыми искусствами, что объясняет его невероятную жесткость в единоборствах и умение не уступать сопернику ни сантиметра поля.", "en": "A tireless engine and destroyer of the central midfield. His stamina and ability to win loose balls give the team the necessary aggression. In his childhood, he practiced martial arts, which explains his incredible toughness in duels and his ability not to yield a single centimeter of the field to the opponent." }, "image": "https://placehold.co/300x300?text=Sofyan+Amrabat" },
    { "name": { "ru": "Аззедин Унаи", "en": "Azzedine Ounahi" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Креативный волшебник с мячом в ногах. Его дриблинг и нестандартное мышление способны взломать любую оборону. Помимо футбола, он также увлекается игрой на пианино, что, как и Боно, подчеркивает его тонкое чувство ритма и координацию.", "en": "A creative wizard with the ball at his feet. His dribbling and unorthodox thinking can break down any defense. Besides football, he is also passionate about playing the piano, which, like Bono, emphasizes his fine sense of rhythm and coordination." }, "image": "https://placehold.co/300x300?text=Azzedine+Ounahi" },
    { "name": { "ru": "Билал Эль Ханнус", "en": "Bilal El Khannouss" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Юный гений и главный дирижер марокканской полузащиты. Его видение поля и точность передач не по годам развиты. Он начал заниматься футболом в Бельгии, но с самого детства мечтал выступать за сборную Марокко, вдохновляясь игрой Зьеша и Хакими.", "en": "A young genius and the main conductor of the Moroccan midfield. His vision of the field and passing accuracy are developed beyond his years. He started playing football in Belgium, but since childhood he dreamed of playing for the Moroccan national team, inspired by the game of Ziyech and Hakimi." }, "image": "https://placehold.co/300x300?text=Bilal+El+Khannouss" },
    { "name": { "ru": "Амир Ричардсон", "en": "Amir Richardson" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Мощный и элегантный бокс-ту-бокс полузащитник французского «Реймса». Его физическая мощь и умение играть в пас делают его идеальным связующим звеном между обороной и атакой. Он вырос в футбольной семье, где его отец также был профессиональным игроком.", "en": "A powerful and elegant box-to-box midfielder for French Reims. His physical strength and passing ability make him the perfect link between defense and attack. He grew up in a football family, where his father was also a professional player." }, "image": "https://placehold.co/300x300?text=Amir+Richardson" },
    { "name": { "ru": "Усама Эль Аззузи", "en": "Oussama El Azzouzi" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Тактический гибрид и разрушитель из «Юниона». Его умение читать игру и перехватывать передачи соперника создают фундамент для быстрых контратак. Он известен своим невероятным трудолюбием и готовностью пахать на поле от звонка до звонка.", "en": "A tactical hybrid and destroyer from Union SG. His ability to read the game and intercept opponent's passes creates the foundation for fast counterattacks. He is known for his incredible hard work and willingness to plow on the pitch from bell to bell." }, "image": "https://placehold.co/300x300?text=Oussama+El+Azzouzi" },
    { "name": { "ru": "Юссеф Эн-Несири", "en": "Youssef En-Nesyri" }, "pos": "forward", "status": "Star", "story": { "ru": "Воздушный монстр и главная угроза на стандартах. Его прыгучесть и мощь в штрафной не имеют аналогов. В юности он занимался баскетболом, что напрямую повлияло на его феноменальный прыжок и умение играть на втором этаже.", "en": "An aerial monster and the main threat on set pieces. His jumping ability and power in the box are unmatched. In his youth, he played basketball, which directly influenced his phenomenal jump and ability to play in the air." }, "image": "https://placehold.co/300x300?text=Youssef+En-Nesyri" },
    { "name": { "ru": "Аюб Эль Кааби", "en": "Ayoub El Kaabi" }, "pos": "forward", "status": "Star", "story": { "ru": "Хладнокровный снайпер с невероятным голевым чутьем. Его способность оказываться в нужном месте в нужное время делает его кошмаром для любого вратаря. Он является одним из самых результативных игроков в истории Лиги конференций, что доказывает его класс на европейской арене.", "en": "A clinical sniper with an incredible goal-scoring instinct. His ability to be in the right place at the right time makes him a nightmare for any goalkeeper. He is one of the most prolific players in the history of the Conference League, which proves his class on the European stage." }, "image": "https://placehold.co/300x300?text=Ayoub+El+Kaabi" },
    { "name": { "ru": "Абдессамад Эззалзули", "en": "Abdessamad Ezzalzouli" }, "pos": "forward", "status": "Star", "story": { "ru": "Взрывной вингер, чья скорость и прямолинейность сводят с ума защитников. Его дриблинг и умение играть один в один открывают огромные пространства для партнеров. Он свободно говорит на арабском, испанском и берберском языках, отражая многообразие своей культуры.", "en": "An explosive winger whose speed and directness drive defenders crazy. His dribbling and ability to play one-on-one open up huge spaces for his teammates. He speaks Arabic, Spanish, and Berber fluently, reflecting the diversity of his culture." }, "image": "https://placehold.co/300x300?text=Abdessamad+Ezzalzouli" },
    { "name": { "ru": "Амин Адли", "en": "Amine Adli" }, "pos": "forward", "status": "Star", "story": { "ru": "Универсальный и техничный нападающий леверкузенского «Байера». Его скорость, финты и нестандартное мышление делают его опаснейшим оружием в атаке. Недавно сменив спортивное гражданство, он с гордостью защищает цвета своей исторической родины.", "en": "A versatile and technical forward for Bayer Leverkusen. His speed, feints, and unorthodox thinking make him the most dangerous weapon in attack. Having recently changed his sporting citizenship, he proudly defends the colors of his historical homeland." }, "image": "https://placehold.co/300x300?text=Amine+Adli" },
    { "name": { "ru": "Валид Чеддира", "en": "Walid Cheddira" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неустанный прессинг-машина и универсальный форвард. Его работоспособность и движение без мяча создают пространство для партнеров. Он родился в Италии, но с детства болел за Марокко, и его переход в национальную сборную стал воплощением детской мечты.", "en": "A tireless pressing machine and a versatile forward. His work rate and off-the-ball movement create space for his teammates. He was born in Italy, but supported Morocco since childhood, and his move to the national team became the realization of a childhood dream." }, "image": "https://placehold.co/300x300?text=Walid+Cheddira" },
    { "name": { "ru": "Исмаэль Сайбари", "en": "Ismael Saibari" }, "pos": "forward", "status": "Starter", "story": { "ru": "Динамичный и мощный нападающий ПСВ. Его способность тащить мяч из глубины поля и мощные рывки делают его идеальным игроком для контратак. Он начинал карьеру в академии «Генка», где его заметили благодаря невероятной физической силе и скорости.", "en": "A dynamic and powerful forward for PSV. His ability to carry the ball from deep and his powerful runs make him the perfect player for counterattacks. He started his career in the Genk academy, where he was noticed for his incredible physical strength and speed." }, "image": "https://placehold.co/300x300?text=Ismael+Saibari" }
  ]
},
"HAI": {
  "desc": {
    "ru": "Сборная Гаити — это история мужества и надежды. Пробившись на мундиаль вопреки всем трудностям, «Гренадеры» несут в себе дух свободы своего острова. Они готовы биться за каждый мяч, доказывая всему миру, что для настоящей любви к футболу не существует преград.",
    "en": "The Haiti national team is a story of courage and hope. Making it to the World Cup against all odds, the 'Grenadiers' carry the spirit of freedom of their island. They are ready to fight for every ball, proving to the whole world that there are no barriers to true love for football."
  },

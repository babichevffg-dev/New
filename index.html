<style>
  .mute-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
  z-index: 1001;
  transition: 0.2s;
  backdrop-filter: blur(4px);
}

.mute-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  color: var(--gold);
  border-color: var(--gold);
  transform: scale(1.1);
}

.mute-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}
  .stadium-card > a {
  display: block;

.stadium-card > a:hover .stadium-img {

}
:root{--bg:#050b18;--card:rgba(16,33,61,.94);--border:rgba(255,255,255,.12);--accent:#3498db;--gold:#f1c40f;--text:#f8f9fa;--muted:#8ea6c7;--pitch:#0a1931}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
.lang-switcher{position:fixed;top:10px;left:10px;display:flex;gap:8px;z-index:1000}
.lang-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-weight:400;font-size:0.75rem;padding:2px 4px;transition:0.2s}
.lang-btn.active{color:var(--gold)}
.bg-trophy{position:fixed;inset:0;z-index:0;pointer-events:none;
  background: url("https://api.tvrgomel.by/upload/iblock/776/aaoipplamffc4dt1o9rq49ve47z9jl02.jpg") no-repeat center;
  background-size: cover;
  opacity: 0.5;
  filter: brightness(1.5) contrast(1.1);
}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 16px 12px}
header h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:700}
header p{color:var(--muted);margin-top:6px;font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:24px 0 16px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px}
.tab,.btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:.9rem;transition:.15s}
.tab:hover,.btn:hover{background:rgba(255,255,255,.12)}
.tab.active{background:var(--accent);color:#042;border-color:var(--accent);font-weight:600}
.btn-save{background:var(--gold);color:#221;border-color:var(--gold);font-weight:600}
.btn-save:hover{background:#ffd966}
.btn-danger{border-color:#a33;color:#faa}
.panel{display:none}
.panel.active{display:block}
.grid-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 360px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;backdrop-filter:blur(10px)}
.card h3{font-size:1.05rem;margin-bottom:10px;color:var(--gold)}
.standings{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:12px}
.standings th,.standings td{padding:5px 4px;text-align:center;border-bottom:1px solid var(--border)}
.standings th:not(:nth-child(2)), .standings td:not(:nth-child(2)) { width: 1%; white-space: nowrap; }
@media (max-width: 480px) {
  .standings th, .standings td { padding: 4px 2px; font-size: 0.7rem; }
  .card { padding: 8px; overflow-x: auto; }
}
.standings th{color:var(--muted);font-weight:500}
.standings td:nth-child(2){text-align:left}
.standings tr.pos1{background:rgba(52,152,219,.35)}
.standings tr.pos2{background:rgba(52,152,219,.2)}
.standings tr.pos3{background:rgba(241,196,15,.25)}
.standings tr.pos3.out3{opacity:.45}
.match-block{border-bottom:1px solid rgba(255,255,255,.08);padding:10px 0}
.match-meta{font-size:.78rem;color:var(--muted);margin-bottom:6px;line-height:1.4}
.match-meta b{color:var(--gold);font-weight:600}
.match-row{display:grid;grid-template-columns:1fr 45px 15px 45px 1fr auto;gap:4px;align-items:center;font-size:.85rem}
.team-cell{display:flex;align-items:center;gap:6px;min-width:0}
.team-cell.away{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.flag{width:24px;height:16px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.3);flex-shrink:0}
.team-tip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.25);transition:.15s}
.team-tip:hover{color:var(--accent);border-bottom-color:var(--accent)}
.team-tip span{text-shadow: -1px -1px 0 var(--pitch), 1px -1px 0 var(--pitch), -1px 1px 0 var(--pitch), 1px 1px 0 var(--pitch);}
.team-popover{position:fixed;z-index:9999;width:min(300px,calc(100vw - 24px));background:rgba(8,22,42,.97);border:1px solid var(--gold);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden;pointer-events:auto;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .15s,transform .15s,visibility .15s}
.team-popover.show{opacity:1;visibility:visible;transform:translateY(0)}
.team-pop-photo{width:100%;height:140px;object-fit:cover;display:block;background:rgba(0,0,0,.3)}
.team-pop-body{padding:12px 14px}
.team-pop-body h4{font-size:1rem;color:var(--gold);margin-bottom:4px;text-shadow: -1px -1px 0 var(--pitch), 1px -1px 0 var(--pitch), -1px 1px 0 var(--pitch), 1px 1px 0 var(--pitch);}
.team-pop-rank{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.team-pop-body p{font-size:.85rem;line-height:1.5;color:var(--text)}
.score-inp{width:40px;padding:5px;text-align:center;border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,.35);color:var(--text);font-size:1rem;font-weight:600}
.score-inp:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.score-inp.filled{background:rgba(0,212,170,.15)}
.ko-section{margin-bottom:24px}
.ko-section h3{color:var(--accent);margin-bottom:12px}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ko-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.ko-card .winner{font-weight:700;color:var(--gold);text-align:center;margin-top:8px}
.bracket-wrap{overflow-x:auto;padding:20px 0; -webkit-overflow-scrolling: touch;}
.bracket{display:flex;gap:40px;min-width:max-content; padding-bottom: 20px;}
.bracket-col{flex:1;min-width:150px}
.bracket-col h4{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.br-slot{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;font-size:.78rem;min-height:56px}
.third-table{width:100%;border-collapse:collapse;font-size:.85rem}
.third-table th,.third-table td{padding:8px;border:1px solid var(--border);text-align:center}
.third-table tr.qual{background:rgba(52,152,219,.3)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.stadium-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%, 320px),1fr));gap:16px}
.stadium-card{display:flex;flex-direction:column;gap:12px}
.stadium-img{width:100%;height:200px;object-fit:cover;border-radius:8px;background:rgba(0,0,0,.3)}
.stadium-info h3{font-size:1.1rem;color:var(--gold);margin-bottom:4px}
.stadium-info .city{font-size:.9rem;color:var(--muted);margin-bottom:8px;font-weight:600}
.stadium-info .desc{font-size:.85rem;line-height:1.5;margin-bottom:12px}
.stadium-fact{font-size:.82rem;padding:10px;background:rgba(255,255,255,.05);border-left:3px solid var(--gold);border-radius:0 4px 4px 0;font-style:italic}
.champion-banner{text-align:center;padding:32px;background:linear-gradient(135deg,rgba(241,196,15,.25),rgba(52,152,219,.15));border:2px solid var(--gold);border-radius:16px;margin-top:20px;display:none}
.champion-banner.show{display:block}
.champion-banner .trophy{font-size:3rem}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.team-card-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:0.2s}
.team-card-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.team-card-btn .flag{width:48px;height:32px}

.squad-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.player-row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:grid;grid-template-columns:1fr 120px 100px;align-items:center;cursor:pointer;transition:0.15s}
.player-row:hover{background:rgba(255,255,255,0.08);border-color:var(--accent)}
.player-name{font-weight:600;display:flex;align-items:center;gap:8px}
.player-pos{font-size:0.85rem;color:var(--muted)}
.player-status{font-size:0.8rem;text-align:center;padding:2px 8px;border-radius:4px;background:rgba(255,255,255,0.1)}
.player-status.captain{background:var(--gold);color:#221;font-weight:700}
.back-btn{margin-bottom:20px;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:0.9rem}
.back-btn:hover{background:rgba(255,255,255,0.12)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-content{background:var(--bg);border:1px solid var(--gold);border-radius:16px;width:min(500px, 100%);max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.6)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.modal-header h3{color:var(--gold);font-size:1.4rem}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1;padding:4px}
.modal-body{padding:24px}
.modal-body p{line-height:1.6;font-size:1.05rem}
#saveStatus{font-size:.85rem;color:var(--muted)}
#saveStatus.ok{color:var(--accent)}
@media (max-width: 600px) {
  .match-row { grid-template-columns: 1fr 38px 10px 38px 1fr auto; font-size: 0.75rem; }
  .flag { width: 20px; height: 13px; }
  .score-inp { width: 35px !important; padding: 4px 2px !important; }
  .teams-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .team-card-btn { padding: 10px; border-radius: 8px; gap: 6px; }
  .team-card-btn .flag { width: 36px; height: 24px; }
  .team-card-btn span { font-size: 0.85rem; }
}

.team-card-btn span { font-weight: 700; font-size: 1.1rem; color: #fff; text-shadow: -1px -1px 0 var(--pitch), 1px -1px 0 var(--pitch), -1px 1px 0 var(--pitch), 1px 1px 0 var(--pitch), 0 2px 4px rgba(0,0,0,0.4); }
.squad-container { display: grid; grid-template-columns: 1fr 300px; gap: 24px; margin-top: 20px; }
@media (max-width: 900px) { .squad-container { grid-template-columns: 1fr; } }
.team-header { text-align: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.team-header .big-flag { width: 120px; height: 80px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 16px; }
.team-header h2 { font-size: 2.2rem; color: var(--gold); margin-bottom: 12px; text-shadow: -2px -2px 0 var(--pitch), 2px -2px 0 var(--pitch), -2px 2px 0 var(--pitch), 2px 2px 0 var(--pitch); }
.team-desc { font-size: 1.05rem; line-height: 1.6; color: var(--text); max-width: 800px; margin: 0 auto; }
.section-title { font-size: 1.2rem; color: var(--gold); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.coach-list { display: flex; flex-direction: column; gap: 12px; }
.coach-card { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.2s; }
.coach-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.1); }
.coach-info h4 { color: var(--text); margin-bottom: 4px; }
.coach-info span { font-size: 0.85rem; color: var(--muted); }
.modal-photo-link { display: block; width: 150px; height: 150px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gold); cursor: pointer; transition: 0.3s; }
.modal-photo-link:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--gold); }
.modal-photo { width: 100%; height: 100%; object-fit: cover; }
.social-hint { display: block; text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: -15px; margin-bottom: 20px; }
</style>

function getScore(id){return scores[id]||{h:null,a:null,pen:null}}
function isPlayed(sc){return sc.h!==null&&sc.h!==''&&sc.a!==null&&sc.a!==''}
function isGroupFinished(g){
  const ms = GROUP_MATCHES.filter(m => m.g === g);
  return ms.every(m => isPlayed(getScore(m.id)));
}
function areAllGroupsFinished(){
  return 'ABCDEFGHIJKL'.split('').every(g => isGroupFinished(g));
}

function getMskDateStr(d, t) {
  if (!t) return d;
  const [h] = t.split(':').map(Number);
  if (h + 7 < 24) return d;
  const dt = new Date(d + 'T12:00:00');
  dt.setDate(dt.getDate() + 1);
  return dt.toISOString().split('T')[0];
}

function etToMsk(t){
  if(!t)return '';
  const [h,m]=t.split(':').map(Number);
  let mh=h+7,mm=m||0;
  if(mh>=24)mh-=24;
  return String(mh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function formatKickoff(t){
  const T = TRANSLATIONS[currentLang];
  if(!t)return '';
  if(currentLang === 'ru') return '🕐 ' + etToMsk(t) + ' МСК (' + t + ' ET)';
  return '🕐 '+t+' ET · '+etToMsk(t)+' '+T.msk_time;
}
function formatDate(d, t){
  const locale = currentLang;
  const targetD = currentLang === 'ru' ? getMskDateStr(d, t) : d;
  return new Date(targetD+'T12:00:00').toLocaleDateString(locale,{weekday:'short',day:'numeric',month:'short'});
}

}
function slotLabel(s){
  const T = TRANSLATIONS[currentLang];
  if(!s)return '—';
  if(s.startsWith('W'))return T.winner+' '+s.slice(1);
  if(s.startsWith('L'))return T.loser+' '+s.slice(1);
  if(/^[12][A-L]$/.test(s)) {
    const pos = s[0]==='1'? T.pos_1st + ' ' : T.pos_2nd + ' ';
    const gr = T.gr_short + ' ';
    return pos+gr+s[1];
  }
  if(s.startsWith('3@'))return T.pos_3rd + ' ' + T.to_short + s[2] + ')';
  return s;
}

function calcGroupStandings(g){
  const ids=GROUPS[g];
  const st=ids.map(id=>({id,w:0,d:0,l:0,gf:0,ga:0,pts:0,played:0}));
  const idx=id=>st.findIndex(x=>x.id===id);
  GROUP_MATCHES.filter(m=>m.g===g).forEach(m=>{
    const sc=getScore(m.id);
    if(!isPlayed(sc))return;
    const h=+sc.h,a=+sc.a;
    const hi=idx(m.h),ai=idx(m.a);
    st[hi].gf+=h;st[hi].ga+=a;st[hi].played++;
    st[ai].gf+=a;st[ai].ga+=h;st[ai].played++;
    if(h>a){st[hi].w++;st[hi].pts+=3;st[ai].l++}
    else if(h<a){st[ai].w++;st[ai].pts+=3;st[hi].l++}
    else{st[hi].d++;st[ai].d++;st[hi].pts++;st[ai].pts++}
  });
  st.forEach(s=>{s.gd=s.gf-s.ga});
  function h2h(ta,tb){
    let ap=0,bp=0,agd=0,bgd=0,agf=0,bgf=0;
    GROUP_MATCHES.filter(m=>m.g===g&&((m.h===ta&&m.a===tb)||(m.h===tb&&m.a===ta))).forEach(m=>{
      const sc=getScore(m.id);if(!isPlayed(sc))return;
      const h=+sc.h,a2=+sc.a,home=m.h===ta;
      const gf=home?h:a2,ga=home?a2:h;
      agf+=gf;bgf+=ga;agd+=gf-ga;bgd+=ga-gf;
      if(gf>ga)ap+=3;else if(gf<ga)bp+=3;else{ap++;bp++}
    });
    return{ap,bp,agd,bgd,agf,bgf};
  }
  function rankPair(a,b){
    if(a.pts!==b.pts)return b.pts-a.pts;
    const h=h2h(a.id,b.id);
    if(h.ap!==h.bp)return h.bp-h.ap;
    if(h.agd!==h.bgd)return h.bgd-h.agd;
    if(h.agf!==h.bgf)return h.bgf-h.agf;
    if(a.gd!==b.gd)return b.gd-a.gd;
    if(a.gf!==b.gf)return b.gf-a.gf;
    return (TEAMS[a.id].r||99)-(TEAMS[b.id].r||99);
  }
  st.sort((a,b)=>rankPair(a,b));
  return st.map((s,i)=>({...s,pos:i+1}));
}

function getThirdPlaces(){
  const all=[];
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const st=calcGroupStandings(g);
    if(st[2])all.push({...st[2],group:g});
  });
  all.sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.gd!==a.gd)return b.gd-a.gd;
    if(b.gf!==a.gf)return b.gf-a.gf;
    return (TEAMS[a.id].r||99)-(TEAMS[b.id].r||99);
  });
  return all;
}
function getQualifiedThirds(){return getThirdPlaces().slice(0,8);}
function getAnnexMapping(){
  const q=getQualifiedThirds();
  if(q.length<8)return null;
  return ANNEX_C[q.map(t=>t.group).sort().join('')]||null;
}
function resolveThirdForWinner(wg){
  if(!areAllGroupsFinished()) return null;
  const map=getAnnexMapping();if(!map)return null;
  const slot=map[wg];if(!slot)return null;
  const g=slot[1];
  const t=getThirdPlaces().find(x=>x.group===g);
  return t?t.id:null;
}
function resolveSlot(slot,memo={}){
  if(!slot)return null;
  if(memo[slot]!==undefined)return memo[slot];
  if(TEAMS[slot]){memo[slot]=slot;return slot}
  if(slot.startsWith('3@')){
    const id=resolveThirdForWinner(slot[2]);memo[slot]=id;return id;
  }
  if(/^3[A-L]$/.test(slot)){
    if(!isGroupFinished(slot[1])) return null;
    const st=calcGroupStandings(slot[1]);
    const id=st[2]?st[2].id:null;memo[slot]=id;return id;
  }
  if(/^[12][A-L]$/.test(slot)){
    if(!isGroupFinished(slot[1])) return null;
    const st=calcGroupStandings(slot[1]);
    const id=st[+slot[0]-1]?st[+slot[0]-1].id:null;memo[slot]=id;return id;
  }
  if(slot.startsWith('W')||slot.startsWith('L')){
    const mid=slot.slice(1);
    const m=KO.find(x=>x.id===mid);
    if(!m){memo[slot]=null;return null}
    const sc=getScore(mid);
    const hId=resolveSlot(m.h,memo),aId=resolveSlot(m.a,memo);
    if(!isPlayed(sc)){memo[slot]=null;return null}
    let h=+sc.h,a=+sc.a;
    if(h===a&&sc.pen){if(sc.pen==='h')h++;else a++}
    if(h===a){memo[slot]=null;return null}
    memo[slot]=slot[0]==='W'?(h>a?hId:aId):(h>a?aId:hId);
    return memo[slot];
  }
  memo[slot]=null;return null;
}
function getWinner(mid){return resolveSlot('W'+mid);}

function renderStandingsTable(g){
  const T = TRANSLATIONS[currentLang];
  const st=calcGroupStandings(g);
  const q8=getQualifiedThirds().map(t=>t.group);
  let h='<table class="standings"><tr><th>'+T.st_pos+'</th><th>'+T.st_team+'</th><th>'+T.st_p+'</th><th>'+T.st_w+'</th><th>'+T.st_d+'</th><th>'+T.st_l+'</th><th>'+T.st_gf+'</th><th>'+T.st_ga+'</th><th>'+T.st_gd+'</th><th>'+T.st_pts+'</th></tr>';
  st.forEach((s,i)=>{
    let cls='pos'+(i+1);
    if(i===2){cls+=' pos3';if(!q8.includes(g))cls+=' out3'}
    h+='<tr class="'+cls+'"><td>'+(i+1)+'</td><td>'+teamLabel(s.id)+'</td><td>'+s.played+'</td><td>'+s.w+'</td><td>'+s.d+'</td><td>'+s.l+'</td><td>'+s.gf+'</td><td>'+s.ga+'</td><td>'+(s.gd>0?'+':'')+s.gd+'</td><td><b>'+s.pts+'</b></td></tr>';
  });
  return h+'</table>';
}

      const m=KO.find(x=>x.id===id);
      const sc=getScore(id);
      const hId=resolveSlot(m.h),aId=resolveSlot(m.a);
      const w=getWinner(id);
      h+='<div class="br-slot"><b>'+id+'</b> '+(STAGE_T[m.s]?STAGE_T[m.s][currentLang]:m.s)+'<br>'+formatKickoff(m.t)+'<br><span onclick="goToStadiumByVenue(\''+m.v.replace(/'/g, "\\'")+'\')" style="cursor:pointer;text-decoration:underline">'+tCity(m.v)+'</span><br>';

      if(w)h+='<br>→ <span style="color:var(--gold)">'+teamLabel(w)+'</span>';
      h+='</div>';
    });
    h+='</div>';
  });
  document.getElementById('panel5').innerHTML=h+'</div></div>';
  const champ=getWinner('M104');
  const banner=document.getElementById('championBanner');

    { "name": { "ru": "Николас Гонсалес", "en": "Nicolás González" }, "pos": "forward", "status": "Regular", "story": { "ru": "Вингер из «Атлетико», который наконец-то играет на ЧМ. Пропустил ЧМ-2022 из-за травмы, но вернулся сильнее. Его скорость, дриблинг и удары с обеих ног делают его опасным на любом фланге.", "en": "Winger from Atlético who finally plays at a World Cup. Missed WC 2022 due to injury but returned stronger. His speed, dribbling, and two-footed shooting make him dangerous on any flank." }, "image": "https://i.ytimg.com/vi/RSjieBMQsj8/maxresdefault.jpg?sqp=-oaymwEmCIAKENAF8quKqQMa8AEB-AH-CYAC0AWKAgwIABABGGUgVyhNMA8=&amp;rs=AOn4CLCuprmhgli2JRvRZzEqAmdamlh1ag" },

    { "name": { "ru": "Херонимо Рульи", "en": "Gerónimo Rulli" }, "pos": "goalkeeper", "status": "Regular", "story": { "ru": "Вратарь «Марселя» с опытом выступлений в Ла Лиге. Олимпийский чемпион 2016 года. Его игра ногами и спокойствие под давлением — важная альтернатива Мартинесу.", "en": "Marseille goalkeeper with La Liga experience. 2016 Olympic Champion. His footwork and composure under pressure are an important alternative to Martínez." }, "image": "https://img.championat.com/s/1350x900/news/big/w/h/vratar-ayaksa-ruli-mozhet-perejti-v-marsel-fabricio-romano_17228723111795278335.jpg" },
    
    { "name": { "ru": "Хуан Муссо", "en": "Juan Musso" }, "pos": "goalkeeper", "status": "Regular", "story": { "ru": "Вратарь «Атлетико», резервист Облака. Опытный голкипер с играми за сборную. Его рефлексы и уверенность в воротах дают Скалони спокойствие за глубину позиции.", "en": "Atlético goalkeeper, Oblak's backup. Experienced keeper with national team caps. His reflexes and confidence in goal give Scaloni peace of mind about positional depth." }, "image": "https://cdn.footboom.net/img/upload/5/ac45f-khuan-musso.jpeg" },
    
    { "name": { "ru": "Джовани Ло Чельсо", "en": "Giovani Lo Celso" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Плеймейкер из «Бетиса», который пропустил ЧМ-2022 из-за травмы, но был с командой и получил медаль. Дебютировал против России в 2017. Его техника и креативность — опция для взлома плотной обороны.", "en": "Playmaker from Betis who missed WC 2022 due to injury but stayed with the team and got his medal. Debuted against Russia in 2017. His technique and creativity are options to break down tight defenses." }, "image": "https://i.pinimg.com/736x/4b/25/cf/4b25cff7c8f16e2c085982372e5acd0f.jpg" },
    
    { "name": { "ru": "Тьяго Альмада", "en": "Thiago Almada" }, "pos": "forward", "status": "Regular", "story": { "ru": "Вундеркинд из «Ботафого». В 21 год уже чемпион мира (сыграл 6 минут в 2022). Его дриблинг, скорость и нестандартное мышление — будущее аргентинского футбола уже сейчас.", "en": "Wonderkid from Botafogo. At 21, already a World Champion (played 6 minutes in 2022). His dribbling, speed, and unconventional thinking are the future of Argentine football — right now." }, "image": "https://assets.goal.com/images/v3/blt2c2d601e9ed9f782/GOAL_-_Blank_WEB_-_Facebook_-_2024-01-30T085703.842.jpg" },
    
    { "name": { "ru": "Леонардо Балерди", "en": "Leonardo Balerdi" }, "pos": "defender", "status": "Regular", "story": { "ru": "Капитан «Марселя» в 27 лет. Защитник с 11 матчами за сборную. Его рост, игра в воздухе и лидерские качества — важное усиление обороны. Скалони видит в нем надежность на годы вперед.", "en": "Marseille captain at 27. Defender with 11 national team caps. His height, aerial ability, and leadership are important defensive reinforcements. Scaloni sees reliability in him for years to come." }, "image": "https://www.sport.fr/wp-content/uploads/2024/11/ICONSPORT_241000_0444-jpg.webp" },
    
    { "name": { "ru": "Факундо Медина", "en": "Facundo Medina" }, "pos": "defender", "status": "Regular", "story": { "ru": "Центральный защитник «Ланса» с 10 играми за сборную. Универсал, который может сыграть и слева. Его скорость и умение начинать атаки из глубины — современный профиль защитника.", "en": "Lens center-back with 10 national team caps. Versatile player who can also play on the left. His speed and ability to start attacks from deep is the modern defender profile." }, "image": "https://cdn.yeniakit.com.tr/images/album/baskan-transferi-baslatti-agbadounun-yanina-facundo-medina-besiktasa-berlin-duvari-79e50b.png" },
    
    { "name": { "ru": "Джулиано Симеоне", "en": "Giuliano Simeone" }, "pos": "forward", "status": "Regular", "story": { "ru": "Сын Диего Симеоне! Форвард «Наполи» несет футбольную ДНК отца — агрессию, прессинг и жажду борьбы. В 23 года он доказывает, что достоин фамилии не только именем, но и делом.", "en": "Diego Simeone's son! The Napoli forward carries his father's football DNA — aggression, pressing, and fighting spirit. At 23, he proves he's worthy of the surname not just by name, but by deeds." }, "image": "https://i.pinimg.com/736x/43/e7/1b/43e71b5b1561f7476e2cbcae29c477d6.jpg" },
    
    { "name": { "ru": "Нико Пас", "en": "Nicolás Paz" }, "pos": "forward", "status": "Regular", "story": { "ru": "21-летняя звезда «Комо»! Сын экс-игрока «Реала». Прорыв сезона в Серии А, его техника, видение поля и зрелость не по годам впечатлили Скалони. Будущее атаки Аргентины после Месси.", "en": "21-year-old star of Como! Son of a former Real Madrid player. Breakthrough of the season in Serie A, his technique, vision, and maturity beyond his years impressed Scaloni. The future of Argentina's attack after Messi." }, "image": "https://i.pinimg.com/736x/71/ec/b8/71ecb8c1a9dc218513d3cb3471e1a1e5.jpg" },
    
    { "name": { "ru": "Валентин Барко", "en": "Valentín Barco" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Сенсация в 21 год! Левый латераль/полузащитник «Страсбура», за которого борется «Челси». Всего 2 матча за сборную, но Скалони видит в нем будущую звезду. Универсал с отличным потенциалом.", "en": "Sensation at 21! Left-back/midfielder from Strasbourg, chased by Chelsea. Only 2 national team caps, but Scaloni sees a future star. A versatile player with excellent potential." }, "image": "https://livesport-ott-images.ssl.cdn.cra.cz/r1200xfq60/147fd477-e547-47dd-97c1-6be6f534b49a.jpeg" },
    
    { "name": { "ru": "Хосе Мануэль Лопес", "en": "José Manuel López" }, "pos": "forward", "status": "Regular", "story": { "ru": "Нападающий «Палмейраса» — неожиданный выбор Скалони. Мощный форвард с хорошим ударом. Его включение в состав — риск тренера, который верит, что свежая кровь может стать козырем в Северной Америке.", "en": "Palmeiras striker — Scaloni's unexpected choice. Powerful forward with a good shot. His inclusion is a coach's gamble, believing fresh blood could be a trump card in North America." }, "image": "https://football-talk.co.uk/wp-content/uploads/2026/02/Flaco-Lopez-1000x600.jpeg" }
  ]
},
"FRA": {
  "desc": {
    "ru": "Двукратные чемпионы мира, представляющие собой просто футбольную машину - «Ле Блё» - под руководством Дидье Дешама — симфония атлетизма, тактической гибкости и индивидуальности. С одним из самых глубоких и звездных составов в истории, французы нацелены вернуть себе трон, демонстрируя футбол высочайшего качества.",
   "en": "Two-time world champions, a perfect football machine. 'Les Bleus' under Didier Deschamps is a symphony of athleticism, tactical flexibility, and individual genius. With one of the deepest and most star-studded squads in history, the French aim to reclaim their throne, showcasing football of the highest caliber."

  },
  "coaches": [{ "name": { "ru": "Дидье Дешам", "en": "Didier Deschamps" }, "story": { "ru": "Выиграл чемпионат мира и как игрок, и как тренер. Символ стабильности французского футбола.", "en": "Won the World Cup as both a player and a coach. A symbol of stability in French football." }, "image": "https://image.assets.pressassociation.io/v2/image/production/b3a97519b933bb3eb67b266716ca4c84Y29udGVudHNlYXJjaGFwaSwxNjcwMTU0Mjc3/2.69971812.jpg?w=1280" }],
  "players": [
    { "name": { "ru": "Килиан Мбаппе", "en": "Kylian Mbappé" }, "pos": "forward", "status": "Captain", "story": { "ru": "Один из лучших игроков планеты. Его скорость и завершение атак делают его кошмаром для любого защитника.", "en": "One of the best players on the planet. His speed and clinical finishing make him a nightmare for any defender." }, "image": "https://placehold.co/300x300?text=Kylian+Mbappe" },
    
    { "name": { "ru": "Майк Меньян", "en": "Mike Maignan" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "«Стена Милана» — один из лучших вратарей мира. Чемпион Серии А, его рефлексы и игра ногами на уровне элиты. В 30 лет он на пике формы и готов защищать ворота Франции от любых атак.", "en": "The 'Wall of Milan' — one of the world's best goalkeepers. Serie A champion, his reflexes and footwork are elite level. At 30, he's in peak form and ready to guard France's goal against any attack." }, "image": "https://placehold.co/300x300?text=Mike+Maignan" },
    
    { "name": { "ru": "Брис Самба", "en": "Brice Samba" }, "pos": "goalkeeper", "status": "Regular", "story": { "ru": "Ветеран из «Ренна» в 32 года. Прошел путь от английской Премьер-лиги до сборной. Его опыт, рост 188 см и спокойствие под давлением делают его надежной страховкой для Меньяна.", "en": "Veteran from Rennes at 32. Journeyed from English Premier League to the national team. His experience, 188cm height, and composure under pressure make him reliable backup for Maignan." }, "image": "https://placehold.co/300x300?text=Brice+Samba" },
    
    { "name": { "ru": "Робен Риссер", "en": "Robin Risser" }, "pos": "goalkeeper", "status": "Regular", "story": { "ru": "Сенсация в 21 год! Вратарь «Ланса» с ростом 192 см — самый молодой в составе. Его включение — ставка Дешама на будущее. Всего несколько матчей за сборную, но потенциал огромен.", "en": "Sensation at 21! The Lens goalkeeper stands 192cm tall — the youngest in the squad. His inclusion is Deschamps' bet on the future. Only a few caps, but enormous potential." }, "image": "https://placehold.co/300x300?text=Robin+Risser" },
    
    { "name": { "ru": "Мало Густо", "en": "Malo Gusto" }, "pos": "defender", "status": "Regular", "story": { "ru": "Правый защитник «Челси» в 23 года. Восходящая звезда французского футбола. Его скорость, техника и умение подключаться к атакам — современное оружие на фланге. Будущее обороны «Ле Блё».", "en": "Chelsea right-back at 23. Rising star of French football. His speed, technique, and ability to join attacks are modern weapons on the flank. The future of 'Les Bleus' defense." }, "image": "https://placehold.co/300x300?text=Malo+Gusto" },
    
    { "name": { "ru": "Люка Динь", "en": "Lucas Digne" }, "pos": "defender", "status": "Regular", "story": { "ru": "Опытный левый защитник «Астон Виллы» в 32 года. Ветеран с опытом «Барселоны» и «Эвертона». Его навесы, стандарты и надежность — важный элемент тактики Дешама на ЧМ-2026.", "en": "Experienced left-back from Aston Villa at 32. Veteran with Barcelona and Everton experience. His crosses, set pieces, and reliability are key elements of Deschamps' tactics at WC 2026." }, "image": "https://placehold.co/300x300?text=Lucas+Digne" },
    
    { "name": { "ru": "Дайо Упамекано", "en": "Dayot Upamecano" }, "pos": "defender", "status": "Star", "story": { "ru": "Центральный защитник «Баварии» — скала французской обороны. В 27 лет он на пике карьеры. Его мощь, игра в воздухе и чтение игры делают его одним из лучших ЦЗ мира. Финалист ЧМ-2022.", "en": "Bayern Munich center-back — a rock of French defense. At 27, he's at his career peak. His power, aerial ability, and game reading make him one of the world's best CBs. 2022 WC finalist." }, "image": "https://placehold.co/300x300?text=Dayot+Upamecano" },
    
    { "name": { "ru": "Жюль Кунде", "en": "Jules Koundé" }, "pos": "defender", "status": "Star", "story": { "ru": "Универсал из «Барселоны» — может сыграть и ЦЗ, и правого защитника. Финалист ЧМ-2022, его скорость и техника позволяют адаптироваться к любой тактике. Один из самых гибких защитников мира.", "en": "Barcelona utility man — can play CB or right-back. 2022 WC finalist, his speed and technique allow him to adapt to any tactics. One of the most versatile defenders in the world." }, "image": "https://placehold.co/300x300?text=Jules+Kounde" },
    
    { "name": { "ru": "Ибраима Конате", "en": "Ibrahima Konaté" }, "pos": "defender", "status": "Regular", "story": { "ru": "Гигант из «Ливерпуля» — рост 193 см, мощь и скорость. В 27 лет он один из самых перспективных ЦЗ мира. Чемпион Англии, его игра в воздухе и отборы — кошмар для нападающих.", "en": "The giant from Liverpool — 193cm tall, powerful and fast. At 27, he's one of the most promising CBs in the world. English champion, his aerial game and tackles are a nightmare for strikers." }, "image": "https://placehold.co/300x300?text=Ibrahima+Konate" },
    
    { "name": { "ru": "Вильям Салиба", "en": "William Saliba" }, "pos": "defender", "status": "Star", "story": { "ru": "«Новый Видаль» из «Арсенала» — рост 193 см, но с техникой полузащитника. В 25 лет он уже лидер обороны «канониров». Его элегантность, чтение игры и хладнокровие — будущее французской обороны.", "en": "The 'New Vidal' from Arsenal — 193cm tall but with a midfielder's technique. At 25, he's already the leader of the Gunners' defense. His elegance, game reading, and composure are the future of French defense." }, "image": "https://placehold.co/300x300?text=William+Saliba" },
    
    { "name": { "ru": "Тео Эрнандес", "en": "Theo Hernandez" }, "pos": "defender", "status": "Star", "story": { "ru": "Атакующий левый защитник из «Аль-Хиляля». Брат Люки Эрнандеса, финалист ЧМ-2022. Его скорость, дриблинг и голы с фланга делают его уникальным оружием. Один из самых опасных латералей мира.", "en": "Attacking left-back from Al-Hilal. Lucas Hernandez's brother, 2022 WC finalist. His speed, dribbling, and goals from the flank make him a unique weapon. One of the most dangerous wing-backs in the world." }, "image": "https://placehold.co/300x300?text=Theo+Hernandez" },
    
    { "name": { "ru": "Люка Эрнандес", "en": "Lucas Hernandez" }, "pos": "defender", "status": "Regular", "story": { "ru": "Чемпион мира 2018, универсал из ПСЖ. Может сыграть и слева, и в центре обороны. Его опыт, лидерство и самоотверженность — важный элемент для Дешама. Брат Тео Эрнандеса.", "en": "2018 World Champion, PSG utility player. Can play left-back or center-back. His experience, leadership, and dedication are important for Deschamps. Theo Hernandez's brother." }, "image": "https://placehold.co/300x300?text=Lucas+Hernandez" },
    
    { "name": { "ru": "Максанс Лакруа", "en": "Maxence Lacroix" }, "pos": "defender", "status": "Regular", "story": { "ru": "Центральный защитник «Кристал Пэлас» в 26 лет. Рост 190 см, мощь и игра в воздухе. Его включение в состав — признание отличного сезона в АПЛ. Надежная опция для ротации в обороне.", "en": "Crystal Palace center-back at 26. 190cm tall, powerful and strong in the air. His inclusion recognizes an excellent Premier League season. A reliable option for defensive rotation." }, "image": "https://placehold.co/300x300?text=Maxence+Lacroix" },
    
    { "name": { "ru": "Ману Коне", "en": "Manu Koné" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Опорный полузащитник «Ромы» в 25 лет. Энерджайзер с невероятным объемом работы. Его отборы, прессинг и простота — идеальный баланс для атакующих партнеров. Новый двигатель сборной.", "en": "Roma defensive midfielder at 25. An energizer with incredible work rate. His tackles, pressing, and simplicity provide perfect balance for attacking partners. The new engine of the national team." }, "image": "https://placehold.co/300x300?text=Manu+Kone" },
    
    { "name": { "ru": "Орельен Чуамени", "en": "Aurélien Tchouaméni" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Новый Макелеле» из «Реала» — один из лучших опорников мира. В 26 лет он уже чемпион Лиги чемпионов. Его отборы, чтение игры и длинные передачи — фундамент полузащиты Франции.", "en": "The 'New Makelele' from Real Madrid — one of the world's best defensive midfielders. At 26, he's already a Champions League winner. His tackles, game reading, and long passes are the foundation of France's midfield." }, "image": "https://placehold.co/300x300?text=Aurelien+Tchouameni" },
    
    { "name": { "ru": "Н'Голо Канте", "en": "N'Golo Kanté" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Легенда в 35 лет! Чемпион мира 2018 и Европы 2021. Канте из «Фенербахче» вернулся в сборную — его работоспособность, скромность и умение перехватывать мячи не имеют аналогов. Вечный двигатель.", "en": "Legend at 35! 2018 World Champion and 2021 European Champion. Kanté from Fenerbahce returned to the national team — his work rate, humility, and ball-winning ability are unmatched. The eternal engine." }, "image": "https://placehold.co/300x300?text=NGolo+Kante" },
    
    { "name": { "ru": "Адриен Рабио", "en": "Adrien Rabiot" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Универсал из «Милана» в 31 год. Рост 190 см, техника и видение поля. Финалист ЧМ-2022, его опыт и класс важны для баланса команды. Может сыграть и опорника, и атакующего полузащитника.", "en": "AC Milan utility player at 31. 190cm tall with technique and vision. 2022 WC finalist, his experience and class are crucial for team balance. Can play defensive or attacking midfield." }, "image": "https://placehold.co/300x300?text=Adrien+Rabiot" },
    
    { "name": { "ru": "Варрен Заир-Эмери", "en": "Warren Zaïre-Emery" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Вундеркинд в 20 лет! Самый молодой игрок ПСЖ в истории Лиги 1. Его техника, зрелость и хладнокровие не по годам поражают. Будущее французского футбола уже сейчас играет ключевую роль.", "en": "Wonderkid at 20! PSG's youngest player in Ligue 1 history. His technique, maturity, and composure beyond his years are astonishing. The future of French football is already playing a key role." }, "image": "https://placehold.co/300x300?text=Warren+Zaire-Emery" },
    
    { "name": { "ru": "Райан Шерки", "en": "Rayan Cherki" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Маг из «Манчестер Сити» в 22 года. Его дриблинг, креативность и нестандартные решения — оружие против плотной обороны. Долго ждал вызова в сборную, но наконец-то доказал Гвардиоле и Дешаму.", "en": "The magician from Manchester City at 22. His dribbling, creativity, and unconventional solutions are weapons against tight defenses. Waited long for a national team call-up, but finally proved himself to Guardiola and Deschamps." }, "image": "https://placehold.co/300x300?text=Rayan+Cherki" },
    
    { "name": { "ru": "Магнес Аклиуш", "en": "Maghnes Akliouche" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Плеймейкер «Монако» в 24 года. Его видение поля, точность передач и удары издали впечатлили Дешама. Воспитанник академии «Монако», он приносит свежую кровь в полузащиту сборной.", "en": "Monaco playmaker at 24. His vision, passing accuracy, and long-range shooting impressed Deschamps. A Monaco academy graduate, he brings fresh blood to the national team midfield." }, "image": "https://placehold.co/300x300?text=Maghnes+Akliouche" },
    
    { "name": { "ru": "Усман Дембеле", "en": "Ousmane Dembélé" }, "pos": "forward", "status": "Star", "story": { "ru": "Чемпион мира 2018 из ПСЖ в 29 лет. Его скорость, дриблинг и непредсказуемость — кошмар для защитников. После проблем с травмами он вернулся сильнее и готов сиять на ЧМ-2026.", "en": "2018 World Champion from PSG at 29. His speed, dribbling, and unpredictability are a nightmare for defenders. After injury problems, he returned stronger and ready to shine at WC 2026." }, "image": "https://placehold.co/300x300?text=Ousmane+Dembélé" },
    
    { "name": { "ru": "Маркус Тюрам", "en": "Marcus Thuram" }, "pos": "forward", "status": "Star", "story": { "ru": "Сын легенды Лилиана Тюрама! Нападающий «Интера» в 28 лет — мощь, скорость и техника. Брат Кхефрена Тюрама (тоже в сборной). Его игра спиной к воротам и завершение — важное оружие для Франции.", "en": "Son of legend Lilian Thuram! Inter Milan striker at 28 — power, speed, and technique. Khephren Thuram's brother (also in the squad). His hold-up play and finishing are important weapons for France." }, "image": "https://placehold.co/300x300?text=Marcus+Thuram" },
    
    { "name": { "ru": "Майкл Олизе", "en": "Michael Olise" }, "pos": "forward", "status": "Star", "story": { "ru": "Звезда «Баварии» в 24 года! Его левая нога — произведение искусства. Техника, дриблинг и удары с любой точки — будущее атаки Франции. Сын экс-игрока сборной, он несет футбольную ДНК.", "en": "Bayern Munich star at 24! His left foot is a work of art. Technique, dribbling, and shooting from any point — the future of France's attack. Son of a former national team player, he carries football DNA." }, "image": "https://placehold.co/300x300?text=Michael+Olise" },
    
    { "name": { "ru": "Брэдли Барколя", "en": "Bradley Barcola" }, "pos": "forward", "status": "Regular", "story": { "ru": "Вингер ПСЖ в 23 года. Его скорость, дриблинг и голы за «Пари Сен-Жермен» сделали его одним из самых ярких молодых игроков Франции. Энергия и молодость — его козыри на ЧМ-2026.", "en": "PSG winger at 23. His speed, dribbling, and goals for Paris Saint-Germain made him one of France's brightest young players. Energy and youth are his trump cards at WC 2026." }, "image": "https://placehold.co/300x300?text=Bradley+Barcola" },
    
    { "name": { "ru": "Дезире Дуэ", "en": "Désiré Doué" }, "pos": "forward", "status": "Regular", "story": { "ru": "Вундеркинд ПСЖ в 21 год! Брат Йена Дуэ (игрок «Ренна»). Его техника, видение поля и зрелость не по годам впечатлили Дешама. Один из самых перспективных талантов французского футбола.", "en": "PSG wonderkid at 21! Yann Gboho's brother (Rennes player). His technique, vision, and maturity beyond his years impressed Deschamps. One of the most promising talents in French football." }, "image": "https://placehold.co/300x300?text=Desire+Doue" },
    
    { "name": { "ru": "Жан-Филипп Матета", "en": "Jean-Philippe Mateta" }, "pos": "forward", "status": "Regular", "story": { "ru": "Таргетмен «Кристал Пэлас» в 28 лет. Рост 193 см, мощь и игра в воздухе. Его включение — ставка на физическое доминирование. Опытный нападающий с голом за сборную, готовый усилить атаку.", "en": "Crystal Palace target man at 28. 193cm tall, powerful and strong in the air. His inclusion is a bet on physical dominance. Experienced striker with a national team goal, ready to strengthen the attack." }, "image": "https://placehold.co/300x300?text=Jean-Philippe+Mateta" }
  ]
},
"USA": {
    "desc": {
      "ru": "Сборная США вступает в свою «золотую эру», полную амбиций и молодых звезд из лучших лиг Европы. Играя дома, «Янкиз» чувствуют за спиной дыхание всей нации. Это команда новой волны, готовая бросить вызов традиционным грандам и доказать, что соккер в Америке - обрел своё величие.",
      "en": "The US national team is entering its 'golden era', full of ambition and young stars from Europe's top leagues. Playing at home, the 'Yankees' feel the breath of the entire nation behind them. This is a new wave team, ready to challenge traditional giants and prove that soccer in America has found its true strength and greatness."
    },
    "coaches": [
      {
        "name": {
          "ru": "Маурисио Почеттино",
          "en": "Mauricio Pochettino"
        },
        "story": {
          "ru": "Звездный тренер, возглавивший сборную США для прорыва на домашнем ЧМ.",
          "en": "Star coach who took charge of the US national team for a breakthrough at the home World Cup."
        },
        "image": "https://placehold.co/300x300?text=Mauricio+Pochettino"
      }
    ],
    "players": [
      {
        "name": {
          "ru": "Кристиан Пулишич",
          "en": "Christian Pulisic"
        },
        "pos": "forward",
        "status": "Captain",
        "story": {
          "ru": "«Капитан Америка» и главная звезда сборной. Лидер атаки и самый узнаваемый игрок команды.",
          "en": "'Captain America' and the national team's main star. The attacking leader and most recognizable player on the team."
        },
        "image": "https://placehold.co/300x300?text=Christian+Pulisic"
      },
      { "name": { "ru": "Мэтт Тёрнер", "en": "Matt Turner" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "Ветеран, покоривший английскую Премьер-лигу в составе «Арсенала». Его акробатические сейвы и лидерские качества делают его безальтернативным первым номером на домашнем мундиале.", "en": "A veteran who conquered the English Premier League with Arsenal. His acrobatic saves and leadership make him the undisputed number one for the home World Cup." } },
      { "name": { "ru": "Итан Хорват", "en": "Ethan Horvath" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Непреклонный голкипер, который преодолел тяжелейшие травмы, чтобы стать звездой АПЛ. Его мастерство отражения пенальти превращает его в кошмар для нападающих.", "en": "A resilient goalkeeper who overcame severe injuries to become a Premier League staple. His penalty-saving expertise makes him a nightmare for strikers." } },
      { "name": { "ru": "Патрик Шulte", "en": "Patrick Schulte" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "Восходящая звезда из «Коламбус Крю». В свои 25 лет он олицетворяет светлое будущее вратарской линии США, привнося взрывную атлетичность в ворота сборной.", "en": "A rising star from Columbus Crew. At just 25, he represents the bright future of US goalkeeping, bringing explosive athleticism to the national team." } },

      { "name": { "ru": "Антони Робинсон", "en": "Antonee Robinson" }, "pos": "defender", "status": "Star", "story": { "ru": "«Джедай» из «Фулхэма», неутомимо снующий по всей бровке. Его забегания и навесы — одно из главных атакующих оружий «Янкиз».", "en": "The 'Jedi' of Fulham, a tireless left-back who bombs up and down the flank. His overlapping runs and crosses are a primary weapon for the US attack." } },
      { "name": { "ru": "Сержиньо Дест", "en": "Sergiño Dest" }, "pos": "defender", "status": "Star", "story": { "ru": "Техничный фулбек, украшавший газоны «Барселоны» и «Милана». Его дриблинг на фланге не имеет равных в сборной, а скорость позволяет успевать в оборону.", "en": "The technically gifted right-back who has graced the pitches of Barcelona and AC Milan. His dribbling skills on the flank are unmatched in the squad." } },
      { "name": { "ru": "Джо Скалли", "en": "Joe Scally" }, "pos": "defender", "status": "Rising", "story": { "ru": "Современный латераль, блистающий в Бундеслиге за «Боруссию» из Мёнхенгладбаха. Его тактический интеллект и физическая мощь идеально вписываются в систему Почеттино.", "en": "A modern full-back thriving in the Bundesliga with Gladbach. His tactical intelligence and physicality make him a perfect fit for Pochettino's system." } },
      { "name": { "ru": "Кэмерон Картер-Викерс", "en": "Cameron Carter-Vickers" }, "pos": "defender", "status": "Star", "story": { "ru": "Кельтский колосс. Родившись в США, он выбрал звездно-полосатый флаг и стал скалой в центре обороны, доминируя на втором этаже.", "en": "The Celtic colossus. US-born, he chose the Stars and Stripes and has become a rock in the heart of the defense, dominating in the air." } },
      { "name": { "ru": "Марк Маккензи", "en": "Mark McKenzie" }, "pos": "defender", "status": "Star", "story": { "ru": "Командир обороны, перенесший свой опыт из Серии А во французский «Тулуза». Его спокойствие с мячом и игра в воздухе критически важны для команды.", "en": "A commanding center-back who brought his Serie A experience to France with Toulouse. His calmness on the ball and aerial prowess are crucial." } },
      { "name": { "ru": "Уокер Циммерман", "en": "Walker Zimmerman" }, "pos": "defender", "status": "Legend", "story": { "ru": "Легенда MLS и капитан «Нэшвилла». Ветеран предыдущих чемпионатов мира, его лидерство и организаторские таланты — фундамент защитной линии.", "en": "An MLS legend and Nashville SC captain. A veteran of previous World Cups, his leadership and organizational skills are the bedrock of the backline." } },
      { "name": { "ru": "Крис Ричардс", "en": "Chris Richards" }, "pos": "defender", "status": "Squad", "story": { "ru": "Защитник, закаленный в баварской кузнице кадров. После опыта в «Баварии» он привносит в сборную США элитную европейскую дисциплину и хладнокровие.", "en": "A defender forged in the Bavarian academy. After his time at Bayern Munich, he brings European elite discipline and composure to the US center-back position." } },
      { "name": { "ru": "Майлз Робинсон", "en": "Miles Robinson" }, "pos": "defender", "status": "Star", "story": { "ru": "«Танк». Его грубая физическая мощь и скорость восстановления делают его одним из самых страшных защитников КОНКАКАФ. Настоящая стена.", "en": "The 'Tank'. His sheer physical power and recovery speed make him one of the most formidable defenders in CONCACAF. A true wall." } },

      { "name": { "ru": "Уэстон Маккенни", "en": "Weston McKennie" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Мотор» туринского «Ювентуса». Настоящий воин «бокс-ту-бокс», способный закрыть любую позицию в полузащите. Его прыгучесть на стандартах легендарна.", "en": "The 'Motor' of Juventus. A true box-to-box warrior who can play anywhere in the midfield. His aerial threat on set pieces is legendary." } },
      { "name": { "ru": "Тайлер Адамс", "en": "Tyler Adams" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Генерал полузащиты. Несмотря на проблемы с травмами, его безжалостный прессинг и тактическая дисциплина делают его сердцем команды, когда он на поле.", "en": "The midfield general. Despite injury setbacks, his relentless pressing and tactical discipline make him the heartbeat of the team when fit." } },
      { "name": { "ru": "Юнус Муса", "en": "Yunus Musah" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Маэстро из «Милана». Родился в Италии, вырос в Англии, но выбрал США. Его бархатный прием мяча и умение диктовать темп — на мировом уровне.", "en": "The Milan maestro. Born in Italy, raised in England, but chose the USA. His silky touch and ability to dictate tempo are world-class." } },
      { "name": { "ru": "Джио Рейна", "en": "Gio Reyna" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Вундеркинд, ставший самым молодым игроком в истории Бундеслиги. Сын легенды USMNT Клаудио Рейны. Его видение поля и креативность способны взломать любую оборону за долю секунды.", "en": "The prodigious playmaker. Once the youngest player in Bundesliga history. Son of USMNT legend Claudio Reyna. His vision and creativity can unlock any defense in a split second." } },
      { "name": { "ru": "Брендон Ааронсон", "en": "Brenden Aaronson" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Белый Пеле». Безжалостная машина прессинга, которая никогда не останавливается. Его работоспособность и голевое чутье из полузащиты бесценны.", "en": "The 'White Pele'. A relentless pressing machine who never stops running. His work rate and goal-scoring instinct from midfield are invaluable." } },
      { "name": { "ru": "Джонни Кардосо", "en": "Johnny Cardoso" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "Опорник из «Атлетико Минейро». Привнося южноамериканскую жесткость и тактическую гибкость, он является главным разрушителем атак и начальной точкой контрвыпадов.", "en": "The Atlético Mineiro enforcer. Bringing South American grit and tactical flexibility, he is the ultimate midfield destroyer and transition starter." } },
      { "name": { "ru": "Малик Тиллман", "en": "Malik Tillman" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "Универсальный атакующий хавбек. Играя на позиции «десятки» или на фланге, его мощные удары и физическое присутствие создают постоянную угрозу.", "en": "The versatile attacker. Whether playing as a 10 or a winger, his powerful shooting and physical presence make him a constant threat." } },
      { "name": { "ru": "Келлин Акоста", "en": "Kellyn Acosta" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Ветеран «ЛАФК». Настоящий тактический хамелеон, способный сыграть как в опорной зоне, так и в центре обороны. Его опыт — клей, скрепляющий полузащиту.", "en": "The LAFC veteran. The ultimate tactical chameleon who can play as a defensive mid or center-back. His experience is the glue that holds the midfield together." } },

      { "name": { "ru": "Тимоти Уэа", "en": "Timothy Weah" }, "pos": "forward", "status": "Star", "story": { "ru": "Скоростной вингер со знаменитой футбольной династией (сын легендарного Джорджа Веа). Его взрывная скорость на правом фланге и хладнокровие в штрафной — постоянная опасность.", "en": "The speedster with a famous footballing bloodline (son of the legendary George Weah). His blistering pace on the right wing and clinical finishing make him a constant danger." } },
      { "name": { "ru": "Фоларин Балогун", "en": "Folarin Balogun" }, "pos": "forward", "status": "Star", "story": { "ru": "Нападающий «Монако». Родился в Нью-Йорке, вырос в Лондоне, а блистает во Франции. Его движение без мяча и реализация моментов — на элитном уровне.", "en": "The Monaco striker. Born in New York, raised in London, and starring in France. His movement off the ball and clinical finishing are elite." } },
      { "name": { "ru": "Рикардо Пепи", "en": "Ricardo Pepi" }, "pos": "forward", "status": "Star", "story": { "ru": "Голевая машина из ПСВ. Американский страйкер нашел свою игру в Эредивизи, став смертоносным финишером в европейском топ-футболе.", "en": "The PSV goal machine. The American striker has found his scoring boots in the Eredivisie, becoming a lethal finisher in the European top flight." } },
      { "name": { "ru": "Джош Сарджент", "en": "Josh Sargent" }, "pos": "forward", "status": "Star", "story": { "ru": "Талисман «Норвич Сити». Непрестанный труженик, который никогда не сдается. Его прессинг и игра в подыгрыше жизненно важны для атаки США.", "en": "The Norwich City talisman. A hard-working striker who never gives up on a lost cause. His pressing and hold-up play are vital for the US attack." } },
      { "name": { "ru": "Хаджи Райт", "en": "Haji Wright" }, "pos": "forward", "status": "Star", "story": { "ru": "Гигант в атаке. При росте 193 см его игра на втором этаже и мощные удары сделали его героем ЧМ-2022, и он остается опасным таргетменом.", "en": "The giant forward. Standing at 193 cm, his aerial ability and powerful strikes made him a hero in the 2022 World Cup, and he remains a dangerous target man." } },
      { "name": { "ru": "Кевин Паредес", "en": "Kevin Paredes" }, "pos": "forward", "status": "Rising", "story": { "ru": "Юный волшебник из «Вольфсбурга». Один из самых захватывающих подростковых талантов в Бундеслиге, его дриблинг и бесстрашие привносят новое измерение в атаку.", "en": "The young wizard from Wolfsburg. One of the most exciting teenage talents in the Bundesliga, his dribbling and fearlessness bring a new dimension to the attack." } }
    ]
},
"BRA": {
  "desc": {
    "ru": "Пятикратные чемпионы мира, для которых футбол — это танец, мяч — продолжение души. «Селесао-Пентакампеоны» всегда выходят на поле как фавориты, неся в себе дух Пеле и Гарринчи. Спустя 24 года ожидания, Бразилия готова вновь раскрасить мир в желто-зеленые цвета, напоминая всем, почему их называют кудесниками мяча.",
    "en": "Five-time world champions for whom football is a dance and the ball is an extension of the soul. The 'Seleção' always take the field as favorites, carrying the spirit of Pelé and Garrincha. After 24 years of waiting, Brazil is ready to paint the world yellow and green again, reminding everyone why they are called the masters of the ball."

  },
 "coaches": [{
  "name": { "ru": "Карло Анчелотти", "en": "Carlo Ancelotti" },
  "story": {
    "ru": "Легендарный итальянский тренер, выигравший Лигу чемпионов 5 раз. Возглавил Бразилию в 2025 году.",
    "en": "Legendary Italian coach with 5 Champions League titles. Took charge of Brazil in 2025."
  },
  "image": "https://placehold.co/300x300?text=Carlo+Ancelotti"
}],
  "players": [
    { "name": { "ru": "Винисиус Жуниор", "en": "Vinícius Júnior" }, "pos": "forward", "status": "Star", "story": { "ru": "Один из лучших дриблеров мира и лидер атаки мадридского «Реала».", "en": "One of the best dribblers in the world and an attacking leader for Real Madrid." }, "image": "https://placehold.co/300x300?text=Vinicius+Jr" },
    
    { "name": { "ru": "Алиссон Бекер", "en": "Alisson Becker" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "«Стена Ливерпуля» — один из лучших вратарей мира. Обладатель «Золотой перчатки» и победитель Лиги чемпионов. Его спокойствие, игра ногами и невероятные сейвы делают его первым номером сборной. Алиссон — это надежность и класс на высочайшем уровне.", "en": "The 'Wall of Liverpool' — one of the world's best goalkeepers. Golden Glove winner and Champions League victor. His composure, footwork, and incredible saves make him Brazil's number one. Alisson is reliability and class at the highest level." }, "image": "https://placehold.co/300x300?text=Alisson" },
    
    { "name": { "ru": "Эдерсон Мораес", "en": "Ederson Moraes" }, "pos": "goalkeeper", "status": "Regular", "story": { "ru": "Вратарь с ногами полузащитника! Эдерсон из «Фенербахче» — мастер длинных передач и игры в поле. Его точность передач выше 90% — рекорд среди вратарей. Чемпион Англии, который может начать атаку лучше любого плеймейкера.", "en": "A goalkeeper with a midfielder's feet! Ederson from Fenerbahce is a master of long passes and playing out from the back. His 90%+ passing accuracy is a record among goalkeepers. English champion who can start attacks better than any playmaker." }, "image": "https://placehold.co/300x300?text=Ederson" },
    
    { "name": { "ru": "Вевертон", "en": "Weverton" }, "pos": "goalkeeper", "status": "Regular", "story": { "ru": "Олимпийский чемпион 2020 года из «Гремио». Ветеран бразильского футбола с невероятной реакцией. Его путь от скромных клубов до сборной — история упорства. На ЧМ-2022 был третьим вратарем, теперь готов бороться за место в основе.", "en": "2020 Olympic champion from Grêmio. Brazilian football veteran with incredible reflexes. His journey from humble clubs to the national team is a story of perseverance. Was third-choice keeper at WC 2022, now ready to compete for the starting spot." }, "image": "https://placehold.co/300x300?text=Weverton" },
    
    { "name": { "ru": "Маркиньос", "en": "Marquinhos" }, "pos": "defender", "status": "Captain", "story": { "ru": "Капитан сборной и легенда ПСЖ! Более 400 матчей за парижский клуб. Чемпион мира 2022 года, лидер обороны с феноменальным чтением игры. Его опыт, лидерство и самоотверженность — фундамент бразильской защиты. Настоящий генерал на поле.", "en": "National team captain and PSG legend! Over 400 matches for Paris. 2022 World Champion, defensive leader with phenomenal game reading. His experience, leadership, and dedication are the foundation of Brazil's defense. A true general on the pitch." }, "image": "https://placehold.co/300x300?text=Marquinhos" },
    
    { "name": { "ru": "Габриэль Магальяйнс", "en": "Gabriel Magalhães" }, "pos": "defender", "status": "Star", "story": { "ru": "«Габигол» из «Арсенала» — скала лондонской обороны. Рост 190 см, мощь и отличная игра головой. Забил больше всех защитников АПЛ в сезоне 2024/25. Его партнерство с Маркиньосом — гарантия надежности. Неудержим на стандартах!", "en": "'Gabigol' from Arsenal — a rock of London's defense. 190cm tall, powerful and excellent in the air. Scored more goals than any Premier League defender in 2024/25. His partnership with Marquinhos is a guarantee of reliability. Unstoppable on set pieces!" }, "image": "https://placehold.co/300x300?text=Gabriel" },
    
    { "name": { "ru": "Бреймер", "en": "Bremer" }, "pos": "defender", "status": "Star", "story": { "ru": "Глейсон Бреймер из «Ювентуса» — один из лучших центральных защитников Серии А. Мощный, быстрый, бескомпромиссный в единоборствах. Его отборы и игра один в один — эталон современного защитника. Туринцы называют его «Стеной».", "en": "Gleison Bremer from Juventus — one of Serie A's best center-backs. Powerful, fast, uncompromising in duels. His tackling and one-on-one defending are the standard for modern defenders. Turin fans call him 'The Wall'." }, "image": "https://placehold.co/300x300?text=Bremer" },
    
    { "name": { "ru": "Данило", "en": "Danilo" }, "pos": "defender", "status": "Regular", "story": { "ru": "Ветеран в 34 года! Вернулся в «Фламенго» после лет в «Ювентусе» и «Ман Сити». Универсал, который может сыграть и справа, и слева, и в центре. Опыт, лидерство и надежность — его главные козыри. Играл на 3 чемпионатах мира.", "en": "Veteran at 34! Returned to Flamengo after years at Juventus and Man City. Utility player who can play right-back, left-back, or center-back. Experience, leadership, and reliability are his main assets. Played in 3 World Cups." }, "image": "https://placehold.co/300x300?text=Danilo" },
    
    { "name": { "ru": "Алекс Сандро", "en": "Alex Sandro" }, "pos": "defender", "status": "Regular", "story": { "ru": "Левый защитник «Фламенго» с опытом «Ювентуса». 9 лет в Турине — сотни матчей и трофеев. Его скорость, навесы и атакующие подключения — оружие на фланге. В 35 лет он доказывает, что возраст — лишь число. Чемпион Италии 8 раз!", "en": "Flamengo left-back with Juventus experience. 9 years in Turin — hundreds of matches and trophies. His speed, crosses, and attacking runs are weapons on the flank. At 35, he proves age is just a number. 8-time Italian champion!" }, "image": "https://placehold.co/300x300?text=Alex+Sandro" },
    
    { "name": { "ru": "Уэсли", "en": "Wesley" }, "pos": "defender", "status": "Regular", "story": { "ru": "Восходящая звезда из «Ромы»! В 22 года стал основным правым защитником римлян. Его скорость, техника и умение играть в атаке впечатлили Анчелотти. Будущее бразильской обороны уже здесь. Моуринью называет его «новым Кафу».", "en": "Rising star from Roma! At 22, became the Giallorossi's starting right-back. His speed, technique, and attacking ability impressed Ancelotti. The future of Brazilian defense is here. Mourinho calls him 'the new Cafu'." }, "image": "https://placehold.co/300x300?text=Wesley" },
    
    { "name": { "ru": "Дуглас Сантос", "en": "Douglas Santos" }, "pos": "defender", "status": "Regular", "story": { "ru": "Левый защитник «Зенита» с опытом выступлений в Германии. Олимпийский чемпион 2016 года! Его выносливость, точные навесы и надежность в обороне — важные качества. Вернулся в сборную после 9 лет. Северо-восток Бразилии гордится им!", "en": "Zenit left-back with German experience. 2016 Olympic Champion! His stamina, accurate crosses, and defensive reliability are important qualities. Returned to the national team after 9 years. Northeast Brazil is proud of him!" }, "image": "https://placehold.co/300x300?text=Douglas+Santos" },
    
    { "name": { "ru": "Лео Перейра", "en": "Léo Pereira" }, "pos": "defender", "status": "Regular", "story": { "ru": "Центральный защитник «Фламенго» с отличной игрой головой. Капитан команды! Его лидерство, борьба в воздухе и умение начинать атаки — ключевые качества. После блестящего сезона в Бразилии получил шанс на ЧМ. Болельщики «Фла» верят в него!", "en": "Flamengo center-back with excellent aerial ability. Team captain! His leadership, aerial battles, and ability to start attacks are key qualities. After a brilliant season in Brazil, he got his World Cup chance. Flamengo fans believe in him!" }, "image": "https://placehold.co/300x300?text=Leo+Pereira" },
    
    { "name": { "ru": "Ибаньес", "en": "Ibañez" }, "pos": "defender", "status": "Regular", "story": { "ru": "Защитник «Аль-Ахли» из Саудовской Аравии. Бывший игрок «Ромы», который нашел вторую молодость на Востоке. Его опыт, чтение игры и хладнокровие — важные качества для сборной. Вернулся в Селесао после 3 лет отсутствия.", "en": "Al-Ahli defender from Saudi Arabia. Former Roma player who found a second youth in the East. His experience, game reading, and composure are important for the national team. Returned to the Seleção after 3 years away." }, "image": "https://placehold.co/300x300?text=Ibanez" },
    
    { "name": { "ru": "Каземиро", "en": "Casemiro" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Каземиро — машина!» — так говорят о нем в «Манчестер Юнайтед». Пятикратный победитель Лиги чемпионов с «Реалом». В 34 года он все еще один из лучших опорников мира. Его отборы, позиционирование и лидерство — основа полузащиты Бразилии. Чемпион мира 2022!", "en": "'Casemiro is a machine!' — that's what they say at Manchester United. Five-time Champions League winner with Real Madrid. At 34, he's still one of the world's best defensive midfielders. His tackling, positioning, and leadership are the foundation of Brazil's midfield. 2022 World Champion!" }, "image": "https://placehold.co/300x300?text=Casemiro" },
    
    { "name": { "ru": "Бруно Гимарайнш", "en": "Bruno Guimarães" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Капитан «Ньюкасла» и один из лучших полузащитников АПЛ! Его техника, видение поля и умение забивать голы впечатляют. В 28 лет он на пике формы. Бруно — это энергия, креативность и надежность. Мечтает выиграть трофей со сборной.", "en": "Newcastle captain and one of the Premier League's best midfielders! His technique, vision, and goal-scoring ability are impressive. At 28, he's in peak form. Bruno is energy, creativity, and reliability. Dreams of winning a trophy with the national team." }, "image": "https://placehold.co/300x300?text=Bruno+Guimaraes" },
    
    { "name": { "ru": "Лукас Пакета", "en": "Lucas Paquetá" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Паqueta» — волшебник с мячом! Вернулся в «Фламенго» после лет в Европе. Его дриблинг, пасы и удары с обеих ног делают его универсальным оружием. Чемпион мира 2022. Любит решающие голы — забивал в финалах Кубка Америки.", "en": "'Paquetá' — a magician with the ball! Returned to Flamengo after years in Europe. His dribbling, passing, and two-footed shooting make him a versatile weapon. 2022 World Champion. Loves crucial goals — scored in Copa América finals." }, "image": "https://placehold.co/300x300?text=Paqueta" },
    
    { "name": { "ru": "Фабиньо", "en": "Fabinho" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Опорник «Аль-Иттихада» с опытом «Ливерпуля». Чемпион Лиги чемпионов 2019 года! Его дисциплина, отборы и тактическая грамотность — важные качества. В 32 года он все еще на высоком уровне. Анчелотти ценит его опыт и профессионализм.", "en": "Al-Ittihad defensive midfielder with Liverpool experience. 2019 Champions League winner! His discipline, tackling, and tactical awareness are important qualities. At 32, he's still at a high level. Ancelotti values his experience and professionalism." }, "image": "https://placehold.co/300x300?text=Fabinho" },
    
    { "name": { "ru": "Данило Сантос", "en": "Danilo Santos" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Молодой талант из «Ботафого»! В 23 года стал одним из открытий бразильского чемпионата. Его энергия, прессинг и умение отбирать мяч впечатлили Анчелотти. Это его первый крупный турнир. Будущее полузащиты Селесао!", "en": "Young talent from Botafogo! At 23, became one of the revelations of the Brazilian championship. His energy, pressing, and ball-winning ability impressed Ancelotti. This is his first major tournament. The future of Seleção's midfield!" }, "image": "https://placehold.co/300x300?text=Danilo+Santos" },
    
    { "name": { "ru": "Неймар", "en": "Neymar" }, "pos": "forward", "status": "Star", "story": { "ru": "ЛЕГЕНДА вернулась! Неймар в 34 года играет за родной «Сантос». Третий бомбардир в истории сборной (79 голов). Его магия, дриблинг и креативность — оружие Бразилии. Четыре чемпионата мира! Это его последний шанс на золото. Мечта сбылась — он дома и на ЧМ!", "en": "THE LEGEND returns! Neymar at 34 plays for his boyhood Santos. Brazil's third all-time top scorer (79 goals). His magic, dribbling, and creativity are Brazil's weapons. Four World Cups! This is his last chance for gold. Dream came true — he's home and at the World Cup!" }, "image": "https://placehold.co/300x300?text=Neymar" },
    
    { "name": { "ru": "Рафинья", "en": "Raphinha" }, "pos": "forward", "status": "Star", "story": { "ru": "Звезда «Барселоны» и один из лучших вингеров мира! Его скорость, удары с обеих ног и дриблинг — кошмар для защитников. В 29 лет он на пике. Забивал в Лиге чемпионов и Ла Лиге. Анчелотти видит в нем лидера атаки. Бразилия ждет его феерии!", "en": "Barcelona star and one of the world's best wingers! His speed, two-footed shooting, and dribbling are a nightmare for defenders. At 29, he's at his peak. Scored in Champions League and La Liga. Ancelotti sees him as an attack leader. Brazil awaits his brilliance!" }, "image": "https://placehold.co/300x300?text=Raphinha" },
    
    { "name": { "ru": "Эндрик", "en": "Endrick" }, "pos": "forward", "status": "Star", "story": { "ru": "Вундеркинд в 19 лет! Игрок «Реала» в аренде в «Лионе». Самый молодой игрок в истории «Палмейраса». Его мощь, скорость и инстинкт убийцы в штрафной поражают. Будущее бразильского футбола уже здесь. Анчелотти верит в него как в нового Роналдо!", "en": "Wonderkid at 19! Real Madrid player on loan at Lyon. Youngest player in Palmeiras history. His power, speed, and killer instinct in the box are stunning. The future of Brazilian football is here. Ancelotti believes in him as the new Ronaldo!" }, "image": "https://placehold.co/300x300?text=Endrick" },
    
    { "name": { "ru": "Габриэль Мартинелли", "en": "Gabriel Martinelli" }, "pos": "forward", "status": "Regular", "story": { "ru": "Вингер «Арсенала» с невероятной скоростью! В 24 года он один из самых ярких игроков АПЛ. Его дриблинг, голы и самоотверженность делают его опасным на любом фланге. Чемпион Англии. Мартинелли — это энергия и молодость атаки Бразилии.", "en": "Arsenal winger with incredible speed! At 24, he's one of the Premier League's brightest players. His dribbling, goals, and dedication make him dangerous on any flank. English champion. Martinelli is the energy and youth of Brazil's attack." }, "image": "https://placehold.co/300x300?text=Martinelli" },
    
    { "name": { "ru": "Матеус Кунья", "en": "Matheus Cunha" }, "pos": "forward", "status": "Star", "story": { "ru": "Звезда «Манчестер Юнайтед»! Его техника, голы и ассисты впечатлили в АПЛ. В 27 лет он на пике формы. Универсал, который может сыграть и нападающего, и атакующего полузащитника. Забивал в решающих матчах. Кунья — это креативность и эффективность!", "en": "Manchester United star! His technique, goals, and assists impressed in the Premier League. At 27, he's in peak form. Utility player who can play striker or attacking midfielder. Scored in crucial matches. Cunha is creativity and efficiency!" }, "image": "https://placehold.co/300x300?text=Matheus+Cunha" },
    
    { "name": { "ru": "Игор Тиаго", "en": "Igor Thiago" }, "pos": "forward", "status": "Regular", "story": { "ru": "Открытие сезона в «Брентфорде»! В 25 лет он забил 19 голов в АПЛ. Его мощь, игра в воздухе и завершение — эталон для нападающего. Первый вызов в сборную — мечта сбылась! Анчелотти видит в нем идеального таргетмена для Бразилии.", "en": "Revelation of the season at Brentford! At 25, he scored 19 goals in the Premier League. His power, aerial ability, and finishing are the standard for a striker. First national team call-up — dream come true! Ancelotti sees him as Brazil's ideal target man." }, "image": "https://placehold.co/300x300?text=Igor+Thiago" },
    
    { "name": { "ru": "Луис Энрике", "en": "Luiz Henrique" }, "pos": "forward", "status": "Regular", "story": { "ru": "Вингер «Зенита» с отличной статистикой! В 25 лет он один из лучших дриблеров мира. Его скорость, техника и голы в России впечатлили. Вернулся в сборную после отличного сезона. Анчелотти ценит его прямолинейность и умение обыгрывать один в один.", "en": "Zenit winger with excellent stats! At 25, he's one of the world's best dribblers. His speed, technique, and goals in Russia impressed. Returned to the national team after a great season. Ancelotti values his directness and one-on-one ability." }, "image": "https://placehold.co/300x300?text=Luiz+Henrique" },
    
    { "name": { "ru": "Раян", "en": "Rayan" }, "pos": "forward", "status": "Regular", "story": { "ru": "Восходящая звезда «Борнмута»! В 21 год он стал одним из открытий АПЛ. Его скорость, дриблинг и голы впечатлили. Первый крупный турнир за сборную. Раян — это будущее бразильского футбола. Анчелотти видит в нем замену для ветеранов.", "en": "Bournemouth's rising star! At 21, he became one of the Premier League's revelations. His speed, dribbling, and goals impressed. First major tournament for the national team. Rayan is the future of Brazilian football. Ancelotti sees him as a replacement for veterans." }, "image": "https://placehold.co/300x300?text=Rayan" }
  ]
},
"ENG": {
  "desc": {
   "ru": "Родоначальники футбола, чье сердце бьется в ритме трибун «Уэмбли», мечтают вернуть трофей домой. Обладая одним из самых талантливых и дорогих составов на планете, «Три льва» сочетают мощь АПЛ и дерзость молодых талантов. Это - поход за мечтой.",
    "en": "The inventors of football, whose hearts beat to the rhythm of Wembley, dream of finally bringing the trophy home. Possessing one of the most talented and expensive squads on the planet, the 'Three Lions' combine the power of the Premier League with the audacity of young talents. This is a quest for a dream that generations have been waiting for."
  },
  "coaches": [{ "name": { "ru": "Томас Тухель", "en": "Thomas Tuchel" }, "story": { "ru": "Топ-тренер, приглашенный для решения главной задачи — возвращения титула чемпиона мира родоначальникам футбола.", "en": "Top-tier coach invited to solve the ultimate goal — bringing the World Cup title back to the creators of football." }, "image": "https://placehold.co/300x300?text=Thomas+Tuchel" }],
  "players": [
    { "name": { "ru": "Гарри Кейн", "en": "Harry Kane" }, "pos": "forward", "status": "Captain", "story": { "ru": "Лучший бомбардир в истории сборной Англии. Мастер реализации и командной игры.", "en": "England's all-time leading goalscorer. A master of finishing and link-up play." }, "image": "https://placehold.co/300x300?text=Harry+Kane" },
    { "name": { "ru": "Джуд Беллингем", "en": "Jude Bellingham" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Молодой феномен, ставший ключевым игроком мадридского «Реала» и сборной в рекордно короткие сроки.", "en": "A young phenomenon who became a key player for Real Madrid and the national team in record time." }, "image": "https://placehold.co/300x300?text=Jude+Bellingham" },
    { "name": { "ru": "Джордан Пикфорд", "en": "Jordan Pickford" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Главный страж ворот «Трёх львов». Герой финала Евро-2020, тащивший пенальти в решающих матчах. Его рефлексам позавидуют кошки, а броски в ближний угол стали его визитной карточкой на третьем для него ЧМ.", "en": "The main guardian of the 'Three Lions' goal. The hero of Euro 2020 final, who saved penalties in crucial matches. His reflexes would make a cat jealous, and his close-range saves have become his trademark at his third World Cup." }, "image": "https://placehold.co/300x300?text=Jordan+Pickford" },
    { "name": { "ru": "Дин Хендерсон", "en": "Dean Henderson" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Надежный дублер, прошедший огонь и воду в составе «Кристал Пэлас». Готов в любой момент выйти на замену и спасти команду, если с основными воротами случится беда.", "en": "A reliable backup who has been through fire and water at Crystal Palace. Ready to come off the bench at any moment and save the team if the main goal is in trouble." }, "image": "https://placehold.co/300x300?text=Dean+Henderson" },
    { "name": { "ru": "Джеймс Траффорд", "en": "James Trafford" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Юный талант из «Манчестер Сити», дебютирующий на взрослом турнире. Будущее английской вратарской школы, чья реакция и игра ногами уже сейчас впечатляют Гвардиолу.", "en": "A young talent from Manchester City making his senior tournament debut. The future of the English goalkeeping school, whose reaction and footwork already impress Guardiola." }, "image": "https://placehold.co/300x300?text=James+Trafford" },
    { "name": { "ru": "Эзри Конса", "en": "Ezri Konsa" }, "pos": "defender", "status": "Starter", "story": { "ru": "Скала в центре обороны «Астон Виллы». Неуступчивый в единоборствах и великолепно играющий на втором этаже. Его стабильность — залог спокойствия всей английской защиты.", "en": "A rock in the center of Aston Villa's defense. Unyielding in duels and superb in the air. His consistency is the key to the calmness of the entire English defense." }, "image": "https://placehold.co/300x300?text=Ezri+Konsa" },
    { "name": { "ru": "Джон Стоунз", "en": "John Stones" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный солдат Тухеля. Может сыграть в центре обороны, на фланге и даже в опорной зоне. Опытнейший ветеран, чей пасинг и чтение игры не уступают лучшим плеймейкерам.", "en": "Tuchel's universal soldier. Can play in the center of defense, on the flank, and even in the defensive midfield. An experienced veteran whose passing and reading of the game are second to none." }, "image": "https://placehold.co/300x300?text=John+Stones" },
    { "name": { "ru": "Марк Гехи", "en": "Marc Guehi" }, "pos": "defender", "status": "Starter", "story": { "ru": "Быстрый и агрессивный центральный защитник, теперь защищающий цвета «Манчестер Сити». Лидер оборонительных редуктов, чья самоотверженность и скорость позволяют гасить любые контратаки.", "en": "A fast and aggressive center-back, now defending the colors of Manchester City. A leader of the defensive reducts, whose dedication and speed allow him to extinguish any counterattacks." }, "image": "https://placehold.co/300x300?text=Marc+Guehi" },
    { "name": { "ru": "Дэн Бёрн", "en": "Dan Burn" }, "pos": "defender", "status": "Reserve", "story": { "ru": "Гигант из «Ньюкасла» ростом под два метра. Настоящая воздушная крепость, чей головой мяч летит дальше, чем у некоторых с форвардов. Идеальное оружие для взлома глухой обороны.", "en": "A giant from Newcastle, standing nearly two meters tall. A real aerial fortress, whose headers travel further than some forwards. The perfect weapon for breaking down a stubborn defense." }, "image": "https://placehold.co/300x300?text=Dan+Burn" },
    { "name": { "ru": "Джарелл Куанса", "en": "Jarell Quansah" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Юный феномен, совершивший смелый переход в «Байер». Дебютант турнира, привносящий в защиту молодецкую удаль и бесстрашие. Будущий капитан сборной.", "en": "A young phenomenon who made a bold move to Bayer Leverkusen. A tournament debutant bringing youthful daring and fearlessness to the defense. A future captain of the national team." }, "image": "https://placehold.co/300x300?text=Jarell+Quansah" },
    { "name": { "ru": "Тино Ливраменто", "en": "Tino Livramento" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Динамичный правый латераль «Ньюкасла». Его скорость и выносливость — идеальное оружие для тактики Тухеля. Еще один дебютант, готовый рвать фланги соперников на части.", "en": "A dynamic right wing-back for Newcastle. His speed and stamina are the perfect weapon for Tuchel's tactics. Another debutant ready to tear the opponents' flanks to shreds." }, "image": "https://placehold.co/300x300?text=Tino+Livramento" },
    { "name": { "ru": "Нико О'Райли", "en": "Nico O'Reilly" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Универсальный молодой талант из «Манчестер Сити». Может сыграть как фулбэка, так и в центре поля. Открытие сезона, чья адаптивность сводит с ума тренеров соперников.", "en": "A versatile young talent from Manchester City. Can play both as a full-back and in the center of the pitch. The revelation of the season, whose adaptability drives opposing coaches crazy." }, "image": "https://placehold.co/300x300?text=Nico+O'Reilly" },

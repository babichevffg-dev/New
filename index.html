    { "name": { "ru": "Джед Спенс", "en": "Djed Spence" }, "pos": "defender", "status": "Reserve", "story": { "ru": "Энергичный и агрессивный фулбэк «Тоттенхэма». Настоящий терьер на фланге, готовый вцепиться в любого вингера соперника и не отпустить его до финального свистка.", "en": "An energetic and aggressive full-back for Tottenham. A real terrier on the flank, ready to grab any opposing winger and not let him go until the final whistle." }, "image": "https://placehold.co/300x300?text=Djed+Spence" },
    { "name": { "ru": "Рис Джеймс", "en": "Reece James" }, "pos": "defender", "status": "Star", "story": { "ru": "Капитан «Челси» и обладатель пушечного удара. Вернувшийся в сборную после череды травм, он готов доказать, что его правый фланг — это не только оборона, но и смертельное оружие.", "en": "The captain of Chelsea and the owner of a cannon-like shot. Returning to the national team after a series of injuries, he is ready to prove that his right flank is not only defense but also a deadly weapon." }, "image": "https://placehold.co/300x300?text=Reece+James" },
    { "name": { "ru": "Деклан Райс", "en": "Declan Rice" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Сердце и мотор команды. Самая дорогая покупка в истории «Арсенала», он диктует темп и разрушает атаки соперников. Его перехваты и передачи — фундамент английской игры.", "en": "The heart and engine of the team. The most expensive purchase in Arsenal's history, he dictates the tempo and breaks up opponents' attacks. His interceptions and passes are the foundation of the English game." }, "image": "https://placehold.co/300x300?text=Declan+Rice" },
    { "name": { "ru": "Эллиот Андерсон", "en": "Elliot Anderson" }, "pos": "midfielder", "status": "Rookie", "story": { "ru": "Яркий талант из «Ноттингем Форест». Дебютант турнира, привносящий в центр поля креатив и неуемную энергию. Игрок, способный одним пасом разрезать любую оборону.", "en": "A bright talent from Nottingham Forest. A tournament debutant bringing creativity and boundless energy to the center of the pitch. A player capable of cutting through any defense with a single pass." }, "image": "https://placehold.co/300x300?text=Elliot+Anderson" },
    { "name": { "ru": "Кобби Майну", "en": "Kobbie Mainoo" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Юный феномен «Манчестер Юнайтед». Несмотря на возраст, он играет с мудростью ветерана, легко обыгрывая соперников на узких пространствах. Будущее английского футбола уже здесь.", "en": "A young phenomenon of Manchester United. Despite his age, he plays with the wisdom of a veteran, easily dribbling past opponents in tight spaces. The future of English football is already here." }, "image": "https://placehold.co/300x300?text=Kobbie+Mainoo" },
    { "name": { "ru": "Джордан Хендерсон", "en": "Jordan Henderson" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Опытнейший ветеран, вернувшийся в Англию, чтобы играть за «Брентфорд». Настоящий лидер и душа раздевалки, чей опыт и характер необходимы команде в борьбе за трофей.", "en": "An experienced veteran who returned to England to play for Brentford. A true leader and the soul of the dressing room, whose experience and character are essential for the team in the fight for the trophy." }, "image": "https://placehold.co/300x300?text=Jordan+Henderson" },
    { "name": { "ru": "Морган Роджерс", "en": "Morgan Rogers" }, "pos": "midfielder", "status": "Rookie", "story": { "ru": "Прорывная звезда «Астон Виллы». Его энергия, дриблинг и голеаторские способности делают его опаснейшим оружием при выходах на замену. Игрок, который никогда не знает слова «усталость».", "en": "The breakthrough star of Aston Villa. His energy, dribbling, and goal-scoring abilities make him the most dangerous weapon when coming off the bench. A player who never knows the word 'fatigue'." }, "image": "https://placehold.co/300x300?text=Morgan+Rogers" },
    { "name": { "ru": "Эберечи Эзе", "en": "Eberechi Eze" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Маг с мячом в ногах. Плеймейкер «Арсенала», способный изменить ход игры одним блестящим дриблингом или ударом со штрафного. Его креатив — это головная боль для любых защитников.", "en": "A magician with the ball at his feet. An Arsenal playmaker capable of changing the course of the game with a brilliant dribble or a free-kick. His creativity is a headache for any defenders." }, "image": "https://placehold.co/300x300?text=Eberechi+Eze" },
    { "name": { "ru": "Айвен Тоуни", "en": "Ivan Toney" }, "pos": "forward", "status": "Star", "story": { "ru": "Мастер пенальти и классическая «девятка». Выступающий в Саудовской Аравии, он привносит в сборную невероятную технику и хладнокровие. Его удары с точки безупречны.", "en": "A master of penalties and a classic number 9. Playing in Saudi Arabia, he brings incredible technique and composure to the national team. His spot-kicks are flawless." }, "image": "https://placehold.co/300x300?text=Ivan+Toney" },
    { "name": { "ru": "Олли Уоткинс", "en": "Ollie Watkins" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неутомимый труженик и блестящий партнер для Кейна. Его движение и прессинг — первая линия обороны. Игрок, который готов жертвовать собой ради командного успеха.", "en": "A tireless worker and a brilliant partner for Kane. His movement and pressing are the first line of defense. A player who is ready to sacrifice himself for the team's success." }, "image": "https://placehold.co/300x300?text=Ollie+Watkins" },
    { "name": { "ru": "Букайо Сака", "en": "Bukayo Saka" }, "pos": "forward", "status": "Star", "story": { "ru": "Главный волшебник на правом фланге. Игрок, который никогда не сдается, несмотря на трагичный финал Евро-2020, он стал главной созидательной силой команды и ее любимцем.", "en": "The main magician on the right flank. A player who never gives up, despite the tragic Euro 2020 final, he has become the main creative force of the team and its favorite." }, "image": "https://placehold.co/300x300?text=Bukayo+Saka" },
    { "name": { "ru": "Нони Мадуэке", "en": "Noni Madueke" }, "pos": "forward", "status": "Star", "story": { "ru": "Фланговый вингер с невероятной скоростью и убойным инстинктом. Новое лицо в атаке, готовое рвать любую оборону своим дриблингом. Его финты сводят с ума защитников.", "en": "A touchline winger with incredible speed and a killer instinct. A new face in the attack, ready to tear apart any defense with his dribbling. His feints drive defenders crazy." }, "image": "https://placehold.co/300x300?text=Noni+Madueke" },
    { "name": { "ru": "Маркус Рэшфорд", "en": "Marcus Rashford" }, "pos": "forward", "status": "Star", "story": { "ru": "Талант, обретший вторую молодость в «Барселоне». Его скорость и техника — кошмар для защитников, готовый взять реванш за неудачи прошлых турниров и вести команду к славе.", "en": "A talent who has found a second youth at Barcelona. His speed and technique are a nightmare for defenders, ready to take revenge for the failures of past tournaments and lead the team to glory." }, "image": "https://placehold.co/300x300?text=Marcus+Rashford" },
    { "name": { "ru": "Энтони Гордон", "en": "Anthony Gordon" }, "pos": "forward", "status": "Starter", "story": { "ru": "Агрессивный и бескомпромиссный вингер «Ньюкасла». Его работоспособность и желание бороться за каждый мяч делают его любимцем тренеров. Игрок, который выжигает себя на поле на 100%.", "en": "An aggressive and uncompromising winger for Newcastle. His work rate and desire to fight for every ball make him a favorite of the coaches. A player who burns himself out on the pitch 100%." }, "image": "https://placehold.co/300x300?text=Anthony+Gordon" }
  ]
},
"ESP": {
  "desc": {
    "ru": "«Испанская фурия» переживает свое второе рождение. После триумфа на Евро-2024 команда сочетает фирменный доминирующий стиль с абсолютным контролем мяча. Новая волна талантов Ла Лиги готова доказать, что испанская футбольная философия — это путь к мировому господству.",
    "en": "The 'Spanish Fury' is experiencing a rebirth. After their Euro 2024 triumph, the team combines their signature dominant style where ball control is brought to the absolute. A new wave of La Liga talents is ready to prove that the Spanish football philosophy is the path to world dominance."
  },
  "coaches": [{ "name": { "ru": "Луис де ла Фуэнте", "en": "Luis de la Fuente" }, "story": { "ru": "Творец победы Испании на Евро-2024, прекрасно знающий игроков по молодежным сборным.", "en": "Architect of Spain's Euro 2024 victory, knowing the players well from the youth national teams." }, "image": "https://placehold.co/300x300?text=Luis+de+la+Fuente" }],
  "players": [
    { "name": { "ru": "Ламин Ямаль", "en": "Lamine Yamal" }, "pos": "forward", "status": "Star", "story": { "ru": "Юный гений, побивший все рекорды возраста. Главное открытие мирового футбола последних лет.", "en": "A young genius who broke all age records. The biggest revelation in world football in recent years." }, "image": "https://placehold.co/300x300?text=Lamine+Yamal" },
    { "name": { "ru": "Родри", "en": "Rodri" }, "pos": "midfielder", "status": "Regular", "story": { "ru": "Лучший опорный полузащитник мира. Мозг и фундамент игры испанской сборной.", "en": "The best defensive midfielder in the world. The brain and foundation of the Spanish national team's game." }, "image": "https://placehold.co/300x300?text=Rodri" },
    { "name": { "ru": "Давид Райя", "en": "David Raya" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Лондонская стена. Покорив АПЛ в составе «Арсенала», он привносит в сборную невероятные рефлексы и командование штрафной. Мастер игры ногами, идеально подходящий под испанский стиль владения.", "en": "The London wall. Having conquered the Premier League with Arsenal, he brings incredible reflexes and command of the box to the national team. A master of playing with his feet, perfectly suited to Spain's possession style." }, "image": "https://placehold.co/300x300?text=David+Raya" },
    { "name": { "ru": "Жоан Гарсия", "en": "Joan García" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Вундеркинд из Ла Масии. Молодой страж ворот, совершивший потрясающий прорыв в «Барселоне» и доказавший, что традиции испанской вратарской школы в надежных руках.", "en": "The prodigy from La Masia. A young shot-stopper who made a stunning breakthrough at Barcelona, proving that the Spanish goalkeeping tradition is in safe hands." }, "image": "https://placehold.co/300x300?text=Joan+Garcia" },
    { "name": { "ru": "Унаи Симон", "en": "Unai Simón" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Опытный спаситель. Герой Евро-2024, чьи решающие сейвы в плей-офф проложили путь к триумфу Испании. Настоящий лидер и эмоциональный фундамент команды.", "en": "The veteran savior. The hero of Euro 2024, whose crucial saves in the knockout stages paved the way for Spain's triumph. A true leader and the emotional backbone of the squad." }, "image": "https://placehold.co/300x300?text=Unai+Simon" },
    { "name": { "ru": "Марк Пубиль", "en": "Marc Pubill" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Восходящая звезда академии «Атлетико». Универсальный защитник, чей тактический интеллект и цепкость привлекли внимание Луиса де ла Фуэнте.", "en": "The rising star of Atlético's academy. A versatile defender whose tactical intelligence and tenacity caught the eye of Luis de la Fuente." }, "image": "https://placehold.co/300x300?text=Marc+Pubill" },
    { "name": { "ru": "Алехандро Гримальдо", "en": "Alejandro Grimaldo" }, "pos": "defender", "status": "Star", "story": { "ru": "Левша-волшебник из Леверкузена. Фланговый защитник, играющий как атакующий полузащитник, обладающий одним из самых смертоносных штрафных в мировом футболе.", "en": "The left-footed magician from Leverkusen. A full-back who plays like an attacking midfielder, boasting one of the most lethal free-kicks in world football." }, "image": "https://placehold.co/300x300?text=Alejandro+Grimaldo" },
    { "name": { "ru": "Эрик Гарсия", "en": "Eric García" }, "pos": "defender", "status": "Starter", "story": { "ru": "Мозг «Барселоны» в обороне. Центральный защитник с пасом плеймейкера, способный начинать атаки от самых ворот своим элегантным распределением мяча.", "en": "The Barcelona brain in defense. A center-back with the passing range of a playmaker, capable of starting attacks from the very back with his elegant distribution." }, "image": "https://placehold.co/300x300?text=Eric+Garcia" },
    { "name": { "ru": "Маркос Льоренте", "en": "Marcos Llorente" }, "pos": "defender", "status": "Star", "story": { "ru": "Абсолютное универсальное оружие. Человек, который в одиночку сломал «Ливерпуль», может сыграть буквально в любой точке поля. Двигатель, который никогда не останавливается.", "en": "The ultimate utility weapon. The man who broke Real Madrid's hearts against Liverpool can play literally anywhere on the pitch. An engine that never stops running." }, "image": "https://placehold.co/300x300?text=Marcos+Llorente" },
    { "name": { "ru": "Педро Порро", "en": "Pedro Porro" }, "pos": "defender", "status": "Starter", "story": { "ru": "Испанский бомбардир на правом фланге. Звезда «Тоттенхэма» известна своими безжалостными подключениями и точными кроссами. Он считает бровку своей личной скоростной трассой.", "en": "The Spanish bomber on the right flank. A Tottenham star known for his relentless overlapping runs and pinpoint crosses. He treats the touchline as his personal highway." }, "image": "https://placehold.co/300x300?text=Pedro+Porro" },
    { "name": { "ru": "Эмерик Ляпорт", "en": "Aymeric Laporte" }, "pos": "defender", "status": "Legend", "story": { "ru": "Опытная скала. После долгого пути левый центральный защитник вернулся в «Атлетик» и в сборную, принеся с собой бесценное спокойствие и лидерские качества в оборону.", "en": "The experienced rock. After a long journey, the left-sided center-back returned to his roots at Athletic Club and to the national team, bringing invaluable calmness and leadership to the defense." }, "image": "https://placehold.co/300x300?text=Aymeric+Laporte" },
    { "name": { "ru": "Пау Кубарси", "en": "Pau Cubarsí" }, "pos": "defender", "status": "Star", "story": { "ru": "Подростковый колосс. Несмотря на невероятно юный возраст, он защищается со спокойствием 30-летнего ветерана. Бриллиант Ла Масии, который уже дирижирует защитной линией «Барселоны».", "en": "The teenage colossus. Despite his incredibly young age, he defends with the composure of a 30-year-old veteran. A La Masia gem who is already dictating Barcelona's backline." }, "image": "https://placehold.co/300x300?text=Pau+Cubarsi" },
    { "name": { "ru": "Марк Кукурелья", "en": "Marc Cucurella" }, "pos": "defender", "status": "Starter", "story": { "ru": "Тактический хамелеон. Работяга из «Челси», который может сыграть как фулбэка, латераля или даже в полузащите. Его тактическая дисциплина и бесконечная энергия делают его мечтой любого тренера.", "en": "The tactical chameleon. A Chelsea workhorse who can play as a full-back, wing-back, or even in midfield. His tactical discipline and endless energy make him De la Fuente's dream player." }, "image": "https://placehold.co/300x300?text=Marc+Cucurella" },
    { "name": { "ru": "Микель Мерино", "en": "Mikel Merino" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Воздушная угроза из центра поля. Мощный бокс-ту-бокс полузащитник «Арсенала» привносит в команду физику, энергию от штрафной до штрафной и удивительный талант забивать важные мячи головой.", "en": "The aerial threat from the center. The Arsenal powerhouse brings physicality, box-to-box energy, and a surprising knack for scoring crucial headers." }, "image": "https://placehold.co/300x300?text=Mikel+Merino" },
    { "name": { "ru": "Фабиан Руис", "en": "Fabián Ruiz" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Элегантный маэстро. Звезда ПСЖ, чья левая нога — высокоточный инструмент. Он диктует темп своей грациозной игрой в пас и умением контролировать центр поля.", "en": "The elegant maestro. A PSG star whose left foot is a precision instrument. He dictates the tempo with his graceful passing and ability to control the midfield." }, "image": "https://placehold.co/300x300?text=Fabian+Ruiz" },
    { "name": { "ru": "Гави", "en": "Gavi" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Бесстрашный гладиатор. Несмотря на миниатюрные габариты, он играет с сердцем льва. Его бесконечный прессинг и техническое совершенство — пульс полузащиты Испании.", "en": "The fearless gladiator. Despite his small stature, he plays with the heart of a lion. His relentless pressing and technical brilliance are the heartbeat of Spain's midfield." }, "image": "https://placehold.co/300x300?text=Gavi" },
    { "name": { "ru": "Дани Ольмо", "en": "Dani Olmo" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Гений решающих моментов. Плеймейкер «Барселоны», который всегда выходит на сцену в самые важные матчи. Мастер неожиданностей, способный забить сумасшедшие голы из ниоткуда.", "en": "The clutch genius. The Barcelona playmaker who always shows up in the biggest moments. A master of the unexpected, capable of scoring world-class goals out of nowhere." }, "image": "https://placehold.co/300x300?text=Dani+Olmo" },
    { "name": { "ru": "Мартин Субименди", "en": "Martín Zubimendi" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Дирижер из глубины поля. Большое подписание «Арсенала» — идеальный партнер для Родри. Его умение читать игру и разрушать атаки соперника сравнимо только с его изысканным пасом.", "en": "The deep-lying conductor. Arsenal's big signing is the perfect partner for Rodri. His ability to read the game and break up play is matched only by his exquisite passing." }, "image": "https://placehold.co/300x300?text=Martin+Zubimendi" },
    { "name": { "ru": "Педро Гонсалес", "en": "Pedri" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Иллюзионист центра поля. Волшебник из «Барселоны», который видит передачи, недоступные другим. Он скользит мимо соперников, заставляя сложное выглядеть предельно просто.", "en": "The midfield illusionist. The Barcelona magician who sees passes that no one else can. He glides past opponents, making the complex look effortlessly simple." }, "image": "https://placehold.co/300x300?text=Pedri" },
    { "name": { "ru": "Ферран Торрес", "en": "Ferran Torres" }, "pos": "forward", "status": "Starter", "story": { "ru": "Универсальный финишер. Атакующий игрок «Барселоны», способный закрыть любую позицию в нападении. Его умное движение и клиническая реализация делают его постоянной угрозой.", "en": "The versatile finisher. A Barcelona attacker who can play across the front line. His intelligent movement and clinical finishing make him a constant threat." }, "image": "https://placehold.co/300x300?text=Ferran+Torres" },
    { "name": { "ru": "Йереми Пино", "en": "Yeremy Pino" }, "pos": "forward", "status": "Starter", "story": { "ru": "Прямой и дерзкий вингер. Привнося свой опыт АПЛ из «Кристал Пэлас», он является хитрым и непредсказуемым нападающим, который обожает играть один в один с защитниками.", "en": "The direct winger. Bringing his Premier League experience from Crystal Palace, he is a tricky, unpredictable attacker who loves to take on defenders one-on-one." }, "image": "https://placehold.co/300x300?text=Yeremy+Pino" },
    { "name": { "ru": "Алекс Баэна", "en": "Álex Baena" }, "pos": "forward", "status": "Star", "story": { "ru": "Специалист по стандартам. Звезда «Атлетико» обладает разрушительной левой ногой. Его подачи и удары из-за штрафной — настоящий кошмар для вратарей соперника.", "en": "The set-piece specialist. The Atlético Madrid star possesses a devastating left foot. His deliveries and long-range shots are a nightmare for opposing goalkeepers." }, "image": "https://placehold.co/300x300?text=Alex+Baena" },
    { "name": { "ru": "Нико Уильямс", "en": "Nico Williams" }, "pos": "forward", "status": "Star", "story": { "ru": "Человек-ураган. Вингер «Атлетика» из Бильбао, возможно, самый быстрый игрок в мире. Когда он получает мяч на левом фланге, защитники могут только молиться об обратном пасе.", "en": "The human hurricane. The Athletic Bilbao winger is arguably the fastest player in the world. When he gets the ball on the left, defenders pray for a backpass." }, "image": "https://placehold.co/300x300?text=Nico+Williams" },
    { "name": { "ru": "Микель Оярсабаль", "en": "Mikel Oyarzabal" }, "pos": "forward", "status": "Legend", "story": { "ru": "Умный нападающий. Капитан «Реал Сосьедада» — мастер поиска свободных зон. Его работоспособность и тактическое понимание делают его незаменимым для командной структуры.", "en": "The intelligent forward. The captain of Real Sociedad is a master of finding pockets of space. His work rate and tactical understanding make him invaluable to the team's structure." }, "image": "https://placehold.co/300x300?text=Mikel+Oyarzabal" },
    { "name": { "ru": "Виктор Муньос", "en": "Víctor Muñoz" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Свежая сенсация. Вундеркинд из «Осасуны», ворвавшийся на сцену со своим невероятным дриблингом и бесстрашием. Настоящий представитель нового, дерзкого поколения Испании.", "en": "The fresh sensation. The Osasuna prodigy who burst onto the scene with his incredible dribbling and fearlessness. A true representative of the new, bold Spanish generation." }, "image": "https://placehold.co/300x300?text=Victor+Munoz" },
    { "name": { "ru": "Борха Иглесиас", "en": "Borja Iglesias" }, "pos": "forward", "status": "Starter", "story": { "ru": "Таргетмен «Панда». Нападающий «Сельты» привносит в команду олдскульную физику и убойное чутье в штрафной. Идеальный план Б, чтобы взломать самую глухую оборону.", "en": "The 'Panda' target man. The Celta Vigo striker brings old-school physicality and a lethal instinct in the box. The perfect plan B to smash through a stubborn defense." }, "image": "https://placehold.co/300x300?text=Borja+Iglesias" }
  ]
},
"POR": {
  "desc": {
    "ru": "Команда-феномен, где величие Криштиану Роналду встречается с невероятным талантом нового поколения. Португальцы — взрывная смесь техники, дисциплины и жажды побед. Они едут на ЧМ-2026, чтобы написать золотую главу в своей истории, доказывая, что их главное время триумфа - впереди.",
    "en": "A phenomenon team where the greatness of Cristiano Ronaldo meets the incredible talent of a new generation. The Portuguese are an explosive mix of technique, discipline, and a hunger for victory. They go to WC 2026 to write a golden chapter in their history, proving that their time of triumph is not over."
  },
  "coaches": [{ "name": { "ru": "Роберто Мартинес", "en": "Roberto Martínez" }, "story": { "ru": "Тренер, успешно адаптировавший свои идеи к талантам португальского футбола.", "en": "Coach who successfully adapted his ideas to the talents of Portuguese football." }, "image": "https://placehold.co/300x300?text=Roberto+Martínez" }],
  "players": [
    { "name": { "ru": "Криштиану Роналду", "en": "Cristiano Ronaldo" }, "pos": "forward", "status": "Captain", "story": { "ru": "Живая легенда, один из величайших игроков всех времен.", "en": "A living legend, one of the greatest players of all time." }, "image": "https://placehold.co/300x300?text=Cristiano+Ronaldo" },
    { "name": { "ru": "Диогу Кошта", "en": "Diogo Costa" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Неприступная стена «Порту» и первый номер сборной. Обладает реакцией кошачьего и отлично играет ногами, что идеально вписывается в философию Мартинеса. Его сейвы в Лиге чемпионов стали легендой.", "en": "The impenetrable wall of Porto and the number one for the national team. Possesses cat-like reflexes and excellent footwork, which fits perfectly into Martínez's philosophy. His Champions League saves have become legendary." }, "image": "https://placehold.co/300x300?text=Diogo+Costa" },
    { "name": { "ru": "Жозе Са", "en": "José Sá" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Опытный страж ворот, прошедший школу АПЛ в «Вулверхэмптоне». Его хладнокровие и чтение игры — это страховка, которая не подведет в самый ответственный момент.", "en": "An experienced shot-stopper who went through the Premier League school at Wolverhampton. His composure and reading of the game are an insurance policy that won't fail in the most crucial moment." }, "image": "https://placehold.co/300x300?text=Jose+Sa" },
    { "name": { "ru": "Руй Силва", "en": "Rui Silva" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Ветеран вратарского цеха, чей опыт бесценен. Он не только надежен на линии, но и является настоящим дядькой-наставником для молодежного десанта в рамке.", "en": "A veteran of the goalkeeping trade whose experience is invaluable. He is not only reliable on the line but also a true mentor for the youthful squad in goal." }, "image": "https://placehold.co/300x300?text=Rui+Silva" },
    { "name": { "ru": "Рикарду Велью", "en": "Ricardo Velho" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Главная интрига заявки Мартинеса. Феноменальный сезон в «Генчлербирлиги» доказал, что он готов к большим вызовам. Настоящая темная лошадка, способная удивить мир.", "en": "The main intrigue of Martínez's squad. A phenomenal season at Gençlerbirliği proved he is ready for big challenges. A real dark horse capable of surprising the world." }, "image": "https://placehold.co/300x300?text=Ricardo+Velho" },
    { "name": { "ru": "Рубен Диаш", "en": "Rúben Dias" }, "pos": "defender", "status": "Star", "story": { "ru": "Цемент обороны «Манчестер Сити» и сборной. Его лидерские качества и умение читать игру на шаг вперед делают его одним из лучших центральных защитников планеты.", "en": "The cement of Manchester City's and the national team's defense. His leadership and ability to read the game a step ahead make him one of the best center-backs on the planet." }, "image": "https://placehold.co/300x300?text=Ruben+Dias" },
    { "name": { "ru": "Жоау Канселу", "en": "João Cancelo" }, "pos": "defender", "status": "Star", "story": { "ru": "Защитник, который играет как плеймейкер. Звезда «Барселоны» с сумасшедшим дриблингом и пушечным ударом. Когда он подключается к атаке, соперники понимают, что сейчас будет больно.", "en": "A defender who plays like a playmaker. A Barcelona star with crazy dribbling and a cannon-like shot. When he joins the attack, opponents know it's going to hurt." }, "image": "https://placehold.co/300x300?text=Joao+Cancelo" },
    { "name": { "ru": "Нуну Мендеш", "en": "Nuno Mendes" }, "pos": "defender", "status": "Star", "story": { "ru": "Левый латераль ПСЖ с мотором, который никогда не глохнет. Его взрывная скорость и желание бороться за каждый мяч превращают фланг в настоящую взлетно-посадочную полосу.", "en": "The PSG left wing-back with an engine that never stalls. His explosive speed and desire to fight for every ball turn the flank into a real runway." }, "image": "https://placehold.co/300x300?text=Nuno+Mendes" },
    { "name": { "ru": "Диогу Далот", "en": "Diogo Dalot" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный солдат «Манчестер Юнайтед». Тактически грамотный, неутомимый и всегда готовый как отобрать мяч, так и убежать в контратаку. Идеальный винг-бэк для схемы 3-4-3.", "en": "The universal soldier of Manchester United. Tactically smart, tireless, and always ready to either win the ball back or run into a counter-attack. The perfect wing-back for a 3-4-3 formation." }, "image": "https://placehold.co/300x300?text=Diogo+Dalot" },
    { "name": { "ru": "Нелсон Семеду", "en": "Nélson Semedo" }, "pos": "defender", "status": "Legend", "story": { "ru": "Опытный боец, прошедший огонь, воду и медные трубы Ла Лиги и АПЛ. Его жесткость в единоборствах и спокойствие с мячом необходимы команде в матчах против топ-сборных.", "en": "An experienced fighter who has been through fire, water, and brass pipes in La Liga and the Premier League. His toughness in duels and composure on the ball are essential for the team in matches against top sides." }, "image": "https://placehold.co/300x300?text=Nelson+Semedo" },
    { "name": { "ru": "Матеус Нунис", "en": "Matheus Nunes" }, "pos": "defender", "status": "Starter", "story": { "ru": "Человек-двигатель из «Манчестер Сити». Может закрыть любую позицию на фланге или в центре поля. Его работоспособность и отбор мяча — кошмар для любого оппонента.", "en": "The human engine from Manchester City. Can cover any position on the flank or in the center of the pitch. His work rate and ball-winning ability are a nightmare for any opponent." }, "image": "https://placehold.co/300x300?text=Matheus+Nunes" },
    { "name": { "ru": "Гонсалу Инасиу", "en": "Gonçalo Inácio" }, "pos": "defender", "status": "Starter", "story": { "ru": "Элегантный левый центральный защитник лиссабонского «Спортинга». Обладает пасом, достойным плеймейкера, и начинает атаки своей команды прямо от ворот.", "en": "The elegant left-sided center-back for Sporting Lisbon. Possesses a pass worthy of a playmaker and starts his team's attacks right from the goal." }, "image": "https://placehold.co/300x300?text=Goncalo+Inacio" },
    { "name": { "ru": "Ренату Вейга", "en": "Renato Veiga" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Гигант, совершивший переход в «Вильярреал». Его рост и мощь делают его главным оружием команды на стандартах. Настоящая воздушная крепость.", "en": "A giant who made a move to Villarreal. His height and power make him the team's main weapon on set pieces. A real aerial fortress." }, "image": "https://placehold.co/300x300?text=Renato+Veiga" },
    { "name": { "ru": "Томаш Араужу", "en": "Tomás Araújo" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Восходящая звезда Benfica. Молодой, амбициозный и отлично читающий игру центральный защитник, который представляет собой светлое будущее португальской обороны.", "en": "The rising star of Benfica. A young, ambitious, and excellent reading-of-the-game center-back who represents the bright future of the Portuguese defense." }, "image": "https://placehold.co/300x300?text=Tomas+Araujo" },
    { "name": { "ru": "Бернарду Силва", "en": "Bernardo Silva" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Тактический гений и мотор «Манчестер Сити». Человек, который может сыграть на любой позиции в атаке и полузащите. Его видение поля и неустанный прессинг — фундамент португальского успеха.", "en": "The tactical genius and engine of Manchester City. A man who can play in any position in attack and midfield. His vision of the field and relentless pressing are the foundation of Portuguese success." }, "image": "https://placehold.co/300x300?text=Bernardo+Silva" },
    { "name": { "ru": "Бруну Фернандеш", "en": "Bruno Fernandes" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Главный креативщик и душа компании в «Манчестер Юнайтед». Мастер обостряющих передач и стандартов. Его удары и навесы — это всегда головная боль для вратарей и защитников соперника.", "en": "The main creator and soul of the company at Manchester United. A master of incisive passes and set pieces. His shots and crosses are always a headache for opposing goalkeepers and defenders." }, "image": "https://placehold.co/300x300?text=Bruno+Fernandes" },
    { "name": { "ru": "Витинья", "en": "Vitinha" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Дирижер оркестра из ПСЖ. Его умение держать мяч и переключать скорость игры просто завораживает. Настоящий метроном португальской сборной.", "en": "The orchestra conductor from PSG. His ability to hold the ball and switch the speed of the game is simply mesmerizing. The real metronome of the Portuguese national team." }, "image": "https://placehold.co/300x300?text=Vitinha" },
    { "name": { "ru": "Жоау Невеш", "en": "João Neves" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Юный феномен, уже ставший звездой ПСЖ. Несмотря на возраст, он играет с мудростью и агрессией ветерана, разрывая соперников своим прессингом и пасами.", "en": "A young phenomenon who has already become a star at PSG. Despite his age, he plays with the wisdom and aggression of a veteran, tearing opponents apart with his pressing and passes." }, "image": "https://placehold.co/300x300?text=Joao+Neves" },
    { "name": { "ru": "Рубен Невеш", "en": "Rúben Neves" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Мастер длинных передач из «Аль-Хиляля». Его умение одним пасом перевести игру с фланга на фланг или найти нападающего — это искусство высшего пилотажа.", "en": "The master of long passes from Al Hilal. His ability to switch play from flank to flank or find a striker with a single pass is an art of the highest order." }, "image": "https://placehold.co/300x300?text=Ruben+Neves" },
    { "name": { "ru": "Саму Кошта", "en": "Samú Costa" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Энергетическая батарея из «Мальорки». Бокс-ту-бокс полузащитник, который готов бегать от своих ворот до чужих 90 минут без остановки. Идеальный разрушитель и подносчик снарядов.", "en": "The energy battery from Mallorca. A box-to-box midfielder ready to run from his own goal to the opponent's for 90 minutes without stopping. The perfect destroyer and supplier of ammunition." }, "image": "https://placehold.co/300x300?text=Samu+Costa" },
    { "name": { "ru": "Жоау Феликс", "en": "João Félix" }, "pos": "forward", "status": "Star", "story": { "ru": "Талант с божьей искрой, воссоединившийся с Роналду в «Аль-Насре». Его дриблинг, финты и нестандартное мышление способны взломать любую, даже самую насыщенную оборону.", "en": "A talent with a divine spark, reunited with Ronaldo at Al Nassr. His dribbling, feints, and unorthodox thinking can break down any, even the most crowded defense." }, "image": "https://placehold.co/300x300?text=Joao+Felix" },
    { "name": { "ru": "Рафаэл Леау", "en": "Rafael Leão" }, "pos": "forward", "status": "Star", "story": { "ru": "Человек-молния из «Милана». Когда он получает мяч на левом фланге и включает свою максимальную скорость, у защитников соперника остается только один шанс — сфолить.", "en": "The human lightning from AC Milan. When he gets the ball on the left flank and turns on his maximum speed, the opposing defenders have only one chance — to foul." }, "image": "https://placehold.co/300x300?text=Rafael+Leao" },
    { "name": { "ru": "Гонсалу Рамуш", "en": "Gonçalo Ramos" }, "pos": "forward", "status": "Star", "story": { "ru": "Классический «убийца» в штрафной из ПСЖ. Обладает поставленным ударом и отличным позиционным чутьем. Готов выйти из тени и вести команду к голам.", "en": "A classic 'killer' in the box from PSG. Possesses a well-placed shot and excellent positional sense. Ready to step out of the shadows and lead the team to goals." }, "image": "https://placehold.co/300x300?text=Goncalo+Ramos" },
    { "name": { "ru": "Педру Нету", "en": "Pedro Neto" }, "pos": "forward", "status": "Starter", "story": { "ru": "Юркий и непредсказуемый вингер «Челси». Его низкий центр тяжести и сумасшедшая работа с мячом позволяют ему обыгрывать один в один кого угодно.", "en": "The nimble and unpredictable winger for Chelsea. His low center of gravity and crazy ball control allow him to beat anyone one-on-one." }, "image": "https://placehold.co/300x300?text=Pedro+Neto" },
    { "name": { "ru": "Франсишку Консейсау", "en": "Francisco Conceição" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Дерзкий молодой талант из «Ювентуса». Сын легендарного тренера, он унаследовал его характер и прямолинейность. Настоящий терьер на фланге, готовый рвать любого.", "en": "A bold young talent from Juventus. The son of a legendary coach, he inherited his character and directness. A real terrier on the flank, ready to tear anyone apart." }, "image": "https://placehold.co/300x300?text=Francisco+Conceicao" },
    { "name": { "ru": "Франсишку Тринкан", "en": "Francisco Trincão" }, "pos": "forward", "status": "Starter", "story": { "ru": "Кудесник с левой ногой из «Спортинга». Его подачи, прострелы и удары из-за штрафной обладают убойной точностью и силой.", "en": "A wizard with a left foot from Sporting. His crosses, passes, and shots from outside the box possess deadly accuracy and power." }, "image": "https://placehold.co/300x300?text=Francisco+Trincao" },
    { "name": { "ru": "Гонсалу Гедеш", "en": "Gonçalo Guedes" }, "pos": "forward", "status": "Legend", "story": { "ru": "Опытный и умный нападающий «Реал Сосьедада». Универсальный солдат атаки, который может сыграть на любом фланге или в центре, всегда готовый подставить ногу под передачу.", "en": "An experienced and smart forward for Real Sociedad. A universal soldier of the attack who can play on any flank or in the center, always ready to stick his leg out for a pass." }, "image": "https://placehold.co/300x300?text=Goncalo+Guedes" }
  ]
},
"GER": {
  "desc": {
    "ru": "Четырехкратные чемпионы мира, чья история — летопись воли и тактического превосходства. Под руководством Юлиана Нагельсманна «Манншафт» проходит через глубокое обновление, возвращая себе статус неоспоримого лидера. Немецкая машина снова в строю, и она нацелена только на золото.",
    "en": "Four-time world champions whose history is a chronicle of will and tactical superiority. Under Julian Nagelsmann, the 'Mannschaft' is undergoing a deep renewal, reclaiming its status as an undisputed leader. The German machine is back in action, and it is aimed only at gold."
  },
  "coaches": [{ "name": { "ru": "Юлиан Нагельсманн", "en": "Julian Nagelsmann" }, "story": { "ru": "Один из самых инновационных тренеров мира, ведущий сборную Германии к домашнему триумфу.", "en": "One of the world's most innovative coaches, leading the German national team towards home triumph." }, "image": "https://placehold.co/300x300?text=Julian+Nagelsmann" }],
  "players": [
    { "name": { "ru": "Джамал Мусиала", "en": "Jamal Musiala" }, "pos": "midfielder", "status": "Star", "story": { "ru": "«Бэмби» — невероятно техничный игрок, способный обыграть нескольких соперников на носовом платке.", "en": "'Bambi' is an incredibly technical player, capable of beating several opponents in a phone booth." }, "image": "https://placehold.co/300x300?text=Jamal+Musiala" },
    { "name": { "ru": "Марк-Андре тер Штеген", "en": "Marc-André ter Stegen" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Ветеран и гарант надежности. Переживший тяжелые травмы спины, он вернулся в сборную, чтобы доказать, что его рефлексы и лидерские качества по-прежнему на высшем уровне. Знаменит своей игрой ногами, которая фактически делает его десятым полевым игроком.", "en": "A veteran and a guarantee of reliability. Having survived severe back injuries, he returned to the national team to prove that his reflexes and leadership qualities are still at the highest level. Famous for his footwork, which actually makes him the tenth outfield player." }, "image": "https://placehold.co/300x300?text=Marc-Andre+ter+Stegen" },
    { "name": { "ru": "Грегор Кобель", "en": "Gregor Kobel" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Скала из дортмундской «Боруссии». Его невероятная реакция и игра на выходах сделали его одним из лучших вратарей Европы. Интересный факт: в юности он играл в теннис на профессиональном уровне, что объясняет его феноменальную работу рук и ног.", "en": "The rock of Borussia Dortmund. His incredible reflexes and sweeping game made him one of the best goalkeepers in Europe. Interesting fact: in his youth, he played tennis at a professional level, which explains his phenomenal hand and footwork." }, "image": "https://placehold.co/300x300?text=Gregor+Kobel" },
    { "name": { "ru": "Александр Нюбель", "en": "Alexander Nübel" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Идеальный дублер, закаленный в суровых баталиях Бундеслиги и аренд. Его спокойствие и уверенная игра ногами — отличная страховка для команды. Известен своим невероятным ростом и умением перекрывать ближний угол, сводя с ума нападающих.", "en": "The perfect backup, hardened in the tough battles of the Bundesliga and loans. His composure and confident footwork are excellent insurance for the team. Known for his incredible height and ability to cover the near post, driving strikers crazy." }, "image": "https://placehold.co/300x300?text=Alexander+Nubel" },
    { "name": { "ru": "Антонио Рюдигер", "en": "Antonio Rüdiger" }, "pos": "defender", "status": "Star", "story": { "ru": "Немецкий танк. Его агрессия, скорость и бескомпромиссность в единоборствах наводят ужас на нападающих. Интересный факт: его фирменное празднование гола с «крыльями» стало вирусным мемом, но на поле он остается самым жестким защитником Европы.", "en": "The German tank. His aggression, speed, and uncompromising nature in duels terrify strikers. Interesting fact: his signature 'wings' goal celebration became a viral meme, but on the pitch, he remains the toughest defender in Europe." }, "image": "https://placehold.co/300x300?text=Antonio+Rudiger" },
    { "name": { "ru": "Джонатан Та", "en": "Jonathan Tah" }, "pos": "defender", "status": "Starter", "story": { "ru": "Монумент в центре обороны. После триумфа с «Байером» он стал непробиваемой стеной. Он невероятно редко получает красные карточки за всю свою карьеру, что говорит о его высочайшем интеллекте и спокойствии в отборе.", "en": "A monument in the center of defense. After triumphing with Bayer, he became an impenetrable wall. He incredibly rarely gets red cards throughout his career, which speaks to his highest intelligence and composure in tackling." }, "image": "https://placehold.co/300x300?text=Jonathan+Tah" },
    { "name": { "ru": "Нико Шлоттербек", "en": "Nico Schlotterbeck" }, "pos": "defender", "status": "Starter", "story": { "ru": "Левша с поставленным пасом. Центральный защитник «Боруссии», который не только надежно играет в отборе, но и начинает атаки. Факт: он начал заниматься футболом в одной академии с Джамалом Мусиалой, и их связывает крепкая дружба.", "en": "A left-footed player with a set pass. A Borussia Dortmund center-back who not only plays reliably in defense but also starts attacks. Fact: he started playing football in the same academy as Jamal Musiala, and they share a strong friendship." }, "image": "https://placehold.co/300x300?text=Nico+Schlotterbeck" },
    { "name": { "ru": "Вальдемар Антон", "en": "Waldemar Anton" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный солдат. Может сыграть как в центре, так и на фланге. Его тактическая гибкость и неуступчивость делают его незаменимым. Знает несколько языков и считается одним из самых интеллектуальных игроков в раздевалке.", "en": "A universal soldier. Can play both in the center and on the flank. His tactical flexibility and tenacity make him indispensable. Speaks several languages and is considered one of the most intellectual players in the dressing room." }, "image": "https://placehold.co/300x300?text=Waldemar+Anton" },
    { "name": { "ru": "Бенджамин Хенрикс", "en": "Benjamin Henrichs" }, "pos": "defender", "status": "Starter", "story": { "ru": "Мотор на правом фланге. Его выносливость позволяет ему курсировать от своих до чужих ворот весь матч. Факт: он родился в семье выходцев из Ганы, и его старший брат также профессиональный футболист, играющий в низших лигах Германии.", "en": "The engine on the right flank. His stamina allows him to shuttle from his own goal to the opponent's throughout the match. Fact: he was born in a family of Ghanaian descent, and his older brother is also a professional footballer playing in the lower leagues of Germany." }, "image": "https://placehold.co/300x300?text=Benjamin+Henrichs" },
    { "name": { "ru": "Давид Раум", "en": "David Raum" }, "pos": "defender", "status": "Starter", "story": { "ru": "Атакующий латераль с сердцем форварда. Его навесы и подключения в штрафную — одно из главных оружий сборной. Интересный факт: до перехода в профессиональный футбол он работал в сфере ухода за пожилыми людьми, что говорит о его невероятном терпении и заботе.", "en": "An attacking wing-back with the heart of a striker. His crosses and runs into the box are one of the national team's main weapons. Interesting fact: before turning to professional football, he worked in elderly care, which speaks to his incredible patience and care." }, "image": "https://placehold.co/300x300?text=David+Raum" },
    { "name": { "ru": "Йоша Вагноман", "en": "Josha Vagnoman" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Взрывной фланговый защитник. Его скорость и дриблинг позволяют ему легко обыгрывать один в один. Родился в Гамбурге и начинал карьеру в местной академии, где его называли «новым Джанлукой Дзамброттой» за универсальность.", "en": "An explosive flank defender. His speed and dribbling allow him to easily beat opponents one-on-one. Born in Hamburg and started his career in the local academy, where he was called the 'new Gianluca Zambrotta' for his versatility." }, "image": "https://placehold.co/300x300?text=Josha+Vagnoman" },
    { "name": { "ru": "Малик Тиау", "en": "Malick Thiaw" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Молодой гигант из «Милана». Его рост и чтение игры компенсируют нехватку опыта. Факт: его отец — бывший профессиональный баскетболист, что объясняет его невероятные прыгучесть и размах рук при игре головой.", "en": "A young giant from AC Milan. His height and reading of the game compensate for his lack of experience. Fact: his father is a former professional basketball player, which explains his incredible jumping ability and arm span when playing in the air." }, "image": "https://placehold.co/300x300?text=Malick+Thiaw" },
    { "name": { "ru": "Флориан Вирц", "en": "Florian Wirtz" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Маэстро из Леверкузена. Его видение поля и умение отдать последний пас делают его главным креативным хабом. Факт: в 17 лет он стал самым молодым бомбардиром в истории Бундеслиги, побив рекорд, который держался десятилетиями.", "en": "The maestro from Leverkusen. His vision of the field and ability to deliver the final pass make him the main creative hub. Fact: at 17, he became the youngest goalscorer in Bundesliga history, breaking a record that had stood for decades." }, "image": "https://placehold.co/300x300?text=Florian+Wirtz" },
    { "name": { "ru": "Джошуа Киммих", "en": "Joshua Kimmich" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Дирижер и универсал. Капитанские качества и тактический интеллект позволяют ему управлять игрой. Интересный факт: в детстве он занимался дзюдо и имеет черный пояс, что помогает ему в жестких единоборствах в центре поля.", "en": "The conductor and universalist. Captaincy qualities and tactical intelligence allow him to control the game. Interesting fact: in his childhood, he practiced judo and has a black belt, which helps him in tough midfield battles." }, "image": "https://placehold.co/300x300?text=Joshua+Kimmich" },
    { "name": { "ru": "Роберт Андрых", "en": "Robert Andrich" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Таран в центре поля. Его физическая мощь и умение выигрывать подборы дают команде необходимую агрессию. Факт: он начинал карьеру в региональных лигах и пробился в элиту исключительно благодаря своему трудолюбию и характеру.", "en": "A battering ram in the center of the pitch. His physical power and ability to win loose balls give the team the necessary aggression. Fact: he started his career in regional leagues and broke into the elite solely thanks to his hard work and character." }, "image": "https://placehold.co/300x300?text=Robert+Andrich" },
    { "name": { "ru": "Александар Павлович", "en": "Aleksandar Pavlović" }, "pos": "midfielder", "status": "Rookie", "story": { "ru": "Юный феномен «Баварии». Элегантный и хладнокровный опорник. Факт: он родился в Мюнхене в сербской семье и свободно говорит на трех языках, а его дебют за сборную стал одним из самых ярких событий сезона.", "en": "A young phenomenon of Bayern Munich. An elegant and cool-headed defensive midfielder. Fact: he was born in Munich to a Serbian family and speaks three languages fluently, and his debut for the national team became one of the brightest events of the season." }, "image": "https://placehold.co/300x300?text=Aleksandar+Pavlovic" },
    { "name": { "ru": "Леон Горецка", "en": "Leon Goretzka" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Машина box-to-box. Его мощные рывки с мячом и удары из-за штрафной — это то самое «немецкое качество». Интересный факт: он является основателем благотворительного фонда, который собирает миллионы для больниц во время кризисов.", "en": "A box-to-box machine. His powerful runs with the ball and shots from outside the box are that very 'German quality'. Interesting fact: he is the founder of a charitable foundation that raises millions for hospitals during crises." }, "image": "https://placehold.co/300x300?text=Leon+Goretzka" },
    { "name": { "ru": "Паскаль Грос", "en": "Pascal Groß" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Ветеранский опыт и тактическая мудрость. Звезда «Брайтона» привносит в сборную спокойствие. Факт: он долгое время играл в низших лигах Англии, прежде чем стать звездой АПЛ, что делает его историю одной из самых вдохновляющих в футболе.", "en": "Veteran experience and tactical wisdom. The Brighton star brings calmness to the national team. Fact: he played in the lower leagues of England for a long time before becoming a Premier League star, making his story one of the most inspiring in football." }, "image": "https://placehold.co/300x300?text=Pascal+Gross" },
    { "name": { "ru": "Кай Хаверц", "en": "Kai Havertz" }, "pos": "forward", "status": "Star", "story": { "ru": "Универсальный форвард. Его рост, техника и умение открыться в свободные зоны делают его идеальным партнером. Факт: он является одним из самых высоких нападающих в мире, но при этом обладает техникой и дриблингом, достойными маленького плеймейкера.", "en": "A universal forward. His height, technique, and ability to find space make him the perfect partner. Fact: he is one of the tallest strikers in the world, but at the same time possesses the technique and dribbling worthy of a small playmaker." }, "image": "https://placehold.co/300x300?text=Kai+Havertz" },
    { "name": { "ru": "Лерой Зане", "en": "Leroy Sané" }, "pos": "forward", "status": "Star", "story": { "ru": "Человек-молния. Его дриблинг, скорость и поставленный удар с левой ноги — главное оружие Германии. Интересный факт: его отец, Сулейман Сане, был известным сенегальским футболистом, а мать — гимнасткой, что объясняет его невероятную координацию.", "en": "The human lightning. His dribbling, speed, and set left-footed shot are Germany's main weapons. Interesting fact: his father, Souleyman Sané, was a famous Senegalese footballer, and his mother was a gymnast, which explains his incredible coordination." }, "image": "https://placehold.co/300x300?text=Leroy+Sane" },
    { "name": { "ru": "Серж Гнабри", "en": "Serge Gnabry" }, "pos": "forward", "status": "Starter", "story": { "ru": "Мастер рывков в свободные зоны. Его безжалостная реализация и умение оказаться в нужном месте — кошмар для защитников. Факт: в детстве он тренировался в академии «Штутгарта», но его семья переехала, и ему пришлось доказывать свой талант заново.", "en": "A master of runs into free zones. His ruthless finishing and ability to be in the right place are a nightmare for defenders. Fact: in his childhood, he trained in the Stuttgart academy, but his family moved, and he had to prove his talent all over again." }, "image": "https://placehold.co/300x300?text=Serge+Gnabry" },
    { "name": { "ru": "Никлас Фюллькруг", "en": "Niclas Füllkrug" }, "pos": "forward", "status": "Starter", "story": { "ru": "Классический таргетмен. Его игра на втором этаже и поставленный удар — это план «Б» и «А» для взлома обороны. Интересный факт: его знаменитая татуировка с надписью «Echt» (Настоящий) идеально описывает его прямолинейный и бескомпромиссный стиль игры.", "en": "A classic target man. His aerial game and set shot are plan 'B' and 'A' for breaking down the defense. Interesting fact: his famous tattoo with the word 'Echt' (Real) perfectly describes his straightforward and uncompromising style of play." }, "image": "https://placehold.co/300x300?text=Niclas+Fullkrug" },
    { "name": { "ru": "Дениз Ундав", "en": "Deniz Undav" }, "pos": "forward", "status": "Starter", "story": { "ru": "Неутомимый прессинг-машина. Его работоспособность и умение начать атаку высоким отбором мяча. Факт: он родился в семье российских немцев и долгое время играл в низших лигах, прежде чем стать открытием Бундеслиги.", "en": "An tireless pressing machine. His work rate and ability to start an attack with a high turnover. Fact: he was born in a family of Russian Germans and played in the lower leagues for a long time before becoming the revelation of the Bundesliga." }, "image": "https://placehold.co/300x300?text=Deniz+Undav" },
    { "name": { "ru": "Карим Адейеми", "en": "Karim Adeyemi" }, "pos": "forward", "status": "Star", "story": { "ru": "Сверхзвуковой вингер. Когда он включает свою максимальную скорость, у защитников просто не остается шансов. Факт: в юности он занимался легкой атлетикой и показывал результаты на уровне мастера спорта в спринте, что напрямую конвертировалось в его скорость на поле.", "en": "A supersonic winger. When he turns on his maximum speed, the defenders just have no chance. Fact: in his youth, he practiced athletics and showed results at the level of a master of sports in sprinting, which directly translated into his speed on the pitch." }, "image": "https://placehold.co/300x300?text=Karim+Adeyemi" },
    { "name": { "ru": "Брайан Груда", "en": "Brajan Gruda" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Дерзкий молодой вингер. Его скорость, нахальство и умение играть один в один — это свежий ветер в немецкой атаке. Факт: он родился в Германии, но имеет албанские корни, и его выбор в пользу сборной Германии стал триумфом скаутской службы Нагельсманна.", "en": "A bold young winger. His speed, cheekiness, and ability to play one-on-one are a fresh wind in the German attack. Fact: he was born in Germany but has Albanian roots, and his choice in favor of the German national team became a triumph of Nagelsmann's scouting service." }, "image": "https://placehold.co/300x300?text=Brajan+Gruda" }
  ]
},
 "CAN": {
    "desc": {
      "ru": "Хозяева турнира, ставшие главным открытием последних лет. Сборная Канады - это неукротимый дух Севера. Ведомые мировыми звездами, канадцы готовы удивить планету и показать, что кленовый лист —  символ новой футбольной силы.",
      "en": "Tournament hosts who have become the main revelation of recent years. Team Canada is lightning speed and the indomitable spirit of the North. They are no longer underdogs; led by world stars, the Canadians are ready to surprise the planet and show that the maple leaf on their chest is a symbol of a new football power."
    },
    "coaches": [
      {

        "story": { "ru": "Американский тренер с опытом работы в АПЛ и Бундеслиге, ставящий Канаде агрессивный прессинг.", "en": "American coach with PL and Bundesliga experience, implementing aggressive pressing for Canada." }, 
        "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Jesse_Marsch_2022_Croatia.jpg/300px-Jesse_Marsch_2022_Croatia.jpg"

    ],
    "players": [
      {

        "pos": "defender", 
        "status": "Star", 
        "story": { "ru": "Самый титулованный канадский игрок в истории, обладающий невероятной скоростью.", "en": "The most decorated Canadian player in history, possessing incredible speed." }, 
        "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Alphonso_Davies_2023.jpg/300px-Alphonso_Davies_2023.jpg"
      },
      { 
        "name": { "ru": "Джонатан Дэвид", "en": "Jonathan David" }, 
        "pos": "forward", 
        "status": "Star", 
        "story": { "ru": "Лучший бомбардир сборной Канады в истории, наконечник атак.", "en": "All-time top scorer for Canada, the spearhead of the attack." }, 
        "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Jonathan_David_2023.jpg/300px-Jonathan_David_2023.jpg"
      },

"RSA": {
  "desc": {
    "ru": "«Бафана-Бафана» — ритм африканских барабанов и непоколебимая вера в успех. Сборная ЮАР стремится вернуть славные времена, когда они были королями континента. Команда славится своим единством и умением биться до последней секунды, неся в себе наследие великого Нельсона Манделы.",
    "en": "The 'Bafana Bafana' is the rhythm of African drums and an unwavering belief in success. The South African national team seeks to return to those glorious times when they were the kings of the continent. The team is famous for its unity and ability to fight until the last second, carrying the legacy of the great Nelson Mandela."
  },
  "coaches": [{ "name": { "ru": "Уго Брос", "en": "Hugo Broos" }, "story": { "ru": "Опытный бельгийский специалист, приведший ЮАР к бронзе Кубка Африки 2023.", "en": "Experienced Belgian specialist who led South Africa to bronze in the 2023 AFCON." }, "image": "https://placehold.co/300x300?text=Hugo+Broos" }],
  "players": [
    { "name": { "ru": "Ронвен Уильямс", "en": "Ronwen Williams" }, "pos": "goalkeeper", "status": "Captain", "story": { "ru": "Герой серии пенальти на Кубке Африки, отбивший 4 удара в одном матче.", "en": "African Cup of Nations penalty shootout hero, saving 4 shots in a single match." }, "image": "https://placehold.co/300x300?text=Ronwen+Williams" },
    { "name": { "ru": "Перси Тау", "en": "Percy Tau" }, "pos": "forward", "status": "Star", "story": { "ru": "«Лев Иуды», один из самых техничных игроков в истории современного южноафриканского футбола.", "en": "The 'Lion of Judah', one of the most technical players in modern South African football history." }, "image": "https://placehold.co/300x300?text=Percy+Tau" },
    { "name": { "ru": "Реяад Питерсе", "en": "Reyaad Pieterse" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Надежный страж ворот «Мамелоди Сандаунз». Обладает отличной реакцией и уверенно играет на выходах. Он провел несколько сезонов в Европе, играя за «Ваккер» из Инсбрука, что закалило его характер.", "en": "The reliable goalkeeper of Mamelodi Sundowns. Possesses excellent reflexes and is confident in sweeping. He spent several seasons in Europe playing for Wacker Innsbruck, which hardened his character." }, "image": "https://placehold.co/300x300?text=Reyaad+Pieterse" },
    { "name": { "ru": "Брюс Бвума", "en": "Bruce Bvuma" }, "pos": "goalkeeper", "status": "Reserve", "story": { "ru": "Опытный вратарь «Кайзер Чифс». Его спокойствие и чтение игры делают его идеальным дублером. Он известен своими сейвами в дерби Соуэто, где давление на трибунах просто зашкаливает.", "en": "An experienced goalkeeper for Kaizer Chiefs. His composure and reading of the game make him the perfect backup. He is known for his saves in the Soweto derby, where the pressure in the stands is off the charts." }, "image": "https://placehold.co/300x300?text=Bruce+Bvuma" },
    { "name": { "ru": "Тхабо Молоко", "en": "Thabo Moloko" }, "pos": "defender", "status": "Starter", "story": { "ru": "Неутомимый правый защитник «Орландо Пайретс». Его выносливость позволяет ему курсировать по всему флангу 90 минут. Он начинал карьеру как нападающий, что объясняет его атакующий стиль и голевое чутье.", "en": "The tireless right-back for Orlando Pirates. His stamina allows him to shuttle up and down the flank for 90 minutes. He started his career as a forward, which explains his attacking style and goal-scoring instinct." }, "image": "https://placehold.co/300x300?text=Thabo+Moloko" },
    { "name": { "ru": "Кулисо Мудау", "en": "Khuliso Mudau" }, "pos": "defender", "status": "Starter", "story": { "ru": "Мощный левый защитник «Мамелоди Сандаунз». Его скорость и навесы — главное оружие на фланге. Он является воспитником академии «Сандаунз» и прошел все пути от молодежки до основы, став символом верности клубу.", "en": "A powerful left-back for Mamelodi Sundowns. His speed and crosses are the main weapon on the flank. He is a product of the Sundowns academy and went through all the ranks from youth to first team, becoming a symbol of loyalty to the club." }, "image": "https://placehold.co/300x300?text=Khuliso+Mudau" },
    { "name": { "ru": "Сианда Ксулу", "en": "Siyanda Xulu" }, "pos": "defender", "status": "Legend", "story": { "ru": "Ветеран и лидер обороны. Его опыт игры в Европе и МЛС делает его незаменимым. Он играл в Дании, Турции и США, привнося в сборную бесценный международный опыт и лидерские качества.", "en": "A veteran and leader of the defense. His experience playing in Europe and MLS makes him indispensable. He played in Denmark, Turkey, and the USA, bringing invaluable international experience and leadership to the national team." }, "image": "https://placehold.co/300x300?text=Siyanda+Xulu" },
    { "name": { "ru": "Рашин де Рек", "en": "Rushine De Reuck" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный защитник «Мамелоди Сандаунз». Может сыграть на любом фланге и в центре. Его тактическая гибкость и скорость делают его идеальным игроком для схемы с тремя центральными защитниками.", "en": "A versatile defender for Mamelodi Sundowns. Can play on any flank and in the center. His tactical flexibility and speed make him the perfect player for a three-center-back system." }, "image": "https://placehold.co/300x300?text=Rushine+De+Reuck" },
    { "name": { "ru": "Тхапело Морева", "en": "Thapelo Morena" }, "pos": "defender", "status": "Starter", "story": { "ru": "Надежный центральный защитник «Сандаунз». Его игра на втором этаже и чтение игры — щит команды. Он начал карьеру в «Блэк Леопардс» и пробился в элиту благодаря своему трудолюбию и характеру.", "en": "A reliable center-back for Sundowns. His aerial game and reading of the game are the team's shield. He started his career at Black Leopards and broke into the elite thanks to his hard work and character." }, "image": "https://placehold.co/300x300?text=Thapelo+Morena" },
    { "name": { "ru": "Грант Маргеман", "en": "Grant Margeman" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Креативный плеймейкер «Амазулу». Его видение поля и точность передач — мозг атаки. Он известен своими штрафными ударами, которые регулярно украшают матчи южноафриканской Премьер-лиги.", "en": "A creative playmaker for AmaZulu. His vision and passing accuracy are the brain of the attack. He is known for his free-kicks, which regularly decorate matches in the South African Premier Division." }, "image": "https://placehold.co/300x300?text=Grant+Margeman" },
    { "name": { "ru": "Тебохо Мокена", "en": "Teboho Mokoena" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Мотор центра поля «Суперспорта». Его энергия и отбор мяча — фундамент игры сборной. Он является воспитником академии «Суперспорт Юнайтед» и провел там всю карьеру, став символом клуба.", "en": "The engine of the midfield for SuperSport. His energy and ball-winning are the foundation of the national team's game. He is a product of the SuperSport United academy and spent his entire career there, becoming a symbol of the club." }, "image": "https://placehold.co/300x300?text=Teboho+Mokoena" },
    { "name": { "ru": "Камохело Мокотжо", "en": "Kamohelo Mokotjo" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Опытный опорник с европейским прошлым. Его тактический интеллект и спокойствие необходимы команде. Он играл в Нидерландах и Англии, привнося в сборную бесценный опыт выступлений в топ-лигах.", "en": "An experienced defensive midfielder with a European past. His tactical intelligence and composure are essential for the team. He played in the Netherlands and England, bringing invaluable experience of playing in top leagues to the national team." }, "image": "https://placehold.co/300x300?text=Kamohelo+Mokotjo" },
    { "name": { "ru": "Нджабало Блом", "en": "Njabulo Blom" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Универсальный полузащитник «Кайзер Чифс». Может сыграть как опорника, так и атакующего хавбека. Он известен своей работоспособностью и умением начать атаку из глубины поля.", "en": "A versatile midfielder for Kaizer Chiefs. Can play as both a defensive midfielder and an attacking midfielder. He is known for his work rate and ability to start an attack from deep." }, "image": "https://placehold.co/300x300?text=Njabulo+Blom" },
    { "name": { "ru": "Тхапело Морева", "en": "Thapelo Morena" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Энергичный бокс-ту-бокс полузащитник. Его рывки и удары из-за штрафной — угроза для ворот соперника. Он начал карьеру в низших лигах и пробился в сборную исключительно благодаря своему трудолюбию.", "en": "An energetic box-to-box midfielder. His runs and shots from outside the box are a threat to the opponent's goal. He started his career in the lower leagues and made it to the national team solely thanks to his hard work." }, "image": "https://placehold.co/300x300?text=Thapelo+Morena" },
    { "name": { "ru": "Киган Долли", "en": "Keagan Dolly" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Талантливый плеймейкер с европейским опытом. Его дриблинг и видение поля — оружие атаки. Он играл во Франции за «Монпелье», став одним из немногих южноафриканцев, засветившихся в Лиге 1.", "en": "A talented playmaker with European experience. His dribbling and vision are the weapons of the attack. He played in France for Montpellier, becoming one of the few South Africans to shine in Ligue 1." }, "image": "https://placehold.co/300x300?text=Keagan+Dolly" },
    { "name": { "ru": "Мбонгени Гумеде", "en": "Mbongeni Gumede" }, "pos": "forward", "status": "Starter", "story": { "ru": "Быстрый вингер «Амазулу». Его скорость и дриблинг — головная боль для защитников. Он начал карьеру в академии «Амазулу» и быстро пробился в основу, став одним из самых перспективных игроков страны.", "en": "A fast winger for AmaZulu. His speed and dribbling are a headache for defenders. He started his career in the AmaZulu academy and quickly broke into the first team, becoming one of the country's most promising players." }, "image": "https://placehold.co/300x300?text=Mbongeni+Gumede" },
    { "name": { "ru": "Тэмми Мванго", "en": "Tumi Mhlongo" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Юный талант «Орландо Пайретс». Его техника и финты сводят с ума защитников. Он является воспитником академии «Пайретс» и считается будущим южноафриканского футбола.", "en": "A young talent for Orlando Pirates. His technique and feints drive defenders crazy. He is a product of the Pirates academy and is considered the future of South African football." }, "image": "https://placehold.co/300x300?text=Tumi+Mhlongo" },
    { "name": { "ru": "Илса Модири", "en": "Iles Modi" }, "pos": "forward", "status": "Rookie", "story": { "ru": "Молодой нападающий с отличным голевым чутьем. Его движение в штрафной и реализация — кошмар для вратарей. Он начал карьеру в любительской лиге и пробился в профессиональный футбол благодаря своим голам.", "en": "A young striker with an excellent goal-scoring instinct. His movement in the box and finishing are a nightmare for goalkeepers. He started his career in the amateur league and broke into professional football thanks to his goals." }, "image": "https://placehold.co/300x300?text=Iles+Modi" },
    { "name": { "ru": "Моннапуле Саленг", "en": "Monnapule Saleng" }, "pos": "forward", "status": "Starter", "story": { "ru": "Мощный форвард «Орландо Пайретс». Его физическая мощь и игра на втором этаже — план «Б» для взлома обороны. Он известен своей самоотверженностью и готовностью бороться за каждый мяч.", "en": "A powerful forward for Orlando Pirates. His physical strength and aerial game are plan 'B' for breaking down the defense. He is known for his dedication and willingness to fight for every ball." }, "image": "https://placehold.co/300x300?text=Monnapule+Saleng" },
    { "name": { "ru": "Эвиджнн Нгома", "en": "Evidence Makgopa" }, "pos": "forward", "status": "Star", "story": { "ru": "Хладнокровный снайпер «Стока Сити». Его инстинкт убийцы в штрафной и поставленный удар делают его главной угрозой. Он стал лучшим бомбардиром южноафриканской Премьер-лиги, прежде чем переехать в Европу.", "en": "A clinical sniper for Stoke City. His killer instinct in the box and set shot make him the main threat. He became the top scorer in the South African Premier Division before moving to Europe." }, "image": "https://placehold.co/300x300?text=Evidence+Makgopa" }
  ]

"KOR": {
  "desc": {
    "ru": "«Воины Тэджу» — символ азиатского упорства и дисциплины. Самая успешная сборная своего континента в истории ЧМ, Южная Корея - славится своей выносливостью и молниеносными контратаками. Они выходят на поле, чтобы сражаться за честь нации, не оставляя соперникам ни секунды покоя.",
    "en": "The 'Taegeuk Warriors' are a symbol of Asian perseverance and discipline. The most successful national team of their continent in World Cup history, South Korea has always been famous for its endurance and lightning-fast counterattacks. They take the field to fight for the honor of the nation, leaving their opponents not a second of peace."
  },
  "coaches": [{ "name": { "ru": "Хон Мён Бо", "en": "Hong Myung-bo" }, "story": { "ru": "Легенда корейского футбола, вернувшийся к руководству сборной для подготовки к ЧМ-2026.", "en": "Korean football legend who returned to lead the national team in preparation for WC 2026." }, "image": "https://placehold.co/300x300?text=Hong+Myung-bo" }],
  "players": [
    { "name": { "ru": "Сон Хын Мин", "en": "Son Heung-min" }, "pos": "forward", "status": "Captain", "story": { "ru": "Легенда Азии, обладатель Золотой бутсы АПЛ. Кумир миллионов.", "en": "Asian legend, Premier League Golden Boot winner. An idol for millions." }, "image": "https://placehold.co/300x300?text=Son+Heung-min" },
    { "name": { "ru": "Ким Мин Джэ", "en": "Kim Min-jae" }, "pos": "defender", "status": "Star", "story": { "ru": "«Монстр» обороны, прошедший путь от чемпионата Кореи до мюнхенской «Баварии».", "en": "The defensive 'Monster' who made his way from the K-League to Bayern Munich." }, "image": "https://placehold.co/300x300?text=Kim+Min-jae" },
    { "name": { "ru": "Чо Хён У", "en": "Jo Hyeon-woo" }, "pos": "goalkeeper", "status": "Starter", "story": { "ru": "Непробиваемый страж ворот из «Ульсана». Его реакция и лидерские качества делают его первым номером сборной. Он известен своими невероятными сейвами в азиатских кубках, где он в одиночку спасал команду от разгромов.", "en": "The impenetrable guardian of the goal from Ulsan. His reflexes and leadership qualities make him the number one for the national team. He is known for his incredible saves in Asian cups, where he single-handedly saved the team from routs." }, "image": "https://placehold.co/300x300?text=Jo+Hyeon-woo" },
    { "name": { "ru": "Ким Сын Гю", "en": "Kim Seung-gyu" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Опытный ветеран, покоривший саудовскую Премьер-лигу. Его спокойствие и игра на выходах — это страховка для всей обороны. Настоящий дядька-наставник для молодежного десанта в рамке.", "en": "An experienced veteran who has conquered the Saudi Pro League. His composure and sweeping game are insurance for the entire defense. A true mentor for the youthful squad in goal." }, "image": "https://placehold.co/300x300?text=Kim+Seung-gyu" },
    { "name": { "ru": "Хван Ин Джэ", "en": "Hwang In-jae" }, "pos": "goalkeeper", "status": "Rookie", "story": { "ru": "Восходящая звезда вратарского цеха. Его прыгучесть и игра ногами идеально вписываются в современный футбол. Он готов в любой момент выйти на замену и доказать, что будущее корейского футбола в надежных руках.", "en": "A rising star of the goalkeeping trade. His jumping ability and footwork fit perfectly into modern football. He is ready to come off the bench at any moment and prove that the future of Korean football is in safe hands." }, "image": "https://placehold.co/300x300?text=Hwang+In-jae" },
    { "name": { "ru": "Ким Джин Су", "en": "Kim Jin-su" }, "pos": "defender", "status": "Starter", "story": { "ru": "Универсальный солдат на левом фланге. Его выносливость и тактическая гибкость позволяют ему закрывать всю бровку от своих до чужих ворот. Мастер стандартов, чьи навесы не раз приносили команде победы.", "en": "A universal soldier on the left flank. His stamina and tactical flexibility allow him to cover the entire touchline from his own goal to the opponent's. A master of set pieces whose crosses have brought the team victories more than once." }, "image": "https://placehold.co/300x300?text=Kim+Jin-su" },
    { "name": { "ru": "Ким Джин Я", "en": "Kim Jin-ya" }, "pos": "defender", "status": "Starter", "story": { "ru": "Мотор в центре поля и на фланге. Игрок, способный разорвать любую оборону своим бесконечным бегом. Его работоспособность и отбор мяча — кошмар для любого оппонента.", "en": "An engine in the center of the pitch and on the flank. A player capable of tearing apart any defense with his endless running. His work rate and ball-winning are a nightmare for any opponent." }, "image": "https://placehold.co/300x300?text=Kim+Jin-ya" },
    { "name": { "ru": "Ким Ён Гвон", "en": "Kim Young-gwon" }, "pos": "defender", "status": "Legend", "story": { "ru": "Цемент обороны и ветеран с опытом чемпионатов мира. Его чтение игры и жесткость в единоборствах наводят ужас на нападающих. Настоящий лидер, который всегда подскажет и подстрахует.", "en": "The cement of the defense and a veteran with World Cup experience. His reading of the game and toughness in duels terrify strikers. A true leader who always advises and covers." }, "image": "https://placehold.co/300x300?text=Kim+Young-gwon" },
    { "name": { "ru": "Чон Сын Хён", "en": "Jung Seung-hyun" }, "pos": "defender", "status": "Starter", "story": { "ru": "Монумент в центре обороны «Ульсана». Его игра на втором этаже и физическая мощь делают его непробиваемой стеной. Идеальный партнер для Ким Мин Джэ в паре центральных защитников.", "en": "A monument in the center of Ulsan's defense. His aerial game and physical strength make him an impenetrable wall. The perfect partner for Kim Min-jae in a pair of center-backs." }, "image": "https://placehold.co/300x300?text=Jung+Seung-hyun" },
    { "name": { "ru": "Соль Ён У", "en": "Seol Young-woo" }, "pos": "defender", "status": "Starter", "story": { "ru": "Динамичный правый защитник с атакующим сердцем. Его скорость и дриблинг позволяют ему легко обыгрывать один в один. Он не боится идти в обводку даже в штрафной соперника.", "en": "A dynamic right-back with an attacking heart. His speed and dribbling allow him to easily beat opponents one-on-one. He is not afraid to take on defenders even in the opponent's box." }, "image": "https://placehold.co/300x300?text=Seol+Young-woo" },
    { "name": { "ru": "Ли Мён Джэ", "en": "Lee Myung-jae" }, "pos": "defender", "status": "Starter", "story": { "ru": "Тактический хамелеон. Может сыграть как на фланге, так и в центре обороны. Его интеллект и спокойствие с мячом делают его незаменимым для схем Хон Мён Бо.", "en": "A tactical chameleon. Can play both on the flank and in the center of defense. His intelligence and composure on the ball make him indispensable for Hong Myung-bo's schemes." }, "image": "https://placehold.co/300x300?text=Lee+Myung-jae" },
    { "name": { "ru": "Ким Джу Сон", "en": "Kim Ju-sung" }, "pos": "defender", "status": "Rookie", "story": { "ru": "Молодой и амбициозный защитник, представляющий светлое будущее корейской обороны. Его скорость и чтение игры компенсируют нехватку опыта, а характер не позволяет сдаваться ни в одном единоборстве.", "en": "A young and ambitious defender representing the bright future of the Korean defense. His speed and reading of the game compensate for his lack of experience, and his character does not allow him to give up in a single duel." }, "image": "https://placehold.co/300x300?text=Kim+Ju-sung" },
    { "name": { "ru": "Ли Кан Ин", "en": "Lee Kang-in" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Маэстро из ПСЖ. Его левая нога — высокоточный инструмент, способный отдать пас, который не видят другие. Волшебник стандартов и дирижер атакующей игры сборной.", "en": "The maestro from PSG. His left foot is a precision instrument capable of delivering a pass that others don't see. A wizard of set pieces and the conductor of the team's attacking game." }, "image": "https://placehold.co/300x300?text=Lee+Kang-in" },
    { "name": { "ru": "Хван Ин Бом", "en": "Hwang In-beom" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Мотор и разрушитель центра поля. Его энергия и умение выигрывать подборы дают команде необходимую агрессию. Неустанный бегунок, который готов пахать от своих до чужих ворот все 90 минут.", "en": "The engine and destroyer of the central midfield. His energy and ability to win loose balls give the team the necessary aggression. A tireless runner ready to work from his own goal to the opponent's for all 90 minutes." }, "image": "https://placehold.co/300x300?text=Hwang+In-beom" },
    { "name": { "ru": "Чон У Ён", "en": "Jung Woo-young" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Опытный опорник с богатым международным прошлым. Его тактический интеллект и спокойствие необходимы команде в матчах против топ-сборных. Настоящий генерал в центре поля.", "en": "An experienced defensive midfielder with a rich international past. His tactical intelligence and composure are essential for the team in matches against top sides. A true general in the center of the pitch." }, "image": "https://placehold.co/300x300?text=Jung+Woo-young" },
    { "name": { "ru": "Пэк Сын Хо", "en": "Paik Seung-ho" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Элегантный плеймейкер с поставленным ударом. Его умение контролировать темп и начинать атаки из глубины — важное оружие команды. Мастер длинных переводов мяча.", "en": "An elegant playmaker with a set shot. His ability to control the tempo and start attacks from deep is an important weapon for the team. A master of long passes." }, "image": "https://placehold.co/300x300?text=Paik+Seung-ho" },
    { "name": { "ru": "Хон Хён Сок", "en": "Hong Hyun-seok" }, "pos": "midfielder", "status": "Starter", "story": { "ru": "Креативный хавбек с европейским опытом. Его видение поля и нестандартные решения — свежий ветер в корейской полузащите. Игрок, способный одним пасом разрезать любую оборону.", "en": "A creative midfielder with European experience. His vision of the field and unorthodox solutions are a fresh wind in the Korean midfield. A player capable of cutting through any defense with a single pass." }, "image": "https://placehold.co/300x300?text=Hong+Hyun-seok" },

  "coaches": [{ "name": { "ru": "Дик Адвокат", "en": "Dick Advocaat" }, "story": { "ru": "Легендарный 78-летний голландский тренер, который вернулся в сборную перед самым мундиалем. Его опыт работы с «Зенитом», «Рейнджерс», «Фенербахче» и сборной Нидерландов делает его одним из самых титулованных тренеров на турнире.", "en": "The legendary 78-year-old Dutch coach who returned to the national team just before the World Cup. His experience with Zenit, Rangers, Fenerbahçe, and the Netherlands national team makes him one of the most decorated coaches at the tournament." }, "image": "https://placehold.co/300x300?text=Dick+Advocaat" }],
  "players": [
    { "name": { "ru": "Элой Ром", "en": "Eloy Room" }, "pos": "goalkeeper", "status": "Captain", "story": { "ru": "37-летний ветеран «Майами» — настоящий страж ворот с богатейшим опытом! Чемпион MLS в составе «Коламбус Крю», прошёл через ПСВ и «Витессе». Его рост 190 см и реакция делают его стеной для карибской сборной. 10+ лет защищает цвета «Кюрасао», настоящий лидер.", "en": "The 37-year-old Miami veteran is a true goalkeeper with rich experience! MLS champion with Columbus Crew, he navigated through PSV and Vitesse. His 190cm height and reflexes make him a wall for the Caribbean side. 10+ years protecting the Curaçao colors, a true leader." } },

    { "name": { "ru": "Тайрик Бодак", "en": "Tyrick Bodak" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "24-летний вратарь нидерландского «Телстара» — представитель нового поколения! Его включение в состав — это ставка на будущее. Один из самых перспективных голкиперов карибского футбола, готовый сменить ветерана Рома.", "en": "A 24-year-old goalkeeper for Dutch side Telstar — representative of the new generation! His inclusion is a bet on the future. One of the most promising goalkeepers in Caribbean football, ready to replace veteran Room." } },

    { "name": { "ru": "Тревор Дорнбюс", "en": "Trevor Doornbusch" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "26-летний вратарь «ВВВ-Венло» — надёжный резервист с опытом игры в Эредивизи. Его уверенность на линии ворот и игра ногами делают его современным голкипером. Один из трёх стражей ворот, которые защищают честь Кюрасао на мундиале.",
"en": "A 26-year-old goalkeeper for VVV-Venlo — a reliable backup with Eredivisie experience. His confidence between the posts and distribution with his feet make him a modern goalkeeper. One of three shot-stoppers protecting Curaçao's honor at the World Cup." } },

    { "name": { "ru": "Ришедли Базур", "en": "Riechedly Bazoer" }, "pos": "defender", "status": "Star", "story": { "ru": "29-летний защитник турецкого «Коньяспора» — настоящий боец с характером! Прошёл через академию «Аякса», играл в немецкой Бундеслиге за «Вольфсбург». Его универсальность позволяет играть как в центре обороны, так и в полузащите. Один из самых опытных игроков сборной.",
"en": "The 29-year-old defender for Turkish side Konyaspor is a true fighter with character! He came through Ajax's academy and played in the German Bundesliga for Wolfsburg. His versatility allows him to play both in defence and midfield. One of the squad's most experienced players." } },

    { "name": { "ru": "Джошуа Бренет", "en": "Joshua Brenet" }, "pos": "defender", "status": "Squad", "story": { "ru": "31-летний правый защитник турецкого «Кайзериспора» — представитель турецкого футбола в заявке! Прошёл через нидерландский «Твенте» и немецкую Бундеслигу. Его скорость и кроссы делают его опасным оружием на фланге. 30+ матчей за сборную.",
"en": "The 31-year-old right-back for Turkish side Kayserispor is a representative of Turkish football in the squad! He came through Dutch Twente and the German Bundesliga. His pace and crosses make him a dangerous weapon on the flank. 30+ caps for the national team." } },

    { "name": { "ru": "Рошон ван Эйма", "en": "Roshon van Eijma" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний защитник нидерландского «РКС Валвейк» — надёжный центральный защитник! Его физическая мощь и чтение игры делают его кошмаром для нападающих. Один из столпов обороны «Кюрасао», готовый к вызову чемпионата мира.",
"en": "The 27-year-old defender for Dutch side RKC Waalwijk is a reliable centre-back! His physical power and reading of the game make him a nightmare for strikers. One of the defensive pillars of Curaçao, ready for the World Cup challenge." } },

    { "name": { "ru": "Шерел Флоранус", "en": "Sherel Floranus" }, "pos": "defender", "status": "Squad", "story": { "ru": "27-летний защитник нидерландского «ПЕК Зволле» — универсал, способный закрыть любой фланг! Прошёл через академию «Аякса» и теперь играет в Эредивизи. Его скорость и техника делают его современным фланговым защитником. 20+ матчей за сборную.",
"en": "The 27-year-old defender for Dutch side PEC Zwolle is a versatile player capable of covering any flank! He came through Ajax's academy and now plays in the Eredivisie. His pace and technique make him a modern full-back. 20+ caps for the national team." } },

    { "name": { "ru": "Деверон Фонвиль", "en": "Deveron Fonville" }, "pos": "defender", "status": "Rising", "story": { "ru": "25-летний защитник нидерландского «НЕК Неймеген» — один из самых перспективных талантов! Его включение в состав — это ставка на молодость и энергию. Представляет новое поколение карибских защитников, готовых покорять Европу.",
"en": "The 25-year-old defender for Dutch side NEC Nijmegen is one of the most promising talents! His inclusion is a bet on youth and energy. Represents the new generation of Caribbean defenders ready to conquer Europe." } },

    { "name": { "ru": "Джюриен Гаари", "en": "Juriën Gaari" }, "pos": "defender", "status": "Squad", "story": { "ru": "31-летний защитник саудовского «Абха Клаб» — представитель ближневосточного футбола в заявке! Его опыт игры в разных культурах добавил ему тактической мудрости. Один из самых стабильных защитников сборной, 40+ матчей за «Кюрасао».",
"en": "The 31-year-old defender for Saudi side Abha Club is a representative of Middle Eastern football in the squad! His experience playing in different cultures added tactical wisdom. One of the squad's most reliable defenders, 40+ caps for Curaçao." } },

    { "name": { "ru": "Армандо Обиспо", "en": "Armando Obispo" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний центральный защитник нидерландского ПСВ — настоящий патриот клуба! В системе ПСВ ровно 20 лет — с 7-летнего возраста! Трёхкратный обладатель Суперкубка Нидерландов. Его преданность и опыт игры в топ-клубе делают его лидером обороны.",

    { "name": { "ru": "Джастин Клюйверт", "en": "Justin Kluivert" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний вингер французской «Ниццы» — сын легенды Патрика Клюйверта! Настоящая футбольная династия. Прошёл через «Аякс», «Рому» и «Валенсию». Его скорость и дриблинг создают проблемы для любой обороны. 25+ матчей за сборную, продолжение семейной традиции.", "en": "The 27-year-old winger for French side Nice is the son of legend Patrick Kluivert! A true football dynasty. He came through Ajax, Roma, and Valencia. His pace and dribbling cause problems for any defence. 25+ caps for the national team, continuing the family tradition." } },

    { "name": { "ru": "Вут Вегхорст", "en": "Wout Weghorst" }, "pos": "forward", "status": "Star", "story": { "ru": "33-летний нападающий нидерландского «Аякса» — настоящий гигант (197 см)! Прошёл через множество клубов, играл в английской Премьер-лиге за «Бернли» и «Манчестер Юнайтед». Его рост и мощь делают его башней в штрафной соперника. 40+ матчей за сборную.", "en": "The 33-year-old forward for Dutch giants Ajax is a true giant (197cm)! He navigated through multiple clubs, played in the English Premier League for Burnley and Manchester United. His height and power make him a tower in the opponent's penalty area. 40+ caps for the national team." } },

    { "name": { "ru": "Ноа Ланг", "en": "Noa Lang" }, "pos": "forward", "status": "Rising", "story": { "ru": "26-летний вингер нидерландского ПСВ — один из самых ярких талантов! Прошёл через академию «Аякса» и теперь играет за топ-клуб Нидерландов. Его техника и креативность делают его дирижёром атак. 15+ матчей за сборную, будущее голландского футбола.", "en": "The 26-year-old winger for Dutch giants PSV is one of the brightest talents! He came through Ajax's academy and now plays for the Netherlands' top club. His technique and creativity make him the conductor of attacks. 15+ caps for the national team, the future of Dutch football." } },

"JPN": {
  "desc": {
    "ru": "«Синие самураи» — это триумф интеллекта, дисциплины и технологий на футбольном поле. Япония восхищает своим командным взаимодействием и скоростью принятия решений. Это команда будущего, которая уже сегодня побеждает грандов и заставляет весь мир уважать азиатский футбол.",

  "coaches": [{ "name": { "ru": "Хадзимэ Мориясу", "en": "Hajime Moriyasu" }, "story": { "ru": "Символ преемственности и успеха японского футбола, творец побед над грандами на ЧМ-2022.", "en": "Symbol of continuity and success in Japanese football, architect of victories over giants at WC 2022." }, "image": "https://placehold.co/300x300?text=Hajime+Moriyasu" }],
  "players": [

    { "name": { "ru": "Каору Митома", "en": "Kaoru Mitoma" }, "pos": "forward", "status": "Star", "story": { "ru": "Мастер дриблинга, написавший диссертацию об искусстве обводки.", "en": "A dribbling master who wrote a university thesis on the art of dribbling." } },

    { "name": { "ru": "Дзион Судзуки", "en": "Zion Suzuki" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "23-летний вратарь итальянской «Пармы» — первый номер сборной! Рост 190 см, 23 матча за «Самураев». Прошёл через «Ураву Ред Даймондс» и теперь покоряет Серию А. Его реакция и игра на выходах делают его надёжным стражем ворот «Синих самураев».", "en": "The 23-year-old goalkeeper for Italian side Parma is the national team's number one! 190cm tall, 23 caps for the 'Samurai Blue'. He came through Urawa Red Diamonds and now conquers Serie A. His reflexes and command of the area make him a reliable guardian for Japan." } },

    { "name": { "ru": "Кейсуке Осако", "en": "Keisuke Osako" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "26-летний вратарь «Санфречче Хиросима» — представитель внутреннего чемпионата! 11 матчей за сборную, 8 пропущенных голов. Его включение — это ставка на опыт игры в Джей-лиге и стабильность. Один из лучших голкиперов Японии.", "en": "The 26-year-old goalkeeper for Sanfrecce Hiroshima is a representative of the domestic league! 11 caps, 8 goals conceded. His inclusion is a bet on J-League experience and stability. One of Japan's best goalkeepers." } },

    { "name": { "ru": "Томоки Хаякава", "en": "Tomoki Hayakawa" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "27-летний вратарь «Касима Антлерс» — третий страж ворот в заявке! 3 матча за сборную, 0 пропущенных голов — идеальная статистика! Его включение — это дань уважения одному из самых стабильных голкиперов Джей-лиги.", "en": "The 27-year-old goalkeeper for Kashima Antlers is the third shot-stopper in the squad! 3 caps, 0 goals conceded — a perfect record! His inclusion honors one of the J-League's most consistent goalkeepers." } },

    { "name": { "ru": "Юто Нагатомо", "en": "Yuto Nagatomo" }, "pos": "defender", "status": "Legend", "story": { "ru": "39-летний ветеран «Токио» — настоящая легенда японского футбола! Рекордсмен сборной по количеству матчей — 144 игры! Прошёл через итальянскую Серию А («Чезена», «Интер»), турецкую Суперлигу («Галатасарай») и теперь вернулся домой. Участник 4 чемпионатов мира! Его опыт и лидерство бесценны для молодой команды.", "en": "The 39-year-old FC Tokyo veteran is a true Japanese football legend! The national team's all-time appearance record holder — 144 caps! He navigated through Italian Serie A (Cesena, Inter), Turkish Super Lig (Galatasaray), and now returned home. Participant in 4 World Cups! His experience and leadership are invaluable for the young team." } },

    { "name": { "ru": "Сёго Танигути", "en": "Shogo Taniguchi" }, "pos": "defender", "status": "Star", "story": { "ru": "34-летний защитник бельгийского «Сент-Трюйдена» — ветеран с богатым опытом! 37 матчей за сборную, 1 гол. Прошёл через катарский футбол («Аль-Райян») и теперь закаляет себя в Бельгии. Его физическая мощь и чтение игры делают его надёжным столпом обороны.", "en": "The 34-year-old defender for Belgian side Sint-Truidense is a veteran with rich experience! 37 caps, 1 goal. He navigated through Qatari football (Al-Rayyan) and now toughens himself in Belgium. His physical power and reading of the game make him a reliable defensive pillar." } },

    { "name": { "ru": "Цуёси Ватанабэ", "en": "Tsuyoshi Watanabe" }, "pos": "defender", "status": "Rising", "story": { "ru": "28-летний защитник нидерландского «Фейеноорда» — представитель элитного голландского футбола! 10 матчей за сборную. Прошёл через японские клубы и теперь играет в Эредивизи. Его техника и скорость делают его современным центральным защитником.", "en": "The 28-year-old defender for Dutch giants Feyenoord is a representative of elite Dutch football! 10 caps for the national team. He came through Japanese clubs and now plays in the Eredivisie. His technique and pace make him a modern centre-back." } },

    { "name": { "ru": "Дзюнносукэ Судзуки", "en": "Junnosuke Suzuki" }, "pos": "defender", "status": "Rising", "story": { "ru": "22-летний защитник датского «Копенгагена» — один из самых молодых игроков в заявке! 6 матчей за сборную. Прошёл через японские клубы и теперь покоряет скандинавский футбол. Его включение — это ставка на будущее японской обороны.", "en": "The 22-year-old defender for Danish side FC Copenhagen is one of the youngest players in the squad! 6 caps for the national team. He came through Japanese clubs and now conquers Scandinavian football. His inclusion is a bet on the future of Japanese defence." } },

    { "name": { "ru": "Хироки Ито", "en": "Hiroki Ito" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний защитник немецкой «Баварии» — настоящая звезда! 23 матча за сборную, 1 гол. Прошёл через «Хоккайдо Консадоле Саппоро» и немецкий «Штутгарт», прежде чем попасть в топ-клуб мира. Его техника и чтение игры делают его одним из лучших азиатских защитников в Европе.", "en": "The 26-year-old defender for German giants Bayern Munich is a true star! 23 caps, 1 goal. He came through Hokkaido Consadole Sapporo and German Stuttgart before joining the world's top club. His technique and reading of the game make him one of Asia's best defenders in Europe." } },

    { "name": { "ru": "Ко Итакура", "en": "Ko Itakura" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний защитник нидерландского «Аякса» — один из самых стабильных игроков сборной! 39 матчей, 2 гола. Прошёл через «Гронинген» и теперь играет за топ-клуб Нидерландов. Его универсальность позволяет играть на любой позиции в обороне. Настоящий боец с характером «самурая».", "en": "The 28-year-old defender for Dutch giants Ajax is one of the squad's most reliable players! 39 caps, 2 goals. He came through Groningen and now plays for the Netherlands' top club. His versatility allows him to play any defensive position. A true fighter with 'samurai' character." } },

    { "name": { "ru": "Такехиро Томиясу", "en": "Takehiro Tomiyasu" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний защитник нидерландского «Аякса» — партнёр Итакуры по клубу! 42 матча за сборную, 1 гол. Прошёл через итальянскую «Болонью» и английский «Арсенал». Его скорость и техника делают его современным фланговым защитником. Один из ключевых игроков обороны «Синих самураев».", "en": "The 27-year-old defender for Dutch giants Ajax is Itakura's club teammate! 42 caps, 1 goal. He came through Italian Bologna and English Arsenal. His pace and technique make him a modern full-back. One of the key defensive players for the 'Blue Samurai'." } },

    { "name": { "ru": "Аюму Секо", "en": "Ayumu Seko" }, "pos": "defender", "status": "Rising", "story": { "ru": "25-летний защитник французского «Гавра» — представитель элитного французского футбола! 13 матчей за сборную. Прошёл через японские клубы и теперь играет в Лиге 1. Его рост 186 см и мощь делают его башней в штрафной соперника.", "en": "The 25-year-old defender for French side Le Havre is a representative of elite French football! 13 caps for the national team. He came through Japanese clubs and now plays in Ligue 1. His 186cm height and power make him a tower in the opponent's penalty area." } },

    { "name": { "ru": "Юкинари Сугавара", "en": "Yukinari Sugawara" }, "pos": "defender", "status": "Star", "story": { "ru": "25-летний защитник немецкого «Вердера» — один из самых результативных защитников сборной! 20 матчей, 6 голов — невероятная статистика для оборонца! Прошёл через японский «Нагоя Грампус» и нидерландский АЗ. Его кроссы и стандарты — секретное оружие «Самураев».", "en": "The 25-year-old defender for German side Werder Bremen is one of the squad's most prolific defenders! 20 caps, 6 goals — incredible stats for a defender! He came through Japanese Nagoya Grampus and Dutch AZ. His crosses and set pieces are the 'Samurai' secret weapon." } },

    { "name": { "ru": "Даити Камада", "en": "Daichi Kamada" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний полузащитник английского «Кристал Пэлас» — один из самых техничных игроков сборной! 49 матчей, 12 голов. Прошёл через немецкую Бундеслигу («Айнтрахт Франкфурт») и теперь играет в Премьер-лиге. Его видение поля и пасы — дирижёр атак «Синих самураев».", "en": "The 29-year-old midfielder for English side Crystal Palace is one of the squad's most technical players! 49 caps, 12 goals. He came through the German Bundesliga (Eintracht Frankfurt) and now plays in the Premier League. His vision and passing are the conductor of the 'Blue Samurai' attacks." } },

    { "name": { "ru": "Каисю Сано", "en": "Kaishu Sano" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "25-летний полузащитник немецкого «Майнца» — представитель элитного немецкого футбола! 12 матчей за сборную. Прошёл через японские клубы и теперь играет в Бундеслиге. Его энергия и работоспособность в центре поля делают его незаменимым для Мориясу.", "en": "The 25-year-old midfielder for German side Mainz 05 is a representative of elite German football! 12 caps for the national team. He came through Japanese clubs and now plays in the Bundesliga. His energy and work rate in central midfield make him indispensable for Moriyasu." } },

    { "name": { "ru": "Ао Танака", "en": "Ao Tanaka" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний полузащитник английского «Лидс Юнайтед» — один из самых стабильных игроков сборной! 37 матчей, 8 голов. Прошёл через нидерландский «Херенвен» и теперь играет в Чемпионшипе. Его тактическая мудрость и умение начинать атаки делают его ключевым игроком полузащиты.", "en": "The 27-year-old midfielder for English side Leeds United is one of the squad's most reliable players! 37 caps, 8 goals. He came through Dutch Heerenveen and now plays in the Championship. His tactical wisdom and ability to start attacks make him a key midfield player." } },

    { "name": { "ru": "Дзюня Ито", "en": "Junya Ito" }, "pos": "midfielder", "status": "Star", "story": { "ru": "32-летний вингер бельгийского «Генка» — ветеран сборной с богатым опытом! 68 матчей, 15 голов. Прошёл через японские клубы, бельгийский «Сент-Трюйден» и французский «Реймс». Его скорость и дриблинг создают проблемы для любой обороны. Один из самых опасных игроков Азии.", "en": "The 32-year-old winger for Belgian side Genk is a national team veteran with rich experience! 68 caps, 15 goals. He came through Japanese clubs, Belgian Sint-Truidense, and French Reims. His pace and dribbling cause problems for any defence. One of Asia's most dangerous players." } },

    { "name": { "ru": "Рицу Доан", "en": "Ritsu Doan" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний полузащитник немецкого «Айнтрахта» — одна из главных звёзд сборной! 64 матча, 11 голов. Прошёл через немецкие «Фрайбург» и «Билефельд». Его техника и видение поля делают его дирижёром атак. Герой ЧМ-2022, забивший Испании и Германии!",
"en": "The 27-year-old midfielder for German side Eintracht Frankfurt is one of the squad's biggest stars! 64 caps, 11 goals. He came through German Freiburg and Bielefeld. His technique and vision make him the conductor of attacks. WC 2022 hero who scored against Spain and Germany!" } },

    { "name": { "ru": "Кэито Накамура", "en": "Keito Nakamura" }, "pos": "forward", "status": "Rising", "story": { "ru": "25-летний нападающий французского «Реймса» — один из самых перспективных талантов! 24 матча, 10 голов — отличная результативность! Прошёл через японские клубы и теперь играет в Лиге 1. Его скорость и дриблинг создают проблемы для любой обороны. Будущее японской атаки.",
"en": "The 25-year-old forward for French side Reims is one of the most promising talents! 24 caps, 10 goals — excellent scoring rate! He came through Japanese clubs and now plays in Ligue 1. His pace and dribbling cause problems for any defence. The future of the Japanese attack." } },

    { "name": { "ru": "Такефуса Кубо", "en": "Takefusa Kubo" }, "pos": "midfielder", "status": "Star", "story": { "ru": "24-летний полузащитник испанского «Реал Сосьедада» — настоящая суперзвезда! 48 матчей, 7 голов. Прошёл через академию «Барселоны» и «Реала», играл за «Хетафе» и «Мальорку». Его техника и дриблинг сравнивают с Месси. «Японский Месси» — будущее азиатского футбола!",
"en": "The 24-year-old midfielder for Spanish side Real Sociedad is a true superstar! 48 caps, 7 goals. He came through Barcelona and Real Madrid academies, played for Getafe and Mallorca. His technique and dribbling are compared to Messi. The 'Japanese Messi' — the future of Asian football!" } },

    { "name": { "ru": "Юито Судзуки", "en": "Yuito Suzuki" }, "pos": "forward", "status": "Rising", "story": { "ru": "24-летний нападающий немецкого «Фрайбурга» — представитель элитного немецкого футбола! 6 матчей за сборную. Прошёл через японский «Сёнан Бельмаре» и теперь играет в Бундеслиге. Его мощь и игра в штрафной делают его опасным оружием. Будущее японской атаки.",
"en": "The 24-year-old forward for German side SC Freiburg is a representative of elite German football! 6 caps for the national team. He came through Japanese Shonan Bellmare and now plays in the Bundesliga. His power and penalty area play make him a dangerous weapon. The future of the Japanese attack." } },

    { "name": { "ru": "Дайдзэн Маэда", "en": "Daizen Maeda" }, "pos": "forward", "status": "Star", "story": { "ru": "28-летний нападающий шотландского «Селтика» — настоящий боец с характером! 27 матчей, 4 гола. Прошёл через японские клубы и теперь играет в одном из лучших клубов Шотландии. Его энергия и работоспособность делают его незаменимым для Мориясу. Один из самых агрессивных нападающих Азии.",
"en": "The 28-year-old forward for Scottish side Celtic is a true fighter with character! 27 caps, 4 goals. He came through Japanese clubs and now plays for one of Scotland's best clubs. His energy and work rate make him indispensable for Moriyasu. One of Asia's most aggressive strikers." } },

    { "name": { "ru": "Аясэ Уэда", "en": "Ayase Ueda" }, "pos": "forward", "status": "Star", "story": { "ru": "27-летний нападающий нидерландского «Фейеноорда» — один из самых результативных форвардов сборной! 38 матчей, 16 голов — лучший бомбардир текущего состава! Прошёл через японские клубы и бельгийский «Серкль Брюгге». Его хладнокровие в штрафной и игра в воздухе делают его грозным оружием.",
"en": "The 27-year-old forward for Dutch giants Feyenoord is one of the squad's most prolific strikers! 38 caps, 16 goals — the current squad's top scorer! He came through Japanese clubs and Belgian Cercle Brugge. His composure in the penalty area and aerial ability make him a fearsome weapon." } },

      { "name": { "ru": "Коки Огава", "en": "Koki Ogawa" }, "pos": "forward", "status": "Squad", "story": { "ru": "28-летний нападающий нидерландского «НЕК Неймеген» — представитель элитного голландского футбола! 14 матчей, 10 голов — отличная результативность! Прошёл через японские клубы и теперь играет в Эредивизи. Его мощь и игра в штрафной делают его опасным оружием. Один из самых стабильных бомбардиров сборной.",
"en": "The 28-year-old forward for Dutch side NEC Nijmegen is a representative of elite Dutch football! 14 caps, 10 goals — excellent scoring rate! He came through Japanese clubs and now plays in the Eredivisie. His power and penalty area play make him a dangerous weapon. One of the squad's most consistent scorers." } },

    { "name": { "ru": "Такума Асано", "en": "Takuma Asano" }, "pos": "forward", "status": "Star", "story": { "ru": "31-летний нападающий немецкого «Бохума» — ветеран сборной с богатым опытом! 56 матчей, 10 голов. Прошёл через английскую Премьер-лигу («Арсенал»), немецкую Бундеслигу («Штутгарт», «Ганновер») и теперь играет в элите немецкого футбола. Его скорость и дриблинг создают проблемы для любой обороны. Герой ЧМ-2022, забивший Германии!",
"en": "The 31-year-old forward for German side VfL Bochum is a national team veteran with rich experience! 56 caps, 10 goals. He came through the English Premier League (Arsenal), German Bundesliga (Stuttgart, Hannover), and now plays in Germany's elite. His pace and dribbling cause problems for any defence. WC 2022 hero who scored against Germany!" } }
  ]
},
"SWE": {
  "desc": {
    "ru": "Скандинавский дух и железная организованность — это сборная Швеции. Традиции крепкой обороны и опасных стандартов здесь сочетаются с новым поколением ярких атакующих талантов. Шведы — это монолитная сила, способная сокрушить любого соперника за счет своей воли и командного духа.",
    "en": "Scandinavian spirit and iron organization — that is the Swedish national team. Traditions of strong defense and dangerous set pieces are combined here with a new generation of brilliant attacking talents. The Swedes are a monolithic force capable of crushing any opponent through their will and team spirit."

  },
 "coaches": [{
  "name": { "ru": "Грэм Поттер", "en": "Graham Potter" },
  "story": {
    "ru": "Английский тренер, ранее работавший в «Челси» и «Брайтоне». Назначен в октябре 2025 года.",
    "en": "English coach, previously managed Chelsea and Brighton. Appointed in October 2025."
  },
  "image": "https://placehold.co/300x300?text=Graham+Potter"
}],
  "players": [
    { "name": { "ru": "Виктор Дьёкереш", "en": "Viktor Gyökeres" }, "pos": "forward", "status": "Star", "story": { "ru": "Один из самых результативных нападающих Европы в последние годы.", "en": "One of the most prolific forwards in Europe in recent years." } },
    { "name": { "ru": "Александр Исак", "en": "Alexander Isak" }, "pos": "forward", "status": "Star", "story": { "ru": "Техничный и быстрый форвард, способный обыграть любого защитника.", "en": "A technical and fast forward, capable of beating any defender." } },

    { "name": { "ru": "Виктор Юханссон", "en": "Viktor Johansson" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "28-летний вратарь «Сток Сити». Надежный первый номер, который проводит отличный сезон в Чемпионшипе. Его реакция и игра на выходах делают его неприступной стеной для «Тре Крунур».", "en": "The 28-year-old Stoke City goalkeeper. A reliable number one having a great Championship season. His reflexes and command of the area make him an impenetrable wall for the 'Three Crowns'." } },
    { "name": { "ru": "Кристоффер Нордфельдт", "en": "Kristoffer Nordfeldt" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "36-летний ветеран АИК. Вернулся в Швецию, чтобы завершить карьеру, но получил шокирующий вызов на ЧМ! Настоящий опыт и спокойствие для молодых партнеров.", "en": "The 36-year-old AIK veteran. Returned to Sweden to finish his career but got a shocking World Cup call-up! True experience and composure for the young teammates." } },
    { "name": { "ru": "Якоб Виделль Зеттерстрём", "en": "Jacob Widell Zetterström" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "28-летний голкипер «Дерби Каунти». Сумел преодолеть вирусную инфекцию прямо перед объявлением заявки и заслужил место в самолете до США.", "en": "The 28-year-old Derby County goalkeeper. Managed to overcome a viral infection right before the squad announcement and earned his seat on the plane to the USA." } },

    { "name": { "ru": "Хьяльмар Эдаль", "en": "Hjalmar Ekdal" }, "pos": "defender", "status": "Star", "story": { "ru": "27-летний универсал «Бернли». Может сыграть как в центре обороны, так и в опорной зоне. Тактический хамелеон в руках Грэма Поттера.", "en": "The 27-year-old Burnley utility man. Can play both as a centre-back and in defensive midfield. A tactical chameleon in Graham Potter's hands." } },
    { "name": { "ru": "Габриэль Гудмундссон", "en": "Gabriel Gudmundsson" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний защитник «Лидс Юнайтед». Надежное звено в обороне, сочетающее физическую мощь с отличным чтением игры.", "en": "The 26-year-old Leeds United defender. A reliable link in the defence, combining physical power with excellent reading of the game." } },
    { "name": { "ru": "Исак Хьен", "en": "Isak Hien" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний центральный защитник «Аталанты». Привносит в сборную жесткость и скорость итальянской Серии А. Настоящий гладиатор в защите.", "en": "The 26-year-old Atalanta centre-back. Brings the toughness and pace of Italian Serie A to the national team. A true gladiator in defence." } },
    { "name": { "ru": "Густаф Лагербльке", "en": "Gustaf Lagerbielke" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний талант из «Браги». Один из самых молодых защитников в заявке, представляющий светлое будущее шведского футбола.", "en": "The 23-year-old talent from Braga. One of the youngest defenders in the squad, representing the bright future of Swedish football." } },
    { "name": { "ru": "Виктор Нильссон Линделёф", "en": "Victor Nilsson Lindelöf" }, "pos": "defender", "status": "Legend", "story": { "ru": "31-летний ветеран «Астон Виллы». Переход в АПЛ стал новым витком карьеры. Обладает колоссальным опытом игр за «Манчестер Юнайтед» и сборную.", "en": "The 31-year-old Aston Villa veteran. The move to the Premier League was a new turn in his career. Possesses colossal experience playing for Manchester United and the national team." } },
    { "name": { "ru": "Эрик Смит", "en": "Eric Smith" }, "pos": "defender", "status": "Squad", "story": { "ru": "28-летний боец из «Санкт-Паули». Привносит в команду жесткость и характер немецкой Бундеслиги. С ним соперникам не сладится в единоборствах.", "en": "The 28-year-old fighter from FC St. Pauli. Brings the toughness and character of the German Bundesliga to the team. Opponents will have a hard time in duels against him." } },
    { "name": { "ru": "Карл Старфельт", "en": "Carl Starfelt" }, "pos": "defender", "status": "Star", "story": { "ru": "30-летний защитник «Сельты». Преодолел сомнения из-за травм, чтобы попасть в итоговую заявку. Опытный боец, закаленный в испанской Ла Лиге.", "en": "The 30-year-old Celta Vigo defender. Overcame injury doubts to make the final cut. An experienced fighter hardened in the Spanish La Liga." } },
    { "name": { "ru": "Даниэль Свенссон", "en": "Daniel Svensson" }, "pos": "defender", "status": "Rising", "story": { "ru": "22-летняя суперзвезда дортмундской «Боруссии»! Один из самых востребованных молодых левых защитников в Европе. Его скорость и кроссы — грозное оружие.", "en": "A 22-year-old superstar for Borussia Dortmund! One of the most sought-after young left-backs in Europe. His pace and crosses are a formidable weapon." } },
    { "name": { "ru": "Эллиот Страуд", "en": "Elliot Stroud" }, "pos": "defender", "status": "Rising", "story": { "ru": "21-летний талант из «Мьельбю». Единственный представитель домашнего чемпионата Аллсвенскан в линии обороны! Настоящий патриот и надежда шведского футбола.", "en": "The 21-year-old talent from Mjällby AIF. The only representative of the domestic Allsvenskan in the defensive line! A true patriot and hope of Swedish football." } },
    { "name": { "ru": "Херман Юханссон", "en": "Herman Johansson" }, "pos": "defender", "status": "Squad", "story": { "ru": "26-летний защитник «Эф-Си Даллас». Был экстренно вызван в сборную вместо травмированного Эмиля Хольма. Привносит опыт MLS и готовность бороться за каждый мяч.", "en": "The 26-year-old FC Dallas defender. Was urgently called up to the national team instead of the injured Emil Holm. Brings MLS experience and readiness to fight for every ball." } },

    { "name": { "ru": "Таха Али", "en": "Taha Ali" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "21-летний вундеркинд «Мальмё». Представляет новое поколение шведских талантов, растущее в домашней лиге. Его техника и видение поля восхищают.", "en": "The 21-year-old Malmö FF wonderkid. Represents the new generation of Swedish talents growing in the domestic league. His technique and vision are admirable." } },
    { "name": { "ru": "Ясин Аяри", "en": "Yasin Ayari" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "21-летний креативный полузащитник «Брайтона». Игрок с огромным потенциалом в АПЛ, способный обострить игру одним пасом.", "en": "The 21-year-old creative midfielder for Brighton & Hove Albion. A player with huge potential in the Premier League, capable of sharpening the game with a single pass." } },
    { "name": { "ru": "Лукас Бергвалль", "en": "Lucas Bergvall" }, "pos": "midfielder", "status": "Star", "story": { "ru": "20-летняя восходящая звезда «Тоттенхэма»! Один из самых молодых игроков в заявке, но уже выступающий за лондонский гранд. Будущее шведского футбола уже здесь.", "en": "A 20-year-old rising star of Tottenham Hotspur! One of the youngest players in the squad but already playing for a London giant. The future of Swedish football is already here." } },
    { "name": { "ru": "Александр Бернхардссон", "en": "Alexander Bernhardsson" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "25-летний полузащитник «Хольштайн Киля». Привносит в команду рабочий темп и тактическую дисциплину немецкой Бундеслиги.", "en": "The 25-year-old midfielder for Holstein Kiel. Brings the work rate and tactical discipline of the German Bundesliga to the team." } },
    { "name": { "ru": "Энтони Эланга", "en": "Anthony Elanga" }, "pos": "forward", "status": "Star", "story": { "ru": "23-летний электрический вингер «Ньюкасла». Его сумасшедшая скорость и дриблинг создают кошмар для любых защитников. Главная угроза на фланге.", "en": "The 23-year-old electric winger for Newcastle United. His crazy pace and dribbling create a nightmare for any defenders. The main threat on the flank." } },
    { "name": { "ru": "Йеспер Карлстрём", "en": "Jesper Karlström" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний двигатель «Удинезе». Тактический мозг и выносливость, закаленные в итальянской Серии А. Сердце полузащиты.", "en": "The 29-year-old engine of Udinese. Tactical brain and endurance hardened in Italian Serie A. The heart of the midfield." } },
    { "name": { "ru": "Густаф Нильссон", "en": "Gustaf Nilsson" }, "pos": "forward", "status": "Squad", "story": { "ru": "28-летний таранный нападающий «Брюгге». Физическая мощь и игра в воздухе делают его опасным оружием на стандартах.", "en": "The 28-year-old battering ram striker for Club Brugge. Physical power and aerial ability make him a dangerous weapon on set pieces." } },
    { "name": { "ru": "Бенджамин Нюгрен", "en": "Benjamin Nygren" }, "pos": "forward", "status": "Rising", "story": { "ru": "24-летний дерзкий вингер «Селтика». Привносит шотландскую страсть и прямолинейность в атакующие порядки сборной.", "en": "The 24-year-old daring winger for Celtic. Brings Scottish passion and directness to the team's attacking ranks." } },
    { "name": { "ru": "Кен Сема", "en": "Ken Sema" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "32-летний ветеран «Пафоса». Неожиданное возвращение в сборную! Поттер взял его за бесценный опыт, энергию и позитив, который так нужен в раздевалке на ЧМ.", "en": "The 32-year-old Pafos veteran. An unexpected return to the national team! Potter took him for his invaluable experience, energy, and positivity, which is so needed in the World Cup dressing room." } },
    { "name": { "ru": "Маттиас Сванберг", "en": "Mattias Svanberg" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний универсальный боец из «Вольфсбурга». Двигатель полузащиты, способный пробежать весь бокс-ту-бокс от своих до чужих ворот.", "en": "The 26-year-old versatile fighter from Wolfsburg. The engine of the midfield, capable of running the entire box-to-box from his own goal to the opponent's." } },
    { "name": { "ru": "Бесфорт Зенели", "en": "Besfort Zeneli" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "23-летний креативный хавбек «Юниона». Недавно перешел из «Эльфсборга» в Бельгию и уже доказал свой класс на европейской арене.", "en": "The 23-year-old creative midfielder for Union SG. Recently transferred from Elfsborg to Belgium and has already proven his class on the European stage." } }
  ]
},
"TUN": {
  "desc": {
    "ru": "«Карфагенские орлы» — стражи футбольных традиций Северной Африки. Сборная Туниса славится своей тактической гибкостью и умением выстраивать непроходимые оборонительные редуты. Это команда, которая бьется за каждый гол, превращая поле - в настоящую арену.",
    "en": "The 'Carthage Eagles' are the guardians of North African football traditions. The Tunisia national team is famous for its tactical flexibility and ability to build impenetrable defensive redoubts. This is a team that fights for every point, turning the field into an arena where order and discipline lead to success."
  },
  "coaches": [{
    "name": { "ru": "Сами Трабельси", "en": "Sami Trabelsi" },
    "story": {
      "ru": "Бывший игрок сборной Туниса, назначенный главным тренером в феврале 2025 года.",
      "en": "Former Tunisia international player, appointed head coach in February 2025."
    },
    "image": "https://placehold.co/300x300?text=Sami+Trabelsi"
  }],
  "players": [
    { "name": { "ru": "Айсса Лайдуни", "en": "Aissa Laidouni" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Неутомимый полузащитник, ставший мотором тунисской сборной.", "en": "A tireless midfielder who has become the engine of the Tunisian national team." } },

    { "name": { "ru": "Абдельмухиб Шамах", "en": "Abdelmouhib Chamakh" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "24-летний вратарь «Клуб Африкэн» — самый молодой голкипер в заявке! Его включение — это ставка на будущее тунисского футбола. Представляет новое поколение стражей ворот «Карфагенских орлов».", "en": "The 24-year-old Club Africain goalkeeper is the youngest shot-stopper in the squad! His inclusion is a bet on the future of Tunisian football. Represents the new generation of 'Carthage Eagles' guardians." } },

    { "name": { "ru": "Аймен Дахмен", "en": "Aymen Dahmen" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "29-летний вратарь «КС Сфаксьен» — первый номер сборной! Прошёл через множество тунисских клубов и теперь защищает цвета национальной команды. Его реакция и лидерство делают его надёжным стражем ворот.", "en": "The 29-year-old CS Sfaxien goalkeeper is the national team's number one! He navigated through multiple Tunisian clubs and now protects the national team's colors. His reflexes and leadership make him a reliable guardian." } },

    { "name": { "ru": "Сабри Бен Хессен", "en": "Sabri Ben Hessen" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "29-летний вратарь «Этуаль дю Сахель» — опытный страж ворот с богатой карьерой! Один из самых стабильных голкиперов тунисского чемпионата. Его хладнокровие и опыт незаменимы для молодых защитников.", "en": "The 29-year-old Etoile du Sahel goalkeeper is an experienced shot-stopper with a rich career! One of the most consistent goalkeepers in the Tunisian league. His composure and experience are invaluable for young defenders." } },

    { "name": { "ru": "Монтассар Тальби", "en": "Montassar Talbi" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний центральный защитник французского «Лорьяна» — настоящий генерал обороны! Прошёл через тунисские клубы и теперь играет в Лиге 1. Его физическая мощь и чтение игры делают его одним из лучших африканских защитников в Европе.", "en": "The 28-year-old centre-back for French side Lorient is a true defensive general! He came through Tunisian clubs and now plays in Ligue 1. His physical power and reading of the game make him one of Africa's best defenders in Europe." } },

    { "name": { "ru": "Адем Арус", "en": "Adem Arous" }, "pos": "defender", "status": "Rising", "story": { "ru": "21-летний вундеркинд — один из самых молодых защитников в заявке! Его включение — это ставка на будущее тунисской обороны. Представляет новое поколение «Карфагенских орлов», готовых покорять мировую арену.", "en": "A 21-year-old wonderkid — one of the youngest defenders in the squad! His inclusion is a bet on the future of Tunisian defence. Represents the new generation of 'Carthage Eagles' ready to conquer the world stage." } },

    { "name": { "ru": "Дилан Бронн", "en": "Dylan Bronn" }, "pos": "defender", "status": "Star", "story": { "ru": "30-летний центральный защитник — ветеран сборной с богатым опытом! Прошёл через европейские клубы и теперь является одним из лидеров обороны. Его опыт и лидерство бесценны для молодой команды.", "en": "The 30-year-old centre-back is a national team veteran with rich experience! He navigated through European clubs and now is one of the defensive leaders. His experience and leadership are invaluable for the young team." } },

    { "name": { "ru": "Раэд Шикауи", "en": "Raed Chikhaoui" }, "pos": "defender", "status": "Rising", "story": { "ru": "22-летний центральный защитник — представитель нового поколения! Его включение в состав — это ставка на молодость и энергию. Один из самых перспективных талантов тунисского футбола.", "en": "The 22-year-old centre-back is a representative of the new generation! His inclusion is a bet on youth and energy. One of the most promising talents in Tunisian football." } },

    { "name": { "ru": "Омар Рекик", "en": "Omar Rekik" }, "pos": "defender", "status": "Star", "story": { "ru": "24-летний центральный защитник — представитель элитного европейского футбола! Прошёл через академии топ-клубов и теперь играет на высоком уровне. Его техника и чтение игры делают его современным защитником.", "en": "The 24-year-old centre-back is a representative of elite European football! He came through top club academies and now plays at a high level. His technique and reading of the game make him a modern defender." } },

    { "name": { "ru": "Артур Теате", "en": "Arthur Theate" }, "pos": "defender", "status": "Star", "story": { "ru": "26-летний центральный защитник немецкого «Айнтрахта» — настоящий боец с характером! Прошёл через бельгийский «Остенде» и немецкий «Шальке». Его физическая мощь и чтение игры делают его одним из лучших молодых защитников Бельгии. 32 матча за сборную, 1 гол.", "en": "The 26-year-old centre-back for German side Eintracht Frankfurt is a true fighter with character! He came through Belgian Oostende and German Schalke. His physical power and reading of the game make him one of Belgium's best young defenders. 32 caps, 1 goal for the national team." } },

    { "name": { "ru": "Амаду Онана", "en": "Amadou Onana" }, "pos": "midfielder", "status": "Star", "story": { "ru": "24-летний опорный полузащитник английской «Астон Виллы» — настоящий разрушитель атак! Родился в Сенегале, но выбрал Бельгию. Прошёл через немецкий «Гамбург» и английский «Эвертон». Его тактическая мудрость и умение начинать атаки делают его незаменимым. 27 матчей за сборную, 1 гол.", "en": "The 24-year-old defensive midfielder for English side Aston Villa is a true attack destroyer! Born in Senegal but chose Belgium. He came through German Hamburg and English Everton. His tactical wisdom and ability to start attacks make him indispensable. 27 caps, 1 goal for the national team." } },

    { "name": { "ru": "Николя Раскин", "en": "Nicolas Raskin" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "25-летний полузащитник шотландского «Рейнджерс» — представитель элитного шотландского футбола! Прошёл через бельгийский «Стандард» и теперь играет в одном из лучших клубов Шотландии. Его энергия и работоспособность в центре поля делают его незаменимым. 15+ матчей за сборную.", "en": "The 25-year-old midfielder for Scottish side Rangers is a representative of elite Scottish football! He came through Belgian Standard and now plays for one of Scotland's best clubs. His energy and work rate in central midfield make him indispensable. 15+ caps for the national team." } },

    { "name": { "ru": "Юри Тилеманс", "en": "Youri Tielemans" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний полузащитник английской «Астон Виллы» — один из самых техничных игроков сборной! Прошёл через бельгийский «Андерлехт», французский «Монако» и английский «Лестер». Его видение поля и пасы — секретное оружие «Красных дьяволов». 70+ матчей за сборную.", "en": "The 29-year-old midfielder for English side Aston Villa is one of the squad's most technical players! He came through Belgian Anderlecht, French Monaco, and English Leicester. His vision and passing are the 'Red Devils' secret weapon. 70+ caps for the national team." } },

    { "name": { "ru": "Ханс Ванакен", "en": "Hans Vanaken" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "33-летний ветеран бельгийского «Брюгге» — настоящая легенда клуба! 195 см роста, один из лучших бомбардиров в истории «Брюгге». Его опыт и лидерство бесценны для молодой команды. 30+ матчей за сборную, настоящий боец с характером.", "en": "The 33-year-old Belgian Club Brugge veteran is a true club legend! 195cm tall, one of the best scorers in Brugge's history. His experience and leadership are invaluable for the young team. 30+ caps for the national team, a true fighter with character." } },

    { "name": { "ru": "Аксель Витсель", "en": "Axel Witsel" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "37-летний ветеран испанской «Жироны» — настоящая легенда бельгийского футбола! Прошёл через «Стандард», «Зенит», «Боруссию Дортмунд» и «Атлетико Мадрид». Его опыт и лидерство бесценны для молодой команды. 130+ матчей за сборную — рекордсмен!", "en": "The 37-year-old Spanish side Girona veteran is a true Belgian football legend! He came through Standard, Zenit, Borussia Dortmund, and Atlético Madrid. His experience and leadership are invaluable for the young team. 130+ caps for the national team — a record holder!" } },

    { "name": { "ru": "Шарль Де Кетеларе", "en": "Charles De Ketelaere" }, "pos": "forward", "status": "Star", "story": { "ru": "25-летний нападающий итальянской «Аталанты» — одна из главных звёзд сборной! Прошёл через бельгийский «Брюгге» и английский «Милан». Его техника и видение поля делают его дирижёром атак. 30+ матчей за сборную, будущее бельгийского футбола.", "en": "The 25-year-old forward for Italian side Atalanta is one of the squad's biggest stars! He came through Belgian Club Brugge and English Milan. His technique and vision make him the conductor of attacks. 30+ caps for the national team, the future of Belgian football." } },

    { "name": { "ru": "Жереми Доку", "en": "Jeremy Doku" }, "pos": "forward", "status": "Star", "story": { "ru": "24-летний вингер английского «Манчестер Сити» — настоящая суперзвезда! Прошёл через бельгийский «Андерлехт» и французский «Ренн». Его скорость и дриблинг создают проблемы для любой обороны. 30+ матчей за сборную, один из самых опасных игроков Европы.", "en": "The 24-year-old winger for English side Manchester City is a true superstar! He came through Belgian Anderlecht and French Rennes. His pace and dribbling cause problems for any defence. 30+ caps for the national team, one of Europe's most dangerous players." } },

    { "name": { "ru": "Матиас Фернандес-Пардо", "en": "Matias Fernandez-Pardo" }, "pos": "forward", "status": "Rising", "story": { "ru": "21-летний нападающий французского «Лилля» — один из самых перспективных талантов! Родился в Бельгии, но мог играть за Испанию. Выбрал «Красных дьяволов» и теперь представляет будущее бельгийской атаки. Его мощь и игра в штрафной делают его опасным оружием.", "en": "The 21-year-old forward for French side Lille is one of the most promising talents! Born in Belgium but could have played for Spain. Chose the 'Red Devils' and now represents the future of the Belgian attack. His power and penalty area play make him a dangerous weapon." } },

    { "name": { "ru": "Доди Люкебакио", "en": "Dodi Lukebakio" }, "pos": "forward", "status": "Star", "story": { "ru": "28-летний вингер португальской «Бенфики» — настоящий боец с характером! Прошёл через бельгийский «Андерлехт», немецкую «Герту» и французский «Монпелье». Его скорость и дриблинг создают проблемы для любой обороны. 25+ матчей за сборную, один из самых опытных игроков атаки.", "en": "The 28-year-old winger for Portuguese side Benfica is a true fighter with character! He came through Belgian Anderlecht, German Hertha, and French Montpellier. His pace and dribbling cause problems for any defence. 25+ caps for the national team, one of the squad's most experienced attacking players." } },

    { "name": { "ru": "Диего Морейра", "en": "Diego Moreira" }, "pos": "forward", "status": "Rising", "story": { "ru": "21-летний вингер французского «Страсбура» — один из самых молодых игроков в заявке! Прошёл через «Ливерпуль» и «Лион». Его техника и креативность делают его дирижёром атак. Представляет новое поколение бельгийских футболистов, готовых покорять мировую арену.", "en": "The 21-year-old winger for French side Strasbourg is one of the youngest players in the squad! He came through Liverpool and Lyon. His technique and creativity make him the conductor of attacks. Represents the new generation of Belgian footballers ready to conquer the world stage." } },

    { "name": { "ru": "Алексис Салемакерс", "en": "Alexis Saelemaekers" }, "pos": "forward", "status": "Star", "story": { "ru": "26-летний вингер итальянского «Милана» — представитель элитного итальянского футбола! Прошёл через бельгийский «Андерлехт» и теперь играет в одном из лучших клубов мира. Его скорость и дриблинг создают проблемы для любой обороны. 20+ матчей за сборную.", "en": "The 26-year-old winger for Italian giants AC Milan is a representative of elite Italian football! He came through Belgian Anderlecht and now plays for one of the world's best clubs. His pace and dribbling cause problems for any defence. 20+ caps for the national team." } },

    { "name": { "ru": "Леандро Троссар", "en": "Leandro Trossard" }, "pos": "forward", "status": "Star", "story": { "ru": "31-летний нападающий английского «Арсенала» — одна из главных звёзд сборной! Прошёл через бельгийский «Генк», английский «Брайтон» и теперь играет в одном из лучших клубов Англии. Его техника и хладнокровие в штрафной делают его опасным оружием. 50+ матчей за сборную.", "en": "The 31-year-old forward for English side Arsenal is one of the squad's biggest stars! He came through Belgian Genk, English Brighton, and now plays for one of England's best clubs. His technique and composure in the penalty area make him a dangerous weapon. 50+ caps for the national team." } }
  ]
},
"EGY": {
  "desc": {
    "ru": "«Фараоны» — величайшие правители африканского футбола. Ведомые своим бессменным лидером Мо Салахом, египтяне несут в себе мощь древней цивилизации. Это команда с невероятной историей и характером, способная на молниеносные атаки, которые заставляют трепетать любую оборону.",
    "en": "The 'Pharaohs' are the greatest rulers of African football. Led by their perennial leader Mo Salah, the Egyptians carry the power of an ancient civilization. This is a team with an incredible history and character, capable of lightning-fast attacks that make any defense tremble."
  },
  "coaches": [{ "name": { "ru": "Хоссам Хассан", "en": "Hossam Hassan" }, "story": { "ru": "Легендарный бомбардир, ставший во главе национальной команды своей страны.", "en": "Legendary goalscorer who has now taken charge of his country's national team." }, "image": "https://placehold.co/300x300?text=Hossam+Hassan" }],
  "players": [
    { "name": { "ru": "Мохамед Салах", "en": "Mohamed Salah" }, "pos": "forward", "status": "Captain", "story": { "ru": "Кумир всей нации, один из лучших вингеров мира, переписавший рекорды «Ливерпуля».", "en": "An icon for the entire nation, one of the world's best wingers, who rewrote Liverpool's records." } },

    { "name": { "ru": "Мохамед Эль-Шенави", "en": "Mohamed El Shenawy" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "Ветеран, чье имя стало синонимом надежности. В свои 37 лет он продолжает защищать ворота «Фараонов», обладая невероятной реакцией и харизмой лидера. 80+ матчей за сборную.", "en": "A veteran whose name has become synonymous with reliability. At 37, he continues to guard the Pharaohs' goal, possessing incredible reflexes and the charisma of a leader. 80+ caps for the national team." } },
    { "name": { "ru": "Мохамед Авад", "en": "Mohamed Awad" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "Опытный страж ворот, прошедший через множество египетских топ-клубов. Его спокойствие и уверенность на линии ворот делают его незаменимым дублером.", "en": "An experienced shot-stopper who has navigated through multiple Egyptian top clubs. His composure and confidence between the posts make him an indispensable backup." } },
    { "name": { "ru": "Абубакар Абдо", "en": "Abubakar Abdo" }, "pos": "goalkeeper", "status": "Rising", "story": { "ru": "24-летний вундеркинд — будущее вратарской линии Египта! Его акробатические сейвы и игра ногами привлекают внимание европейских скаутов.", "en": "A 24-year-old wonderkid — the future of Egypt's goalkeeping line! His acrobatic saves and distribution with his feet attract the attention of European scouts." } },

    { "name": { "ru": "Ахмед Хегаси", "en": "Ahmed Hegazy" }, "pos": "defender", "status": "Legend", "story": { "ru": "Капитан обороны с опытом игры в АПЛ («Вест Бромвич») и Саудовской Аравии. Его мощь и игра на втором этаже делают его кошмаром для нападающих соперника. 90+ матчей за сборную.", "en": "A defensive captain with experience in the Premier League (West Bromwich) and Saudi Arabia. His power and aerial ability make him a nightmare for opposing strikers. 90+ caps for the national team." } },
    { "name": { "ru": "Мохамед Абдельмонем", "en": "Mohamed Abdelmonem" }, "pos": "defender", "status": "Star", "story": { "ru": "Звезда «Аль-Ахли» и один из лучших центральных защитников Африки. Его чтение игры и пасы из обороны выводят команду на новый уровень. 40+ матчей за сборную.", "en": "A star of Al Ahly and one of Africa's best centre-backs. His reading of the game and passes from the back take the team to a new level. 40+ caps for the national team." } },
    { "name": { "ru": "Махмуд Хамди «Эль-Венш»", "en": "Mahmoud Hamdy 'El Wensh'" }, "pos": "defender", "status": "Star", "story": { "ru": "Гигант (194 см) в центре обороны «Замалека». Его рост и физическая мощь делают его непробиваемым на стандартах. Настоящая стена «Фараонов».", "en": "A giant (194cm) in Zamalek's center of defense. His height and physical power make him impenetrable on set pieces. A true wall for the 'Pharaohs'." } },
    { "name": { "ru": "Али Габр", "en": "Ali Gabr" }, "pos": "defender", "status": "Legend", "story": { "ru": "37-летний ветеран «Пирамидз» — настоящий боец с характером! Его опыт и лидерство бесценны для молодой обороны. 60+ матчей за сборную.", "en": "The 37-year-old Pyramids FC veteran is a true fighter with character! His experience and leadership are invaluable for the young defense. 60+ caps for the national team." } },
    { "name": { "ru": "Карим Хафез", "en": "Karim Hafez" }, "pos": "defender", "status": "Star", "story": { "ru": "Мастер стандартов! Левый защитник, чьи штрафные и пенальти приносят «Фараонам» важнейшие голы. Его левая нога — главное оружие на мертвых мячах.", "en": "A set-piece master! A left-back whose free-kicks and penalties bring the 'Pharaohs' crucial goals. His left foot is the main weapon on dead balls." } },
    { "name": { "ru": "Мохамед Хамди", "en": "Mohamed Hamdy" }, "pos": "defender", "status": "Star", "story": { "ru": "Надежный левый защитник с богатым опытом в египетском чемпионате. Его скорость и кроссы делают его опасным оружием на фланге. 30+ матчей за сборную.", "en": "A reliable left-back with rich experience in the Egyptian league. His pace and crosses make him a dangerous weapon on the flank. 30+ caps for the national team." } },
    { "name": { "ru": "Хоссам Абдельмагуд", "en": "Hossam Abdelmaguid" }, "pos": "defender", "status": "Rising", "story": { "ru": "25-летний универсал «Аль-Ахли» — одно из самых ярких открытий последних лет! Способен закрыть правый фланг и центр обороны. Будущее египетской защиты.", "en": "A 25-year-old Al Ahly utility man — one of the brightest discoveries in recent years! Capable of covering the right flank and center of defense. The future of Egyptian defense." } },
    { "name": { "ru": "Омар Габер", "en": "Omar Gaber" }, "pos": "defender", "status": "Legend", "story": { "ru": "34-летний правый защитник — ветеран с опытом игры в MLS и Европе. Его тактическая мудрость и хладнокровие незаменимы в напряженных матчах мундиаля.", "en": "A 34-year-old right-back — a veteran with experience in MLS and Europe. His tactical wisdom and composure are indispensable in tense World Cup matches." } },

    { "name": { "ru": "Мохамед Эль-Нени", "en": "Mohamed Elneny" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "Легенда лондонского «Арсенала» и один из самых опытных игроков сборной. Его видение поля и пасы — дирижер атак «Фараонов». 100+ матчей за национальную команду!", "en": "A London Arsenal legend and one of the squad's most experienced players. His vision and passing are the conductor of the 'Pharaohs' attacks. 100+ caps for the national team!" } },
    { "name": { "ru": "Эмам Ашур", "en": "Emam Ashour" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Мотор полузащиты. Прошел через академию «Аль-Ахли» и покорил Европу. Его энергия, дриблинг и мощные удары из-за штрафной — секретное оружие Хоссана Хассана.", "en": "The engine of the midfield. He came through Al Ahly's academy and conquered Europe. His energy, dribbling, and powerful shots from outside the box are Hossam Hassan's secret weapon." } },
    { "name": { "ru": "Марван Аттия", "en": "Marwan Attia" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Опорный полузащитник «Аль-Ахли» — настоящий разрушитель атак! Его тактическая дисциплина и умение начинать контрвыпады делают его незаменимым. 25+ матчей за сборную.", "en": "An Al Ahly defensive midfielder — a true attack destroyer! His tactical discipline and ability to start counterattacks make him indispensable. 25+ caps for the national team." } },
    { "name": { "ru": "Ахмед Сайд «Зизо»", "en": "Ahmed Sayed 'Zizo'" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Креативный гений «Замалека». Его нестандартные передачи и дриблинг создают хаос в обороне соперника. Один из самых техничных игроков Египта. 50+ матчей за сборную.", "en": "Zamalek's creative genius. His unorthodox passing and dribbling create chaos in the opponent's defense. One of Egypt's most technical players. 50+ caps for the national team." } },
    { "name": { "ru": "Махмуд Кахраба", "en": "Mahmoud Kahraba" }, "pos": "midfielder", "status": "Legend", "story": { "ru": "34-летний ветеран «Аль-Ахли» с богатым опытом игры в Саудовской Аравии и Швейцарии. Его лидерство и харизма заряжают команду на победу. 40+ матчей за сборную.", "en": "A 34-year-old Al Ahly veteran with rich experience in Saudi Arabia and Switzerland. His leadership and charisma inspire the team to victory. 40+ caps for the national team." } },
    { "name": { "ru": "Набиль Эмад «Дунга»", "en": "Nabil Emad 'Dunga'" }, "pos": "midfielder", "status": "Squad", "story": { "ru": "Надежный опорник «Пирамидз». Его прозвище в честь легендарного бразильца, и он оправдывает его своей жесткостью и тактической мудростью. 30+ матчей за сборную.", "en": "A reliable defensive midfielder for Pyramids FC. His nickname is after the legendary Brazilian, and he lives up to it with his toughness and tactical wisdom. 30+ caps for the national team." } },
    { "name": { "ru": "Мустафа Фатхи", "en": "Mostafa Fathi" }, "pos": "midfielder", "status": "Star", "story": { "ru": "Универсальный атакующий хавбек «Пирамидз». Способен сыграть на любом фланге и в центре. Его скорость и голевое чутье делают его опасным оружием. 40+ матчей за сборную.", "en": "A versatile attacking midfielder for Pyramids FC. Capable of playing on any flank and in the center. His pace and goal-scoring instinct make him a dangerous weapon. 40+ caps for the national team." } },

    { "name": { "ru": "Омар Мармуш", "en": "Omar Marmoush" }, "pos": "forward", "status": "Star", "story": { "ru": "Главная звезда европейского футбола в составе Египта! Блистает в Бундеслиге. Его скорость, дриблинг и голевое чутье делают его правой рукой Салаха в атаке. 30+ матчей за сборную.", "en": "The biggest European football star in the Egypt squad! He shines in the Bundesliga. His pace, dribbling, and goal-scoring instinct make him Salah's right-hand man in attack. 30+ caps for the national team." } },
    { "name": { "ru": "Махмуд Хасан «Трезеге»", "en": "Mahmoud Hassan 'Trezeguet'" }, "pos": "forward", "status": "Star", "story": { "ru": "Ветеран с богатым опытом игры в АПЛ («Астон Вилла») и Турции. Его прозвище в честь Давида Трезеге, и он оправдывает его своим голевым чутьем. 60+ матчей за сборную.", "en": "A veteran with rich experience in the Premier League (Aston Villa) and Turkey. His nickname is after David Trezeguet, and he lives up to it with his goal-scoring instinct. 60+ caps for the national team." } },
    { "name": { "ru": "Хусейн эль-Шахат", "en": "Hussein El Shahat" }, "pos": "forward", "status": "Star", "story": { "ru": "Электрический вингер «Аль-Ахли». Его взрывная скорость и дриблинг создают кошмар для любых защитников. Автор легендарного гола в финале Лиги чемпионов КАФ. 50+ матчей за сборную.", "en": "An electric winger for Al Ahly. His blistering pace and dribbling create a nightmare for any defenders. Author of the legendary goal in the CAF Champions League final. 50+ caps for the national team." } },
    { "name": { "ru": "Мохамед Шериф", "en": "Mohamed Sherif" }, "pos": "forward", "status": "Star", "story": { "ru": "Мощный таранный нападающий «Аль-Ахли». Его игра в воздухе и умение держать мяч делают его идеальным партнером для быстрых вингеров «Фараонов». 25+ матчей за сборную.", "en": "A powerful battering ram striker for Al Ahly. His aerial ability and hold-up play make him the perfect partner for the Pharaohs' fast wingers. 25+ caps for the national team." } },
    { "name": { "ru": "Ибрагим Адель", "en": "Ibrahim Adel" }, "pos": "forward", "status": "Rising", "story": { "ru": "25-летний вундеркинд «Пирамидз» — один из самых перспективных талантов Египта! Его техника и видение поля восхищают. Будущее египетской атаки уже здесь.", "en": "A 25-year-old Pyramids FC wonderkid — one of Egypt's most promising talents! His technique and vision are admirable. The future of the Egyptian attack is already here." } },
    { "name": { "ru": "Ахмед Атефа", "en": "Ahmed Atefa" }, "pos": "forward", "status": "Rising", "story": { "ru": "27-летний правый вингер «Замалека». Его дриблинг и умение обводить один в один делают его одним из самых опасных игроков египетского чемпионата. 15+ матчей за сборную.", "en": "A 27-year-old right winger for Zamalek. His dribbling and 1v1 skills make him one of the most dangerous players in the Egyptian league. 15+ caps for the national team." } }

"IRN": {
  "desc": {
    "ru": "Иран — это несокрушимая стена и стальной характер Азии. «Мелли» славятся своей организованностью и умением выжимать максимум из каждого момента. Команда воинов, которые сражаются за свою страну с беспримерным мужеством, делая каждый матч настоящим испытанием для любого противника.",
    "en": "Iran is the indestructible wall and the steel character of Asia. 'Melli' are famous for their organization and ability to squeeze the maximum out of every moment. This is a team of warriors who fight for their country with unparalleled courage, making every match a real test for any opponent."

  },
  "coaches": [{ "name": { "ru": "Амир Галенои", "en": "Amir Ghalenoei" }, "story": { "ru": "Опытный иранский специалист, знающий возможности своих игроков досконально.", "en": "Experienced Iranian specialist who knows the capabilities of his players inside out." }, "image": "https://placehold.co/300x300?text=Amir+Ghalenoei" }],
  "players": [
    { "name": { "ru": "Мехди Тареми", "en": "Mehdi Taremi" }, "pos": "forward", "status": "Captain", "story": { "ru": "Звездный нападающий, ставший одним из лучших бомбардиров в истории иранского футбола.", "en": "Star forward, who has become one of the all-time leading goalscorers in Iranian football history." } },

    { "name": { "ru": "Алиреза Беиранванд", "en": "Alireza Beiranvand" }, "pos": "goalkeeper", "status": "Legend", "story": { "ru": "33-летний титан (194 см) из «Трактора» — настоящая легенда азиатского футбола! Обладатель мирового рекорда по самому длинному броску мяча рукой (более 61 метра). Участник ЧМ-2018, где отразил пенальти от Криштиану Роналду! 80+ матчей за сборную, его харизма и лидерство делают его непререкаемым авторитетом.", "en": "The 33-year-old titan (194cm) from Tractor is a true Asian football legend! Holder of the world record for the longest hand throw (over 61 meters). A participant in WC 2018, where he saved a penalty from Cristiano Ronaldo! 80+ caps for the national team, his charisma and leadership make him an unquestionable authority." } },

    { "name": { "ru": "Сеид Хоссейн Хоссейни", "en": "Seyed Hossein Hosseini" }, "pos": "goalkeeper", "status": "Star", "story": { "ru": "33-летний вратарь «Сепахана» — надёжный страж ворот с богатым опытом! Один из самых стабильных голкиперов иранского чемпионата. Его реакция и игра на выходах делают его ценным резервистом для Беиранванда. 30+ матчей за сборную.", "en": "The 33-year-old Sepahan goalkeeper is a reliable shot-stopper with rich experience! One of the most consistent goalkeepers in the Iranian league. His reflexes and command of the area make him a valuable backup to Beiranvand. 30+ caps for the national team." } },

    { "name": { "ru": "Паям Ниазманд", "en": "Payam Niazmand" }, "pos": "goalkeeper", "status": "Squad", "story": { "ru": "31-летний голкипер «Персеполиса» — представитель самого титулованного клуба Ирана! Его хладнокровие и опыт игры в Лиге чемпионов АФК делают его незаменимым третьим номером. Один из лучших стражей ворот иранского чемпионата.", "en": "The 31-year-old Persepolis goalkeeper is a representative of Iran's most decorated club! His composure and AFC Champions League experience make him an indispensable third choice. One of the best shot-stoppers in the Iranian league." } },

    { "name": { "ru": "Эхсан Хаджсафи", "en": "Ehsan Hajsafi" }, "pos": "defender", "status": "Legend", "story": { "ru": "36-летний ветеран «Сепахана» — настоящая легенда иранского футбола! Рекордсмен сборной по количеству матчей — 140+ игр! Прошёл через греческие клубы («Паниониос», «Олимпиакос») и теперь вернулся домой. Участник 4 чемпионатов мира! Его универсальность позволяет играть на любом фланге защиты и в полузащите.", "en": "The 36-year-old Sepahan veteran is a true Iranian football legend! The national team's all-time appearance record holder — 140+ caps! He navigated through Greek clubs (Panionios, Olympiacos) and now returned home. Participant in 4 World Cups! His versatility allows him to play on any defensive flank and in midfield." } },

    { "name": { "ru": "Хоссейн Канаани", "en": "Hossein Kanaani" }, "pos": "defender", "status": "Star", "story": { "ru": "32-летний центральный защитник «Персеполиса» — настоящий генерал обороны! 50+ матчей за сборную, его физическая мощь и игра на втором этаже делают его кошмаром для нападающих. Один из самых стабильных защитников «Мелли».", "en": "The 32-year-old Persepolis centre-back is a true defensive general! 50+ caps for the national team, his physical power and aerial ability make him a nightmare for strikers. One of the most consistent defenders for 'Melli'." } },

    { "name": { "ru": "Шоджа Халилзаде", "en": "Shoja Khalilzadeh" }, "pos": "defender", "status": "Star", "story": { "ru": "37-летний ветеран «Трактора» — настоящий боец с характером! Прошёл через катарский футбол и теперь вернулся в Иран. Его опыт и лидерство бесценны для молодой обороны. 50+ матчей за сборную, участник ЧМ-2018 и ЧМ-2022.", "en": "The 37-year-old Tractor veteran is a true fighter with character! He navigated through Qatari football and now returned to Iran. His experience and leadership are invaluable for the young defense. 50+ caps for the national team, participant in WC 2018 and WC 2022." } },

    { "name": { "ru": "Милад Мохаммади", "en": "Milad Mohammadi" }, "pos": "defender", "status": "Star", "story": { "ru": "32-летний левый защитник «Персеполиса» — один из самых опытных игроков сборной! Прошёл через российскую Премьер-лигу («Ахмат Грозный») и бельгийский футбол. Его скорость и кроссы делают его опасным оружием на фланге. 60+ матчей за «Мелли».", "en": "The 32-year-old left-back for Persepolis is one of the squad's most experienced players! He came through the Russian Premier League (Akhmat Grozny) and Belgian football. His pace and crosses make him a dangerous weapon on the flank. 60+ caps for 'Melli'." } },

    { "name": { "ru": "Салех Хардани", "en": "Saleh Hardani" }, "pos": "defender", "status": "Rising", "story": { "ru": "28-летний правый защитник «Эстеглала» — один из самых стабильных игроков обороны! Его энергия и работоспособность делают его незаменимым для Галенои. 25+ матчей за сборную, представитель одного из топ-клубов Ирана.", "en": "The 28-year-old right-back for Esteghlal is one of the squad's most consistent defenders! His energy and work rate make him indispensable for Ghalenoei. 25+ caps for the national team, a representative of one of Iran's top clubs." } },

    { "name": { "ru": "Даниал Эйри", "en": "Danial Eiri" }, "pos": "defender", "status": "Rising", "story": { "ru": "22-летний вундеркинд «Малавана» — один из самых молодых защитников в заявке! Его включение — это ставка на будущее иранской обороны. Представляет новое поколение «Мелли», готовых покорять мировую арену.", "en": "A 22-year-old wonderkid for Malavan is one of the youngest defenders in the squad! His inclusion is a bet on the future of Iranian defence. Represents the new generation of 'Melli' ready to conquer the world stage." } },

    { "name": { "ru": "Али Немати", "en": "Ali Nemati" }, "pos": "defender", "status": "Rising", "story": { "ru": "23-летний защитник — представитель нового поколения! Его техника и чтение игры делают его современным центральным защитником. Один из самых перспективных талантов иранского футбола.", "en": "A 23-year-old defender is a representative of the new generation! His technique and reading of the game make him a modern centre-back. One of Iranian football's most promising talents." } },

    { "name": { "ru": "Омид Нурафкан", "en": "Omid Noorafkan" }, "pos": "defender", "status": "Star", "story": { "ru": "28-летний универсал «Фулада» — настоящий боец с характером! Способен закрыть любой фланг защиты. Его физическая мощь и скорость делают его кошмаром для нападающих. 30+ матчей за сборную.", "en": "The 28-year-old Foolad utility man is a true fighter with character! Capable of covering any defensive flank. His physical power and pace make him a nightmare for strikers. 30+ caps for the national team." } },

    { "name": { "ru": "Рамин Резаеян", "en": "Ramin Rezaeian" }, "pos": "defender", "status": "Legend", "story": { "ru": "35-летний ветеран «Фулада» — настоящая легенда иранского футбола! Прошёл через бельгийский футбол и теперь вернулся домой. Его опыт и лидерство бесценны для молодой команды. 60+ матчей за сборную, участник ЧМ-2018.", "en": "The 35-year-old Foolad veteran is a true Iranian football legend! He came through Belgian football and now returned home. His experience and leadership are invaluable for the young team. 60+ caps for the national team, participant in WC 2018." } },

    { "name": { "ru": "Рузбех Чешми", "en": "Rouzbeh Cheshmi" }, "pos": "midfielder", "status": "Star", "story": { "ru": "32-летний опорный полузащитник «Эстеглала» — настоящий мотор команды! Его тактическая мудрость и умение разрушать атаки делают его незаменимым. 50+ матчей за сборную, один из самых стабильных игроков «Мелли».", "en": "The 32-year-old Esteghlal defensive midfielder is a true team engine! His tactical wisdom and ability to break up attacks make him indispensable. 50+ caps for the national team, one of 'Melli's most consistent players." } },

    { "name": { "ru": "Саид Эззатолахи", "en": "Saeid Ezatolahi" }, "pos": "midfielder", "status": "Star", "story": { "ru": "29-летний полузащитник эмиратского «Шабаб Аль-Ахли» — один из самых техничных игроков сборной! Прошёл через российский футбол («Ростов», «Анжи») и испанский «Атлетико Мадрид». Его видение поля и пасы — секретное оружие «Мелли». 60+ матчей за сборную.", "en": "The 29-year-old Emirati side Shabab Al Ahli midfielder is one of the squad's most technical players! He came through Russian football (Rostov, Anzhi) and Spanish Atlético Madrid. His vision and passing are 'Melli's secret weapon. 60+ caps for the national team." } },

    { "name": { "ru": "Саман Годдос", "en": "Saman Ghoddos" }, "pos": "midfielder", "status": "Star", "story": { "ru": "32-летний плеймейкер эмиратского «Кальбы» — настоящая звезда! Прошёл через английскую Премьер-лигу («Брентфорд») и французский футбол. Его техника и креативность делают его дирижёром атак «Мелли». 50+ матчей за сборную, один из самых опасных игроков Азии.", "en": "The 32-year-old Emirati side Kalba playmaker is a true star! He came through the English Premier League (Brentford) and French football. His technique and creativity make him the conductor of 'Melli's attacks. 50+ caps for the national team, one of Asia's most dangerous players." } },

    { "name": { "ru": "Алиреза Джаханбахш", "en": "Alireza Jahanbakhsh" }, "pos": "midfielder", "status": "Star", "story": { "ru": "32-летний вингер бельгийского «Дендера» — настоящая легенда иранского футбола! Прошёл через нидерландский АЗ, английскую Премьер-лигу («Брайтон») и теперь играет в Бельгии. Его скорость и дриблинг создают проблемы для любой обороны. 80+ матчей за сборную, лучший бомбардир Эредивизи 2017/18!", "en": "The 32-year-old Belgian side Dender winger is a true Iranian football legend! He came through Dutch AZ, the English Premier League (Brighton), and now plays in Belgium. His pace and dribbling cause problems for any defence. 80+ caps for the national team, Eredivisie top scorer 2017/18!" } },

    { "name": { "ru": "Мехди Гаеди", "en": "Mehdi Ghaedi" }, "pos": "midfielder", "status": "Star", "story": { "ru": "27-летний вингер эмиратского «Аль-Насра» — одна из главных звёзд сборной! Его скорость и дриблинг создают кошмар для любых защитников. Один из самых техничных игроков «Мелли». 30+ матчей за сборную, будущее иранской атаки.", "en": "The 27-year-old Emirati side Al Nasr winger is one of the squad's biggest stars! His pace and dribbling create a nightmare for any defenders. One of 'Melli's most technical players. 30+ caps for the national team, the future of the Iranian attack." } },

    { "name": { "ru": "Мохаммад Горбани", "en": "Mohammad Ghorbani" }, "pos": "midfielder", "status": "Star", "story": { "ru": "26-летний полузащитник эмиратского «Аль-Вахды» — представитель элитного ближневосточного футбола! Его энергия и работоспособность в центре поля делают его незаменимым. 20+ матчей за сборную, один из самых перспективных талантов Ирана.", "en": "The 26-year-old Emirati side Al Wahda midfielder is a representative of elite Middle Eastern football! His energy and work rate in central midfield make him indispensable. 20+ caps for the national team, one of Iran's most promising talents." } },

    { "name": { "ru": "Ария Юсефи", "en": "Aria Yousefi" }, "pos": "midfielder", "status": "Rising", "story": { "ru": "23-летний полузащитник «Сепахана» — представитель нового поколения! Его техника и видение поля делают его дирижёром атак. Один из самых перспективных талантов иранского футбола. 10+ матчей за сборную.", "en": "A 23-year-old Sepahan midfielder is a representative of the new generation! His technique and vision make him the conductor of attacks. One of Iranian football's most promising talents. 10+ caps for the national team." } },

    { "name": { "ru": "Али Алипур", "en": "Ali Alipour" }, "pos": "forward", "status": "Star", "story": { "ru": "30-летний нападающий «Персеполиса» — один из самых результативных форвардов сборной! Прошёл через португальский футбол («Порту») и теперь вернулся домой. Его хладнокровие в штрафной и игра в воздухе делают его опасным оружием. 50+ матчей за «Мелли», 15+ голов.", "en": "The 30-year-old Persepolis forward is one of the squad's most prolific strikers! He came through Portuguese football (Porto) and now returned home. His composure in the penalty area and aerial ability make him a dangerous weapon. 50+ caps for 'Melli', 15+ goals." } },

    { "name": { "ru": "Амирхоссейн Хоссейнзаде", "en": "Amirhossein Hosseinzadeh" }, "pos": "forward", "status": "Rising", "story": { "ru": "25-летний нападающий «Трактора» — один из самых горячих бомбардиров иранского чемпионата! Его скорость и дриблинг создают проблемы для любой обороны. 15+ матчей за сборную, будущее иранской атаки.", "en": "The 25-year-old Tractor forward is one of the Iranian league's hottest scorers! His pace and dribbling cause problems for any defence. 15+ caps for the national team, the future of the Iranian attack." } },

    { "name": { "ru": "Шахрияр Моганлу", "en": "Shahriyar Moghanlou" }, "pos": "forward", "status": "Star", "story": { "ru": "31-летний нападающий эмиратского «Кальбы» — настоящий гигант (194 см)! Прошёл через португальский футбол и теперь играет на Ближнем Востоке. Его рост и мощь делают его башней в штрафной соперника. 25+ матчей за сборную, один из самых опасных таргетменов Азии.",
"en": "The 31-year-old Emirati side Kalba forward is a true giant (194cm)! He came through Portuguese football and now plays in the Middle East. His height and power make him a tower in the opponent's penalty area. 25+ caps for the national team, one of Asia's most dangerous target men." } }
